<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：探究加速度与力、质量的关系</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M03 scene.css — 探究加速度与力、质量的关系：实验台、数据表、图像与诊断页 */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 40px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:3px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px;padding:0 10px;font-size:13.5px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:8px 14px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 346px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(58vh,470px);min-height:330px;background:#EAF1F8;border-radius:var(--r);overflow:hidden}
.hold{position:absolute;right:16px;top:16px;z-index:3;background:var(--warn);border-color:var(--warn);color:#fff}
.stage-hint{position:absolute;left:12px;bottom:10px;z-index:2;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink2);pointer-events:none}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;max-height:calc(58vh + 180px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:5px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:50px}
.side-v{min-width:52px;text-align:center;font-size:13.5px}
.theta-range{flex:1;min-width:80px;accent-color:var(--blue);cursor:pointer;height:28px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 6px}
.side-acts .btn{min-height:40px;font-size:14px;padding:0 10px}
.side-acts .btn.sm{min-height:32px;font-size:13px}
.live-stat{background:#F4F8FD;border:1px solid var(--line);border-radius:var(--rs);padding:6px 10px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-bottom:4px}
.live-stat b{color:var(--ink)}
.side-tip{font-size:13px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:8px 10px;overflow-y:auto;flex:1 1 auto}
.steps{padding-left:20px;margin:0;flex:1 1 auto;overflow-y:auto}
.steps li{margin-bottom:7px;font-size:13.5px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12.5px}
.st-why{color:var(--ink2);font-size:11px;margin-top:1px;line-height:1.35}
.link.sm{font-size:12.5px;min-height:32px;padding:2px 0}
.gate-t{width:100%;margin-top:6px}
.gate-res{margin-top:6px;font-size:13.5px;line-height:1.75}
.muted{color:var(--ink2);font-size:13px}

/* 下方纸带分析与图像区 */
.analysis{margin-top:14px;background:#fff;border-radius:var(--r);padding:14px 18px;border:1px solid var(--line)}
.ana-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.ana-h{margin:0;font-size:19px}
.ana-tapes,.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-hint{background:#EEF4FF;border-radius:var(--rs);padding:8px 12px;margin:8px 0;font-size:14px}
.ana-strip{border:1px solid var(--line);border-radius:var(--rs);position:relative}
.tape-strip{position:relative;width:100%;background:#fff}
.ana-ctl{margin-top:8px}
.ana-block{margin-top:12px}
.ana-block h3{font-size:15px;margin:0 0 6px}
.ana-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start;margin-top:10px}
.tbl-wrap{overflow-x:auto}
.formula{font-size:16.5px;margin:6px 0}
.verdict{border-radius:var(--rs);padding:10px 14px;margin:8px 0;font-size:14px;font-weight:600}
.verdict.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.verdict.warn{background:#FFF8EC;border:1px solid #F3D3A1;color:#9A5A00}
.verdict.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:var(--err)}

/* 学·原理小部件 */
.learn-widget{margin-top:12px}
.comp-widget-stage{position:relative;height:142px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.tens-widget-stage{position:relative;height:152px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.cmp-note{font-size:14px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-table th.bad{color:var(--err)}
.cmp-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m03","title":"实验：探究加速度与力、质量的关系","sub":"人教版 必修第一册 第四章 2","chapter":"必修第一册 第四章 2","methods":["控制变量法","补偿阻力法","逐差法 / 光电门测速","化曲为直（图像法）","力传感器消除系统误差"],"learn":[{"id":"L1","title":"实验目的与控制变量法","html":"<p><b>目的：<\/b>定量探究物体加速度 <i>a<\/i> 与所受合外力 <i>F<\/i>、物体质量 <i>M<\/i> 的关系。<\/p>","steps":["研究三个物理量（<i>a<\/i>、<i>F<\/i>、<i>M<\/i>）的关系，必须采用<b>控制变量法<\/b>：<br>① 保持小车总质量 <i>M<\/i> 不变，改变所受拉力 <i>F<\/i>，探究 <i>a<\/i> 与 <i>F<\/i> 的关系；<br>② 保持所受拉力 <i>F<\/i> 不变，改变小车总质量 <i>M<\/i>，探究 <i>a<\/i> 与 <i>M<\/i> 的关系。","<b>需要测量的物理量：<\/b>小车及车上砝码总质量 <i>M<\/i>（用<b>天平<\/b>测量）、小车所受合外力 <i>F<\/i>、小车加速度 <i>a<\/i>（用打点计时器纸带逐差法或双光电门测出）。","<b>装置安装与操作要领：<\/b>调整定滑轮高度，使牵引小车的<b>细绳与长木板平行<\/b>（保证拉力方向沿木板不变）；小车停在<b>靠近打点计时器<\/b>的位置，<b>先接通电源后释放小车<\/b>，到达滑轮前按住小车。"]},{"id":"L2","title":"补偿阻力（平衡摩擦力）","widget":"compensate-demo","html":"<p>小车在木板上运动时除了受细绳拉力，还受轮轨摩擦和纸带阻力。只有把阻力抵消，<b>细绳拉力才等于小车所受的合外力<\/b>。<\/p>","steps":["<b>做法：<\/b>用<b>垫块<\/b>将长木板<b>不带滑轮的一端<\/b>垫高，形成微小倾角 θ，利用重力沿木板向下的分力抵消阻力：<br>Mg sinθ = μMg cosθ + f<sub>纸带<\/sub>。","<b>检验方法（关键动作）：<\/b><b>不挂槽码、穿好纸带<\/b>，接通电源后<b>轻推小车<\/b>。若打出的纸带<b>点迹均匀<\/b>（或通过两个光电门的遮光时间相等），说明小车做匀速直线运动，阻力已恰当补偿。","<b>为什么改变小车质量 <i>M<\/i> 后无需重新补偿阻力？<\/b>——因为轨道阻力主要来自滚动/滑动摩擦 μMg cosθ，由 Mg sinθ = μMg cosθ 可知<b>质量 <i>M<\/i> 两边约去<\/b>（tanθ ≈ μ，微小的纸带阻力可忽略，电火花计时器更小），增减车上砝码后倾角 θ 仍然合适！"]},{"id":"L3","title":"细绳拉力与系统误差","widget":"tension-demo","html":"<p>如果不装力传感器，直接把槽码重力 <i>mg<\/i> 当作细绳拉力 <i>F<\/i><sub>T<\/sub>，会带来系统误差。为什么？<\/p>","steps":["补偿阻力后，对小车（质量 <i>M<\/i>）和槽码（质量 <i>m<\/i>）分别应用牛顿第二定律：<br>对小车：F<sub>T<\/sub> = Ma　；　对槽码：mg − F<sub>T<\/sub> = ma。","联立解得真实加速度与细绳真实拉力：<br>a = {{frac|mg|M + m}}　，　F<sub>T<\/sub> = {{frac|Mmg|M + m}} = {{frac|mg|1 + m/M}} &lt; mg。","<b>物理原因：<\/b>槽码随小车一起向下加速，处于<b>失重<\/b>状态，细绳拉力 <i>F<\/i><sub>T<\/sub> 总是<b>小于<\/b>槽码重力 <i>mg<\/i>，且 <i>m<\/i> 占 <i>M<\/i> 的比例越大，偏差越大。","<b>消除/减小误差的两条路径：<\/b><br>① 用普通细绳时，必须满足 <b><i>m<\/i> ≪ <i>M<\/i><\/b>（槽码质量远小于小车总质量），使 <i>F<\/i><sub>T<\/sub> ≈ <i>mg<\/i>；<br>② 改用<b>力传感器<\/b>直接测量绳拉力 <i>F<\/i><sub>T<\/sub>（或把车上砝码移入槽码盘、研究 <i>M<\/i>+<i>m<\/i> 整体），则<b>不再需要 <i>m<\/i> ≪ <i>M<\/i><\/b>！"]},{"id":"L4","title":"测量加速度的两种方案","html":"<p>每次释放小车后，可以通过<b>纸带逐差法<\/b>或<b>双光电门<\/b>测出加速度 <i>a<\/i>。<\/p>","steps":["<b>方案一 · 打点计时器纸带（逐差法）：<\/b>交流电源频率 50 Hz（周期 0.02 s），常每 5 个点取 1 个计数点（计数间隔 T = 0.1 s）。6 段连续位移依次为 x₁…x₆，则：<br>a = {{frac|(x₄ + x₅ + x₆) − (x₁ + x₂ + x₃)|9T²}}。<br>（警惕陷阱：若题中说打点周期为 <i>T<\/i>、相邻计数点间有 4 个点未画出，则计数间隔为 5<i>T<\/i>，分母为 9(5T)² = <b>225T²<\/b>！）","<b>方案二 · 双光电门测速：<\/b>遮光片宽度 <i>d<\/i> 越窄，v = {{frac|d|Δt}} 越接近瞬时速度。测出两光电门间距 <i>x<\/i> 及挡光时间 Δt₁、Δt₂，得：<br>a = {{frac|v₂² − v₁²|2x}} = {{frac|d²|2x}}({{frac|1|Δt₂²}} − {{frac|1|Δt₁²}})。","<b>光电门检验平衡阻力：<\/b>不挂槽码轻推小车（或滑块），若通过两个光电门的遮光时间<b>近似相等（Δt₁ ≈ Δt₂）<\/b>，说明匀速运动，阻力已平衡。"]},{"id":"L5","title":"探究 a-F 图像与误差判读","widget":"af-demo","html":"<p>保持小车质量 <i>M<\/i> 不变，作出 <i>a-F<\/i> 图像（下方可交互叠加对比各种误差情形）。<\/p>","steps":["理想情况：a = {{frac|1|M}} F，图线是<b>过原点的倾斜直线<\/b>，斜率 k = {{frac|1|M}}（若纵轴画 <i>F<\/i>、横轴画 <i>a<\/i>，则斜率 k = M）。","<b>正横截距（交于 <i>F<\/i> 轴正半轴）：<\/b>加了一定拉力 <i>a<\/i> 仍为 0，说明<b>未补偿阻力或补偿不足<\/b>（木板倾角偏小），需增大倾角。","<b>正纵截距（交于 <i>a<\/i> 轴正半轴）：<\/b>不加拉力 <i>F<\/i> = 0 时已有加速度，说明<b>补偿阻力过度<\/b>（木板倾角过大），需减小倾角。","<b>末端向下弯曲：<\/b>用 <i>mg<\/i> 代替拉力且 <i>m<\/i> 增大到不满足 <i>m<\/i> ≪ <i>M<\/i> 时，a = {{frac|mg|M + m}}，斜率 {{frac|1|M + m}} 变小而向下弯曲；若用力传感器直接读 <i>F<\/i><sub>T<\/sub>，图线始终为直线！"]},{"id":"L6","title":"探究 a-M 关系：化曲为直","widget":"am-demo","html":"<p>保持合外力 <i>F<\/i> 不变，改变小车（含砝码）总质量 <i>M<\/i>，怎样从数据中确定 <i>a<\/i> 与 <i>M<\/i> 的定量关系？<\/p>","steps":["若直接作 <b><i>a-M<\/i> 图像<\/b>，得到的是向下弯曲的递减曲线——仅靠眼睛无法区分它是 a ∝ {{frac|1|M}} 还是 a ∝ {{frac|1|M²}}。","<b>化曲为直：<\/b>改作 <b><i>a<\/i>-{{frac|1|M}} 图像<\/b>，若图线为过原点的倾斜直线（斜率 k = F），则可直观确认 <i>F<\/i> 一定时 <i>a<\/i> 与 <i>M<\/i> 成反比。","<b>常见变式（1/a - M 图像）：<\/b>由 a = {{frac|mg|M + m}} 取倒数得：<br>{{frac|1|a}} = {{frac|1|mg}} M + {{frac|1|g}}。<br>这是一条不经原点的直线：<b>斜率 k = {{frac|1|mg}}<\/b>（所用槽码质量 <i>m<\/i> 越大，斜率越小），<b>纵截距 b = {{frac|1|g}}<\/b>！（也可作 am-m 图看是否为水平直线）"]}],"equipment":[{"id":"board","name":"长木板与垫块","html":"一端附有定滑轮。将<b>没有滑轮<\/b>的一端用<b>垫块<\/b>垫高，可调节倾角 θ 以补偿阻力；滑轮高度应使牵引细绳与木板平行。"},{"id":"cart_weights","name":"小车与砝码","html":"小车上可增减砝码来改变总质量 <i>M<\/i>（本实验台可调 0.200–0.800 kg）。改变 <i>M<\/i> 前须用天平准确称量小车和砝码的总质量。"},{"id":"slotted","name":"槽码（及小盘）","html":"挂在跨过定滑轮的细绳下端，提供牵引拉力。若直接用 <i>mg<\/i> 代替绳拉力，必须满足槽码总质量远小于小车总质量（<i>m<\/i> ≪ <i>M<\/i>）。"},{"id":"sensor","name":"力传感器","html":"安装在小车挂钩与细绳之间（或悬线端），直接测量细绳真实拉力 <i>F<\/i><sub>T<\/sub>。使用力传感器后，不再要求 <i>m<\/i> ≪ <i>M<\/i>，可消除系统误差。"},{"id":"timer_tape","name":"打点计时器、纸带与刻度尺","html":"电磁打点计时器接约 8 V 交流，电火花计时器接 220 V 交流（50 Hz，周期 0.02 s）。补偿阻力时<b>必须穿好纸带<\/b>，并用刻度尺量点距、逐差法求 <i>a<\/i>。"},{"id":"gate","name":"光电门与数字计时器","html":"配合小车上的窄遮光片使用，测遮光时间 Δt 得瞬时速度 v = {{frac|d|Δt}}；两光电门间距 <i>x<\/i> 已知时，由 v₂² − v₁² = 2ax 求加速度，或对比 Δt₁、Δt₂ 检验匀速。"}],"procedure":[{"id":"P1","title":"安装器材与调平行","how":"长木板放在桌面，打点计时器固定在无滑轮一端，穿好纸带，调节定滑轮使细绳与木板平行。","why":"保证小车运动过程中细绳拉力方向始终沿着长木板平面。"},{"id":"P2","title":"补偿阻力（不挂槽码、穿纸带）","how":"<b>取下槽码（m = 0）、穿好纸带<\/b>，用垫块垫高木板无滑轮端，接通电源后轻推小车，直至纸带点迹均匀。","why":"让重力沿斜面向下的分力恰好抵消轨道摩擦与纸带阻力，此后细绳拉力才等于小车合力。","errorId":"E4"},{"id":"P3","title":"控制倾角不过度也不足","how":"轻推后若点迹由密变疏说明倾角过大，由疏变密说明倾角不足；调至点距均匀后再进行后续实验。","why":"倾角不足会使 a-F 图出现正横截距，倾角过大则会出现正纵截距。","errorId":"E1"},{"id":"P4","title":"控 M 探 a-F（注意 m ≪ M 或用力传感器）","how":"保持小车质量 <i>M<\/i> 不变，挂上槽码，先通电后释放、滑轮前按住，换不同槽码测出多组 <i>a<\/i>；使用普通细绳时需控制 <i>m<\/i> ≪ <i>M<\/i>，大槽码应改用力传感器。","why":"细绳拉力 F<sub>T<\/sub> = {{frac|Mmg|M + m}} &lt; mg，只有满足 <i>m<\/i> ≪ <i>M<\/i> 时 <i>mg<\/i> 才近似等于拉力；力传感器可直接读出真实拉力。","errorId":"E3"},{"id":"P5","title":"控 F 探 a-1/M（改变 M 无需重调垫块）","how":"保持所挂槽码不变，增减小车上的砝码改变总质量 <i>M<\/i>，<b>不要重新垫高木板<\/b>，测多组 <i>a<\/i>。","why":"补偿阻力平衡方程中质量 <i>M<\/i> 近似约去，改变 <i>M<\/i> 后仍处于平衡状态。","errorId":"E5"},{"id":"P6","title":"数据处理与化曲为直","how":"用逐差法（或光电门）算加速度，分别作出 <i>a-F<\/i> 图像和 <i>a<\/i>-{{frac|1|M}} 图像。","why":"<i>a-M<\/i> 是曲线无法直接判断反比关系，改作 <i>a<\/i>-{{frac|1|M}} 化曲为直为过原点直线即可定量验证。","errorId":"E6"}],"errors":[{"id":"E1","name":"未补偿阻力或补偿不足","noteId":"P3","trigger":"垫块移出使木板水平（θ = 0°），直接挂槽码测 a-F","config":{"theta":0,"phase":"af"},"observe":"看轻推纸带的点距变化，以及对应的 a-F 图像与横轴交点在哪里。","consequence":"轻推小车迅速减速停下（点距越来越密）；作出的 <i>a-F<\/i> 图像不过原点，在<b>横轴（<i>F<\/i> 轴）上有正截距<\/b>。","ask":{"stem":"<i>a-F<\/i> 图像在横轴（<i>F<\/i> 轴）上有正截距，说明什么问题？应如何调整？","options":["补偿阻力过度，应减小木板倾角","未补偿阻力或补偿不足，应增大木板倾角","槽码质量没有远小于小车质量","小车质量测量偏大"],"answer":1,"quizId":"M03:try:E1"},"why":"未补偿或补偿不足时，拉力必须先克服剩余阻力 <i>f<\/i> 后小车才加速：a = {{frac|F − f|M}}。当 <i>a<\/i> = 0 时 <i>F<\/i> = <i>f<\/i> &gt; 0，故图线在 <i>F<\/i> 轴出现正截距，应增大垫高倾角。","questionIds":["Q4","Q8"]},{"id":"E2","name":"补偿阻力过度","noteId":"P3","trigger":"把垫块垫得过高（θ = 3.2°）","config":{"theta":3.2,"phase":"af"},"observe":"看未挂槽码轻推后的纸带点迹，以及 a-F 图像的纵轴截距。","consequence":"不挂槽码（<i>F<\/i> = 0）时小车自己向下加速（点距越来越疏）；<i>a-F<\/i> 图像在<b>纵轴（<i>a<\/i> 轴）上有正截距<\/b>。","ask":{"stem":"<i>a-F<\/i> 图像在纵轴（<i>a<\/i> 轴）上有正截距，原因是什么？","options":["未补偿阻力","木板倾角过大，补偿阻力过度","先释放小车后接通电源","槽码质量过大"],"answer":1,"quizId":"M03:try:E2"},"why":"木板垫得过高时 Mg sinθ &gt; f，不挂槽码小车已有合外力 ΔF = Mg sinθ − f &gt; 0，故 F = 0 时 a = {{frac|ΔF|M}} &gt; 0，图线交于纵轴正半轴，应减小倾角。","questionIds":["Q7"]},{"id":"E3","name":"槽码质量未远小于小车质量","noteId":"P4","trigger":"小车 M = 0.400 kg，槽码 m 一直加到 250 g，直接用 mg 作拉力","config":{"maxM":0.25,"phase":"af"},"observe":"比较以槽码重力 mg 作横轴和以力传感器拉力 F_T 作横轴的两条 a-F 图线。","consequence":"当 <i>m<\/i> 增大到不可忽略时，普通细绳（以 <i>mg<\/i> 作横轴）的 <i>a-F<\/i> 图线<b>末端明显向下弯曲<\/b>；而改用<b>力传感器<\/b>测真实拉力 <i>F<\/i><sub>T<\/sub> 时始终是一条直线！","ask":{"stem":"用 <i>mg<\/i> 当作拉力时，槽码质量增大为什么会使 <i>a-F<\/i> 图线向下弯曲？","options":["木板阻力随速度增大而剧增","绳拉力 F_T = Mmg/(M+m) 明显小于 mg，且斜率 1/(M+m) 随 m 增大而减小","打点计时器频率发生漂移","小车质量变大了"],"answer":1,"quizId":"M03:try:E3"},"why":"由于槽码加速下落处于失重状态，a = {{frac|mg|M + m}} = {{frac|1|M + m}}·mg。当 <i>m<\/i> 不可忽略时，把 <i>mg<\/i> 当横坐标，斜率 {{frac|1|M + m}} 随 <i>m<\/i> 增大而变小，图像向下弯曲。力传感器直接测 <i>F<\/i><sub>T<\/sub> = <i>Ma<\/i>，斜率恒为 1/<i>M<\/i>。","questionIds":["Q1","Q2"]},{"id":"E4","name":"补偿阻力时未穿纸带或挂了槽码","noteId":"P2","trigger":"未穿纸带（或挂着 20 g 槽码）调平木板","config":{"badBalance":"no-tape-or-with-m"},"observe":"比较“未穿纸带调平”后穿上纸带运行，以及“挂槽码调平”后实验的加速度偏差。","consequence":"未穿纸带调平时倾角偏小（少抵消了纸带阻力），正式实验穿纸带后仍<b>补偿不足<\/b>；若挂着槽码调平，则把本该用于提供加速的槽码重力消耗在平衡阻力上，后续以 <i>mg<\/i> 为拉力时严重失真。","ask":{"stem":"关于补偿阻力的操作，下列做法完全正确的是？","options":["取下槽码、穿好纸带，轻推小车观察点迹是否均匀","挂上最小槽码、不穿纸带，使小车匀速下滑","不穿纸带、不挂槽码，看小车自己能不能滑下来","挂上槽码让小车加速滑下即可"],"answer":0,"quizId":"M03:try:E4"},"why":"正式实验时小车既要拖着纸带运动（存在纸带阻力），又只靠槽码提供合外力，所以补偿阻力时必须模拟“零外力、带纸带”状态：<b>不挂槽码、穿好纸带<\/b>，轻推使点迹均匀。","questionIds":["Q2","Q3"]},{"id":"E5","name":"误区：改变小车质量后需要重新补偿阻力？","noteId":"P5","trigger":"在同一个已调好的倾角 θ₀ 下，把小车质量从 0.300 kg 改为 0.600 kg","config":{"masses":[0.3,0.6]},"observe":"在同一倾角 θ₀ 下，分别取 M = 0.300 kg 和 M = 0.600 kg 不挂槽码轻推，观察两条纸带点距。","consequence":"改变 <i>M<\/i> 后，两条纸带的点迹<b>都保持均匀<\/b>（加速度几乎为 0），说明不需要重新垫高或放低木板！","ask":{"stem":"在探究 <i>a<\/i> 与 <i>M<\/i> 的关系时，每次向小车上增减砝码后，是否需要重新平衡摩擦力？","options":["需要，质量越大阻力越大，必须垫得更高","需要，质量越大滑得越快，必须垫得更低","不需要，平衡摩擦力方程 Mg sinθ = μMg cosθ 中质量 M 可以约去","只有质量超过 0.5 kg 时才需要重调"],"answer":2,"quizId":"M03:try:E5"},"why":"由 Mg sinθ = μMg cosθ 得 tanθ = μ，平衡倾角 θ 只与动摩擦因数 μ 有关，与小车质量 <i>M<\/i> 无关（纸带阻力极小且基本恒定）。因此增减砝码改变 <i>M<\/i> 时无需重新补偿阻力。","questionIds":["Q2"]},{"id":"E6","name":"探究 a-M 时直接作曲线而非化曲为直","noteId":"P6","trigger":"保留同一组 (M, a) 数据，对比 a-M 图与 a-1/M 图","config":{"phase":"am"},"observe":"对比左图的 a-M 曲线和右图的 a-1/M 图像，看哪一张能确定反比关系。","consequence":"<i>a-M<\/i> 图是一条向下弯曲的曲线，单看曲线无法判断是反比（∝ 1/<i>M<\/i>）还是平方反比（∝ 1/<i>M<\/i>²）；改作 <b><i>a<\/i>-1/<i>M<\/i> 图像<\/b>立即变成过原点的直线（<i>R<\/i>² &gt; 0.999）！","ask":{"stem":"探究加速度与质量的关系时，处理数据为什么要作 <i>a<\/i>-1/<i>M<\/i> 图像？","options":["1/M 的数值更好算","将曲线关系转化为直线关系（化曲为直），便于直观判断 a 与 M 是否成反比","可以消除阻力的影响","可以不测小车质量"],"answer":1,"quizId":"M03:try:E6"},"why":"人眼和直尺很难检验一条曲线是不是精确的双曲线；作 <i>a<\/i>-1/<i>M<\/i> 图像（或 1/<i>a<\/i>-<i>M<\/i> 图像）把反比关系转化为过原点的线性关系，只要点迹在一条过原点直线上就能确证反比规律。","questionIds":["Q3","Q5"]}],"reverse":[{"id":"R1","show":{"type":"af-under"},"stem":"某同学在“探究 <i>a<\/i> 与 <i>F<\/i> 的关系”时，保持小车质量不变，得到的 <i>a-F<\/i> 图像如图所示（延长线与横轴交于正半轴）。最可能的原因是？","options":["未补偿阻力或补偿阻力不足","补偿阻力过度（木板倾角过大）","槽码质量未远小于小车质量","先释放小车后接通电源"],"answer":[0],"replay":"E1","why":"图线在横轴上有正截距，表示施加了一定拉力后小车加速度仍为零，即拉力先用来抵消未被平衡的阻力，说明未补偿阻力或倾角太小。","quizId":"M03:reverse:R1"},{"id":"R2","show":{"type":"af-over"},"stem":"另一位同学作出的 <i>a-F<\/i> 图像如图所示，图线未过原点且交于纵轴（<i>a<\/i> 轴）正半轴。最可能的原因是？","options":["未补偿阻力","木板无滑轮一端垫得过高（补偿阻力过度）","力传感器忘记调零偏小","改变质量后没有重新补偿阻力"],"answer":[1],"replay":"E2","why":"当 <i>F<\/i> = 0（未挂槽码）时小车已有向下的加速度，说明重力沿木板向下的分力大于阻力，即木板垫得过高、补偿过度。","quizId":"M03:reverse:R2"},{"id":"R3","show":{"type":"af-bend"},"stem":"用普通细绳牵引小车（以槽码重力 <i>mg<\/i> 作为拉力 <i>F<\/i>），得到的 <i>a-F<\/i> 图像在拉力较大时明显向横轴一侧弯曲。原因是？","options":["木板倾角随时间变小了","槽码质量较大，不满足 m ≪ M，细绳真实拉力明显小于 mg","小车到达滑轮前没有按住","交流电源频率大于 50 Hz"],"answer":[1],"replay":"E3","why":"a = {{frac|mg|M + m}}，当 <i>m<\/i> 不可忽略时，斜率 {{frac|1|M + m}} 随 <i>m<\/i> 增大而减小，故图线向下弯曲。改用力传感器测拉力可直接消除此弯曲。","quizId":"M03:reverse:R3"},{"id":"R4","show":{"type":"inv-a-M"},"stem":"保持槽码不变、改变小车及砝码总质量 <i>M<\/i>，甲、乙两组同学分别作出的 {{frac|1|a}}-<i>M<\/i> 图像如图所示（两直线交于纵轴同一点）。下列说法正确的是（多选）？","options":["在合外力一定时，a 与 M 成反比","甲组所用的槽码质量比乙组大","乙组所用的槽码质量比甲组大","两直线纵轴截距相同，理论上均等于 1/g"],"answer":[0,1,3],"replay":"E6","why":"由 a = {{frac|mg|M + m}} 得 {{frac|1|a}} = {{frac|1|mg}} M + {{frac|1|g}}。斜率 k = {{frac|1|mg}}，纵截距均为 {{frac|1|g}}。图中甲直线斜率更小，说明甲组槽码质量 <i>m<\/i> 更大。（对应 2024·甘肃卷第11题思想）","quizId":"M03:reverse:R4"}],"summary":{"principle":"控制变量法：<i>M<\/i> 一定时 <i>a<\/i> ∝ <i>F<\/i>，<i>F<\/i> 一定时 <i>a<\/i> ∝ {{frac|1|M}}。补偿阻力后 Mg sinθ = μMg cosθ + f<sub>纸带<\/sub>；真实拉力 F<sub>T<\/sub> = {{frac|Mmg|M + m}}，当 <i>m<\/i> ≪ <i>M<\/i>（或用力传感器）时可消除系统误差。","steps":["长木板无滑轮端安装打点计时器并放垫块，调滑轮使细绳平行木板","不挂槽码、穿好纸带，调节垫块使轻推小车后纸带点迹均匀（补偿阻力）","控制 <i>M<\/i> 不变，换不同槽码测出多组 <i>a<\/i>（先通电后释放、滑轮前按住），作 <i>a-F<\/i> 图","控制槽码不变，增减小车砝码改变 <i>M<\/i>（无需重调倾角），测多组 <i>a<\/i>","作 <i>a<\/i>-{{frac|1|M}} 图像（化曲为直），斜率近似等于合力 <i>F<\/i>"],"notes":[{"do":"补偿阻力时必须不挂槽码、穿好纸带","why":"要同时抵消轨道摩擦和纸带阻力，且不能把槽码重力算进来"},{"do":"细绳要与长木板平行","why":"确保绳对小车的拉力方向沿木板方向不变"},{"do":"改变小车质量 M 后无需重新补偿阻力","why":"Mg sinθ = μMg cosθ 中质量 M 可约去，倾角只与 μ 有关"},{"do":"普通细绳须满足 m ≪ M；力传感器则无需","why":"槽码失重使 F_T = Mmg/(M+m) < mg；力传感器直接测出 F_T"},{"do":"探究 a-M 时改作 a-1/M 图像","why":"把曲线化为过原点的倾斜直线，便于确证反比关系"}],"errors":["系统误差：未满足 m ≪ M（a-F 图末端下弯）；补偿阻力不足（F 轴正截距）或过度（a 轴正截距）","偶然误差：纸带读数、描点作图误差","逻辑/公式误区：打点周期为 T 且间隔 4 点未画时，逐差法分母应为 225T²"],"conclusions":["a-F 图像斜率 = 1/M（若 F-a 图则斜率 = M）","F 轴正截距 → 补偿不足/未补偿；a 轴正截距 → 补偿过度","a-F 末端下弯 → 不满足 m ≪ M（可用力传感器或整体法解决）","1/a-M 图斜率 = 1/(mg)，纵截距 = 1/g"]}}</script>

" r=\"2.8\"/><circle cx=\"184\" cy=\"18\" r=\"2.8\"/><circle cx=\"222\" cy=\"18\" r=\"2.8\"/><circle cx=\"248\" cy=\"18\" r=\"2.8\"/><circle cx=\"266\" cy=\"18\" r=\"2.8\"/><\/g><\/g><\/svg>","options":["点距从密到疏","点距均匀","点距从疏到密","点距先密后疏再密"],"answer":1,"replay":"E1","explain":"补偿阻力恰当时，不挂槽码轻推小车，小车做匀速直线运动，打点计时器打出的纸带点距均匀，故选 B。","quizId":"M03:paper:Q1:①"},{"label":"②","type":"numeric","prompt":"某次实验得到一条纸带，部分计数点如下图所示（每相邻两个计数点间还有 4 个点，图中未画出），测得 s₁ = 6.20 cm，s₂ = 6.70 cm，s₃ = 7.21 cm，s₄ = 7.73 cm。已知打点计时器所接交流电源频率为 50 Hz，则小车的加速度 a =（要求充分利用测量数据，结果保留两位有效数字）<svg viewBox=\"0 0 600 92\" width=\"600\" role=\"img\" aria-label=\"2024天津纸带分段图\"><rect x=\"14\" y=\"20\" width=\"572\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#9AA8B8\"/><g fill=\"#2B2B2B\"><circle cx=\"70\" cy=\"34\" r=\"3\"/><circle cx=\"160\" cy=\"34\" r=\"3\"/><circle cx=\"264\" cy=\"34\" r=\"3\"/><circle cx=\"384\" cy=\"34\" r=\"3\"/><circle cx=\"520\" cy=\"34\" r=\"3\"/><\/g><g font-size=\"13\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"700\"><text x=\"70\" y=\"14\">A<\/text><text x=\"160\" y=\"14\">B<\/text><text x=\"264\" y=\"14\">C<\/text><text x=\"384\" y=\"14\">D<\/text><text x=\"520\" y=\"14\">E<\/text><\/g><g stroke=\"#12A9C4\" stroke-dasharray=\"3 3\"><line x1=\"70\" y1=\"34\" x2=\"70\" y2=\"72\"/><line x1=\"160\" y1=\"34\" x2=\"160\" y2=\"72\"/><line x1=\"264\" y1=\"34\" x2=\"264\" y2=\"72\"/><line x1=\"384\" y1=\"34\" x2=\"384\" y2=\"72\"/><line x1=\"520\" y1=\"34\" x2=\"520\" y2=\"72\"/><\/g><g stroke=\"#10233F\" fill=\"none\"><path d=\"M72 64 H158\"/><path d=\"M162 64 H262\"/><path d=\"M266 64 H382\"/><path d=\"M386 64 H518\"/><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\"><text x=\"115\" y=\"82\">s₁<\/text><text x=\"212\" y=\"82\">s₂<\/text><text x=\"324\" y=\"82\">s₃<\/text><text x=\"452\" y=\"82\">s₄<\/text><\/g><\/svg>","unit":"m/s²","answer":0.51,"tol":0.005,"sig":2,"show":"0.51","explain":"每相邻两个计数点间有 5 个打点间隔，T = 0.1 s。利用四段逐差法：a = {{frac|(s₃ + s₄) − (s₁ + s₂)|4T²}} = {{frac|(7.21 + 7.73 − 6.20 − 6.70) × 10⁻² m|4 × (0.1 s)²}} = 0.51 m/s²。","quizId":"M03:paper:Q1:②"},{"label":"③","type":"numeric","prompt":"该同学将一个可以直接测出绳子拉力的传感器安装在小车上，小车和传感器总质量为 210 g。按要求补偿阻力后，该同学共进行了四次实验，悬挂的槽码质量依次为 5 g、10 g、20 g、40 g。处理数据时，用两种方式得到小车（含传感器）受到的合力，一种将槽码所受重力当作合力，另一种将传感器示数当作合力，则这两种方式得到的合力差异最大时，槽码质量为","unit":"g","answer":40,"tol":0.1,"show":"40","replay":"E3","explain":"绳子实际拉力 F<sub>T<\/sub> = {{frac|Mmg|M + m}}，与槽码重力 mg 之差 ΔF = mg − F<sub>T<\/sub> = {{frac|m²g|M + m}}。随着槽码质量 m 增大，m 相对 M 越不可忽略，两种合力差异越大，故在 40 g 时差异最大。","quizId":"M03:paper:Q1:③"}]},{"id":"Q2","source":"2024·浙江1月选考·第16-Ⅰ题","verified":true,"score":7,"stem":"如图 1 所示是“探究加速度与力、质量的关系”的实验装置。<svg viewBox=\"0 0 640 132\" width=\"640\" role=\"img\" aria-label=\"2024浙江1月选考装置与纸带坐标图\"><rect x=\"20\" y=\"64\" width=\"240\" height=\"8\" fill=\"#C9A97A\" stroke=\"#8B6B3E\"/><g transform=\"translate(34,58) rotate(-2)\"><rect x=\"0\" y=\"0\" width=\"220\" height=\"6\" fill=\"#D9B98C\" stroke=\"#9A7B4F\"/><circle cx=\"-4\" cy=\"0\" r=\"7\" fill=\"#C9D1D9\" stroke=\"#596574\"/><rect x=\"84\" y=\"-22\" width=\"46\" height=\"18\" rx=\"3\" fill=\"#5C8DEB\"/><rect x=\"176\" y=\"-20\" width=\"30\" height=\"20\" fill=\"#4F6A8A\"/><line x1=\"0\" y1=\"-10\" x2=\"84\" y2=\"-13\" stroke=\"#222\"/><line x1=\"130\" y1=\"-11\" x2=\"226\" y2=\"-11\" stroke=\"#E6D6B0\" stroke-width=\"3\"/><\/g><line x1=\"25\" y1=\"58\" x2=\"25\" y2=\"104\" stroke=\"#222\"/><rect x=\"16\" y=\"104\" width=\"18\" height=\"10\" fill=\"#8E99A6\"/><text x=\"135\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#10233F\">图1<\/text><g transform=\"translate(300,16)\"><rect x=\"10\" y=\"16\" width=\"310\" height=\"24\" fill=\"#F6F1E3\" stroke=\"#9AA8B8\"/><rect x=\"10\" y=\"40\" width=\"310\" height=\"24\" fill=\"#FBFCFE\" stroke=\"#9AA8B8\"/><g fill=\"#2B2B2B\"><circle cx=\"28\" cy=\"28\" r=\"2.5\"/><circle cx=\"48\" cy=\"28\" r=\"2.5\"/><circle cx=\"74\" cy=\"28\" r=\"2.5\"/><circle cx=\"106\" cy=\"28\" r=\"2.5\"/><circle cx=\"144\" cy=\"28\" r=\"2.5\"/><circle cx=\"188\" cy=\"28\" r=\"2.5\"/><circle cx=\"240\" cy=\"28\" r=\"2.5\"/><\/g><g font-size=\"11\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\"><text x=\"28\" y=\"12\">0<\/text><text x=\"48\" y=\"12\">x₁<\/text><text x=\"74\" y=\"12\">x₂<\/text><text x=\"106\" y=\"12\">x₃<\/text><text x=\"144\" y=\"12\">x₄<\/text><text x=\"188\" y=\"12\">x₅<\/text><text x=\"240\" y=\"12\">x₆<\/text><\/g><g stroke=\"#10233F\" stroke-width=\"0.9\"><line x1=\"28\" y1=\"40\" x2=\"28\" y2=\"52\"/><line x1=\"78\" y1=\"40\" x2=\"78\" y2=\"50\"/><line x1=\"128\" y1=\"40\" x2=\"128\" y2=\"52\"/><line x1=\"178\" y1=\"40\" x2=\"178\" y2=\"50\"/><line x1=\"228\" y1=\"40\" x2=\"228\" y2=\"52\"/><line x1=\"278\" y1=\"40\" x2=\"278\" y2=\"50\"/><\/g><text x=\"165\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#10233F\">图2（相邻计数点间有4个点未画出）<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"choice","prompt":"该实验中同时研究三个物理量间关系是很困难的，因此我们采用的研究方法是____。","options":["放大法","控制变量法","补偿法"],"answer":1,"explain":"先保持质量 M 不变探究 a 与 F 的关系，再保持 F 不变探究 a 与 M 的关系，这种方法叫做控制变量法（B）。","quizId":"M03:paper:Q2:(1)"},{"label":"(2)","type":"choice","prompt":"该实验过程中操作正确的是____。","options":["补偿阻力时小车未连接纸带","先接通打点计时器电源，后释放小车","调节滑轮高度使细绳与水平桌面平行"],"answer":1,"replay":"E4","explain":"补偿阻力时小车必须连接纸带（A 错）；应调节滑轮高度使细绳与长木板平行而非水平桌面（C 错）；应先接通电源再释放小车（B 对）。","quizId":"M03:paper:Q2:(2)"},{"label":"(3)①","type":"text-choice","prompt":"在小车质量____槽码质量时，可以认为细绳拉力近似等于槽码的重力。","options":["远大于","远小于"],"answer":0,"replay":"E3","explain":"由 F<sub>T<\/sub> = {{frac|Mmg|M + m}} = {{frac|mg|1 + m/M}} 可知，只有小车质量 M 远大于槽码质量 m 时，拉力才近似等于槽码重力 mg。","quizId":"M03:paper:Q2:(3)①"},{"label":"(3)②","type":"text-choice","prompt":"上述用槽码重力代替细绳拉力的做法引起的误差为____。","options":["偶然误差","系统误差"],"answer":1,"explain":"由于实验原理（忽略槽码加速失重）造成的总是偏大的确定性误差，属于系统误差。","quizId":"M03:paper:Q2:(3)②"},{"label":"(3)③","type":"choice","prompt":"为减小（消除）此系统误差，下列可行的方案是____。","options":["用气垫导轨代替普通导轨，滑块代替小车","在小车上加装遮光条，用光电计时系统代替打点计时器","在小车与细绳之间加装力传感器，测出小车所受拉力大小"],"answer":2,"explain":"加装力传感器可直接测得细绳对小车的真实拉力 F<sub>T<\/sub>，不再用 mg 近似代替拉力，从而消除该系统误差，选 C。","quizId":"M03:paper:Q2:(3)③"},{"label":"(4)①","type":"expr","prompt":"经正确操作后获得如图 2 所示的纸带，建立以计数点 0 为坐标原点的 x 轴，各计数点的位置坐标分别为 0、x₁、…、x₆（相邻计数点间还有 4 个点未画出）。已知打点计时器的打点周期为 T，则打计数点 5 时小车速度的表达式","lhs":"v =","vars":{"x4":"x₄","x5":"x₅","x6":"x₆","T":"T"},"extra":["1","2","5","0"],"answer":"(x6-x4)/(10*T)","show":"(x₆ − x₄) ÷ (10T)","explain":"相邻计数点时间间隔 t = 5T。计数点 5 是 4、6 两点的中间时刻，位移为 x₆ − x₄，用时 2t = 10T，故 v₅ = {{frac|x₆ − x₄|10T}}。","quizId":"M03:paper:Q2:(4)①"},{"label":"(4)②","type":"choice","prompt":"（接上问）小车加速度的表达式是____。","options":["a = {{frac|x₆ − 2x₃|(15T)²}}","a = {{frac|x₆ − 2x₃|(3T)²}}","a = {{frac|x₅ + x₄ − (x₃ + x₂)|(10T)²}}"],"answer":0,"explain":"前三段总位移为 x₃，后三段总位移为 x₆ − x₃，每三段用时 3t = 15T。由逐差法得 a = {{frac|(x₆ − x₃) − x₃|(15T)²}} = {{frac|x₆ − 2x₃|(15T)²}}，选 A。","quizId":"M03:paper:Q2:(4)②"}]},{"id":"Q3","source":"2024·甘肃卷·第11题","verified":true,"stem":"用图 1 所示实验装置探究外力一定时加速度与质量的关系。<svg viewBox=\"0 0 640 154\" width=\"640\" role=\"img\" aria-label=\"2024甘肃第11题装置、纸带与图像\"><g transform=\"translate(8,8)\"><rect x=\"58\" y=\"76\" width=\"176\" height=\"8\" fill=\"#C9D1D9\" stroke=\"#596574\"/><rect x=\"84\" y=\"84\" width=\"14\" height=\"46\" fill=\"#C9D1D9\" stroke=\"#596574\"/><g transform=\"translate(34,70) rotate(-3)\"><rect x=\"0\" y=\"0\" width=\"194\" height=\"6\" fill=\"#E6B87A\" stroke=\"#8B6B3E\"/><circle cx=\"-4\" cy=\"0\" r=\"7\" fill=\"#fff\" stroke=\"#222\"/><rect x=\"102\" y=\"-20\" width=\"34\" height=\"16\" fill=\"#fff\" stroke=\"#222\"/><rect x=\"114\" y=\"-30\" width=\"10\" height=\"10\" fill=\"#8E99A6\" stroke=\"#222\"/><rect x=\"152\" y=\"-16\" width=\"20\" height=\"16\" fill=\"#E6B87A\" stroke=\"#8B6B3E\"/><line x1=\"0\" y1=\"-8\" x2=\"102\" y2=\"-12\" stroke=\"#222\"/><line x1=\"136\" y1=\"-10\" x2=\"198\" y2=\"-10\" stroke=\"#222\"/><\/g><rect x=\"214\" y=\"68\" width=\"14\" height=\"8\" fill=\"#10233F\"/><line x1=\"24\" y1=\"70\" x2=\"24\" y2=\"106\" " y2=\"58\" stroke=\"#C7374B\" stroke-dasharray=\"3 3\" stroke-width=\"1.5\"/><line x1=\"78\" y1=\"58\" x2=\"124\" y2=\"16\" stroke=\"#C7374B\" stroke-width=\"1.8\"/><line x1=\"24\" y1=\"109\" x2=\"86\" y2=\"68\" stroke=\"#1661FF\" stroke-dasharray=\"3 3\" stroke-width=\"1.5\"/><line x1=\"86\" y1=\"68\" x2=\"156\" y2=\"22\" stroke=\"#1661FF\" stroke-width=\"1.8\"/><text x=\"68\" y=\"44\" font-size=\"11\" fill=\"#C7374B\" font-weight=\"700\">乙<\/text><text x=\"124\" y=\"62\" font-size=\"11\" fill=\"#1661FF\" font-weight=\"700\">甲<\/text><text x=\"30\" y=\"16\" font-size=\"10.5\" fill=\"#10233F\">1/a / (m·s⁻²)⁻¹<\/text><text x=\"164\" y=\"130\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#10233F\">M / kg<\/text><text x=\"96\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"700\">图3<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"choice","prompt":"以下操作正确的是____。","options":["使小车质量远小于槽码质量","调整垫块位置以补偿阻力","补偿阻力时移去打点计时器和纸带","释放小车后立即打开打点计时器"],"answer":1,"replay":"E1","explain":"应使槽码质量远小于小车质量（A 错）；补偿阻力时必须保留打点计时器和纸带（C 错）；应先通电后释放（D 错）；调整垫块位置以补偿阻力正确，选 B。","quizId":"M03:paper:Q3:(1)"},{"label":"(2)","type":"choice","prompt":"保持槽码质量不变，改变小车上砝码的质量，得到一系列打点纸带。其中一条纸带的计数点如图 2 所示，相邻两点之间的距离分别为 S₁、S₂、…、S₈，时间间隔均为 T。下列加速度算式中，最优的是____。","options":["a = {{frac|1|7}}[{{frac|S₈ − S₇|T²}} + {{frac|S₇ − S₆|T²}} + … + {{frac|S₂ − S₁|T²}}]","a = {{frac|1|6}}[{{frac|S₈ − S₆|2T²}} + {{frac|S₇ − S₅|2T²}} + … + {{frac|S₃ − S₁|2T²}}]","a = {{frac|1|5}}[{{frac|S₈ − S₅|3T²}} + {{frac|S₇ − S₄|3T²}} + … + {{frac|S₄ − S₁|3T²}}]","a = {{frac|1|4}}[{{frac|S₈ − S₄|4T²}} + {{frac|S₇ − S₃|4T²}} + {{frac|S₆ − S₂|4T²}} + {{frac|S₅ − S₁|4T²}}]"],"answer":3,"explain":"A、B、C 三式求和后中间项大量抵消，只用到首尾少数几个数据；D 式为 8 段逐差法，8 个数据恰好各自参与一次，偶然误差最小，选 D。","quizId":"M03:paper:Q3:(2)"},{"label":"(3)①","type":"text-choice","prompt":"以小车和砝码的总质量 M 为横坐标，加速度的倒数 1/a 为纵坐标，甲、乙两组同学分别得到的 1/a-M 图像如图 3 所示。由图可知，在所受外力一定的条件下，a 与 M 成____。","options":["正比","反比"],"answer":1,"replay":"E6","explain":"1/a 与 M 近似呈线性关系（截距很小），在满足 m ≪ M 时 1/a ∝ M，即外力一定时 a 与 M 成反比。","quizId":"M03:paper:Q3:(3)①"},{"label":"(3)②","type":"text-choice","prompt":"甲组所用的____质量比乙组的更大。","options":["小车","砝码","槽码"],"answer":2,"explain":"由 a = {{frac|mg|M + m}} 取倒数得 {{frac|1|a}} = {{frac|1|mg}} M + {{frac|1|g}}。图线斜率 k = {{frac|1|mg}}，甲组斜率小于乙组，说明甲组所用的槽码质量 m 更大。","quizId":"M03:paper:Q3:(3)②"}]},{"id":"Q4","source":"2025·山东卷·第13题","verified":true,"stem":"某小组采用如图甲所示的装置验证牛顿第二定律：将两光电门安装在长直轨道上，选择宽度为 d 的遮光片固定在小车上，调整轨道倾角，用跨过定滑轮的细线将小车与托盘及砝码相连。<svg viewBox=\"0 0 640 144\" width=\"640\" role=\"img\" aria-label=\"2025山东第13题装置与a-F图\"><g transform=\"translate(14,10)\"><rect x=\"10\" y=\"88\" width=\"290\" height=\"8\" fill=\"#D9B98C\" stroke=\"#8B6B3E\"/><circle cx=\"10\" cy=\"84\" r=\"8\" fill=\"#C9D1D9\" stroke=\"#596574\"/><line x1=\"2\" y1=\"84\" x2=\"2\" y2=\"112\" stroke=\"#222\"/><rect x=\"-4\" y=\"112\" width=\"12\" height=\"10\" fill=\"#8E99A6\"/><rect x=\"210\" y=\"62\" width=\"54\" height=\"24\" rx=\"3\" fill=\"#5C8DEB\"/><rect x=\"218\" y=\"46\" width=\"6\" height=\"16\" fill=\"#10233F\"/><rect x=\"168\" y=\"36\" width=\"8\" height=\"52\" fill=\"#3B4B60\"/><rect x=\"84\" y=\"36\" width=\"8\" height=\"52\" fill=\"#3B4B60\"/><line x1=\"10\" y1=\"76\" x2=\"210\" y2=\"74\" stroke=\"#222\"/><g font-size=\"11\" fill=\"#10233F\" text-anchor=\"middle\"><text x=\"88\" y=\"28\">光电门2<\/text><text x=\"172\" y=\"28\">光电门1<\/text><text x=\"236\" y=\"38\">遮光片 d<\/text><text x=\"155\" y=\"128\" font-weight=\"700\">图甲<\/text><\/g><\/g><g transform=\"translate(360,8)\"><line x1=\"34\" y1=\"106\" x2=\"240\" y2=\"106\" stroke=\"#10233F\" stroke-width=\"1.5\"/><line x1=\"34\" y1=\"106\" x2=\"34\" y2=\"14\" stroke=\"#10233F\" stroke-width=\"1.5\"/><line x1=\"84\" y1=\"106\" x2=\"218\" y2=\"26\" stroke=\"#1661FF\" stroke-width=\"2\"/><line x1=\"84\" y1=\"106\" x2=\"34\" y2=\"136\" stroke=\"#1661FF\" stroke-dasharray=\"4 3\" stroke-width=\"1.4\"/><text x=\"24\" y=\"18\" font-size=\"12\" fill=\"#10233F\">a<\/text><text x=\"236\" y=\"120\" font-size=\"12\" text-anchor=\"end\" fill=\"#10233F\">F<\/text><text x=\"24\" y=\"118\" font-size=\"11\" fill=\"#10233F\">O<\/text><text x=\"136\" y=\"128\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"700\">图乙<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"选用 d = ____ cm 的遮光片，可以较准确地测量遮光片运动到光电门时小车的瞬时速度。","options":["5.00","1.00"],"answer":1,"explain":"光电门用平均速度 v = d/Δt 代替瞬时速度，遮光片越窄、遮光时间越短，平均速度越接近瞬时速度，故选 1.00 cm。","quizId":"M03:paper:Q4:(1)"},{"label":"(2)","type":"numeric","prompt":"将小车自轨道右端由静止释放，从数字毫秒计分别读取遮光片经过光电门 1、光电门 2 时的速度 v₁ = 0.40 m/s、v₂ = 0.81 m/s，以及从遮光片开始遮住光电门 1 到开始遮住光电门 2 的时间 t = 1.00 s，计算小车的加速度 a =（保留 2 位有效数字）","unit":"m/s²","answer":0.41,"tol":0.005,"sig":2,"show":"0.41","explain":"由 a = {{frac|v₂ − v₁|t}} = {{frac|0.81 − 0.40|1.00}} m/s² = 0.41 m/s²。","quizId":"M03:paper:Q4:(2)"},{"label":"(3)","type":"text-choice","prompt":"将托盘及砝码的重力视为小车受到的合力 F，改变砝码质量，重复上述步骤，根据数据拟合出 a-F 图像如图乙所示。若要得到一条过原点的直线，实验中应____轨道的倾角。","options":["增大","减小"],"answer":0,"replay":"E1","explain":"图乙在横轴（F 轴）上有正截距，说明未完全平衡摩擦力（补偿阻力不足），需要增大轨道右端的垫高倾角。","quizId":"M03:paper:Q4:(3)"},{"label":"(4)","type":"text-choice","prompt":"图乙中直线斜率的单位为____。","options":["kg","kg⁻¹"],"answer":1,"explain":"由 a = {{frac|1|M}} F − {{frac|f|M}} 可知，a-F 图像的斜率表示小车总质量的倒数 {{frac|1|M}}，单位为 kg⁻¹。","quizId":"M03:paper:Q4:(4)"}]},{"id":"Q5","source":"2025·陕晋宁青卷·第11题","verified":true,"stem":"某同学利用打点计时器、小车、长木板、垫块和槽码探究“外力一定时加速度与质量的关系”，测得小车质量 <i>m<\/i> 与加速度 <i>a<\/i> 的部分实验数据如下表：<table class=\"dt\"><tr><th>m / kg<\/th><td>0.25<\/td><td>0.33<\/td><td>0.40<\/td><td>0.50<\/td><td>1.00<\/td><\/tr><tr><th>a / (m·s⁻²)<\/th><td>0.618<\/td><td>0.482<\/td><td>0.403<\/td><td>0.317<\/td><td>0.152<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"text-choice","prompt":"实验前为补偿小车受到的阻力，应取下槽码、穿好纸带，将长木板____。","options":["水平放置在桌面上","一端垫高使轻推小车后匀速运动"],"answer":1,"replay":"E1","explain":"补偿阻力须将长木板不带滑轮的一端垫高，不挂槽码、穿好纸带，轻推小车直至点迹均匀。","quizId":"M03:paper:Q5:(1)"},{"label":"(2)","type":"multi","prompt":"为了从上表数据直观验证 <i>a<\/i> 与 <i>m<\/i> 的定量关系，可作出的线性图像是____（多选）。","options":["a - 1/m 图像","a - m 图像","am - m 图像","a² - m 图像"],"answer":[0,2],"replay":"E6","explain":"若 a ∝ 1/m，则 a-{{frac|1|m}} 图像为过原点的倾斜直线，且 a·m = F（恒量），故 am-m 图像也是一条平行于横轴的直线。选 A、C。","quizId":"M03:paper:Q5:(2)"},{"label":"(3)","type":"choice","prompt":"在随后探究“质量一定时加速度与力的关系”时，甲同学不断往槽码盘中增加桌面上的槽码；乙同学则事先把一批槽码放在小车上，每次从车上取槽码移到槽码盘中。为减小系统误差，更合理的方案是____。","options":["甲同学的方案，因为小车质量一直保持不变","乙同学的方案，因为小车与全部槽码构成的系统总质量不变，可直接消去 m ≪ M 引起的系统误差"],"answer":1,"replay":"E3","explain":"乙同学把车上槽码移到盘中，研究小车与全部槽码整体时系统总质量 (M + m<sub>总<\/sub>) 保持恒定，合外力恰好等于盘中槽码重力，从而消除了 m 不能远小于 M 带来的系统误差，选乙。","quizId":"M03:paper:Q5:(3)"}]},{"id":"Q6","source":"2026·河南卷·第11题","verified":true,"stem":"某实验小组利用图 1 所示装置验证牛顿第二定律，器材有：气垫导轨、滑块、光电门、数字计时器、遮光条、游标卡尺、垫块等。已知气垫导轨两支脚间距为 <i>L<\/i>，一端垫块垫高为 <i>h<\/i>，两光电门间距为 <i>s<\/i>。<svg viewBox=\"0 0 640 165\" width=\"640\" role=\"img\" aria-label=\"2026河南第11题气垫导轨与20分度游标卡尺图\"><g transform=\"translate(10,12)\"><line x1=\"10\" y1=\"120\" x2=\"260\" y2=\"120\" stroke=\"#8B6B3E\" stroke-width=\"3\"/><g transform=\"translate(22,108) rotate(-7)\"><rect x=\"0\" y=\"0\" width=\"230\" height=\"10\" fill=\"#C9D1D9\" stroke=\"#596574\"/><rect x=\"148\" y=\"-20\" width=\"34\" height=\"18\" rx=\"2\" fill=\"#5C8DEB\" stroke=\"#2E5FBF\"/><rect x=\"162\" y=\"-32\" width=\"5\" height=\"12\" fill=\"#10233F\"/><rect x=\"114\" y=\"-38\" width=\"7\" height=\"38\" fill=\"#3B4B60\"/><rect x=\"48\" y=\"-38\" width=\"7\" height=\"38\" fill=\"#3B4B60\"/><\/g><rect x=\"216\" y=\"96\" width=\"26\" height=\"24\" fill=\"#8E99A6\" stroke=\"#596574\"/><text x=\"250\" y=\"112\" font-size=\"11\" fill=\"#10233F\">h<\/text><text x=\"135\" y=\"136\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">两支脚间距 L<\/text><text x=\"92\" y=\"52\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">s<\/text><text x=\"135\" y=\"150\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"700\">图1<\/text><\/g><g transform=\"translate( xt x=\"355\" y=\"52\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#4A5B73\">cm<\/text><rect x=\"52\" y=\"56\" width=\"308\" height=\"46\" fill=\"#E8EEF5\" stroke=\"#596574\"/><g stroke=\"#10233F\"><line x1=\"72.10\" y1=\"56\" x2=\"72.10\" y2=\"77\" stroke-width=\"1.4\"/><line x1=\"82.55\" y1=\"56\" x2=\"82.55\" y2=\"67\"/><line x1=\"93.00\" y1=\"56\" x2=\"93.00\" y2=\"67\"/><line x1=\"103.45\" y1=\"56\" x2=\"103.45\" y2=\"67\"/><line x1=\"113.90\" y1=\"56\" x2=\"113.90\" y2=\"67\"/><line x1=\"124.35\" y1=\"56\" x2=\"124.35\" y2=\"77\"/><line x1=\"134.80\" y1=\"56\" x2=\"134.80\" y2=\"67\"/><line x1=\"145.25\" y1=\"56\" x2=\"145.25\" y2=\"67\"/><line x1=\"155.70\" y1=\"56\" x2=\"155.70\" y2=\"67\"/><line x1=\"166.15\" y1=\"56\" x2=\"166.15\" y2=\"67\"/><line x1=\"176.60\" y1=\"56\" x2=\"176.60\" y2=\"77\"/><line x1=\"187.05\" y1=\"56\" x2=\"187.05\" y2=\"67\"/><line x1=\"197.50\" y1=\"56\" x2=\"197.50\" y2=\"67\"/><line x1=\"207.95\" y1=\"56\" x2=\"207.95\" y2=\"67\"/><line x1=\"218.40\" y1=\"56\" x2=\"218.40\" y2=\"67\"/><line x1=\"228.85\" y1=\"56\" x2=\"228.85\" y2=\"77\"/><line x1=\"239.30\" y1=\"56\" x2=\"239.30\" y2=\"67\"/><line x1=\"249.75\" y1=\"56\" x2=\"249.75\" y2=\"67\"/><line x1=\"260.20\" y1=\"56\" x2=\"260.20\" y2=\"67\"/><line x1=\"270.65\" y1=\"56\" x2=\"270.65\" y2=\"67\"/><line x1=\"281.10\" y1=\"56\" x2=\"281.10\" y2=\"77\"/><\/g><g font-size=\"10.5\" text-anchor=\"middle\" fill=\"#10233F\"><text x=\"72.10\" y=\"91\" font-weight=\"700\">0<\/text><text x=\"124.35\" y=\"91\">5<\/text><text x=\"176.60\" y=\"91\">10<\/text><text x=\"228.85\" y=\"91\">15<\/text><text x=\"281.10\" y=\"91\">20<\/text><\/g><text x=\"354\" y=\"115\" font-size=\"10\" text-anchor=\"end\" fill=\"#4A5B73\">(20分度)<\/text><text x=\"182\" y=\"135\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"700\">图2<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"numeric","prompt":"用 20 分度游标卡尺测量遮光条的宽度 Δx，示数如图 2 所示，则 Δx =","unit":"mm","answer":5.1,"tol":0.01,"sig":3,"show":"5.10","explain":"主尺读数 5 mm，20 分度游标尺第 2 条刻线与主尺对齐（精确度 0.05 mm，不估读），故 Δx = 5 + 2 × 0.05 = 5.10 mm。","quizId":"M03:paper:Q6:(1)"},{"label":"(2)","type":"numeric","prompt":"释放滑块，数字计时器记录滑块通过光电门 1 的遮光时间为 Δt₁ = 10.20 ms，则滑块通过光电门 1 的速度大小 v₁ =（保留 2 位有效数字）","unit":"m/s","answer":0.5,"tol":0.005,"sig":2,"show":"0.50","explain":"v₁ = {{frac|Δx|Δt₁}} = {{frac|5.10 × 10⁻³ m|10.20 × 10⁻³ s}} = 0.50 m/s。","quizId":"M03:paper:Q6:(2)"},{"label":"(3)①","type":"expr","prompt":"测得滑块通过光电门 2 的速度为 v₂，两光电门间距为 s，则滑块下滑的加速度","lhs":"a =","vars":{"v1":"v₁","v2":"v₂","s":"s"},"extra":["1","2"],"answer":"(v2^2-v1^2)/(2*s)","show":"(v₂² − v₁²) ÷ (2s)","explain":"由匀变速直线运动速度—位移关系 v₂² − v₁² = 2as，得 a = {{frac|v₂² − v₁²|2s}}。","quizId":"M03:paper:Q6:(3)①"},{"label":"(3)②","type":"expr","prompt":"忽略气垫导轨阻力，理论上滑块下滑加速度 a 的表达式应与____相等（用 g、h、L 表示）。","lhs":"a =","vars":{"g":"g","h":"h","L":"L"},"extra":[],"answer":"g*h/L","show":"gh ÷ L","explain":"由几何关系得斜面倾角正弦 sinθ = {{frac|h|L}}，合外力为 mg sinθ，故理论加速度 a = g sinθ = {{frac|gh|L}}。","quizId":"M03:paper:Q6:(3)②"}]},{"id":"Q7","source":"2026·湖北卷·第12题","verified":true,"stem":"某同学设计如下实验验证牛顿第二定律：直导轨上固定两个光电门 A、B（间距为 <i>s<\/i>），小车和遮光条总质量为 <i>m<\/i>（遮光条宽为 <i>d<\/i>）。连接小车两端的细绳跨过左右定滑轮，初始时两端各挂 10 个质量均为 <i>m₀<\/i> 的钩码，重力加速度为 <i>g<\/i>。<svg viewBox=\"0 0 600 140\" width=\"600\" role=\"img\" aria-label=\"2026湖北第12题实验装置图\"><line x1=\"40\" y1=\"126\" x2=\"560\" y2=\"126\" stroke=\"#8B6B3E\" stroke-width=\"2\"/><rect x=\"114\" y=\"63\" width=\"24\" height=\"63\" fill=\"#B8935D\" stroke=\"#8B6B3E\"/><rect x=\"456\" y=\"75\" width=\"24\" height=\"51\" fill=\"#B8935D\" stroke=\"#8B6B3E\"/><g transform=\"translate(90,54) rotate(2)\"><rect x=\"0\" y=\"0\" width=\"420\" height=\"8\" fill=\"#D9B98C\" stroke=\"#8B6B3E\"/><circle cx=\"-4\" cy=\"0\" r=\"7\" fill=\"#C9D1D9\" stroke=\"#596574\"/><circle cx=\"424\" cy=\"0\" r=\"7\" fill=\"#C9D1D9\" stroke=\"#596574\"/><rect x=\"180\" y=\"-22\" width=\"54\" height=\"18\" rx=\"3\" fill=\"#5C8DEB\"/><rect x=\"204\" y=\"-34\" width=\"5\" height=\"12\" fill=\"#10233F\"/><rect x=\"124\" y=\"-40\" width=\"7\" height=\"40\" fill=\"#3B4B60\"/><rect x=\"304\" y=\"-40\" width=\"7\" height=\"40\" fill=\"#3B4B60\"/><line x1=\"-4\" y1=\"-7\" x2=\"180\" y2=\"-12\" stroke=\"#222\"/><line x1=\"234\" y1=\"-12\" x2=\"424\" y2=\"-7\" stroke=\"#222\"/><text x=\"128\" y=\"-44\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">A(t₁)<\/text><text x=\"308\" y=\"-44\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">B(t₂)<\/text><text x=\"218\" y=\"-48\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1661FF\">间距 s<\/text><\/g><line x1=\"79\" y1=\"54\" x2=\"79\" y2=\"86\" stroke=\"#222\"/><rect x=\"67\" y=\"86\" width=\"24\" height=\"14\" fill=\"#8E99A6\" stroke=\"#596574\"/><text x=\"79\" y=\"114\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">10−n 个<\/text><line x1=\"521\" y1=\"69\" x2=\"521\" y2=\"94\" stroke=\"#222\"/><rect x=\"509\" y=\"94\" width=\"24\" height=\"16\" fill=\"#8E99A6\" stroke=\"#596574\"/><text x=\"521\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">10+n 个<\/text><\/svg><br>主要步骤：ⅰ. 测出 <i>m<\/i>、<i>s<\/i>、<i>d<\/i>；ⅱ. 调节导轨倾斜程度，使轻推小车沿导轨向右运动时通过两光电门的遮光时间近似相等；ⅲ. 从左侧细绳取下 <i>n<\/i> 个钩码挂到右侧细绳，由静止释放小车，测得通过 A、B 的遮光时间分别为 <i>t<\/i>₁、<i>t<\/i>₂。","parts":[{"label":"(1)","type":"text-choice","prompt":"实验步骤 ⅱ 的主要目的是____。","options":["减小遮光片宽度引起的误差","平衡摩擦力","使钩码质量远小于小车质量"],"answer":1,"replay":"E1","explain":"不改变钩码分布（合外力差值为零），调斜导轨使两光电门遮光时间相等，即让小车匀速运动以平衡摩擦力。","quizId":"M03:paper:Q7:(1)"},{"label":"(2)","type":"expr","prompt":"从左侧取下 n 个钩码挂到右侧后，理论上系统加速度大小 a =","lhs":"a =","vars":{"n":"n","m0":"m₀","m":"m","g":"g"},"extra":["2","0"],"answer":"2*n*m0*g/(m+20*m0)","show":"2nm₀g ÷ (m + 20m₀)","explain":"左侧少 n 个、右侧多 n 个，两盘重力差（即系统合外力）为 (10 + n)m₀g − (10 − n)m₀g = 2nm₀g；系统总质量恒为 m + 20m₀，故 a = {{frac|2nm₀g|m + 20m₀}}。","quizId":"M03:paper:Q7:(2)"},{"label":"(3)","type":"expr","prompt":"由遮光条宽度 d、两光电门间距 s 及遮光时间 t₁、t₂，实验测得的加速度表达式","lhs":"a =","vars":{"d":"d","s":"s","t1":"t₁","t2":"t₂"},"extra":["1","2"],"answer":"d^2/(2*s)*(1/t2^2-1/t1^2)","show":"d²(1/t₂² − 1/t₁²) ÷ (2s)","explain":"v₁ = {{frac|d|t₁}}，v₂ = {{frac|d|t₂}}，由 v₂² − v₁² = 2as 得 a = {{frac|d²|2s}}({{frac|1|t₂²}} − {{frac|1|t₁²}})。","quizId":"M03:paper:Q7:(3)"},{"label":"(4)","type":"text-choice","prompt":"以 n 为横坐标、a 为纵坐标绘制 a-n 图像，若得到过原点的直线，说明在总质量一定时，物体的加速度与所受合外力成____。","options":["正比","反比"],"answer":0,"explain":"系统总质量 m + 20m₀ 不变，合外力 2nm₀g ∝ n，a-n 为过原点直线说明加速度与合外力成正比。","quizId":"M03:paper:Q7:(4)"},{"label":"(5)","type":"choice","prompt":"若实验得到的 a-n 图像不过原点，可能的原因是____。","options":["小车没有贴近光电门静止释放","步骤 ⅱ 中导轨倾斜程度调节不当","钩码质量未远小于小车质量"],"answer":1,"replay":"E2","explain":"本实验采用整体法（系统总质量恒为 m + 20m₀），不要求钩码质量远小于小车质量（C 错）；图像不过原点说明摩擦力平衡不足或过度，即步骤 ⅱ 中导轨倾斜程度调节不当（B 对）。","quizId":"M03:paper:Q7:(5)"}]},{"id":"Q8","source":"2025·山东青岛模拟","verified":true,"stem":"小明利用如图甲所示的实验装置探究加速度与力的关系：滑块放在水平桌面上的长木板上，砂桶通过滑轮与细线拉滑块，细线上接有微型力传感器可直接读出拉力大小 <i>F<\/i>。保持滑块质量不变，改变砂量测出多组 <i>F<\/i> 与对应纸带的加速度 <i>a<\/i>，得到如图乙所示的 <i>F-a<\/i> 图像。<svg viewBox=\"0 0 640 176\" width=\"640\" role=\"img\" aria-label=\"2025山东青岛模拟图甲乙丙\"><g transform=\"translate(12,10)\"><rect x=\"10\" y=\"64\" width=\"170\" height=\"8\" fill=\"#E2E8F0\" stroke=\"#596574\"/><rect x=\"40\" y=\"56\" width=\"170\" height=\"8\" fill=\"#B8C4D0\" stroke=\"#596574\"/><rect x=\"34\" y=\"72\" width=\"10\" height=\"44\" fill=\"#E2E8F0\" stroke=\"#596574\"/><rect x=\"148\" y=\"72\" width=\"10\" height=\"44\" fill=\"#E2E8F0\" stroke=\"#596574\"/><rect x=\"44\" y=\"40\" width=\"16\" height=\"16\" fill=\"#4F6A8A\" stroke=\"#10233F\"/><text x=\"52\" y=\"26\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#10233F\">打点计时器<\/text><rect x=\"76\" y=\"36\" width=\"42\" height=\"20\" fill=\"#fff\" stroke=\"#10233F\"/><text x=\"97\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">滑块<\/text><circle cx=\"214\" cy=\"54\" r=\"5\" fill=\"#fff\" stroke=\"#10233F\"/><line x1=\"118\" y1=\"48\" x2=\"214\" y2=\"48\" stroke=\"#10233F\"/><line x1=\"219\" y1=\"54\" x2=\"       ctx.fillStyle = '#E8CA9C'; ctx.fillRect(zx, zy + 8, zX(d.endMm) - zx, zMidY - zy - 8);
      ctx.strokeStyle = '#9F7C49'; ctx.strokeRect(zx - 2, zy + 8, zX(d.endMm) - zx + 2, zMidY - zy - 8);
      ctx.fillStyle = '#FBFCFE'; ctx.fillRect(zx, zMidY, zw, zh);
      drawLine(ctx, zx, zMidY, zx + zw, zMidY, '#9AA8B8', 1);
      var mStart = Math.max(0, Math.floor(zMin)), mEnd = Math.ceil(zMin + zSpan);
      ctx.strokeStyle = '#10233F'; ctx.beginPath();
      for (var mm = mStart; mm <= mEnd; mm++) {
        var tx = zX(mm), hTick = mm % 10 === 0 ? 18 : mm % 5 === 0 ? 13 : 8;
        ctx.moveTo(tx, zMidY); ctx.lineTo(tx, zMidY + hTick);
      }
      ctx.stroke();
      for (mm = mStart; mm <= mEnd; mm++) {
        if (mm % 5 === 0) D.text(ctx, (mm / 10).toFixed(mm % 10 === 0 ? 0 : 1), zX(mm), zMidY + 30, { align: 'center', size: 11, weight: mm % 10 === 0 ? 700 : 500 });
      }
      drawLine(ctx, zX(d.endMm), zy + 4, zX(d.endMm), zMidY + 22, '#C7374B', 1.8);
      ctx.restore();
      D.text(ctx, '末端放大', zx + 6, zy + 13, { size: 10, color: '#0E8CA3', weight: 700 });
    }

    if (st.marks && st.marks.indexOf('nonzero') >= 0 && startMm > 0) {
      D.ring(ctx, ox0, ry + 14, 24, '#C7374B');
      D.text(ctx, '起点在 ' + (startMm / 10).toFixed(2) + ' cm，需做差！', ox0 + 28, ry + rh + 20, { size: 12, weight: 700, color: '#C7374B' });
    } else if (st.sightShiftMm) {
      var sx = X(d.endMm + st.sightShiftMm);
      ctx.save(); ctx.setLineDash([4, 3]);
      drawLine(ctx, ox1 + st.sightShiftMm * pxPerMm * 2.2, 22, ox1, oy, '#C7374B', 1.6);
      drawLine(ctx, ox1, oy, sx, ry + 12, '#C7374B', 1.6);
      ctx.restore();
      D.text(ctx, '斜视（未正对刻度线）', ox1 + 10, 26, { size: 12, weight: 700, color: '#C7374B' });
    }
    D.text(ctx, '分度值 1 mm · 估读到 0.1 mm（0.01 cm）', 14, hh - 10, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  2. 游标卡尺（10 / 20 / 50 分度）
   * ===================================================================== */
  function drawCaliper(ctx, w, hh, st) {
    st = st || {};
    var div = st.div || 10, valMm = st.valMm != null ? st.valMm : 19.0;
    var d = G.caliper.decompose(valMm, div);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 上半部分：2.5D 卡尺与被测物示意
    var compact = hh < 270;
    var jawX = 56, topY = compact ? 6 : 22, beamY = topY + (compact ? 12 : 26), beamH = compact ? 22 : 30;
    var jawDrop = compact ? 26 : 44, jawInner = compact ? 14 : 22, objOff = compact ? 6 : 14, objH = compact ? 16 : 24;
    var maxMainMm = Math.max(60, Math.ceil((d.q + 52) / 10) * 10);
    var topPxPerMm = Math.min(4.8, (w - jawX - 36) / maxMainMm);
    var mX = function (mm) { return jawX + mm * topPxPerMm; };

    // 主尺身与左固定量爪
    ctx.fillStyle = D.grad(ctx, 0, beamY, 0, beamY + beamH, ['#EEF2F6', '#CDD6E0']);
    ctx.beginPath();
    ctx.moveTo(jawX - 18, beamY); ctx.lineTo(mX(maxMainMm) + 12, beamY);
    ctx.lineTo(mX(maxMainMm) + 12, beamY + beamH); ctx.lineTo(jawX, beamY + beamH);
    ctx.lineTo(jawX, beamY + beamH + jawDrop); ctx.lineTo(jawX - 16, beamY + beamH + jawInner);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7E8C9B'; ctx.lineWidth = 1.2; ctx.stroke();

    // 主尺上刻度
    ctx.strokeStyle = '#10233F'; ctx.beginPath();
    for (var m = 0; m <= maxMainMm; m++) {
      var tx = mX(m), tl = m % 10 === 0 ? 11 : m % 5 === 0 ? 8 : 5;
      ctx.moveTo(tx, beamY + beamH); ctx.lineTo(tx, beamY + beamH - tl);
    }
    ctx.stroke();
    for (var c = 0; c <= Math.floor(maxMainMm / 10); c++) {
      D.text(ctx, String(c), mX(c * 10), beamY + (compact ? 10 : 13), { align: 'center', size: 10, weight: 700 });
    }

    // 被测圆柱（夹在两外量爪之间）
    var objW = d.q * topPxPerMm, objY = beamY + beamH + objOff;
    ctx.fillStyle = D.grad(ctx, jawX, objY, jawX + objW, objY, ['#E69B2D', '#F5C469', '#C87E1A']);
    ctx.fillRect(jawX, objY, objW, objH);
    ctx.strokeStyle = '#9A5A00'; ctx.strokeRect(jawX, objY, objW, objH);

    // 可动游标框（左边缘在 d.q - 2.0 mm，游标 0 刻线在 d.q mm）
    var vLeft = mX(d.q - 2.2), vRight = mX(d.q + (div === 10 ? 11 : div === 20 ? 21 : 51));
    var vBoxBot = compact ? 15 : 20;
    ctx.fillStyle = D.grad(ctx, 0, beamY + beamH - 2, 0, beamY + beamH + vBoxBot + 4, ['#DCE4EC', '#AEB9C6']);
    ctx.beginPath();
    ctx.moveTo(mX(d.q), beamY + beamH + jawDrop); ctx.lineTo(mX(d.q) + 16, beamY + beamH + jawInner);
    ctx.lineTo(mX(d.q) + 16, beamY + beamH + vBoxBot); ctx.lineTo(vRight, beamY + beamH + vBoxBot);
    ctx.lineTo(vRight, beamY + beamH - 2); ctx.lineTo(vLeft, beamY + beamH - 2);
    ctx.lineTo(vLeft, beamY + beamH + vBoxBot); ctx.lineTo(mX(d.q), beamY + beamH + vBoxBot);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();
    // 游标 0 刻线标记
    drawLine(ctx, mX(d.q), beamY + beamH - 1, mX(d.q), beamY + beamH + (compact ? 11 : 14), '#1661FF', 1.5);

    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, vLeft, beamY + beamH + 8, 14, '#C7374B');
      D.text(ctx, '这是游标框左边缘（不是 0 线）', vLeft - 8, beamY + beamH + (compact ? 31 : 34), { size: 11, weight: 700, color: '#C7374B' });
    }

    // 下半部分：高倍率刻度放大阅读窗（能清晰分辨 50 分度 0.02 mm）
    var zy = compact ? Math.max(Math.round(hh * 0.48), beamY + beamH + 36) : Math.round(hh * 0.45);
    var zh = hh - zy - (compact ? 22 : 26), zx = 14, zw = w - 28;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.4;
    D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '局部放大（' + div + ' 分度 · 精度 ' + d.step + ' mm）', zx + 12, zy + 17, { size: 12, weight: 700, color: '#1661FF' });

    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 4, zy + 22, zw - 8, zh - 26, 8); ctx.clip();
    var vernLen = div === 10 ? 9 : div === 20 ? 19 : 49;
    var winSpan = Math.max(18, vernLen + 9);
    var winMinMm = Math.max(0, Math.floor(d.q) - 4);
    var zScale = (zw - 36) / winSpan;
    var zX = function (mm) { return zx + 18 + (mm - winMinMm) * zScale; };
    var midY = zy + 22 + (zh - 26) * 0.48;

    // 放大主尺
    ctx.fillStyle = '#F3F7FC'; ctx.fillRect(zx, zy + 22, zw, midY - zy - 22);
    ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.1; ctx.beginPath();
    var m0 = Math.floor(winMinMm), m1 = Math.ceil(winMinMm + winSpan);
    for (m = m0; m <= m1; m++) {
      var xPos = zX(m), hT = m % 10 === 0 ? 22 : m % 5 === 0 ? 16 : 10;
      ctx.moveTo(xPos, midY); ctx.lineTo(xPos, midY - hT);
    }
    ctx.stroke();
    for (m = m0; m <= m1; m++) {
      if (m % 10 === 0) D.text(ctx, String(m / 10), zX(m), midY - 26, { align: 'center', size: 12, weight: 700 });
    }
    D.text(ctx, 'cm', zX(m1) - 10, midY - 26, { align: 'right', size: 11, color: '#4A5B73' });

    // 放大游标尺框（框左边缘明显在 0 线左 2 mm）
    var zvLeft = zX(d.q - 2.0), zvRight = zX(d.markPosMm(div) + 1.8);
    ctx.fillStyle = '#E8EEF5'; ctx.fillRect(zvLeft, midY, zvRight - zvLeft, zh);
    drawLine(ctx, zvLeft, midY, zvLeft, zy + zh, '#7E8C9B', 2);
    drawLine(ctx, zx, midY, zx + zw, midY, '#596574', 1.2);

    // 放大游标刻线
    for (var i = 0; i <= div; i++) {
      var vx = zX(d.markPosMm(i));
      var isMajor = div === 10 ? true : (div === 20 ? i % 2 === 0 : i % 5 === 0);
      var isAlign = st.hintAlign && i === d.k;
      var vLen = i === 0 || i === div ? 22 : (i % 5 === 0 ? 18 : 11);
      drawLine(ctx, vx, midY, vx, midY + vLen, isAlign ? '#25A870' : (i === 0 ? '#1661FF' : '#10233F'), isAlign || i === 0 ? 1.8 : 1);
      if (isMajor && (div !== 50 || i % 10 === 0 || i === 5)) {
        var lbl = div === 50 ? String(i / 5) : String(i);
        D.text(ctx, lbl, vx, midY + 35, { align: 'center', size: div === 50 ? 10.5 : 11, weight: i === 0 ? 700 : 500, color: i === 0 ? '#1661FF' : '#10233F' });
      }
    }
    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, zvLeft, midY + 12, 16, '#C7374B');
      D.ring(ctx, zX(d.q), midY + 12, 16, '#25A870');
    }
    if (st.hintAlign) {
      var ax = zX(d.markPosMm(d.k));
      ctx.save(); ctx.setLineDash([3, 3]);
      drawLine(ctx, ax, midY - 26, ax, midY + 26, '#25A870', 1.6);
      ctx.restore();
    }
    ctx.restore();

    D.text(ctx, '主尺读到游标 0 刻线左侧整毫米；拖动量爪或右侧按钮调长度，按住看放大镜', 14, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  3. 螺旋测微器（千分尺）
   * ===================================================================== */
  function drawMicSleeve(ctx, x, y, w, hh, dispMm, opts) {
    opts = opts || {};
    var pxPerMm = opts.pxPerMm || 28;
    var sleeveW = w * 0.56, zeroX = x + 16;
    var datumY = y + hh * 0.50;
    var thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    if (thimbleX > x + sleeveW - 18) {
      var shiftMm = (thimbleX - (x + sleeveW - 18)) / pxPerMm;
      zeroX -= shiftMm * pxPerMm;
      thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    }

    ctx.save();
    ctx.beginPath(); D.rr(ctx, x, y, w, hh, 8); ctx.clip();
    ctx.fillStyle = '#FBFCFE'; ctx.fillRect(x, y, w, hh);

    // 固定刻度套筒
    ctx.fillStyle = D.grad(ctx, 0, datumY - 36, 0, datumY + 36, ['#DCE3EC', '#F8FAFC', '#C7D1DC']);
    ctx.fillRect(x, datumY - 36, Math.max(0, thimbleX - x), 72);
    drawLine(ctx, x, datumY - 36, thimbleX, datumY - 36, '#8E99A6', 1);
    drawLine(ctx, x, datumY + 36, thimbleX, datumY + 36, '#8E99A6', 1);
    drawLine(ctx, Math.min(x, zeroX - 4), datumY, thimbleX, datumY, '#10233F', 1.4);

    // 整毫米（上）与 0.5 mm（下）
    var maxM = Math.ceil((thimbleX - zeroX) / pxPerMm) + 1;
    var halfExp = (Math.floor((dispMm + 1e-9) / 0.5) % 2) === 1;
    for (var m = 0; m <= maxM; m++) {
      var mx = zeroX + m * pxPerMm;
      if (mx <= thimbleX + 0.5 && mx >= x + 4) {
        drawLine(ctx, mx, datumY, mx, datumY - (m % 5 === 0 ? 18 : 12), '#10233F', m % 5 === 0 ? 1.5 : 1.1);
        if (m % 5 === 0) D.text(ctx, String(m), mx, datumY - 22, { align: 'center', size: 11, weight: 700 });
      }
      var hx = zeroX + (m + 0.5) * pxPerMm;
      if (hx <= thimbleX + 0.5 && hx >= x + 4) {
        var isHalfMark = opts.markHalf && halfExp && Math.abs(m - Math.floor(dispMm)) < 0.01;
        drawLine(ctx, hx, datumY, hx, datumY + 13, isHalfMark ? '#C7374B' : '#10233F', isHalfMark ? 2 : 1.1);
        if (isHalfMark) D.ring(ctx, hx, datumY + 7, 13, '#C7374B');
      }
    }
    if (opts.markHalf && !halfExp && dispMm > 0) {
      D.ring(ctx, thimbleX - 6, datumY + 8, 13, '#C7374B');
      D.text(ctx, '半mm未露', Math.max(x + 34, thimbleX - 18), datumY + 28, { align: 'center', size: 10.5, weight: 700, color: '#C7374B' });
    }

    // 可动刻度锥面套筒
    var bevelW = 34, bodyW = x + w - thimbleX - bevelW;
    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#B8C3CF', '#F5F8FB', '#9AA7B5']);
    ctx.beginPath();
    ctx.moveTo(thimbleX, datumY - 36); ctx.lineTo(thimbleX + bevelW, datumY - 48);
    ctx.lineTo(thimbleX + bevelW, datumY + 48); ctx.lineTo(thimbleX, datumY + 36);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();

    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#9FAAB7', '#E6ECF3', '#7E8A98']);
    ctx.fillRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);
    ctx.strokeRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);

    // 可动刻度 50 格（向上递增）
    var thVal = +((dispMm - Math.floor((dispMm + 1e-9) / 0.5) * 0.5) * 100).toFixed(2);
    var sp = 6.2;
    for (var t = 0; t < 50; t++) {
      var diff = ((t - thVal + 75) % 50) - 25;
      var ty = datumY - diff * sp;
      if (ty < datumY - 43 || ty > datumY + 43) continue;
      var is5 = t % 5 === 0;
      drawLine(ctx, thimbleX + 3, ty, thimbleX + (is5 ? 20 : 12), ty, '#10233F', is5 ? 1.4 : 1);
      if (is5) D.text(ctx, String(t), thimbleX + 23, ty + 4, { size: 11, weight: 700 });
    }
    ctx.restore();
    ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.2;
    D.rr(ctx, x, y, w, hh, 8); ctx.stroke();
  }

  function drawMicrometer(ctx, w, hh, st) {
    st = st || {};
    var trueMm = st.trueMm != null ? st.trueMm : 6.860, zeroErr = st.zeroErrMm || 0;
    var d = G.micrometer.decompose(trueMm, zeroErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：2.5D U 形尺架与被测物
    var uLeft = 24, uTop = 26, anvilX = 56, gapW = Math.max(12, Math.min(72, d.trueMm * 4.5));
    var spinX = anvilX + gapW, axisY = uTop + 34;
    ctx.strokeStyle = '#596574'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(uLeft + 52, axisY + 34, 48, Math.PI * 0.12, Math.PI * 1.12); ctx.stroke();
    ctx.strokeStyle = '#9AA7B5'; ctx.lineWidth = 8; ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineWidth = 1;

    ctx.fillStyle = '#8E99A6'; ctx.fillRect(anvilX - 10, axisY - 7, 10, 14);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 12, 0, axisY + 12, ['#D9B98C', '#C49F6B']);
    ctx.beginPath(); ctx.arc((anvilX + spinX) / 2, axisY, gapW / 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8E6B38'; ctx.stroke();
    ctx.fillStyle = '#C9D1D9'; ctx.fillRect(spinX, axisY - 6, 48, 12); ctx.strokeStyle = '#6E7B8A'; ctx.strokeRect(spinX, axisY - 6, 48, 12);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 16, 0, axisY + 16, ['#DCE4EC', '#9AA7B5']);
    ctx.fillRect(spinX + 46, axisY - 16, 62, 32); ctx.strokeRect(spinX + 46, axisY - 16, 62, 32);

    var compact = hh < 270;
    // 零误差参考小窗（若存在零误差）
    if (Math.abs(zeroErr) > 1e-6) {
      var zx = w - 210, zy = compact ? 4 : 10, zh0 = compact ? 62 : 88;
      D.text(ctx, '空载零误差：' + (zeroErr >= 0 ? '+' : '') + zeroErr.toFixed(3) + ' mm', zx + 2, zy + 11, { size: 11.5, weight: 700, color: '#C7374B' });
      drawMicSleeve(ctx, zx, zy + 16, 194, zh0, zeroErr, { pxPerMm: 24 });
    } else {
      D.text(ctx, '螺距 0.5 mm · 50 格（0.01 mm/格）· 估读到 0.001 mm', w - 16, axisY - 12, { align: 'right', size: 11.5, weight: 600, color: '#10233F' });
    }

    // 下方：高清晰放大套筒读数窗
    var my = (compact && Math.abs(zeroErr) > 1e-6) ? Math.max(Math.round(hh * 0.42), 88) : Math.round(hh * 0.36);
    var mh = hh - my - 26;
    drawMicSleeve(ctx, 18, my, w - 36, mh, d.dispMm, { pxPerMm: Math.min(34, (w - 160) / Math.max(6, d.dispMm + 2)), markHalf: st.marks && st.marks.indexOf('half') >= 0 });
    D.text(ctx, '读数 = 固定刻度（注意下排 0.5 mm 刻线）+ 可动刻度格数 × 0.01 mm', 18, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  4. 弹簧测力计（0-5 N，0.1 N 分度）
   * ===================================================================== */
  function drawDynamometer(ctx, w, hh, st) {
    st = st || {};
    var f = st.trueForceN != null ? st.trueForceN : 3.70, zErr = st.zeroOffsetN || 0;
    var d = G.dynamometer.decompose(f, zErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：测力计整机
    var cx = Math.round(w * 0.28), by = 30, bw = 82, bh = Math.min(220, hh - 80);
    ctx.strokeStyle = '#8E99A6'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, by - 8, 12, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = D.grad(ctx, cx - bw / 2, 0, cx + bw / 2, 0, ['#F8FAFC', '#DCE4EC']);
    D.rr(ctx, cx - bw / 2, by, bw, bh, 12); ctx.fill(); ctx.strokeStyle = '#7E8C9B'; ctx.stroke();

    var sTop = by + 24, sBot = by + bh - 26, sH = sBot - sTop;
    var yOf = function (n) { return sTop + (n / 5) * sH; };
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 22, sTop - 8, 44, sH + 16);
    ctx.strokeStyle = '#B9C8DA'; ctx.strokeRect(cx - 22, sTop - 8, 44, sH + 16);
    for (var n = 0; n <= 50; n++) {
      var yy = yOf(n / 10), maj = n % 10 === 0, mid = n % 5 === 0;
      drawLine(ctx, cx - 20, yy, cx - 20 + (maj ? 14 : mid ? 10 : 6), yy, '#10233F', maj ? 1.4 : 0.9);
      if (maj) D.text(ctx, String(n / 10), cx + 14, yy + 4, { align: 'right', size: 11, weight: 700 });
    }
    var py = yOf(Math.max(0, Math.min(5, d.dispN)));
    drawLine(ctx, cx - 22, py, cx + 18, py, '#C7374B', 2.4);
    drawLine(ctx, cx, by + bh, cx, by + bh + 18, '#6E7B8A', 2.5);
    ctx.fillStyle = '#8E99A6'; ctx.fillRect(cx - 14, by + bh + 16, 28, 16);
    D.text(ctx, '0–5 N', cx, by + 16, { align: 'center', size: 11, weight: 700, color: '#4A5B73' });

    // 右侧：指针处高倍率放大窗
    var zx = Math.round(w * 0.48), zw = w - zx - 20, zy = 26, zh = hh - 62;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '指针局部放大（最小分度 0.1 N · 估读到 0.01 N）', zx + 14, zy + 20, { size: 12, weight: 700, color: '#1661FF' });
    if (Math.abs(zErr) > 1e-6) {
      D.text(ctx, '注意：空载未调零，零误差 ' + (zErr >= 0 ? '+' : '') + zErr.toFixed(2) + ' N', zx + 14, zy + 38, { size: 12, weight: 700, color: '#C7374B' });
    }
    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 8, zy + 46, zw - 16, zh - 56, 8); ctx.clip();
    var zScale = (zh - 60) / 1.4, zCenter = d.dispN;
    var zY = function (val) { return zy + 46 + (zh - 56) / 2 + (val - zCenter) * zScale; };
    var n0 = Math.max(0, Math.floor((zCenter - 0.8) * 10)), n1 = Math.min(50, Math.ceil((zCenter + 0.8) * 10));
    var scaleX = zx + zw * 0.42;
    ctx.fillStyle = '#F8FBFF'; ctx.fillRect(scaleX - 30, zy + 46, 90, zh);
    for (n = n0; n <= n1; n++) {
      var yk = zY(n / 10), isMaj = n % 10 === 0, isMid = n % 5 === 0;
      drawLine(ctx, scaleX - 24, yk, scaleX - 24 + (isMaj ? 32 : isMid ? 22 : 14), yk, '#10233F', isMaj ? 1.8 : 1.1);
      if (isMaj || isMid) D.text(ctx, (n / 10).toFixed(1), scaleX + 20, yk + 4, { size: 12.5, weight: isMaj ? 700 : 500 });
