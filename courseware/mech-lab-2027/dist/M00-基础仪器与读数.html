<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基础仪器与读数</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);transition:transform .2s;display:grid;grid-template-columns:repeat(4,72px);gap:6px;background:#E9EEF5;padding:10px;border-radius:18px 18px 0 0;z-index:70;box-shadow:0 -4px 18px rgba(16,35,63,.15)}
.ml-keypad.show{transform:translate(-50%,0)}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M00 scene.css — 基础仪器与读数（1016×563 横屏一屏紧凑适配） */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 32px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:7px 12px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 350px;gap:12px;align-items:start}
.bench-stage-wrap{display:flex;flex-direction:column;gap:8px}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:5px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:52px}
.m00-read-row{display:flex;align-items:center;gap:6px;margin:6px 0}
.m00-disp{flex:1;min-height:38px;border:1.5px solid var(--line);border-radius:var(--rs);padding:4px 10px;font-size:17px;font-weight:700;display:flex;align-items:center;background:#FBFCFE;cursor:text}
.m00-disp.focus{border-color:var(--blue);background:#EEF4FF}
.m00-disp.empty{color:#8E99A6;font-weight:500;font-size:13.5px}
.m00-unit{font-weight:700;color:var(--ink2);min-width:30px}
.m00-pad{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 6px}
.m00-k{min-height:32px;border:1px solid var(--line);border-radius:8px;background:#F6F9FD;cursor:pointer;font-weight:600;font-size:14px}
.m00-k:active{background:#DCE8FF}
.m00-fb{border-radius:var(--rs);padding:7px 10px;font-size:13px;margin:4px 0;background:#F6F9FD}
.m00-fb.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.m00-fb.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:var(--err)}
.m00-fb .link{padding:0;min-height:24px;font-size:13px}
.steps{padding-left:18px;margin:4px 0 0;flex:1 1 auto;overflow-y:auto}
.steps li{margin-bottom:6px;font-size:13.5px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}.st-how{color:var(--ink2);font-size:12.5px}.st-why{color:var(--ink2);margin-top:2px}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ana-tags .tag{cursor:pointer;min-height:34px;font:inherit;font-size:12.5px}
.link.sm{font-size:12.5px;min-height:32px;padding:0 4px}
.diag{max-width:1180px;margin:0 auto;padding:16px}
.diag-h{font-size:19px;margin:14px 0 4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.err-card{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.err-card.done{border-color:#BCE6D2}
.err-name{font-weight:700}.err-note{font-size:13px;color:var(--ink2);flex:1}
.err-card .btn{align-self:flex-start}
.cmp-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp-box{border-radius:var(--rs);padding:10px 12px;font-size:14px}
.cmp-box.good{background:#EEF9F4;border:1px solid #BCE6D2}
.cmp-box.bad{background:#FFF4F5;border:1px solid #F2BFC8}
.cmp-box b{display:block;font-size:16px;margin-top:2px}
.learn-widget{margin-top:10px}
@media (max-width:900px),(orientation:portrait){
  .bench-row{grid-template-columns:1fr}
  .cmp-split{grid-template-columns:1fr}
}
@media (max-height:640px) and (orientation:landscape) and (min-width:901px){
  .bench{padding:5px 10px 6px}
  .bench-top{margin-bottom:4px;gap:6px}
  .seg .chip{min-height:32px}
  .bench-top .btn{min-height:34px;padding:0 12px;font-size:13.5px}
  .bench-row{grid-template-columns:1fr 334px;gap:8px}
  .bench-side{height:calc(100vh - 106px);padding:8px 10px}
  .bench-banner:not([hidden]) + .bench-row .bench-side{height:calc(100vh - 148px)}
  .bench-side .chip{min-height:28px;padding:0 8px;font-size:12.5px}
  .side-l{min-width:44px;font-size:12.5px}
  .side-row{margin:3px 0;gap:4px}
  .side-k{margin:2px 0 3px;font-size:12.5px}
  .m00-read-row{margin:4px 0}
  .m00-disp{min-height:34px;font-size:16px}
  .m00-pad{gap:3px;margin:3px 0 4px}
  .m00-k{min-height:28px;font-size:13px}
  .m00-fb{padding:5px 8px;font-size:12px}
  .steps li{margin-bottom:4px;font-size:12.5px;padding:3px 6px}
  .st-how{font-size:11.5px}
}

<script type="application/json" id="ml-content">{"slug":"mech-lab-m00","title":"基础仪器与读数","sub":"人教版 必修第三册 第十一章 3 · 贯穿全部力学实验","chapter":"必修第三册 第十一章 3","methods":["“1”字分度估读规则","游标差值放大法（不估读）","螺旋放大法（0.5 mm 螺距）","零点校准与系统误差修正"],"learn":[{"id":"L1","title":"读数总原则：估读与有效数字","html":"<p><b>核心口诀：<\/b>最小分度带“1”的仪器<b>要估读<\/b>到下一位；游标卡尺和机械停表<b>不估读<\/b>。<\/p>","steps":["<b>需要估读的仪器<\/b>：毫米刻度尺（1 mm → 估读到 <b>0.1 mm<\/b>）、螺旋测微器（0.01 mm → 估读到 <b>0.001 mm<\/b>）、弹簧测力计 0–5 N 档（0.1 N → 估读到 <b>0.01 N<\/b>）。即使指针或边缘恰好与某条刻线对齐，也必须补写末尾的“0”（如 1.90 cm、6.860 mm、3.70 N）。","<b>不需要估读的仪器<\/b>：游标卡尺（10/20/50 分度对应 <b>0.1 / 0.05 / 0.02 mm<\/b>）与机械停表（最小分度 <b>0.1 s<\/b>）。看哪条刻线对齐就写到该精度，<b>绝对不能多写一位估读数<\/b>。","<b>末尾“0”不能随便省<\/b>：10 分度游标卡尺 19.0 mm 写成 19 mm 是错的；20 分度 10.00 mm 写成 10.0 mm 也是错的——位数反映了仪器的分度精度。","<b>单位换算小数位数跟着变<\/b>：例如 50 分度游标卡尺读为 41.08 mm，换算成 cm 应写为 <b>4.108 cm<\/b>（末尾位数不能丢）。"]},{"id":"L2","title":"毫米刻度尺与弹簧测力计","widget":"ruler-dyn-demo","html":"<p>两者最小分度均以“1”开头（1 mm、0.1 N），都必须估读到最小分度的下一位。<\/p>","steps":["<b>毫米刻度尺<\/b>：最小分度 1 mm，估读到 0.1 mm。若以 cm 为单位，小数点后必须有<b>两位<\/b>（如 1.90 cm、6.26 cm）。","<b>非零起点测量<\/b>：当物体左端对准非零刻度（如 2.00 cm）时，物体长度 = 末端刻度 − 起始刻度。","<b>弹簧测力计<\/b>：使用前先轻拉防卡壳并<b>调零<\/b>；拉力沿轴线方向；0–5 N 常见测力计最小分度为 0.1 N，须估读到 <b>0.01 N<\/b>（如 3.70 N、1.00 N）。"]},{"id":"L3","title":"游标卡尺（10 / 20 / 50 分度）","widget":"caliper-demo","html":"<p>利用主尺与游标尺每一格长度的微小差值（差值放大法）提高精度，<b>不估读<\/b>。<\/p>","steps":["<b>三种规格对照<\/b>：<table class=\"dt\"><tr><th>分度数<\/th><th>游标总长<\/th><th>每格与主尺差（精度）<\/th><th>mm 小数位数<\/th><\/tr><tr><td>10 分度<\/td><td>9 mm（10 格）<\/td><td><b>0.1 mm<\/b><\/td><td>1 位（如 19.0 mm）<\/td><\/tr><tr><td>20 分度<\/td><td>19 mm（20 格）<\/td><td><b>0.05 mm<\/b><\/td><td>2 位（末位 0 或 5，如 10.00 mm）<\/td><\/tr><tr><td>50 分度<\/td><td>49 mm（50 格）<\/td><td><b>0.02 mm<\/b><\/td><td>2 位（末位偶数，如 6.04 mm）<\/td><\/tr><\/table>","<b>两步读数法<\/b>：① 在主尺上读出<b>游标 0 刻线左侧<\/b>最邻近的整毫米数 M（注意：千万不要看成游标金属框的左边缘！）；② 找出游标尺上与主尺刻线对齐的第 k 条刻线，<b>读数 = M + k × 精度<\/b>。","<b>常见反推考法<\/b>：若读数为 1.024 cm = 10.24 mm，末尾是 0.04 mm（非 0.05 倍数）→ 一定是 50 分度（精度 0.02 mm），对齐格数 k = 0.24 ÷ 0.02 = 12。"]},{"id":"L4","title":"螺旋测微器（千分尺与零误差）","widget":"micrometer-demo","html":"<p>螺杆旋转一周（50 格）前进半毫米（0.5 mm），因此每格对应 <b>0.01 mm<\/b>，再估读一位到 <b>0.001 mm<\/b>。<\/p>","steps":["<b>固定刻度看两排<\/b>：轴线上方是整毫米刻线，轴线下方是<b>半毫米（0.5 mm）刻线<\/b>。特别注意：当半毫米刻线刚刚露出或快露出时，若可动刻度刚过 0 线（如 1.2 格），说明该半毫米刻线<b>已经露出<\/b>；若可动刻度在 48、49 格，说明尚未转过下一条刻线，不要多算 0.5 mm。","<b>可动刻度要估读<\/b>：读出与水平基准线对齐的格数 n（估读到 0.1 格），总读数 = 固定刻度（mm） + n × 0.01 mm（写足 3 位小数，如 6.860 mm）。","<b>零点误差修正<\/b>：测砧与测微螺杆并拢时，若可动刻度 0 线未对准基准线，则存在零误差 Δ（如 +0.020 mm 或 −0.015 mm）。<b>真实长度 = 测量示数 − 零误差<\/b>（正零误差要减去，负零误差相当于加上绝对值）。"]},{"id":"L5","title":"机械停表与托盘天平","widget":"stopwatch-demo","html":"<p>机械停表<b>不估读<\/b>，先读小表盘（分钟 + 半分钟判定），再读大表盘（秒）。<\/p>","steps":["<b>停表两步读数<\/b>：① 看小表盘（0–15 min）：读出整数分钟 m，并看分针是否<b>超过半分钟红线<\/b>（未过半加 0 s，过半加 30 s）；② 看大表盘（0–30 s 一圈，最小分度 0.1 s）：直接按小盘判定读取 0–30 s 或 30–60 s 刻线，再折算成总秒数 t = 60m + s（注意 1 min = 60 s，不是 100 s）。","<b>例：54.0 s<\/b>：小表盘指针在 0 和 1 之间且<b>已过半分钟红线<\/b>，大表盘指针指在 24.0（内圈 54.0）位置 → 读数为 <b>54.0 s<\/b>。","<b>托盘天平<\/b>：放水平、游码归零、调平衡螺母；左盘放物体、右盘放砝码（用镊子夹取，先大后小）；读数 = 砝码总质量 + 游码<b>左侧边缘<\/b>对应的刻度。"]},{"id":"L6","title":"五大仪器读数规则速查","html":"<p>做实验和做高考填空题前，对照这张表检查“<b>是否估读<\/b>”与“<b>小数位数<\/b>”。<\/p><table class=\"dt\"><tr><th>仪器<\/th><th>最小分度<\/th><th>是否估读<\/th><th>常见单位与小数位<\/th><th>最易错点<\/th><\/tr><tr><td>毫米刻度尺<\/td><td>1 mm<\/td><td><b>要估读<\/b>（0.1 mm）<\/td><td>cm：2 位；mm：1 位<\/td><td>漏末尾 0；非零起点忘记相减<\/td><\/tr><tr><td>游标卡尺（10 分度）<\/td><td>0.1 mm<\/td><td><b>不估读<\/b><\/td><td>mm：1 位；cm：2 位<\/td><td>多估读成两位小数；看框边缘<\/td><\/tr><tr><td>游标卡尺（20 分度）<\/td><td>0.05 mm<\/td><td><b>不估读<\/b><\/td><td>mm：2 位（0/5 结尾）<\/td><td>漏末尾 0；按 0.1 mm 算<\/td><\/tr><tr><td>游标卡尺（50 分度）<\/td><td>0.02 mm<\/td><td><b>不估读<\/b><\/td><td>mm：2 位（偶数结尾）<\/td><td>漏末尾 0；看错游标对齐格<\/td><\/tr><tr><td>螺旋测微器<\/td><td>0.01 mm<\/td><td><b>要估读<\/b>（0.001 mm）<\/td><td>mm：3 位；cm：4 位<\/td><td>漏看 0.5 mm 线；未修零误差<\/td><\/tr><tr><td>弹簧测力计（0–5 N）<\/td><td>0.1 N<\/td><td><b>要估读<\/b>（0.01 N）<\/td><td>N：2 位<\/td><td>未调零；对齐刻线漏写 0<\/td><\/tr><tr><td>机械停表<\/td><td>0.1 s<\/td><td><b>不估读<\/b><\/td><td>s：1 位<\/td><td>漏加/多加 30 s；分秒按百进制算<\/td><\/tr><\/table>","steps":["现在进入<b>② 做·实验<\/b>：可以亲手拖动五类仪器、用放大镜读数并练习“随机出题”，系统会立刻诊断你的读数属于哪类错误。"]}],"equipment":[{"id":"ruler","name":"毫米刻度尺","html":"最小分度 1 mm，读数须估读到 0.1 mm（0.01 cm）。测量长度时尽量让 0 刻度对齐起点；若用非零刻度对齐，需用末端减起点。"},{"id":"caliper","name":"游标卡尺","html":"由主尺和可动游标尺组成，有 10/20/50 分度三种规格。读数时主尺看<b>游标 0 刻线左侧<\/b>的整毫米，游标找对齐刻线，<b>不估读<\/b>。"},{"id":"micrometer","name":"螺旋测微器","html":"又称千分尺。螺距 0.5 mm，可动刻度 50 格，每格 0.01 mm，需估读到 <b>0.001 mm<\/b>。注意固定刻度下排 0.5 mm 线与空载零点误差。"},{"id":"dynamometer","name":"弹簧测力计","html":"利用胡克定律测量力。使用前先校零，拉动时拉力方向与弹簧轴线共线；0.1 N 分度需估读到 <b>0.01 N<\/b>。"},{"id":"stopwatch","name":"机械停表","html":"小表盘读分钟（注意半分钟红线），大表盘 30 s 一圈（最小分度 0.1 s，不估读）。按 1 min = 60 s 折算成秒。"},{"id":"balance","name":"托盘天平","html":"水平放置、游码归零后调平；左物右码，用镊子增减砝码；游码读左侧边缘对准的刻度。"}],"procedure":[{"id":"P1","title":"判分度，定是否估读","how":"先看仪器规格：刻度尺/螺旋测微器/测力计<b>要估读<\/b>到下一位；游标卡尺/停表<b>不估读<\/b>。","why":"多估读或漏末尾 0 都会扣分。","errorId":"E1"},{"id":"P2","title":"游标卡尺看“0 刻线”不看框边","how":"在主尺上找到<b>游标 0 刻线<\/b>（不是游标金属框左边缘）左侧最邻近的整毫米数。","why":"金属框左边缘在 0 刻线左侧约 2 mm，看错位置会直接少读 2 mm。","errorId":"E2"},{"id":"P3","title":"螺旋测微器检查半毫米刻线","how":"看固定刻度下排的 0.5 mm 刻线是否已露出；当可动刻度接近 0 时，用其读数（刚过 0 vs 48/49）复核。","why":"漏看或多算一条半毫米刻线，结果直接差 0.500 mm。","errorId":"E3"},{"id":"P4","title":"对齐整刻线也要补写估读位“0”","how":"对刻度尺、螺旋测微器、测力计，即使边线或指针正好落在刻线上，也要补写估读位“0”（如 1.90 cm、6.860 mm、3.70 N）。","why":"有效数字末位的 0 代表测量精度，不能省略。","errorId":"E4"},{"id":"P5","title":"螺旋测微器与测力计先看零点误差","how":"空载合拢时若示数不为 0（存在零误差），真实值 = 测量示数 − 零误差（或先调零再测量）。","why":"不修正零误差或正负号算反，会引入系统误差。","errorId":"E5"},{"id":"P6","title":"机械停表先看小盘半分钟线","how":"先看小表盘分针在整数分之后是否<b>已过半分钟红线<\/b>，决定大表盘读 0~30 s 还是 30~60 s，再按 1 min = 60 s 换算。","why":"忽略半分钟线会导致读数恰好差 30 s。","errorId":"E6"},{"id":"P7","title":"毫米刻度尺非零起点要做差","how":"物体左端若未对准 0 刻度线，必须用右端读数减去左端起点读数。","why":"直接读末端刻度会把起点位置也算进长度里。","errorId":"E7"},{"id":"P8","title":"独立完成五类仪器随机读数各 1 题","how":"切换到五种仪器分别读对至少 1 次，巩固有效数字与单位换算。","why":"高考常在实验第 (1) 小问直接考查其中任一种仪器的精确读数。"}],"errors":[{"id":"E1","name":"游标卡尺/停表：多估读或漏精度末尾 0","noteId":"P1","trigger":"10 分度游标卡尺（真值 19.0 mm）写成了 19.00 mm 或 19 mm","config":{"type":"caliper","div":10,"valMm":19.0,"bad":"19.00"},"observe":"看主尺与 10 分度游标对齐情况，比较“19.0 mm”与“19.00 mm / 19 mm”的含义差异。","consequence":"游标卡尺精度只有 0.1 mm，多写一位（19.00 mm）是伪造更高精度；少写末尾 0（19 mm）则丢失了 0.1 mm 精度信息。","ask":{"stem":"关于 20 分度游标卡尺的读数，下列写法规范的是？","options":["10.0 mm","10.00 mm","10.000 mm","10 mm"],"answer":1,"quizId":"M00:try:E1"},"why":"20 分度精度为 0.05 mm（两位小数），游标卡尺不估读，因此以 mm 为单位必须写足两位小数，对齐 0 线时写 10.00 mm。","questionIds":["G4","Y1"]},{"id":"E2","name":"游标卡尺：看成游标框左边缘而非 0 刻线","noteId":"P2","trigger":"把主尺整毫米读到了游标金属框左边缘所在位置","config":{"type":"caliper","div":20,"valMm":10.35,"bad":"8.35"},"observe":"注意放大窗里“游标金属框左边缘”与“游标 0 刻线”之间有一段空白边框。","consequence":"因为金属框左边缘在游标 0 刻线左侧约 2 mm，看错参考线会使主尺部分少读 2 mm（10.35 mm 错读成 8.35 mm）。","ask":{"stem":"游标卡尺测量物体时，卡尺两外测量爪夹紧物体，主尺整数部分应看？","options":["游标金属框的左边缘","游标尺上的 0 刻线","游标尺上的末刻线","对齐刻线所在的主尺数值"],"answer":1,"quizId":"M00:try:E2"},"why":"当两测量爪并拢（被测厚度为 0）时，是“游标 0 刻线”对准主尺 0 刻线，而不是游标尺的金属框边缘。因此任何时候主尺都要看游标 0 刻线左侧最邻近的整毫米。","questionIds":["G2","G5"]},{"id":"E3","name":"螺旋测微器：漏看或多算 0.5 mm 半毫米刻线","noteId":"P3","trigger":"被测厚度 7.415 mm（可动刻度 41.5 格）或 6.510 mm（可动刻度 1.0 格）","config":{"type":"micrometer","trueMm":7.415,"zeroErrMm":0,"bad":"7.915"},"observe":"仔细看固定刻度下排的半毫米刻线在 7 mm 右侧是否已经露出，并结合可动刻度 41.5 格判断。","consequence":"7.415 mm 时 7.5 mm 半毫米刻线尚未露出（可动刻度还要转过 45~50 才会露出 7.5 mm），误以为露出就会多算 0.500 mm（读成 7.915 mm）。","ask":{"stem":"某次测量中螺旋测微器可动刻度为 1.5 格（刚过 0 线），固定刻度整毫米线 6 mm 右侧半毫米线已明显露出，读数应为？","options":["6.015 mm","6.515 mm","7.015 mm","6.150 mm"],"answer":1,"quizId":"M00:try:E3"},"why":"可动刻度刚过 0 线（1.5 格），说明套筒刚刚越过上一条半毫米或整毫米刻线；下排半毫米刻线已露出，故固定刻度为 6.5 mm，总读数为 6.5 + 0.015 = 6.515 mm。","questionIds":["G7","Y1"]},{"id":"E4","name":"需估读仪器：对齐刻线时漏写估读位“0”","noteId":"P4","trigger":"刻度尺 1.90 cm 写成 1.9 cm，或测力计 3.70 N 写成 3.7 N","config":{"type":"dynamometer","trueForceN":3.7,"zeroOffsetN":0,"bad":"3.7"},"observe":"放大窗中指针恰好对准 3.7 N 刻线，对比“3.7 N”与“3.70 N”表达的测量精度。","consequence":"漏写末尾 0 会被判定为“未估读”，在高考实验题中直接扣分。","ask":{"stem":"用分度值为 0.1 N 的弹簧测力计测拉力，指针恰好指在 1.0 N 刻线上，规范记录为？","options":["1 N","1.0 N","1.00 N","1.000 N"],"answer":2,"quizId":"M00:try:E4"},"why":"最小分度 0.1 N 的仪器必须估读到下一位（0.01 N），指针刚好对齐时估读位为 0，记为 1.00 N。","questionIds":["Y2","G1"]},{"id":"E5","name":"螺旋测微器/测力计：未调零或零误差符号算反","noteId":"P5","trigger":"螺旋测微器空载零误差 +0.020 mm，测量示数 1.520 mm 却直接填 1.520 mm 或加成了 1.540 mm","config":{"type":"micrometer","trueMm":1.5,"zeroErrMm":0.02,"bad":"1.520"},"observe":"看右上角空载零误差小窗与下方测量示数，比较未修正直接读出的结果与真实值。","consequence":"未测物体时就多出了 +0.020 mm，测量值里自带这个多出来的偏置；只有“测量示数 − 零误差”才能还原真实直径 1.500 mm。","ask":{"stem":"若螺旋测微器空载时可动刻度 0 线在基准线上方，零误差为 −0.015 mm，测得金属丝示数为 1.245 mm，则真实直径为？","options":["1.230 mm","1.245 mm","1.260 mm","1.275 mm"],"answer":2,"quizId":"M00:try:E5"},"why":"真实值 = 测量示数 − 零误差 = 1.245 − (−0.015) = 1.260 mm（起跑线退后了 0.015 mm，相当于实际多走了 0.015 mm）。","questionIds":["Y4"]},{"id":"E6","name":"机械停表：忽略小表盘半分钟红线","noteId":"P6","trigger":"停表 54.0 s 读成 24.0 s（或 84.0 s 读成 1 min 24.0 s 后误写成 124.0 s）","config":{"type":"stopwatch","totalSec":54.0,"bad":"24.0"},"observe":"看上方小表盘红针位置：它处在 0 和 1 min 之间，已经越过了中间的半分钟红线！","consequence":"大表盘走一圈只有 30 s。分针过半分钟线后，大表盘同一指针位置代表的是 54.0 s（30 + 24.0），直接读外圈黑字会整整少 30 s。","ask":{"stem":"机械停表小表盘指针在 1 min 与 2 min 之间且尚未过 1.5 min 红线，大表盘指在 18.4（内圈红字 48.4）处，停表读数为？","options":["48.4 s","78.4 s","108.4 s","118.4 s"],"answer":1,"quizId":"M00:try:E6"},"why":"小表盘为 1 min 且未过半分钟线，因此大表盘读 0~30 s 外圈即 18.4 s，总计 60 + 18.4 = 78.4 s。","questionIds":["Y3"]},{"id":"E7","name":"毫米刻度尺：非零起点直接读末端刻度","noteId":"P7","trigger":"物体左端对准 1.00 cm，右端对准 3.45 cm，直接填 3.45 cm","config":{"type":"ruler","lengthMm":24.5,"startMm":10.0,"bad":"3.45"},"observe":"看木块左端对齐的是 1.00 cm 刻度线而非 0 刻度线。","consequence":"直接读末端刻度 3.45 cm 会把前面空出的 1.00 cm 也算进木块长度里；正确长度应为 3.45 − 1.00 = 2.45 cm。","ask":{"stem":"物体左端对准刻度尺 2.00 cm 刻线，右端在 8.36 cm 刻线处，该物体的长度是？","options":["8.36 cm","6.36 cm","6.4 cm","10.36 cm"],"answer":1,"quizId":"M00:try:E7"},"why":"长度等于末端刻度减去起始刻度：8.36 − 2.00 = 6.36 cm，且保留两位小数体现毫米刻度尺的 0.1 mm 估读。","questionIds":[]}],"reverse":[{"id":"R1","show":{"type":"caliper","div":10,"valMm":19.0},"stem":"某同学用 10 分度游标卡尺测量工件（如图），提交的答案是“19.00 mm”，被判错误。原因最可能是？","options":["把 10 分度游标卡尺也进行了估读，多写了一位小数","游标对齐刻线看错","主尺看成了卡尺框左边缘","没有修正零点误差"],"answer":[0],"replay":"E1","why":"10 分度游标卡尺精度为 0.1 mm，游标卡尺不估读，规范读数应为 19.0 mm（1 位小数）。","quizId":"M00:reverse:R1"},{"id":"R2","show":{"type":"caliper","div":20,"valMm":10.35},"stem":"如图为 20 分度游标卡尺（实际宽度 10.35 mm），某同学却读成了“8.35 mm”。他最可能犯了什么错？","options":["漏加了游标部分","把主尺整毫米读在了游标金属框左边缘，而不是游标 0 刻线","把 20 分度当成 50 分度计算","多估读了一位"],"answer":[1],"replay":"E2","why":"金属框左边缘在游标 0 刻线左侧约 2 mm（8.x mm 处），而游标第 7 格对齐算出 0.35 mm，合起来正好偏少 2 mm 读成 8.35 mm。","quizId":"M00:reverse:R2"},{"id":"R3","show":{"type":"micrometer","trueMm":7.415,"zeroErrMm":0},"stem":"如图螺旋测微器可动刻度指在 41.5 格处，某同学读出“7.915 mm”（比正确答案 7.415 mm 大 0.500 mm）。他错在哪里？","options":["可动刻度看反了方向","误以为 7.5 mm 半毫米刻线已经露出，多加了 0.5 mm","忘记修正零点误差","小数点点错了一位"],"answer":[1],"replay":"E3","why":"可动刻度 41.5 格尚未转到 0 线，7.5 mm 半毫米刻线其实还未露出（只露出 7 mm 整刻度），故应为 7.0 + 0.415 = 7.415 mm。","quizId":"M00:reverse:R3"},{"id":"R4","show":{"type":"stopwatch","totalSec":54.0},"stem":"某同学用图示停表测单摆 30 次全振动时间，填了“24.0 s”（实际应为 54.0 s）。问题出在哪里？","options":["小表盘分针已过半分钟红线，却未给大表盘加上 30 s","大表盘精度看错","把分钟当成了十进制","停表没有归零"],"answer":[0],"replay":"E6","why":"小表盘指针在 0 与 1 min 之间且已过半分钟线，大表盘应读 30~60 s 内圈（30 + 24.0 = 54.0 s）。","quizId":"M00:reverse:R4"}],"summary":{"principle":"带“1”分度（刻度尺 1 mm、螺旋测微器 0.01 mm、测力计 0.1 N）<b>估读到下一位<\/b>；游标卡尺（0.1/0.05/0.02 mm）与停表（0.1 s）<b>不估读<\/b>。螺旋测微器 真实值 = 示数 − 零误差。","steps":["判别仪器是否需要估读与目标单位","毫米刻度尺：末端 − 起点，估读到 0.1 mm（0.01 cm）","游标卡尺：游标 0 线左侧主尺整 mm + k × 分度值","螺旋测微器：固定刻度（含 0.5 mm 线）+ 可动刻度 × 0.01 mm − 零误差","弹簧测力计：校零后读到 0.01 N","机械停表：小表盘分+半分钟判定 + 大表盘（0~30 或 30~60 s）"],"notes":[{"do":"游标卡尺、机械停表不估读，但末尾 0 不能省","why":"小数位数反映仪器精度（如 20 分度写 10.00 mm）"},{"do":"游标卡尺主尺看“游标 0 刻线”左侧","why":"看成金属框左边缘会少读约 2 mm"},{"do":"螺旋测微器仔细核对 0.5 mm 半毫米线","why":"差一条刻线即差 0.500 mm；接近 0 线时看可动刻度复核"},{"do":"刻度尺、测微器、测力计对齐刻线要补“0”","why":"有效数字末位必须体现估     drawLine(ctx, mX(d.q), beamY + beamH - 1, mX(d.q), beamY + beamH + (compact ? 11 : 14), '#1661FF', 1.5);

    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, vLeft, beamY + beamH + 8, 14, '#C7374B');
      D.text(ctx, '这是游标框左边缘（不是 0 线）', vLeft - 8, beamY + beamH + (compact ? 31 : 34), { size: 11, weight: 700, color: '#C7374B' });
    }

    // 下半部分：高倍率刻度放大阅读窗（能清晰分辨 50 分度 0.02 mm）
    var zy = compact ? Math.max(Math.round(hh * 0.48), beamY + beamH + 36) : Math.round(hh * 0.45);
    var zh = hh - zy - (compact ? 22 : 26), zx = 14, zw = w - 28;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.4;
    D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '局部放大（' + div + ' 分度 · 精度 ' + d.step + ' mm）', zx + 12, zy + 17, { size: 12, weight: 700, color: '#1661FF' });

    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 4, zy + 22, zw - 8, zh - 26, 8); ctx.clip();
    var vernLen = div === 10 ? 9 : div === 20 ? 19 : 49;
    var winSpan = Math.max(18, vernLen + 9);
    var winMinMm = Math.max(0, Math.floor(d.q) - 4);
    var zScale = (zw - 36) / winSpan;
    var zX = function (mm) { return zx + 18 + (mm - winMinMm) * zScale; };
    var midY = zy + 22 + (zh - 26) * 0.48;

    // 放大主尺
    ctx.fillStyle = '#F3F7FC'; ctx.fillRect(zx, zy + 22, zw, midY - zy - 22);
    ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.1; ctx.beginPath();
    var m0 = Math.floor(winMinMm), m1 = Math.ceil(winMinMm + winSpan);
    for (m = m0; m <= m1; m++) {
      var xPos = zX(m), hT = m % 10 === 0 ? 22 : m % 5 === 0 ? 16 : 10;
      ctx.moveTo(xPos, midY); ctx.lineTo(xPos, midY - hT);
    }
    ctx.stroke();
    for (m = m0; m <= m1; m++) {
      if (m % 10 === 0) D.text(ctx, String(m / 10), zX(m), midY - 26, { align: 'center', size: 12, weight: 700 });
    }
    D.text(ctx, 'cm', zX(m1) - 10, midY - 26, { align: 'right', size: 11, color: '#4A5B73' });

    // 放大游标尺框（框左边缘明显在 0 线左 2 mm）
    var zvLeft = zX(d.q - 2.0), zvRight = zX(d.markPosMm(div) + 1.8);
    ctx.fillStyle = '#E8EEF5'; ctx.fillRect(zvLeft, midY, zvRight - zvLeft, zh);
    drawLine(ctx, zvLeft, midY, zvLeft, zy + zh, '#7E8C9B', 2);
    drawLine(ctx, zx, midY, zx + zw, midY, '#596574', 1.2);

    // 放大游标刻线
    for (var i = 0; i <= div; i++) {
      var vx = zX(d.markPosMm(i));
      var isMajor = div === 10 ? true : (div === 20 ? i % 2 === 0 : i % 5 === 0);
      var isAlign = st.hintAlign && i === d.k;
      var vLen = i === 0 || i === div ? 22 : (i % 5 === 0 ? 18 : 11);
      drawLine(ctx, vx, midY, vx, midY + vLen, isAlign ? '#25A870' : (i === 0 ? '#1661FF' : '#10233F'), isAlign || i === 0 ? 1.8 : 1);
      if (isMajor && (div !== 50 || i % 10 === 0 || i === 5)) {
        var lbl = div === 50 ? String(i / 5) : String(i);
        D.text(ctx, lbl, vx, midY + 35, { align: 'center', size: div === 50 ? 10.5 : 11, weight: i === 0 ? 700 : 500, color: i === 0 ? '#1661FF' : '#10233F' });
      }
    }
    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, zvLeft, midY + 12, 16, '#C7374B');
      D.ring(ctx, zX(d.q), midY + 12, 16, '#25A870');
    }
    if (st.hintAlign) {
      var ax = zX(d.markPosMm(d.k));
      ctx.save(); ctx.setLineDash([3, 3]);
      drawLine(ctx, ax, midY - 26, ax, midY + 26, '#25A870', 1.6);
      ctx.restore();
    }
    ctx.restore();

    D.text(ctx, '主尺读到游标 0 刻线左侧整毫米；拖动量爪或右侧按钮调长度，按住看放大镜', 14, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  3. 螺旋测微器（千分尺）
   * ===================================================================== */
  function drawMicSleeve(ctx, x, y, w, hh, dispMm, opts) {
    opts = opts || {};
    var pxPerMm = opts.pxPerMm || 28;
    var sleeveW = w * 0.56, zeroX = x + 16;
    var datumY = y + hh * 0.50;
    var thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    if (thimbleX > x + sleeveW - 18) {
      var shiftMm = (thimbleX - (x + sleeveW - 18)) / pxPerMm;
      zeroX -= shiftMm * pxPerMm;
      thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    }

    ctx.save();
    ctx.beginPath(); D.rr(ctx, x, y, w, hh, 8); ctx.clip();
    ctx.fillStyle = '#FBFCFE'; ctx.fillRect(x, y, w, hh);

    // 固定刻度套筒
    ctx.fillStyle = D.grad(ctx, 0, datumY - 36, 0, datumY + 36, ['#DCE3EC', '#F8FAFC', '#C7D1DC']);
    ctx.fillRect(x, datumY - 36, Math.max(0, thimbleX - x), 72);
    drawLine(ctx, x, datumY - 36, thimbleX, datumY - 36, '#8E99A6', 1);
    drawLine(ctx, x, datumY + 36, thimbleX, datumY + 36, '#8E99A6', 1);
    drawLine(ctx, Math.min(x, zeroX - 4), datumY, thimbleX, datumY, '#10233F', 1.4);

    // 整毫米（上）与 0.5 mm（下）
    var maxM = Math.ceil((thimbleX - zeroX) / pxPerMm) + 1;
    var halfExp = (Math.floor((dispMm + 1e-9) / 0.5) % 2) === 1;
    for (var m = 0; m <= maxM; m++) {
      var mx = zeroX + m * pxPerMm;
      if (mx <= thimbleX + 0.5 && mx >= x + 4) {
        drawLine(ctx, mx, datumY, mx, datumY - (m % 5 === 0 ? 18 : 12), '#10233F', m % 5 === 0 ? 1.5 : 1.1);
        if (m % 5 === 0) D.text(ctx, String(m), mx, datumY - 22, { align: 'center', size: 11, weight: 700 });
      }
      var hx = zeroX + (m + 0.5) * pxPerMm;
      if (hx <= thimbleX + 0.5 && hx >= x + 4) {
        var isHalfMark = opts.markHalf && halfExp && Math.abs(m - Math.floor(dispMm)) < 0.01;
        drawLine(ctx, hx, datumY, hx, datumY + 13, isHalfMark ? '#C7374B' : '#10233F', isHalfMark ? 2 : 1.1);
        if (isHalfMark) D.ring(ctx, hx, datumY + 7, 13, '#C7374B');
      }
    }
    if (opts.markHalf && !halfExp && dispMm > 0) {
      D.ring(ctx, thimbleX - 6, datumY + 8, 13, '#C7374B');
      D.text(ctx, '半mm未露', Math.max(x + 34, thimbleX - 18), datumY + 28, { align: 'center', size: 10.5, weight: 700, color: '#C7374B' });
    }

    // 可动刻度锥面套筒
    var bevelW = 34, bodyW = x + w - thimbleX - bevelW;
    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#B8C3CF', '#F5F8FB', '#9AA7B5']);
    ctx.beginPath();
    ctx.moveTo(thimbleX, datumY - 36); ctx.lineTo(thimbleX + bevelW, datumY - 48);
    ctx.lineTo(thimbleX + bevelW, datumY + 48); ctx.lineTo(thimbleX, datumY + 36);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();

    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#9FAAB7', '#E6ECF3', '#7E8A98']);
    ctx.fillRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);
    ctx.strokeRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);

    // 可动刻度 50 格（向上递增）
    var thVal = +((dispMm - Math.floor((dispMm + 1e-9) / 0.5) * 0.5) * 100).toFixed(2);
    var sp = 6.2;
    for (var t = 0; t < 50; t++) {
      var diff = ((t - thVal + 75) % 50) - 25;
      var ty = datumY - diff * sp;
      if (ty < datumY - 43 || ty > datumY + 43) continue;
      var is5 = t % 5 === 0;
      drawLine(ctx, thimbleX + 3, ty, thimbleX + (is5 ? 20 : 12), ty, '#10233F', is5 ? 1.4 : 1);
      if (is5) D.text(ctx, String(t), thimbleX + 23, ty + 4, { size: 11, weight: 700 });
    }
    ctx.restore();
    ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.2;
    D.rr(ctx, x, y, w, hh, 8); ctx.stroke();
  }

  function drawMicrometer(ctx, w, hh, st) {
    st = st || {};
    var trueMm = st.trueMm != null ? st.trueMm : 6.860, zeroErr = st.zeroErrMm || 0;
    var d = G.micrometer.decompose(trueMm, zeroErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：2.5D U 形尺架与被测物
    var uLeft = 24, uTop = 26, anvilX = 56, gapW = Math.max(12, Math.min(72, d.trueMm * 4.5));
    var spinX = anvilX + gapW, axisY = uTop + 34;
    ctx.strokeStyle = '#596574'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(uLeft + 52, axisY + 34, 48, Math.PI * 0.12, Math.PI * 1.12); ctx.stroke();
    ctx.strokeStyle = '#9AA7B5'; ctx.lineWidth = 8; ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineWidth = 1;

    ctx.fillStyle = '#8E99A6'; ctx.fillRect(anvilX - 10, axisY - 7, 10, 14);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 12, 0, axisY + 12, ['#D9B98C', '#C49F6B']);
    ctx.beginPath(); ctx.arc((anvilX + spinX) / 2, axisY, gapW / 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8E6B38'; ctx.stroke();
    ctx.fillStyle = '#C9D1D9'; ctx.fillRect(spinX, axisY - 6, 48, 12); ctx.strokeStyle = '#6E7B8A'; ctx.strokeRect(spinX, axisY - 6, 48, 12);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 16, 0, axisY + 16, ['#DCE4EC', '#9AA7B5']);
    ctx.fillRect(spinX + 46, axisY - 16, 62, 32); ctx.strokeRect(spinX + 46, axisY - 16, 62, 32);

    var compact = hh < 270;
    // 零误差参考小窗（若存在零误差）
    if (Math.abs(zeroErr) > 1e-6) {
      var zx = w - 210, zy = compact ? 4 : 10, zh0 = compact ? 62 : 88;
      D.text(ctx, '空载零误差：' + (zeroErr >= 0 ? '+' : '') + zeroErr.toFixed(3) + ' mm', zx + 2, zy + 11, { size: 11.5, weight: 700, color: '#C7374B' });
      drawMicSleeve(ctx, zx, zy + 16, 194, zh0, zeroErr, { pxPerMm: 24 });
    } else {
      D.text(ctx, '螺距 0.5 mm · 50 格（0.01 mm/格）· 估读到 0.001 mm', w - 16, axisY - 12, { align: 'right', size: 11.5, weight: 600, color: '#10233F' });
    }

    // 下方：高清晰放大套筒读数窗
    var my = (compact && Math.abs(zeroErr) > 1e-6) ? Math.max(Math.round(hh * 0.42), 88) : Math.round(hh * 0.36);
    var mh = hh - my - 26;
    drawMicSleeve(ctx, 18, my, w - 36, mh, d.dispMm, { pxPerMm: Math.min(34, (w - 160) / Math.max(6, d.dispMm + 2)), markHalf: st.marks && st.marks.indexOf('half') >= 0 });
    D.text(ctx, '读数 = 固定刻度（注意下排 0.5 mm 刻线）+ 可动刻度格数 × 0.01 mm', 18, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  4. 弹簧测力计（0-5 N，0.1 N 分度）
   * ===================================================================== */
  function drawDynamometer(ctx, w, hh, st) {
    st = st || {};
    var f = st.trueForceN != null ? st.trueForceN : 3.70, zErr = st.zeroOffsetN || 0;
    var d = G.dynamometer.decompose(f, zErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：测力计整机
    var cx = Math.round(w * 0.28), by = 30, bw = 82, bh = Math.min(220, hh - 80);
    ctx.strokeStyle = '#8E99A6'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, by - 8, 12, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = D.grad(ctx, cx - bw / 2, 0, cx + bw / 2, 0, ['#F8FAFC', '#DCE4EC']);
    D.rr(ctx, cx - bw / 2, by, bw, bh, 12); ctx.fill(); ctx.strokeStyle = '#7E8C9B'; ctx.stroke();

    var sTop = by + 24, sBot = by + bh - 26, sH = sBot - sTop;
    var yOf = function (n) { return sTop + (n / 5) * sH; };
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 22, sTop - 8, 44, sH + 16);
    ctx.strokeStyle = '#B9C8DA'; ctx.strokeRect(cx - 22, sTop - 8, 44, sH + 16);
    for (var n = 0; n <= 50; n++) {
      var yy = yOf(n / 10), maj = n % 10 === 0, mid = n % 5 === 0;
      drawLine(ctx, cx - 20, yy, cx - 20 + (maj ? 14 : mid ? 10 : 6), yy, '#10233F', maj ? 1.4 : 0.9);
      if (maj) D.text(ctx, String(n / 10), cx + 14, yy + 4, { align: 'right', size: 11, weight: 700 });
    }
    var py = yOf(Math.max(0, Math.min(5, d.dispN)));
    drawLine(ctx, cx - 22, py, cx + 18, py, '#C7374B', 2.4);
    drawLine(ctx, cx, by + bh, cx, by + bh + 18, '#6E7B8A', 2.5);
    ctx.fillStyle = '#8E99A6'; ctx.fillRect(cx - 14, by + bh + 16, 28, 16);
    D.text(ctx, '0–5 N', cx, by + 16, { align: 'center', size: 11, weight: 700, color: '#4A5B73' });

    // 右侧：指针处高倍率放大窗
    var zx = Math.round(w * 0.48), zw = w - zx - 20, zy = 26, zh = hh - 62;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '指针局部放大（最小分度 0.1 N · 估读到 0.01 N）', zx + 14, zy + 20, { size: 12, weight: 700, color: '#1661FF' });
    if (Math.abs(zErr) > 1e-6) {
      D.text(ctx, '注意：空载未调零，零误差 ' + (zErr >= 0 ? '+' : '') + zErr.toFixed(2) + ' N', zx + 14, zy + 38, { size: 12, weight: 700, color: '#C7374B' });
    }
    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 8, zy + 46, zw - 16, zh - 56, 8); ctx.clip();
    var zScale = (zh - 60) / 1.4, zCenter = d.dispN;
    var zY = function (val) { return zy + 46 + (zh - 56) / 2 + (val - zCenter) * zScale; };
    var n0 = Math.max(0, Math.floor((zCenter - 0.8) * 10)), n1 = Math.min(50, Math.ceil((zCenter + 0.8) * 10));
    var scaleX = zx + zw * 0.42;
    ctx.fillStyle = '#F8FBFF'; ctx.fillRect(scaleX - 30, zy + 46, 90, zh);
    for (n = n0; n <= n1; n++) {
      var yk = zY(n / 10), isMaj = n % 10 === 0, isMid = n % 5 === 0;
      drawLine(ctx, scaleX - 24, yk, scaleX - 24 + (isMaj ? 32 : isMid ? 22 : 14), yk, '#10233F', isMaj ? 1.8 : 1.1);
      if (isMaj || isMid) D.text(ctx, (n / 10).toFixed(1), scaleX + 20, yk + 4, { size: 12.5, weight: isMaj ? 700 : 500 });
    }
    var zpy = zY(d.dispN);
    drawLine(ctx, scaleX - 42, zpy, scaleX + 18, zpy, '#C7374B', 2.6);
    ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.moveTo(scaleX - 42, zpy - 6); ctx.lineTo(scaleX - 30, zpy); ctx.lineTo(scaleX - 42, zpy + 6); ctx.closePath(); ctx.fill();
    ctx.restore();
    D.text(ctx, '拖动挂钩或右侧按钮改变拉力', 14, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  5. 机械停表（0-15 min 小盘 + 0-30 s 大盘，不估读）
   * ===================================================================== */
  function drawStopwatch(ctx, w, hh, st) {
    st = st || {};
    var totalSec = st.totalSec != null ? st.totalSec : 54.0;
    var d = G.stopwatch.decompose(totalSec);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：停表主体
    var R = Math.min(hh * 0.38, w * 0.22, 118), cx = Math.round(w * 0.27), cy = Math.round(hh * 0.52);
    ctx.fillStyle = '#8E99A6'; ctx.fillRect(cx - 10, cy - R - 18, 20, 14);
    ctx.fillStyle = D.grad(ctx, cx - R, cy - R, cx + R, cy + R, ['#E6ECF2', '#9AA7B5']);
    ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();

    // 大表盘（30 s 一圈，300 格）
    for (var i = 0; i < 300; i++) {
      var ang = (i / 300) * Math.PI * 2 - Math.PI / 2;
      var maj = i % 10 === 0, mid = i % 5 === 0;
      if (R < 90 && !maj && i % 2 !== 0) continue;
      var rOut = R - 4, rIn = rOut - (maj ? 10 : mid ? 7 : 4);
      drawLine(ctx, cx + Math.cos(ang) * rIn, cy + Math.sin(ang) * rIn, cx + Math.cos(ang) * rOut, cy + Math.sin(ang) * rOut, '#10233F', maj ? 1.3 : 0.7);
      if (maj && i % 20 === 0) {
        var s0 = i / 10;
        D.text(ctx, String(s0 === 0 ? 30 : s0), cx + Math.cos(ang) * (R - 20), cy + Math.sin(ang) * (R - 20) + 4, { align: 'center', size: 10.5, weight: 700 });
        D.text(ctx, String(s0 === 0 ? 60 : s0 + 30), cx + Math.cos(ang) * (R - 32), cy + Math.sin(ang) * (R - 32) + 4, { align: 'center', size: 9, color: '#C7374B', weight: 600 });
      }
    }

    // 小表盘（15 min）
    var sx = cx, sy = cy - R * 0.38, sr = R * 0.29;
    ctx.fillStyle = '#F8FBFF'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#9AA8B8'; ctx.stroke();
    for (i = 0; i < 30; i++) {
      var ma = (i / 30) * Math.PI * 2 - Math.PI / 2;
      var isInt = i % 2 === 0;
      drawLine(ctx, sx + Math.cos(ma) * (sr - (isInt ? 6 : 4)), sy + Math.sin(ma) * (sr - (isInt ? 6 : 4)), sx + Math.cos(ma) * (sr - 1), sy + Math.sin(ma) * (sr - 1), isInt ? '#10233F' : '#C7374B', isInt ? 1.2 : 1);
    }
    var mAng = (d.minPos / 15) * Math.PI * 2 - Math.PI / 2;
    drawLine(ctx, sx, sy, sx + Math.cos(mAng) * (sr - 5), sy + Math.sin(mAng) * (sr - 5), '#C7374B', 2);

    // 秒针
    var sAng = (d.handSec / 30) * Math.PI * 2 - Math.PI / 2;
    drawLine(ctx, cx - Math.cos(sAng) * 14, cy - Math.sin(sAng) * 14, cx + Math.cos(sAng) * (R - 8), cy + Math.sin(sAng) * (R - 8), '#10233F', 2);
    ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();

    // 右侧上下两个局部放大窗
    var zx = Math.round(w * 0.50), zw = w - zx - 16;
    var z1y = 14, z1h = Math.round((hh - 44) * 0.44);
    var z2y = z1y + z1h + 10, z2h = hh - z2y - 24;

    // 放大1：小表盘（分针与红线半分钟判定）
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; D.rr(ctx, zx, z1y, zw, z1h, 10); ctx.fill(); ctx.stroke();
    D.text(ctx, '① 小表盘放大（红线为半分钟线）', zx + 10, z1y + 16, { size: 11.5, weight: 700, color: '#C7374B' });
    ctx.save(); ctx.beginPath(); D.rr(ctx, zx + 4, z1y + 20, zw - 8, z1h - 24, 6); ctx.clip();
    var mStart = Math.max(0, d.minInt - 1), mSpan = 3.2, mScale = (zw - 40) / mSpan;
    var mBarY = z1y + z1h * 0.62;
    drawLine(ctx, zx + 14, mBarY, zx + zw - 14, mBarY, '#9AA8B8', 1.2);
    for (var mi = mStart * 2; mi <= (mStart + 4) * 2; mi++) {
      var mv = mi * 0.5, mx = zx + 20 + (mv - mStart) * mScale;
      var isMin = mi % 2 === 0;
      drawLine(ctx, mx, mBarY - (isMin ? 16 : 11), mx, mBarY, isMin ? '#10233F' : '#C7374B', isMin ? 1.8 : 1.5);
      if (isMin) D.text(ctx, String(mv), mx, mBarY + 14, { align: 'center', size: 11, weight: 700 });
      else D.text(ctx, '半', mx, mBarY - 19, { align: 'center', size: 9.5, color: '#C7374B' });
    }
    var mPtrX = zx + 20 + (d.minPos - mStart) * mScale;
    ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.moveTo(mPtrX, mBarY - 2); ctx.lineTo(mPtrX - 5, mBarY - 14); ctx.lineTo(mPtrX + 5, mBarY - 14); ctx.closePath(); ctx.fill();

        else if (e.key === 'Enter') { self.submitReading(); e.preventDefault(); }
      }
    }, this.input || '点下面数字键输入读数');
    function updateDisp() {
      disp.textContent = self.input || '点下面数字键输入读数';
      disp.classList.toggle('empty', !self.input);
    }
    var checkBtn = h('button.btn.primary.sm', { type: 'button', onclick: function () { self.submitReading(); } }, '判分');
    ctl.appendChild(h('div.m00-read-row', disp, h('span.m00-unit', unitLbl), checkBtn));

    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '.', '⌫'];
    ctl.appendChild(h('div.m00-pad', keys.map(function (k) {
      return h('button.m00-k', { type: 'button', onclick: function () {
        if (k === '⌫') self.input = self.input.slice(0, -1);
        else if (k === '.' && self.input.indexOf('.') >= 0) return;
        else self.input += k;
        updateDisp();
      } }, k);
    })));

    this.fbBox = h('div.m00-fb');
    ctl.appendChild(this.fbBox);
    this.renderFb();
    side.appendChild(ctl);

    if (this.mode === 'guided') {
      side.appendChild(h('div.side-k', '读数要点清单'));
      var ids = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'], curId = null;
      for (var i = 0; i < ids.length; i++) { if (!this.pDone[ids[i]]) { curId = ids[i]; break; } }
      var curEl = null;
      var ol = h('ol.steps', ids.map(function (id) {
        var p = PROC[id], ok = !!self.pDone[id], isCur = id === curId;
        var li = h('li' + (ok ? '.ok' : '') + (isCur ? '.cur' : ''),
          h('div.st-t', (ok ? '✓ ' : isCur ? '▸ ' : '') + p.title),
          h('div.st-how', { html: M.tex(p.how) + (p.why ? '<div class="st-why">理由：' + M.tex(p.why) + '</div>' : '') }),
          p.errorId ? h('button.link.sm', { type: 'button', onclick: function () { openTry(p.errorId); } }, '试一试 →') : null);
        if (isCur) curEl = li;
        return li;
      }));
      side.appendChild(ol);
      if (curEl) setTimeout(function () { if (ol.scrollHeight > ol.clientHeight + 4) ol.scrollTop = Math.max(0, curEl.offsetTop - ol.offsetTop - 4); }, 0);
    } else {
      side.appendChild(h('div.side-k', '自由模式错因标签'));
      if (this.freeTags.length) {
        side.appendChild(h('div.ana-tags', this.freeTags.map(function (id) {
          return h('button.tag.err', { type: 'button', onclick: function () { openTry(id); } }, '✕ ' + ERR[id].name + ' → 试一试');
        })));
      } else {
        side.appendChild(h('div.st-how', '可自由拖动仪器并判分；若读数触及典型易错点，这里会记下对应纠错标签。'));
      }
    }
  };

  /* =====================================================================
   *  ③ 诊·误差（四拍试一试 + 反推）
   * ===================================================================== */
  function cfgToState(cfg, forReverse) {
    var st = Object.assign({ type: cfg.type || 'caliper', locked: true, marks: null }, cfg);
    if (cfg.type === 'caliper' && cfg.bad && cfg.valMm === 10.35) st.marks = ['frameEdge'];
    if (cfg.type === 'micrometer' && cfg.trueMm === 7.415) st.marks = ['half'];
    if (!forReverse && cfg.type === 'stopwatch' && cfg.totalSec === 54.0) st.marks = ['half'];
    if (cfg.type === 'ruler' && cfg.startMm > 0) st.marks = ['nonzero'];
    return st;
  }
  function comparePair(err) {
    var c = err.config, bad = String(c.bad || '');
    if (c.type === 'caliper') {
      var dc = G.caliper.decompose(c.valMm, c.div);
      var diag = G.caliper.diagnose(bad, c.valMm, { div: c.div, unit: 'mm' });
      var goodMsg = err.id === 'E2'
        ? dc.mmStr + ' mm（主尺看游标 0 刻线左侧整毫米 ' + dc.mainMm + ' mm + ' + dc.k + '×' + dc.step + '）'
        : dc.mmStr + ' mm（' + dc.div + ' 分度不估读，保留 ' + dc.mmDecimals + ' 位小数）';
      return { good: goodMsg, bad: bad + ' mm（' + diag.msg + '）' };
    }
    if (c.type === 'micrometer') {
      var dm = G.micrometer.decompose(c.trueMm, c.zeroErrMm || 0);
      var diagM = G.micrometer.diagnose(bad, c.trueMm, { zeroErrMm: c.zeroErrMm || 0, unit: 'mm' });
      var goodM = c.zeroErrMm
        ? dm.trueStr + ' mm（示数 ' + dm.dispStr + ' − 零误差 ' + (c.zeroErrMm >= 0 ? '+' : '') + c.zeroErrMm.toFixed(3) + '）'
        : dm.trueStr + ' mm（固定 ' + dm.fixedMm.toFixed(1) + ' + 可动 ' + dm.thimble.toFixed(1) + '×0.01）';
      return { good: goodM, bad: bad + ' mm（' + diagM.msg + '）' };
    }
    if (c.type === 'dynamometer') {
      var dd = G.dynamometer.decompose(c.trueForceN, c.zeroOffsetN || 0);
      var diagD = G.dynamometer.diagnose(bad, c.trueForceN, { zeroOffsetN: c.zeroOffsetN || 0 });
      return { good: dd.trueStr + ' N（0.1 N 分度，对齐刻线补估读位 0）', bad: bad + ' N（' + diagD.msg + '）' };
    }
    if (c.type === 'stopwatch') {
      var ds = G.stopwatch.decompose(c.totalSec);
      var diagS = G.stopwatch.diagnose(bad, c.totalSec);
      return { good: ds.secStr + ' s（小盘过半分钟线，大盘读 ' + (ds.halfPassed ? '30+' + ds.handSec.toFixed(1) : ds.handSec.toFixed(1)) + ' s）', bad: bad + ' s（' + diagS.msg + '）' };
    }
    var dr = G.ruler.decompose(c.lengthMm, c.startMm || 0);
    var diagR = G.ruler.diagnose(bad, c.lengthMm, { startMm: c.startMm || 0, unit: 'cm' });
    return { good: dr.cmStr + ' cm（末端 ' + dr.endCmStr + ' − 起点 ' + (dr.startMm / 10).toFixed(2) + '）', bad: bad + ' cm（' + diagR.msg + '）' };
  }
  var adapter = {
    compare: function (err, area, done) {
      new GV.GaugeBench(area, { height: 226, state: cfgToState(err.config, false) });
      var pair = comparePair(err);
      area.appendChild(h('div.cmp-split',
        h('div.cmp-box.good', '✓ 规范读数', h('b', pair.good)),
        h('div.cmp-box.bad', '✕ 常见错读', h('b', pair.bad))));
      setTimeout(done, ML.perf.reduced ? 0 : 250);
    },
    show: function (c, vis) {
      new GV.GaugeBench(vis, { height: 224, state: cfgToState(c.show, true) });
    },
    restore: function () {
      S.mode = 'guided'; ML.store.save();
      if (!bench) return;
      bench.st.zeroErrMm = 0; bench.st.zeroOffsetN = 0; bench.st.startMm = 0;
      bench.st.marks = null; bench.st.hintAlign = false;
      bench.freeTags = []; bench.input = ''; bench.fb = null;
      bench.gauge.set(bench.st);
      bench.setMode('guided');
      bench.setBanner(null);
    },
    replay: function (errId) {
      var e = ERR[errId]; if (!e) return;
      shell.go('bench');
      bench.setMode('free', true);
      var c = e.config;
      bench.setInst(c.type, true);
      bench.st.hintAlign = false; bench.st.marks = null;
      bench.st.zeroErrMm = 0; bench.st.zeroOffsetN = 0; bench.st.startMm = 0;
      if (c.div) bench.st.div = c.div;
      if (c.valMm != null) bench.st.valMm = c.valMm;
      if (c.trueMm != null) bench.st.trueMm = c.trueMm;
      if (c.zeroErrMm != null) bench.st.zeroErrMm = c.zeroErrMm;
      if (c.lengthMm != null) bench.st.lengthMm = c.lengthMm;
      if (c.startMm != null) bench.st.startMm = c.startMm;
      if (c.trueForceN != null) bench.st.trueForceN = c.trueForceN;
      if (c.zeroOffsetN != null) bench.st.zeroOffsetN = c.zeroOffsetN;
      if (c.totalSec != null) bench.st.totalSec = c.totalSec;
      bench.st.unit = c.type === 'ruler' ? 'cm' : 'mm';
      bench.input = ''; bench.fb = null;
      bench.gauge.set(bench.st);
      bench.renderSide();
      bench.setBanner('<b>复现：' + e.name + '</b>　实验台已设为对应情景（' + M.tex(e.trigger) + '），请在右侧输入你的读数试试看。');
      shell.main.scrollTop = 0;
    }
  };
  function openTry(id) {
    var e = ERR[id];
    if (e) ML.TryIt(e, adapter, e.noteId && PROC[e.noteId] ? '<b>' + PROC[e.noteId].title + '：</b>' + PROC[e.noteId].how + (PROC[e.noteId].why ? ' 理由：' + PROC[e.noteId].why : '') : '');
  }

  /* =====================================================================
   *  ① 学·原理：交互小部件
   * ===================================================================== */
  function learnWidget(p, card) {
    if (!p.widget) return;
    var box = h('div.learn-widget'), cur = null;
    card.appendChild(box);
    var presets = [];
    if (p.widget === 'ruler-dyn-demo') {
      presets = [
        { label: '刻度尺 0 起点 (1.90 cm)', st: { type: 'ruler', lengthMm: 19.0, startMm: 0, locked: true } },
        { label: '非零起点 (2.45 cm)', st: { type: 'ruler', lengthMm: 24.5, startMm: 10.0, marks: ['nonzero'], locked: true } },
        { label: '弹簧测力计 (3.70 N)', st: { type: 'dynamometer', trueForceN: 3.70, zeroOffsetN: 0, locked: true } }
      ];
    } else if (p.widget === 'caliper-demo') {
      presets = [
        { label: '10 分度 (19.0 mm)', st: { type: 'caliper', div: 10, valMm: 19.0, hintAlign: true, locked: true } },
        { label: '20 分度 (10.35 mm)', st: { type: 'caliper', div: 20, valMm: 10.35, hintAlign: true, locked: true } },
        { label: '50 分度 (6.04 mm)', st: { type: 'caliper', div: 50, valMm: 6.04, hintAlign: true, locked: true } }
      ];
    } else if (p.widget === 'micrometer-demo') {
      presets = [
        { label: '露出半毫米 (6.860 mm)', st: { type: 'micrometer', trueMm: 6.860, zeroErrMm: 0, locked: true } },
        { label: '未露半毫米 (7.415 mm)', st: { type: 'micrometer', trueMm: 7.415, zeroErrMm: 0, marks: ['half'], locked: true } },
        { label: '零误差 +0.020 (真值 1.500)', st: { type: 'micrometer', trueMm: 1.500, zeroErrMm: 0.020, locked: true } }
      ];
    } else if (p.widget === 'stopwatch-demo') {
      presets = [
        { label: '未过半分钟 (24.0 s)', st: { type: 'stopwatch', totalSec: 24.0, locked: true } },
        { label: '已过半分钟 (54.0 s)', st: { type: 'stopwatch', totalSec: 54.0, marks: ['half'], locked: true } },
        { label: '超过 1 分钟 (78.4 s)', st: { type: 'stopwatch', totalSec: 78.4, locked: true } }
      ];
    }
    if (!presets.length) return;
    var sw = h('div.side-row');
    box.appendChild(sw);
    var gb = new GV.GaugeBench(box, { height: 226, state: presets[0].st });
    presets.forEach(function (pr, idx) {
      var b = h('button.chip' + (idx === 0 ? '.on' : ''), { type: 'button', onclick: function () {
        ML.$$('.chip', sw).forEach(function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        cur = Object.assign({ marks: null, hintAlign: false }, pr.st);
        gb.set(cur);
      } }, pr.label);
      sw.appendChild(b);
    });
  }

  /* =====================================================================
   *  组装
   * ===================================================================== */
  var shell = new ML.Shell({
    title: C.title, sub: C.sub, summary: C.summary,
    tabs: [
      { id: 'learn', label: '学·原理', mount: function (el) { ML.Learn(el, C.learn, C.equipment, { onPage: learnWidget, onFinish: function () { shell.go('bench'); } }); } },
      { id: 'bench', label: '做·实验', mount: function (el) { bench = new Bench(el); } },
      { id: 'diag', label: '诊·误差', mount: function (el) {
        var wrap = h('div.diag'); el.appendChild(wrap);
        wrap.appendChild(h('h2.diag-h', 'A. 常见错因实验室'));
        wrap.appendChild(h('p.muted', '每个“试一试”按四拍进行：观察位置 → 对比正误写法 → 追问与揭示。'));
        var grid = h('div.err-grid'), cardMap = {};
        C.errors.forEach(function (e) {
          var note = PROC[e.noteId];
          var card = h('div.err-card' + ((S.done || {})[e.id] ? '.done' : ''),
            h('div.err-name', ((S.done || {})[e.id] ? '✓ ' : '') + e.name),
            note ? h('div.err-note', { html: '<b>规范：</b>' + M.tex(note.how) + (note.why ? '<div class="st-why">理由：' + M.tex(note.why) + '</div>' : '') }) : null,
            h('button.btn.primary.sm', { type: 'button', onclick: function () { openTry(e.id); } }, '试一试'));
          cardMap[e.id] = card; grid.appendChild(card);
        });
        ML.bus.on('try:done', function (id) {
          var card = cardMap[id]; if (!card || card.classList.contains('done')) return;
          card.classList.add('done');
          var nm = ML.$('.err-name', card); if (nm && nm.textContent.indexOf('✓ ') !== 0) nm.textContent = '✓ ' + nm.textContent;
        });
        wrap.appendChild(grid);
        wrap.appendChild(h('h2.diag-h', 'B. 结果反推'));
        wrap.appendChild(h('p.muted', '看一个读错了的答案，判断原因后去实验台再读一次。'));
        var rev = h('div.rev'); wrap.appendChild(rev);
        ML.Reverse(rev, C.reverse, adapter);
      } },
      { id: 'paper', label: '练·真题', mount: function (el) { new ML.Paper(el, Q, { title: C.title + ' · 真题训练', onReplay: adapter.replay }); } }
    ]
  });
  shell.go(S.tab);
  ML.perf.probe();
  ML.m00 = { bench: function () { return bench; }, adapter: adapter, shell: shell };
})(window.ML);

</script>
</body>
</html>
