<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：验证动量守恒定律</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);transition:transform .2s;display:grid;grid-template-columns:repeat(4,72px);gap:6px;background:#E9EEF5;padding:10px;border-radius:18px 18px 0 0;z-index:70;box-shadow:0 -4px 18px rgba(16,35,63,.15)}
.ml-keypad.show{transform:translate(-50%,0)}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M08 scene.css — 验证动量守恒定律实验台、讲解小部件、诊断页与 1016×563 适配 */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 28px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:8px 14px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 344px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(64vh,520px);min-height:350px;background:#EAF1F8;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;height:min(64vh,520px);min-height:350px;display:flex;flex-direction:column;overflow-y:auto;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:7px 0 4px}
.side-k:first-child{margin-top:0}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:5px 0}
.side-l{font-size:12.5px;color:var(--ink2);min-width:56px;font-weight:600}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 6px}
.side-acts .btn{min-height:40px;padding:0 10px;font-size:13.5px}
.side-acts .btn.sm{grid-column:span 2;min-height:32px;font-size:12.5px}
.side-tip{font-size:12.5px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:7px 10px;margin:4px 0}
.res-card{background:#F6F9FD;border:1px solid var(--line);border-radius:var(--rs);padding:7px 10px;margin:5px 0;font-size:12.5px;line-height:1.55}
.res-card.ok{background:#EEF9F4;border-color:#BCE6D2}
.res-card.warn{background:#FFF8EC;border-color:#F3D3A1}
.res-card.bad{background:#FFF4F5;border-color:#F2BFC8}
.res-row{display:flex;justify-content:space-between;gap:6px}
.res-badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700;margin-top:3px}
.res-badge.ok{background:#DCF4EA;color:#17784F}
.res-badge.bad{background:#FDECEF;color:var(--err)}
.steps{padding-left:20px;margin:4px 0 0;flex:1 1 auto;min-height:76px;overflow-y:auto}
.steps li{margin-bottom:7px;font-size:13.5px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12.5px}
.st-why{color:var(--ink2);font-size:11.5px;margin-top:2px;line-height:1.35}
.link.sm{font-size:12.5px;min-height:32px;padding:2px 0}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.muted{color:var(--ink2);font-size:13px}

/* 学·原理小部件与对比图 */
.learn-widget{margin-top:12px}
.m08-w-stage{position:relative;height:185px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0;background:#F8FBFF}
.m08-w-stage.tall{height:220px}
.cmp-note{font-size:14px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-stage{position:relative;height:165px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:#F8FBFF;margin:6px 0}
.cmp-table{width:100%}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-table th.bad{color:var(--err)}
.range-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13.5px}
.range-row input[type=range]{flex:1;accent-color:var(--blue);min-height:32px}
.gauge-modal-card{width:min(780px,100%)}

/* 诊·误差 */
.diag{max-width:1180px;margin:0 auto;padding:16px}
.diag-h{font-size:19px;margin:14px 0 4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}
.err-card{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.err-card.done{border-color:#BCE6D2}
.err-name{font-weight:700}
.err-note{font-size:13px;color:var(--ink2);flex:1}
.err-card .btn{align-self:flex-start}
.rev-stage{position:relative;height:136px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:#FBFAF5;margin:6px 0}

@media (max-width:900px),(orientation:portrait){
  .bench-row{grid-template-columns:1fr}
  .bench-stage{height:min(48vh,68vw);min-height:280px}
  .bench-side{height:auto;min-height:0;overflow:visible}
  .steps{overflow:visible}
}

@media (max-height:640px) and (orientation:landscape) and (min-width:901px){
  .bench{padding:5px 10px 6px}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m08","title":"实验：验证动量守恒定律","sub":"人教版 选择性必修第一册 第一章 4","chapter":"选择性必修第一册 第一章 4","methods":["斜槽平抛水平射程代速度","画最小圆找圆心取平均落点","气垫导轨 + 双光电门测速","双摆弦长代速度"],"learn":[{"id":"L1","title":"动量守恒的验证思路","widget":"momentum-bars","html":"<p><b>实验目的：<\/b>研究两个物体在一维碰撞（或反冲弹开）过程中，系统总动量是否保持不变。<\/p>","steps":["设两物体质量分别为 m₁、m₂，碰撞前速度为 v₁、v₂，碰撞后速度为 v₁′、v₂′，需验证：<b>m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′<\/b>。","动量是<b>矢量<\/b>：必须先选定正方向；若物体碰后反向（如双摆反弹），速度代<b>负值<\/b>。","实验成立条件：系统所受合外力为零，或碰撞瞬间内力远大于外力（如斜槽碰撞中球离开槽口后外力不参与碰撞瞬间）。","实验测量归结为测<b>质量<\/b>（天平/电子秤）和测<b>碰撞前后的速度<\/b>（有多种巧妙替代测速法）。"]},{"id":"L2","title":"三套测速方案总览","widget":"schemes-demo","html":"<p>不必直接测出 m/s 的绝对速度值，只要找到与速度成正比的易测物理量，就能在等式两边消去比例系数。<\/p>","steps":["<b>方案一（斜槽平抛落地法）<\/b>：两球从同一高度水平飞出，飞行时间 t 相等，由 x = v·t 得 v ∝ x，验证式化为 <b>m₁·OP = m₁·OM + m₂·ON<\/b>。","<b>方案二（气垫导轨 + 双光电门）<\/b>：导轨调平后几乎无阻力，由遮光片宽度 d 和挡光时间 Δt 得 v = {{frac|d|Δt}}；若两滑块弹簧弹开，验证 <b>m₁{{frac|d₁|Δt₁}} − m₂{{frac|d₂|Δt₂}} = 0<\/b>。","<b>方案三（双摆碰撞法）<\/b>：等长轻绳 L 悬挂等径两球，摆起弦长 l 满足 2Lh = l²，由动能定理 v = {{sqrt|2gh}} = l{{sqrt|{{frac|g|L}}}} ∝ l；若球 1 反弹，验证 <b>m·l₁ = −m·l₂ + M·l₃<\/b>。"]},{"id":"L3","title":"为什么要求 m₁ > m₂ 与等大对心","widget":"mass-ratio","html":"<p>斜槽碰撞中，入射球与被碰球必须<b>半径相同<\/b>，且入射球质量 <b>m₁ > m₂<\/b>。<\/p>","steps":["两球半径相等且放在斜槽水平末端，能保证碰撞瞬间球心在同一水平线上，实现<b>一维对心正碰<\/b>。","由弹性碰撞公式 v₁′ = {{frac|m₁ − m₂|m₁ + m₂}}v₀：若 <b>m₁ > m₂<\/b>，则 v₁′ > 0，入射球碰后<b>继续向前飞出<\/b>。","若误选 <b>m₁ < m₂<\/b>，则 v₁′ < 0，入射球碰后会<b>向后反弹滚回斜槽<\/b>，在斜槽上因摩擦损失机械能后再滚下，出槽速度严重失真。","<b>斜槽是否必须光滑？<\/b>——不需要！只要每次把入射球从<b>同一位置 S 由静止释放<\/b>，克服摩擦做的功相同，每次到达末端的初速度 v₀ 就相同。"]},{"id":"L4","title":"末端水平与“画最小圆找圆心”","widget":"circle-demo","html":"<p>即使同一位置释放，各次落点仍会有微小散布，需用几何平均法消除偶然误差。<\/p>","steps":["<b>斜槽末端必须水平<\/b>（检验方法：把小球轻放在末端，若不滚动即水平）。末端水平才能保证平抛运动初速度水平、各次下落时间 t 相等，从而无需测量桌面高度 H 和飞行时间 t。","<b>重垂线定 O 点<\/b>：记下斜槽末端在白纸上的垂直投影点 O，复写纸扣在白纸上记录撞击点迹（实验过程中白纸位置不能移动）。","<b>平均落点定位<\/b>：分别不放被碰球、放被碰球各重复实验约 10 次，用圆规<b>画一个尽可能小的圆把各个落点圈住<\/b>，这个圆的<b>圆心<\/b>即为平均落点（P、M、N）。"]},{"id":"L5","title":"弹性碰撞的附加判据与动能比","widget":"elastic-check","html":"<p>验证动量守恒之后，常进一步检验这次碰撞是不是<b>弹性碰撞<\/b>（机械能是否守恒）。<\/p>","steps":["联立动量守恒 m₁v₀ = m₁v₁′ + m₂v₂′ 与动能守恒 {{frac|1|2}}m₁v₀² = {{frac|1|2}}m₁v₁′² + {{frac|1|2}}m₂v₂′²，两式相除消去质量得：<b>v₀ + v₁′ = v₂′<\/b>。","在斜槽实验中乘以相同飞行时间 t，即得弹性碰撞附加判据：<b>OP + OM = ON<\/b>（或写为 OP + OM − ON = 0），这一关系与两球质量比无关。","若两球（或两小车）<b>质量相等<\/b>且为弹性正碰，两物体交换速度，即 v₁′ = 0、v₂′ = v₀；用同一光电门或等宽遮光片测速时表现为 <b>t₂ = t₁<\/b>。","若两物体粘连在一起（完全非弹性碰撞），碰后共同速度 v = {{frac|m₁|m₁ + m₂}}v₀，总动能与碰前动能之比为 <b>{{frac|Eₖ′|Eₖ₀}} = {{frac|m₁|m₁ + m₂}}<\/b>。"]},{"id":"L6","title":"气垫导轨调平与遮光片读数","widget":"gauge-preview","html":"<p>气垫导轨利用气孔喷气托起滑块大幅减小阻力，但仍需先调水平并精确测出遮光片宽度 d。<\/p>","steps":["<b>导轨调平检验<\/b>：接通气源，轻推单个滑块，若滑块先后通过两个光电门的<b>遮光时间相等（Δt₁ = Δt₂）<\/b>，说明滑块做匀速直线运动，导轨已调水平。","若由右向左运动时 Δt<sub>A<\/sub> < Δt<sub>B<\/sub>，说明小车向左减速（重力下滑分力小于阻力或左端偏高），应<b>调高右端<\/b>（或调低左端）。","<b>遮光片宽度测量<\/b>：常用 10/20/50 分度游标卡尺（<b>不估读<\/b>，精度分别为 0.1/0.05/0.02 mm）或螺旋测微器（<b>估读到 0.001 mm<\/b>）测量宽度 d；遮光片越窄，{{frac|d|Δt}} 越接近瞬时速度。"]}],"equipment":[{"id":"chute","name":"斜槽与重垂线","html":"斜槽固定在水平桌边，安装时须调整<b>末端切线水平<\/b>（小球轻放末端不滚动）。重垂线挂在斜槽末端，其尖端在白纸上的垂直投影即射程测量起点 O。"},{"id":"balls","name":"等大碰撞小球","html":"入射球与被碰球必须<b>直径（半径）相等<\/b>，以保证发生一维对心正碰；同时须满足 <b>m₁ > m₂<\/b>（如 45 g 钢球撞 15 g 硬铝球），防止入射球碰后反弹回滚。"},{"id":"paper","name":"白纸、复写纸与刻度尺","html":"白纸固定在水平木板/地面上（实验中不得移动），上方盖复写纸记录球落点印迹。用圆规画最小圆找圆心定 P、M、N，再用毫米刻度尺（估读到 0.1 mm）测 OP、OM、ON。"},{"id":"airtrack","name":"气垫导轨与双滑块","html":"导轨通气后形成空气膜使滑块接近无摩擦滑动，底脚螺母用于调平。滑块可配弹性碰撞片、尼龙粘扣或压缩弹簧与细线，分别实现弹性碰、完全非弹性碰和反冲弹开。"},{"id":"photogate","name":"光电门与数字计时器","html":"遮光片挡住光束期间计时器计时，测得挡光时间 Δt（精度达 0.01 ms），由 v = {{frac|d|Δt}} 算出滑块经过光电门时的瞬时速度。"},{"id":"caliper_mic","name":"游标卡尺 / 螺旋测微器与天平","html":"天平（电子秤）测两球或两滑块质量；游标卡尺（不估读）或螺旋测微器（估读到 0.001 mm）精确测量小球直径与遮光片宽度 d。"}],"procedure":[{"id":"P1","title":"调节斜槽末端水平","how":"固定斜槽，把小球轻放在斜槽水平段末端，能静止不动即末端水平。","why":"保证小球离开槽口做平抛运动，各次下落时间 t 相等，水平射程正比于速度。","errorId":"E3"},{"id":"P2","title":"铺纸并用重垂线定 O 点","how":"木板上固定白纸与复写纸，用重垂线标出槽口末端投影点 O（无需测桌面高度 H）。","why":"所有射程从同一参考点 O 量起；飞行时间 t 在动量等式两边消去，不必测 H 与 t。","errorId":"E6"},{"id":"P3","title":"选定等大且 m₁ > m₂ 的两球","how":"用天平测质量，选半径相同、质量较大的球作入射球 m₁，质量较小的作被碰球 m₂。","why":"半径相同保证对心正碰；m₁ > m₂ 防止入射球碰后反弹回滚导致落点失真。","errorId":"E1"},{"id":"P4","title":"同一位置静止释放，打 P 点簇","how":"不放被碰球，每次让 m₁ 从斜槽同一位置 S 由静止释放，连打 10 次记录落点。","why":"保证每次碰撞前初速度 v₀ 相同，减少斜槽摩擦和释放高度引起的散布误差。","errorId":"E2"},{"id":"P5","title":"放被碰球于末端，打 M、N 点簇","how":"把 m₂ 静置于斜槽末端，再将 m₁ 从同一位置 S 静止释放发生正碰，重复 10 次记录。","why":"使碰前初速度与单独滑落时完全一致，在同一张白纸上记录碰后两球落点。","errorId":"E2"},{"id":"P6","title":"画最小圆定圆心并测 OP、OM、ON","how":"分别用尽量小的圆把 P、M、N 点簇圈住，取圆心为平均落点，测出 OP、OM、ON 检验 m₁·OP = m₁·OM + m₂·ON。","why":"用最小圆圆心代替单次落点可显著减小偶然误差，并可同时用 OP + OM = ON 检验弹性碰撞。","errorId":"E4"},{"id":"P7","title":"（气垫导轨）调水平使两门时间相等","how":"接通气源，调节底脚螺母，轻推单滑块通过两光电门，直至 Δt₁ ≈ Δt₂。","why":"消除重力沿导轨的分力，保证两滑块在水平方向合外力近似为零。","errorId":"E5"},{"id":"P8","title":"（气垫导轨）测 d、Δt 并比对动量与动能","how":"用游标卡尺或螺旋测微器测遮光片宽度 d，运行碰撞或弹簧弹开后读出 Δt₁、Δt₂，验证动量守恒与能量关系。","why":"利用 v = d/Δt 将挡光时间转换为速度，定量检验弹性、粘连与反冲过程中的动量守恒。","errorId":"E5"}],"errors":[{"id":"E1","name":"入射球质量小于被碰球（m₁ < m₂）","noteId":"P3","trigger":"入射球选 15 g 硬铝球，被碰球选 45 g 钢球（m₁ < m₂）","config":{"scheme":"chute","m1":0.015,"m2":0.045,"e":0.98},"observe":"观察入射球碰后的运动轨迹以及白纸上 M 点的落点位置。","consequence":"入射球碰后瞬间速度 v₁′ < 0，<b>先向后反弹滚回斜槽<\/b>再二次滚落；测出的 m₁·OM + m₂·ON 与 m₁·OP <b>严重不相等<\/b>（偏差超 30%）。","ask":{"stem":"为什么实验中要求入射球质量 m₁ 大于被碰球质量 m₂？","options":["保证两球下落高度相同","防止入射球碰后反弹回滚，使碰后两球都向前运动","减小空气阻力","使斜槽轨道更加光滑"],"answer":1,"quizId":"M08:try:E1"},"why":"由弹性碰撞公式 v₁′ = {{frac|m₁ − m₂|m₁ + m₂}}v₀ 可知，当 m₁ < m₂ 时 v₁′ < 0，入射球反弹回滚斜槽，摩擦损耗加上二次滑落导致落点不再反映碰撞瞬间速度。","questionIds":["Q1","Q2"]},{"id":"E2","name":"每次释放位置不固定","noteId":"P4","trigger":"开启“释放位置不固定”，在 S 点上下起伏释放各打 10 发","config":{"scheme":"chute","releaseJitter":true},"observe":"比较两种情况下白纸上落点簇圈出的“最小圆”半径大小。","consequence":"每次初速度 v₀ 起伏约 ±10%，白纸上 P、M、N 三个点簇拉成一条长带，最小圆半径增大到正常情况的 <b>5 倍以上<\/b>，误差剧增。","ask":{"stem":"实验中斜槽表面不必绝对光滑，但必须每次从同一位置由静止释放，原因是？","options":["保证每次到达斜槽末端的初速度 v₀ 相同","保证两球质量相等","减小平抛运动飞行时间","避免小球相互碰撞"],"answer":0,"quizId":"M08:try:E2"},"why":"只要释放高度和初始静止状态固定，小球沿斜槽滑下时重力做功和摩擦损耗每次相同，从而保证碰撞前初速度 v₀ 恒定，不放与放被碰球两组数据才具有同一基准。","questionIds":["Q5"]},{"id":"E3","name":"斜槽末端不水平","noteId":"P1","trigger":"斜槽末端上翘 +18°（非弹性 e = 0.75，未调至水平）","config":{"scheme":"chute","e":0.75,"tiltDeg":18},"observe":"观察三束抛物线飞行时间与射程比值的变化，比较验证等式偏差。","consequence":"末端上翘 +18° 时，速度越大的球飞得越高、滞空时间越长（t<sub>N<\/sub> > t<sub>P<\/sub> > t<sub>M<\/sub>），水平位移不再正比于速度，m₁·OM + m₂·ON 明显偏离 m₁·OP。","ask":{"stem":"斜槽末端上翘时，为什么不能再用水平射程 OP、OM、ON 直接代替速度？","options":["因为各球在斜槽上释放高度变了","因为速度不同导致平抛/斜抛的空中飞行时间 t 不相等","因为重力加速度会变化","因为两球半径不再相等"],"answer":1,"quizId":"M08:try:E3"},"why":"仅当斜槽末端水平（竖直初速度 v<sub>y0<\/sub> = 0）时，飞行时间 t = {{sqrt|{{frac|2H|g}}}} 与水平初速度无关、三球等时。末端倾斜时 t 依赖出槽速度大小，时间因子无法在等式两边消去。","questionIds":["Q2","Q5"]},{"id":"E4","name":"只做 1 次实验不画最小圆取平均","noteId":"P6","trigger":"对比 20 组实验中“只打 1 次单点测量”与“10 发画最小圆取圆心”的偏差","config":{"scheme":"chute","singleShot":true},"observe":"比较两种处理方法在 20 次实验中的动量验证相对偏差分布。","consequence":"单次落点受释放抖动与桌面微振影响，相对偏差波动大幅升高（标准差约扩大 3 倍），个别组偏差甚至超过误差允许范围。","ask":{"stem":"关于用“画最小圆找圆心”确定平均落点，下列说法正确的是？","options":["只圈出最密集的那 3 个点即可","用尽可能小的圆把各个落点圈住，圆心代表平均落点","选距离 O 点最远的落点作为平均落点","把所有落点连成折线取端点"],"answer":1,"quizId":"M08:try:E4"},"why":"多次重复同一实验时，随机因素使落点围绕真实平均位置呈对称散布。画尽量小的圆把各落点圈住，圆心兼顾了所有落点的几何中心，能有效压低偶然误差（约 1/{{sqrt|n}}）。","questionIds":["Q2"]},{"id":"E5","name":"气垫导轨未调水平","noteId":"P7","trigger":"气垫导轨向右上方倾斜 +1.35°（左低右高）","config":{"scheme":"airtrack","tiltDeg":1.35},"observe":"先看单滑块通过两光电门的挡光时间，再看弹簧弹开或碰撞前后动量偏差。","consequence":"单滑块向右运动越走越慢（例如左门 Δt₁ = 13.56 ms、右门 Δt₂ = 17.90 ms）；导轨倾角使滑块受重力分力，两侧测得动量不再相等。","ask":{"stem":"若滑块由右向左通过光电门 A、B 的挡光时间分别为 13.56 ms 和 17.90 ms，应调高导轨的哪一端？","options":["调高左端","调高右端","两端同时垫高","无需调整"],"answer":1,"quizId":"M08:try:E5"},"why":"Δt<sub>A<\/sub> < Δt<sub>B<\/sub> 说明滑块从右向左运动时速度减小（做减速运动），即阻力大于重力下滑分力，因此应适当<b>调高右端<\/b>，增大重力沿左方向的分力直至 Δt<sub>A<\/sub> = Δt<sub>B<\/sub>。","questionIds":["Q4","Q6"]},{"id":"E6","name":"误区：必须测下落高度 H 和飞行时间 t？","noteId":"P2","trigger":"比较桌面高度 H = 0.50 m 与 H = 0.80 m 两种情况下的射程与验证偏差","config":{"scheme":"chute","compareH":true},"observe":"观察改变桌面高度 H 后，OP、OM、ON 与左右两边动量比值是否改变。","consequence":"H 增大后 OP、OM、ON 按相同比例 {{sqrt|H₂/H₁}} 放大，但 {{frac|m₁·OM + m₂·ON|m₁·OP}} 始终等于 1（不依赖 H 与 t）。","ask":{"stem":"用斜槽平抛法验证动量守恒时，是否必须用刻度尺测出桌面高度 H 或用停表测飞行时间 t？","options":["必须测 H，才能算出平抛时间 t","必须用停表测出每次飞行的精确时间 t","不需要测 H 和 t，因为各球时间 t 相等，在等式两边恰好消去","只有弹性碰撞时不需要，非弹性碰撞需要"],"answer":2,"quizId":"M08:try:E6"},"why":"只要斜槽末端水平、下落高度相同，各球空中飞行时间 t 相等。把 v = x/t 代入 m₁v₀ = m₁v₁′ + m₂v₂′ 后，两边同乘 t 即可直接得到 m₁·OP = m₁·OM + m₂·ON，不必测 H 或 t。","questionIds":["Q1"]}],"reverse":[{"id":"R1","stem":"某同学做斜槽碰撞实验，固定 S 释放并画出最小圆后得到如下落点与数据（m₁ = 15 g，m₂ = 45 g），发现入射球 M 点落点紊乱且 m₁·OM + m₂·ON 与 m₁·OP 相差逾 35%。最可能的操作失误是？","show":{"type":"chute-bad","config":{"m1":0.015,"m2":0.045,"e":0.98}},"options":["入射球质量小于被碰球（m₁ < m₂），碰后发生反弹","白纸与复写纸叠放顺序反了","没有测量桌面高度 H","没有使用电磁打点计时器"],"answer":[0],"replay":"E1","why":"当 m₁ < m₂ 时入射球碰后速度反向，滚回斜槽后再滑出，运动轨迹失真、M 点极不正常且不再满足 m₁·OP = m₁·OM + m₂·ON。","quizId":"M08:reverse:R1"},{"id":"R2","stem":"某小组利用光电门 A（在右）和 B（在左）调节轨道水平：让装有遮光片的小车以一定初速度由右向左运动，测得经过 A、B 的挡光时间分别为 13.56 ms 和 17.90 ms。为使两门遮光时间相等，应如何调节轨道？","show":{"type":"gate-tilt","dtA":13.56,"dtB":17.9},"options":["调高轨道左端","调高轨道右端","换用更宽的遮光片","增大滑块质量"],"answer":[1],"replay":"E5","why":"小车由右向左先后经过 A、B，时间从 13.56 ms 变大到 17.90 ms，说明速度在减小（左高右低或阻力偏大），应调高轨道右端使重力下滑分力平衡阻力。","quizId":"M08:reverse:R2"},{"id":"R3","stem":"某同学在斜槽实验中测得 m₁ = 45 g，m₂ = 15 g，平均落点到 O 点距离分别为 OP = 47.9 cm、OM = 24.0 cm、ON = 71.9 cm。仅从这三个距离关系就能判断这次碰撞接近弹性碰撞的依据是？","show":{"type":"elastic-dots","OP":47.9,"OM":24.0,"ON":71.9},"options":["OP = OM + ON","OP + OM = ON","OP² = OM² + ON²","OM = ON"],"answer":[1],"replay":null,"why":"由弹性碰撞动量守恒与动能守恒可推得 v₀ + v₁′ = v₂′，飞行时间相同下即 OP + OM = ON（本题 47.9 + 24.0 = 71.9 cm）。","quizId":"M08:reverse:R3"},{"id":"R4","stem":"在水平气垫导轨上，质量为 m₁ 的滑块以速度 v₀ 撞向静止的质量为 m₂ 的滑块，两滑块上的尼龙粘扣使其粘在一起共同运动。碰后两滑块总动能与碰前总动能之比为？","show":{"type":"inelastic-bar","m1":200,"m2":100},"options":["{{frac|m₂|m₁ + m₂}}","{{frac|m₁|m₁ + m₂}}","({{frac|m₁|m₁ + m₂}})²","{{frac|m₁ − m₂|m₁ + m₂}}"],"answer":[1],"replay":null,"why":"由动量守恒 m₁v₀ = (m₁ + m₂)v 得 v = {{frac|m₁|m₁ + m₂}}v₀，故 {{frac|Eₖ′|Eₖ₀}} = {{frac|{{frac|1|2}}(m₁ + m₂)v²|{{frac|1|2}}m₁v₀²}} = {{frac|m₁|m₁ + m₂}}。","quizId":"M08:reverse:R4"}],"summary":{"principle":"一维碰撞/反冲：<b>m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′<\/b>。<br>① 斜槽平抛（等高飞行时间相等）：<b>m₁·OP = m₁·OM + m₂·ON<\/b>（弹性碰撞附加判据：<b>OP + OM = ON<\/b>）；<br>② 气垫导轨光电门（v = {{frac|d|Δt}}）：弹开 <b>m₁{{frac|d₁|Δt₁}} − m₂{{frac|d₂|Δt₂}} = 0<\/b>；<br>③ 双摆弦长（v ∝ l）：<b>m·l₁ = −m·l₂ + M·l₃<\/b>。","steps":["斜槽：末端调水平 → 挂重垂线定 O → 选等大且 m₁ > m₂ 的两球","不放被碰球，同一位置 S 静止释放 10 次记录 P 点簇","放被碰球于槽口末端，同一位置 S 静止释放 10 次记录 M、N 点簇","画最小圆找圆心定 P、M、N，测 OP、OM、ON 验证等式","气垫导轨：先调水平（单滑块两门 Δt 相等），测 d 与 Δt 比对动量与动能"],"notes":[{"do":"斜槽末端必须水平","why":"保证各球做平抛且飞行时间相等，射程才正比于速度"},{"do":"入射球质量大于被碰球（m₁ > m₂）且两球等径","why":"等径保证对心正碰；m₁ > m₂ 防止入射球碰后反弹回滚"},{"do":"每次从同一位置由静止释放（斜槽不须光滑）","why":"保证每次碰撞前初速度 v₀ 一致"},{"do":"画尽量小的圆圈住落点，圆心为平均落点","why":"综合多次数据减小偶然误差"},{"do":"气垫导轨先调水平，使 Δt₁ = Δt₂","why":"确保水平方向合外力为零"},{"do":"不需要测桌面高度 H 与时间 t","why":"相同时间 t 在等式两边约去"}],"errors":["m₁ < m₂ 导致入射球反弹回滚，M 点失真","释放位置不固定，落点簇分散、最小圆半径大增","斜槽末端不水平，飞行时间不等，x ∝ v 失效","导轨未调平，重力分力做功导致前后动量不等"],"conclusions":["弹性碰撞与质量无关判据：<b>OP + OM = ON<\/b>（等质量光电门：<b>t₂ = t₁<\/b>）","粘连完全非弹性碰撞动能比：<b>{{frac|Eₖ′|Eₖ₀}} = {{frac|m₁|m₁ + m₂}}<\/b>","双摆弦长代速度：h = {{frac|l²|2L}} ⇒ v ∝ l，反弹取负","多组改 m₂ 化曲为直（2026 甘肃）：以 m₂ 为横轴、{{frac|OA − OB|OC}} 为纵轴呈直线"]}}</script>
<script type="application/json" id="ml-questions">[{"id":"Q1","source":"2024·新课标卷·第22题","verified":true,"score":6,"stem":"某同学用如图所示的装置验证动量守恒定律。将斜槽轨道固定在水平桌面上，轨道末段水平，右侧端点在水平木板上的垂直投影为 O，木板上叠放着白纸和复写纸。实验时先将小球 a 从斜槽轨道上 Q 处由静止释放，a 从轨道右端水平飞出后落在木板上；重复多次，测出落点的平均位置 P 与 O 点的距离 x<sub>P<\/sub>。将与 a 半径相等的小球 b 置于轨道右侧端点，再将小球 a 从 Q 处由静止释放，两球碰撞后均落在木板上；重复多次，分别测出 a、b 两球落点的平均位置 M、N 与 O 点的距离 x<sub>M<\/sub>、x<sub>N<\/sub>。<svg viewBox=\"0 0 540 190\" width=\"540\" role=\"img\" aria-label=\"2024新课标卷第22题实验装置图\"><line x1=\"20\" y1=\"160\" x2=\"520\" y2=\"160\" stroke=\"#10233F\" stroke-width=\"2\"/><g stroke=\"#4A5B73\" stroke-width=\"1.2\"><line x1=\"32\" y1=\"160\" x2=\"24\" y2=\"168\"/><line x1=\"56\" y1=\"160\" x2=\"48\" y2=\"168\"/><line x1=\"80\" y1=\"160\" x2=\"72\" y2=\"168\"/><line x1=\"104\" y1=\"160\" x2=\"96\" y2=\"168\"/><line x1=\"128\" y1=\"160\" x2=\"120\" y2=\"168\"/><line x1=\"152\" y1=\"160\" x2=\"144\" y2=\"168\"/><line x1=\"176\" y1=\"160\" x2=\"168\" y2=\"168\"/><line x1=\"200\" y1=\"160\" x2=\"192\" y2=\"168\"/><line x1=\"224\" y1=\"160\" x2=\"216\" y2=\"168\"/><line x1=\"248\" y1=\"160\" x2=\"240\" y2=\"168\"/><line x1=\"272\" y1=\"160\" x2=\"264\" y2=\"168\"/><line x1=\"296\" y1=\"160\" x2=\"288\" y2=\"168\"/><line x1=\"320\" y1=\"160\" x2=\"312\" y2=\"168\"/><line x1=\"344\" y1=\"160\" x2=\"336\" y2=\"168\"/><line x1=\"368\" y1=\"160\" x2=\"360\" y2=\"168\"/><line x1=\"392\" y1=\"160\" x2=\"384\" y2=\"168\"/><line x1=\"416\" y1=\"160\" x2=\"408\" y2=\"168\"/><line x1=\"440\" y1=\"160\" x2=\"432\" y2=\"168\"/><line x1=\"464\" y1=\"160\" x2=\"456\" y2=\"168\"/><line x1=\"488\" y1=\"160\" x2=\"480\" y2=\"168\"/><line x1=\"512\" y1=\"160\" x2=\"504\" y2=\"168\"/><\/g><rect x=\"30\" y=\"84\" width=\"150\" height=\"8\" fill=\"#C9D1D9\" stroke=\"#10233F\"/><rect x=\"125\" y=\"92\" width=\"12\" height=\"68\" fill=\"#8E99A6\" stroke=\"#10233F\"/><rect x=\"48\" y=\"76\" width=\"156\" height=\"8\" fill=\"#D9B98C\" stroke=\"#10233F\"/><path d=\"M62 24 L132 76 H204\" fill=\"none\" （保留 2 位有效数字）；","unit":"s","answer":1.0,"tol":0.05,"sig":2,"show":"1.0","explain":"x-t 图像的斜率表示速度，图乙与图丙的斜率都在 t = 1.0 s 时发生突变，说明两滑块在 t = 1.0 s 时发生碰撞。","quizId":"M08:paper:Q3:(1)"},{"label":"(2)","type":"numeric","prompt":"滑块 B 碰撞前的速度大小 v = ____ m/s（保留 2 位有效数字）；","unit":"m/s","answer":0.2,"tol":0.01,"sig":2,"show":"0.20","explain":"由图丙，碰撞前（0～1.0 s）x<sub>B<\/sub> 从 110 cm 减小到 90 cm，速度大小 v = |90 − 110| cm / 1.0 s = 20 cm/s = 0.20 m/s。","quizId":"M08:paper:Q3:(2)"},{"label":"(3)","type":"text-choice","prompt":"通过分析，得出质量为 200.0 g 的滑块是 ____。","options":["A","B"],"answer":1,"explain":"向右为正方向：图乙给出 v<sub>A<\/sub> = (60 − 10)/100 = 0.50 m/s，v<sub>A<\/sub>′ = (110 − 60)/(1.4 × 100) ≈ 0.357 m/s；图丙给出 v<sub>B<\/sub> = 0.20 m/s，v<sub>B<\/sub>′ = (90 − 20)/(1.4 × 100) = 0.50 m/s。由 m<sub>A<\/sub>(v<sub>A<\/sub> − v<sub>A<\/sub>′) = m<sub>B<\/sub>(v<sub>B<\/sub>′ − v<sub>B<\/sub>) 得 m<sub>A<\/sub> / m<sub>B<\/sub> ≈ 0.30 / 0.143 ≈ 2，故质量为 200.0 g（较小者）的滑块是 B。","quizId":"M08:paper:Q3:(3)"}]},{"id":"Q4","source":"2025·广东卷·第11(2)题","verified":true,"stem":"实验小组利用小车碰撞实验测量吸能材料的性能，装置如图所示，图中轨道由轨道甲和乙平滑拼接而成，且轨道乙倾角较大。选取相同的两辆小车，分别安装宽度为 1.00 cm 的遮光条。<svg viewBox=\"0 0 560 138\" width=\"560\" role=\"img\" aria-label=\"2025广东卷第11(2)题实验装置图\"><rect x=\"18\" y=\"96\" width=\"524\" height=\"8\" fill=\"#C9D1D9\" stroke=\"#10233F\"/><rect x=\"94\" y=\"104\" width=\"12\" height=\"26\" fill=\"#8E99A6\" stroke=\"#10233F\"/><rect x=\"456\" y=\"104\" width=\"12\" height=\"26\" fill=\"#8E99A6\" stroke=\"#10233F\"/><polygon points=\"50,92 288,82 288,88 50,96\" fill=\"#DCE4EC\" stroke=\"#10233F\"/><polygon points=\"288,82 512,38 512,44 288,88\" fill=\"#DCE4EC\" stroke=\"#10233F\"/><rect x=\"272\" y=\"88\" width=\"12\" height=\"8\" fill=\"#10233F\"/><rect x=\"296\" y=\"87\" width=\"12\" height=\"9\" fill=\"#10233F\"/><line x1=\"278\" y1=\"96\" x2=\"286\" y2=\"114\" stroke=\"#10233F\"/><line x1=\"302\" y1=\"96\" x2=\"292\" y2=\"114\" stroke=\"#10233F\"/><text x=\"288\" y=\"128\" font-size=\"12\" text-anchor=\"middle\">螺母<\/text><rect x=\"94\" y=\"48\" width=\"12\" height=\"42\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"100\" cy=\"58\" r=\"3.5\" fill=\"#fff\" stroke=\"#10233F\"/><rect x=\"214\" y=\"42\" width=\"12\" height=\"42\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"220\" cy=\"52\" r=\"3.5\" fill=\"#fff\" stroke=\"#10233F\"/><g transform=\"translate(144,58) rotate(-2.4)\"><rect x=\"0\" y=\"0\" width=\"38\" height=\"18\" fill=\"#fff\" stroke=\"#10233F\"/><rect x=\"15\" y=\"-16\" width=\"7\" height=\"16\" fill=\"#E8B89C\" stroke=\"#10233F\"/><circle cx=\"9\" cy=\"22\" r=\"4.5\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"29\" cy=\"22\" r=\"4.5\" fill=\"#fff\" stroke=\"#10233F\"/><\/g><g transform=\"translate(426,22) rotate(-11.5)\"><rect x=\"0\" y=\"0\" width=\"38\" height=\"18\" fill=\"#fff\" stroke=\"#10233F\"/><rect x=\"15\" y=\"-16\" width=\"7\" height=\"16\" fill=\"#E8B89C\" stroke=\"#10233F\"/><circle cx=\"9\" cy=\"22\" r=\"4.5\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"29\" cy=\"22\" r=\"4.5\" fill=\"#fff\" stroke=\"#10233F\"/><\/g><g font-size=\"12\" fill=\"#10233F\" text-anchor=\"middle\"><text x=\"36\" y=\"76\">轨道甲<\/text><text x=\"498\" y=\"28\">轨道乙<\/text><text x=\"96\" y=\"40\">光电门 B<\/text><text x=\"162\" y=\"36\">小车 1<\/text><text x=\"222\" y=\"36\">光电门 A<\/text><text x=\"440\" y=\"14\">小车 2<\/text><text x=\"452\" y=\"72\" font-style=\"italic\">M<\/text><\/g><line x1=\"44\" y1=\"80\" x2=\"66\" y2=\"91\" stroke=\"#10233F\"/><line x1=\"494\" y1=\"31\" x2=\"490\" y2=\"43\" stroke=\"#10233F\"/><\/svg>","parts":[{"label":"①","type":"choice","prompt":"调节螺母使轨道甲、乙连接处适当升高。将小车在轨道乙上释放，若测得小车通过光电门 A 和 B 的 ____，证明已平衡小车在轨道甲上所受摩擦力及其他阻力。","options":["时间相等","时间之和恒定","时间成反比","时间差等于零点误差"],"answer":0,"replay":"E5","explain":"小车两遮光条等宽，通过光电门 A 和 B 的时间相等，表明小车在轨道甲上做匀速直线运动，摩擦力及其他阻力已被重力分力平衡。","quizId":"M08:paper:Q4:①"},{"label":"②","type":"text-choice","prompt":"先将小车 1 静置于光电门 A 和 B 中间，再将小车 2 在 M 点由静止释放，测得小车 2 通过光电门 A 的时间为 t₂，碰撞后小车 1 通过光电门 B 的时间为 t₁。若 t₂ ____ t₁，可将两小车的碰撞视为弹性碰撞。","options":[">","=","<"],"answer":1,"explain":"两小车质量相等，发生一维弹性正碰时交换速度，即碰后小车 1 获得小车 2 碰前的全部速度、小车 2 停下，故 t₂ = t₁。","quizId":"M08:paper:Q4:②"},{"label":"③","type":"numeric","prompt":"将吸能材料紧贴于小车 2 前端重复步骤。测得小车 2 通过光电门 A 的时间为 10.00 ms，两车碰撞后依次测得小车 1 和 2 通过光电门 B 的时间分别为 15.00 ms、30.00 ms，不计吸能材料的质量，碰撞后两小车总动能与碰撞前小车 2 动能的比值为 ____（保留 2 位有效数字）。","answer":0.56,"tol":0.01,"sig":2,"show":"0.56","explain":"因两车质量与遮光条宽度相同，动能 Eₖ ∝ v² ∝ 1/t²。比值 η = {{frac|(1/15.00)² + (1/30.00)²|(1/10.00)²}} = ({{frac|10|15}})² + ({{frac|10|30}})² = {{frac|4|9}} + {{frac|1|9}} = {{frac|5|9}} ≈ 0.56。","quizId":"M08:paper:Q4:③"}]},{"id":"Q5","source":"2026·甘肃卷·第11题","verified":true,"stem":"某实验小组用如图所示的装置验证动量守恒定律。实验前在水平底板上铺白纸和复写纸，记下重垂线所指位置 O。先将入射小球 m₁ 从斜槽轨道 S 处由静止释放，重复实验找到落点中心位置 A；再将被碰小球 m₂ 静置于斜槽轨道末端，将 m₁ 从 S 处由静止释放与之碰撞，分别找到 m₁ 和 m₂ 相碰后落点的中心位置 B 和 C，测出 O 点到各落点中心的距离 OA、OB 和 OC。<svg viewBox=\"0 0 460 185\" width=\"460\" role=\"img\" aria-label=\"2026甘肃卷第11题实验装置图\"><rect x=\"128\" y=\"22\" width=\"280\" height=\"118\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.4\"/><polygon points=\"128,140 408,140 434,174 108,174\" fill=\"#FBFAF5\" stroke=\"#10233F\" stroke-width=\"1.5\"/><rect x=\"108\" y=\"174\" width=\"326\" height=\"8\" fill=\"#DCE4EC\" stroke=\"#10233F\"/><path d=\"M16 30 L88 86 H172\" fill=\"none\" stroke=\"#10233F\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M16 30 L88 86 H172\" fill=\"none\" stroke=\"#fff\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"20\" y1=\"14\" x2=\"12\" y2=\"24\" stroke=\"#10233F\" stroke-width=\"1.6\"/><circle cx=\"34\" cy=\"32\" r=\"9\" fill=\"#E8B89C\" stroke=\"#10233F\"/><circle cx=\"170\" cy=\"75\" r=\"9\" fill=\"#E8B89C\" stroke=\"#10233F\" stroke-dasharray=\"3 2\"/><line x1=\"172\" y1=\"86\" x2=\"172\" y2=\"148\" stroke=\"#10233F\" stroke-width=\"1.2\"/><polygon points=\"172,150 168,142 176,142\" fill=\"#10233F\"/><circle cx=\"172\" cy=\"155\" r=\"2.8\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"252\" cy=\"155\" r=\"2.8\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"304\" cy=\"155\" r=\"2.8\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"374\" cy=\"155\" r=\"2.8\" fill=\"#fff\" stroke=\"#10233F\"/><circle cx=\"134\" cy=\"166\" r=\"3\" fill=\"#10233F\"/><circle cx=\"416\" cy=\"166\" r=\"3\" fill=\"#10233F\"/><g font-size=\"13\" fill=\"#10233F\" text-anchor=\"middle\"><text x=\"12\" y=\"12\" font-style=\"italic\">S<\/text><text x=\"46\" y=\"48\" font-style=\"italic\">m₁<\/text><text x=\"190\" y=\"68\" font-style=\"italic\">m₂<\/text><text x=\"172\" y=\"171\" font-style=\"italic\">O<\/text><text x=\"252\" y=\"171\" font-style=\"italic\">B<\/text><text x=\"304\" y=\"171\" font-style=\"italic\">A<\/text><text x=\"374\" y=\"171\" font-style=\"italic\">C<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"multi","prompt":"关于实验装置和操作，下列说法正确的是 ____。（多选）","options":["两个小球的材质应相同","两个小球的大小应相等","斜槽轨道表面必须光滑","斜槽轨道末端应调节至水平"],"answer":[1,3],"replay":"E3","explain":"A 错：只要两球半径相等且 m₁ > m₂，材质不必相同（如钢球撞玻璃球或硬铝球）。B 正确：两球等大才能对心正碰。C 错：斜槽不必光滑，只需每次从同一位置静止释放。D 正确：末端水平保证做平抛运动。","quizId":"M08:paper:Q5:(1)"},{"label":"(2)","type":"choice","prompt":"改变被碰小球的质量 m₂，进行多组实验，测出对应的 OB 和 OC 值。以 m₂ 为横坐标，以 ____ 为纵坐标描点，若这些点都近似在一条直线上，则说明动量守恒定律成立。","options":["{{frac|OA − OB|OC}}","{{frac|OC − OB|OB}}","{{frac|OA − OB|OA}}","{{frac|OC − OB|OC}}"],"answer":0,"explain":"动量守恒式为 m₁·OA = m₁·OB + m₂·OC，整理得 {{frac|OA − OB|OC}} = {{frac|1|m₁}}·m₂。保持 m₁ 不变时，{{frac|OA − OB|OC}} 与 m₂ 成正比（线性关系）。","quizId":"M08:paper:Q5:(2)"},{"label":"(3)","type":"numeric","prompt":"若 m₁ = 3m₂，且碰撞近似为弹性碰撞，则 OA 与 OB 的比值应为 ____。","answer":2,"tol":0.05,"show":"2","explain":"弹性碰撞碰后入射球速度 v₁′ = {{frac|m₁ − m₂|m₁ + m₂}}v₀ = {{frac|3 − 1|3 + 1}}v₀ = {{frac|1|2}}v₀，故 OB = {{frac|1|2}}OA，因此 {{frac|OA|OB}} = 2。","quizId":"M08:paper:Q5:(3)"}]},{"id":"Q6","source":"2024·福建卷·第12题（节选·压轴迁移）","verified":true,"stem":"（压轴迁移）某小组基于动量守恒定律测量玩具枪子弹离开枪口的速度大小。所用器材有：玩具枪、玩具子弹、装有挡光片的小车、轨道、光电门 A 和 B、光电计时器、10 分度游标卡尺、电子秤等。先用电子秤分别测出小车质量 M 和子弹质量 m。 xt><text x=\"390\" y=\"92\">0<\/text><\/g><\/svg>","unit":"cm","answer":0.99,"tol":0.005,"sig":2,"show":"0.99","explain":"游标 0 刻线位于主尺 9 mm 与 10 mm 之间（主尺读 9 mm），游标第 9 条刻线与主尺 18 mm 刻线对齐，故 d = 9 mm + 9 × 0.1 mm = 9.9 mm = 0.99 cm（游标卡尺不估读）。","quizId":"M08:paper:Q6:(1)"},{"label":"(2)","type":"text-choice","prompt":"平衡小车沿轨道滑行过程中的阻力：让装有挡光片的小车以一定初速度由右向左先后经过光电门 A 和 B，测得挡光时间分别为 13.56 ms、17.90 ms，则应适当调高轨道的 ____ 端，直至两光电门挡光时间相等。","options":["左","右"],"answer":1,"replay":"E5","explain":"挡光时间 13.56 ms < 17.90 ms，说明小车由右向左运动时速度减小（做减速运动），重力下滑分力不足以克服阻力，故应适当调高轨道<b>右<\/b>端。","quizId":"M08:paper:Q6:(2)"},{"label":"(3)","type":"expr","prompt":"让小车静止在 A 的右侧，枪口靠近小车发射子弹，子弹沿轨道方向射出并粘在小车上，小车向左运动经过光电门 A 的挡光时间为 Δt。则子弹离开枪口的速度大小","lhs":"v =","vars":{"m":"m","M":"M","d":"d","t":"Δt"},"extra":["1","2"],"answer":"(m+M)*d/(m*t)","show":"(m + M)d ÷ (m·Δt)","explain":"子弹与小车碰撞后共同速度 v<sub>车<\/sub> = {{frac|d|Δt}}，由动量守恒 m v = (m + M) v<sub>车<\/sub> 得子弹初速度 v = {{frac|(m + M)d|m·Δt}}。","quizId":"M08:paper:Q6:(3)"}]},{"id":"Q7","source":"2026·福建卷·第12题（动量定理迁移）","verified":true,"stem":"（动量定理迁移）某小组利用如图（a）所示的实验装置验证动量定理。将气垫导轨左端用垫块垫高，测得两光电门中心距离 l = 50.00 cm，两光电门处轨道的高度差 h = 8.00 cm，滑块（含遮光板）质量 m = 200.0 g。<svg viewBox=\"0 0 540 155\" width=\"540\" role=\"img\" aria-label=\"2026福建卷第12题装置图与游标卡尺\"><g transform=\"translate(10,10)\"><line x1=\"8\" y1=\"120\" x2=\"260\" y2=\"120\" stroke=\"#10233F\" stroke-width=\"1.8\"/><rect x=\"18\" y=\"90\" width=\"12\" height=\"30\" fill=\"#8E99A6\" stroke=\"#10233F\"/><g transform=\"translate(14,76) rotate(8.5)\"><rect x=\"0\" y=\"0\" width=\"240\" height=\"14\" fill=\"#DCE4EC\" stroke=\"#10233F\"/><rect x=\"12\" y=\"-16\" width=\"26\" height=\"16\" fill=\"#10233F\"/><rect x=\"24\" y=\"-26\" width=\"3\" height=\"10\" fill=\"#10233F\"/><rect x=\"58\" y=\"-22\" width=\"7\" height=\"22\" fill=\"#3B4B60\"/><rect x=\"148\" y=\"-22\" width=\"7\" height=\"22\" fill=\"#3B4B60\"/><\/g><line x1=\"68\" y1=\"72\" x2=\"156\" y2=\"86\" stroke=\"#1661FF\" stroke-dasharray=\"3 2\"/><line x1=\"68\" y1 "quizId":"M08:paper:Q7:(1)"},{"label":"(2)","type":"expr","prompt":"将滑块移至位置 O 由静止释放，测得通过光电门 1、2 的平均遮光时间分别为 Δt₁ = 10.00 ms、Δt₂ = 6.25 ms（时间间隔 t = 390.00 ms）。滑块从光电门 1 运动到光电门 2 过程中动量变化量大小的表达式（用 m、d、Δt₁、Δt₂ 表示）：","lhs":"Δp =","vars":{"m":"m","d":"d","t1":"Δt₁","t2":"Δt₂"},"extra":["1","2"],"answer":"m*(d/t2-d/t1)","show":"m(d/Δt₂ − d/Δt₁)","explain":"经过光电门 1、2 的速率分别为 v₁ = d/Δt₁、v₂ = d/Δt₂，故动量变化量大小 Δp = m(v₂ − v₁) = m({{frac|d|Δt₂}} − {{frac|d|Δt₁}})。","quizId":"M08:paper:Q7:(2)"},{"label":"(3)","type":"numeric","prompt":"代入测量数据，可算出 Δp = ____ kg·m/s（保留 3 位有效数字；合外力冲量 I = m g (h/l) t ≈ 0.122 N·s）。","unit":"kg·m/s","answer":0.12,"tol":0.002,"sig":3,"show":"0.120","explain":"v₁ = 0.0100 / 0.01000 = 1.00 m/s，v₂ = 0.0100 / 0.00625 = 1.60 m/s，Δp = 0.2000 × (1.60 − 1.00) = 0.120 kg·m/s，与冲量 I ≈ 0.122 N·s 在误差允许范围内一致。","quizId":"M08:paper:Q7:(3)"},{"label":"(4)","type":"choice","prompt":"关于本实验，下列说法正确的是 ____。","options":["垫高导轨的目的是为了平衡滑块所受的阻力","若选用宽度为 d/2 的遮光板，瞬时速率测量值会更准确","若滑块从不同位置静止释放，测得的遮光时间不变"],"answer":1,"explain":"本实验垫高导轨是为了利用重力沿导轨分力提供恒定合外力，A 错；遮光板越窄，平均速度越接近通过光电门时的瞬时速率，B 正确；释放位置不同到达光电门的速度不同，遮光时间会变化，C 错。","quizId":"M08:paper:Q7:(4)"}]},{"id":"Q8","source":"2026·广东广州期中（复习课件题组）","verified":true,"stem":"两实验小组想验证动量守恒定律，第一组采用如图甲所示的“碰撞实验装置”；第二组设计了如图乙所示利用固定了两个光电门的气垫导轨验证两滑块弹开后的动量是否守恒。<svg viewBox=\"0 0 540 225\" width=\"540\" role=\"img\" aria-label=\"2026广州期中双组对照装置图甲与图乙\"><g transform=\"translate(10,4)\"><rect x=\"108\" y=\"36\" width=\"120\" height=\"7\" fill=\"#fff\" stroke=\"#10233F\"/><rect x=\"148\" y=\"43\" width=\"8\" height=\"58\" fill=\"#fff\" stroke=\"#10233F\"/><path d=\"M92 14 L152 36 H228\" fill=\"none\" stroke=\"#10233F\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"15\" r=\"6\" fill=\"#C9D1D9\" stroke=\"#10233F\"/><circle cx=\"228\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#10233F\" stroke-dasharray=\"2 2\"/><line x1=\"228\" y1=\"36\" x2=\"228\" y2=\"98\" stroke=\"#10233F\"/><polygon points=\"228,100 225,94 231,94\" fill=\"#10233F\"/><path d=\"M230 30 Q268 35 288 100\" fi       if (Math.hypot(pts[i].x - c.cx, pts[i].y - c.cy) > c.r + 1e-9) return false;
    }
    return true;
  }
  function convexHull(pts) {
    if (pts.length <= 3) return pts.slice();
    var s = pts.slice().sort(function (a, b) { return a.x !== b.x ? a.x - b.x : a.y - b.y; });
    var uniq = [], i;
    for (i = 0; i < s.length; i++) {
      if (!i || Math.abs(s[i].x - s[i - 1].x) > 1e-12 || Math.abs(s[i].y - s[i - 1].y) > 1e-12) uniq.push(s[i]);
    }
    if (uniq.length <= 3) return uniq;
    function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
    var lo = [], hi = [];
    for (i = 0; i < uniq.length; i++) {
      while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], uniq[i]) <= 0) lo.pop();
      lo.push(uniq[i]);
    }
    for (i = uniq.length - 1; i >= 0; i--) {
      while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], uniq[i]) <= 0) hi.pop();
      hi.push(uniq[i]);
    }
    lo.pop(); hi.pop();
    return lo.concat(hi);
  }
  function minCircle(rawPts) {
    var pts = (rawPts || []).map(function (p) { return Array.isArray(p) ? { x: p[0], y: p[1] } : { x: p.x, y: p.y }; });
    if (!pts.length) return null;
    if (pts.length === 1) return { cx: pts[0].x, cy: pts[0].y, r: 0.002, dist: Math.hypot(pts[0].x, pts[0].y) };
    var hPts = convexHull(pts), n = hPts.length;
    if (n === 1) return { cx: hPts[0].x, cy: hPts[0].y, r: 0.002, dist: Math.hypot(hPts[0].x, hPts[0].y) };
    var best = null, i, j, k, c;
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        c = circle2(hPts[i], hPts[j]);
        if ((!best || c.r < best.r) && insideAll(c, hPts)) best = c;
      }
    }
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        for (k = j + 1; k < n; k++) {
          c = circle3(hPts[i], hPts[j], hPts[k]);
          if (c && (!best || c.r < best.r) && insideAll(c, hPts)) best = c;
        }
      }
    }
    if (!best) best = circle2(hPts[0], hPts[1]);
    return { cx: best.cx, cy: best.cy, r: Math.max(best.r, 0.002), dist: Math.hypot(best.cx, best.cy) };
  }

  /** 批量打点并定最小圆 */
  function chuteSeries(p, nShots) {
    nShots = nShots || 10;
    var baseSeed = p.seed || 31;
    var pDots = [], mDots = [], nDots = [];
    for (var i = 0; i < nShots; i++) {
      var res = chuteCollide(Object.assign({}, p, { seed: baseSeed + i * 17 }));
      if (res.solo) pDots.push(res.pDot);
      else { mDots.push(res.mDot); nDots.push(res.nDot); }
    }
    return {
      pDots: pDots, mDots: mDots, nDots: nDots,
      P: minCircle(pDots), M: minCircle(mDots), N: minCircle(nDots)
    };
  }

  function chuteCheck(m1, m2, OP, OM, ON) {
    var pBefore = m1 * OP, pAfter = m1 * OM + m2 * ON;
    var relErr = pBefore ? (pAfter - pBefore) / pBefore : 0;
    var elSum = OP + OM, elDiff = ON ? (elSum - ON) / ON : 0;
    return { pBefore: pBefore, pAfter: pAfter, relErr: relErr, elSum: elSum, elDiff: elDiff };
  }

  /** 光电门精确遮光时间（已知入口速度 vEntry、导轨加速度 aSign、遮光片宽 d） */
  function gateTransitTime(vEntry, aAlong, d) {
    if (vEntry <= 1e-6) return Infinity;
    if (Math.abs(aAlong) < 1e-8) return d / vEntry;
    var disc = vEntry * vEntry + 2 * aAlong * d;
    if (disc <= 0) return Infinity;
    return (-vEntry + Math.sqrt(disc)) / aAlong;
  }

  /** 气垫导轨 + 双光电门物理核心 */
  function airtrackRun(p) {
    p = p || {};
    var airMode = p.airMode || 'elastic'; // 'elastic' | 'inelastic' | 'spring' | 'level'
    var m1 = p.m1 != null ? p.m1 : 0.200;
    var m2 = p.m2 != null ? p.m2 : 0.100;
    var d1 = p.d1 != null ? p.d1 : 0.010;
    var d2 = p.d2 != null ? p.d2 : 0.010;
    var tiltDeg = p.tiltDeg || 0; // 正值：右端偏高（沿 +x 加速度为负）
    var ideal = !!p.ideal;
    var v0 = p.v0 != null ? p.v0 : 0.80;
    var Ep = p.Ep != null ? p.Ep : 0.060;
    var rnd = getRng(p.seed || 41);

    var rad = tiltDeg * Math.PI / 180;
    var mu = ideal ? 0 : 0.0004;
    var xG1 = AIR.gate1, xG2 = AIR.gate2, xC = AIR.target, xStart = AIR.start;
    var xContact = xC - AIR.length;

    function speedAfterDisp(vIn, a, dx) {
      var v2 = vIn * vIn + 2 * a * dx;
      return v2 > 0 ? Math.sqrt(v2) : 0;
    }
    function jitterDt(dt) {
      if (!isFinite(dt) || ideal) return dt;
      return dt * (1 + rnd.gauss(0.002));
    }

    if (airMode === 'level') {
      // 单滑块自左向右（xStart -> xG1 -> xG2）检验水平
      var aR = -G * Math.sin(rad) - mu * G * Math.cos(rad);
      var vAtG1 = speedAfterDisp(v0, aR, xG1 - d1 / 2 - xStart);
      var dt1 = jitterDt(gateTransitTime(vAtG1, aR, d1));
      var vAtG2 = speedAfterDisp(v0, aR, xG2 - d1 / 2 - xStart);
      var dt2 = jitterDt(gateTransitTime(vAtG2, aR, d1));
      return {
        airMode: airMode, m1: m1, m2: m2, d1: d1, d2: d2, tiltDeg: tiltDeg, v0: v0, a: aR,
        dt1: dt1, dt2: dt2, v1: d1 / dt1, v2: d1 / dt2,
        pBefore: m1 * (d1 / dt1), pAfter: m1 * (d1 / dt2),
        relErr: ((d1 / dt2) - (d1 / dt1)) / (d1 / dt1),
        ekRatio: null
      };
    }

    if (airMode === 'spring') {
      var eEff = Ep * (ideal ? 1.0 : 0.985);
      var v1s = Math.sqrt((2 * eEff * m2) / (m1 * (m1 + m2)));
      var v2s = Math.sqrt((2 * eEff * m1) / (m2 * (m1 + m2)));

      var aLeft = G * Math.sin(rad) - mu * G * Math.cos(rad);   // 沿 -x 正方向的加速度
      var aRight = -G * Math.sin(rad) - mu * G * Math.cos(rad); // 沿 +x 正方向的加速度
      var v1Entry = speedAfterDisp(v1s, aLeft, AIR.spring1 - xG1 - d1 / 2);
      var v2Entry = speedAfterDisp(v2s, aRight, xG2 - AIR.spring2 - d2 / 2);
      var dt1s = jitterDt(gateTransitTime(v1Entry, aLeft, d1));
      var dt2s = jitterDt(gateTransitTime(v2Entry, aRight, d2));
      var v1Meas = isFinite(dt1s) ? d1 / dt1s : 0;
      var v2Meas = isFinite(dt2s) ? d2 / dt2s : 0;
      var p1 = m1 * v1Meas, p2 = m2 * v2Meas;
      var relS = p1 > 0 ? (p2 - p1) / p1 : 0;
      return {
        airMode: airMode, m1: m1, m2: m2, d1: d1, d2: d2, tiltDeg: tiltDeg,
        v1Init: v1s, v2Init: v2s, aLeft: aLeft, aRight: aRight,
        dt1: dt1s, dt2: dt2s, v1: v1Meas, v2: v2Meas,
        p1: p1, p2: p2, pBefore: 0, pAfter: p2 - p1, relErr: relS, ekRatio: null
      };
    }

    // 'elastic' | 'inelastic'：滑块 1 自 xStart 向右过光电门 1，中心到达 xContact 时与静止的滑块 2 接触
    var a1 = -G * Math.sin(rad) - mu * G * Math.cos(rad);
    var v1EntryG1 = speedAfterDisp(v0, a1, xG1 - d1 / 2 - xStart);
    var dt1Pre = jitterDt(gateTransitTime(v1EntryG1, a1, d1));
    var v1MeasPre = d1 / dt1Pre;

    var dt2Post = Infinity, dt1Post = Infinity;

    if (airMode === 'inelastic') {
      var vCombEntry = speedAfterDisp(v2Post, a1, (xG2 - xC) - d1 / 2);
      dt2Post = jitterDt(gateTransitTime(vCombEntry, a1, d1));
      v2MeasPost = isFinite(dt2Post) ? d1 / dt2Post : 0;
      v1MeasPost = v2MeasPost;
    } else {
      var v2EntryG2 = speedAfterDisp(v2Post, a1, (xG2 - xC) - d2 / 2);
      dt2Post = jitterDt(gateTransitTime(v2EntryG2, a1, d2));
      v2MeasPost = isFinite(dt2Post) ? d2 / dt2Post : 0;
      if (v1Post > 1e-4) {

        dt1Post = jitterDt(gateTransitTime(v1EntryG2, a1, d1));

      }

    var pAfter = airMode === 'inelastic' ? (m1 + m2) * v2MeasPost : m1 * v1MeasPost + m2 * v2MeasPost;

    return {
      airMode: airMode, m1: m1, m2: m2, d1: d1, d2: d2, tiltDeg: tiltDeg,
      a: a1, axBack: -G * Math.sin(rad) + mu * G * Math.cos(rad),

    var lipX = ox, lipY = Math.round(splitY * 0.43), floorY = splitY - 12;
    return {
      splitY: splitY, ox: ox, pxPerM: pxPerM,
      lipX: lipX, lipY: lipY, floorY: floorY,
      X: function (m) { return ox + m * pxPerM; },
      paperTop: splitY + 14, paperH: hh - splitY - 24,
      paperMidY: splitY + 14 + (hh - splitY - 24) * 0.46
    };
  };
  Bench.prototype.airGeo = function (w, hh) {
    var trackX = Math.round(w * 0.08), trackW = Math.round(w * 0.84);
    var trackY = Math.round(hh * 0.54);
    var pxPerM = trackW / 1.20;
    return {
      trackX: trackX, trackW: trackW, trackY: trackY, pxPerM: pxPerM,
      X: function (m) { return trackX + m * pxPerM; },
      g1: AIR.gate1, g2: AIR.gate2, c: AIR.target
    };
  };

  /* ---------- 静态层绘制 ---------- */
  Bench.prototype.drawBg = function (ctx, w, hh) {
    ctx.fillStyle = '#EAF1F8'; ctx.fillRect(0, 0, w, hh);
    if (this.scheme === 'chute') this.drawChuteBg(ctx, w, hh);
    else this.drawAirBg(ctx, w, hh);
  };
  Bench.prototype.drawChuteBg = function (ctx, w, hh) {
    var g = this.chuteGeo(w, hh), ch = this.ch;
    // 上半部分：2.5D 侧视台
    ctx.fillStyle = '#F5F9FE'; ctx.fillRect(0, 0, w, g.splitY);
    // 地面与木板
    ctx.fillStyle = D.grad(ctx, 0, g.floorY, 0, g.splitY, ['#DFC49A', '#C8A571']);
    ctx.fillRect(0, g.floorY, w, g.splitY - g.floorY);
    ctx.strokeStyle = '#9C7A47'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, g.floorY); ctx.lineTo(w, g.floorY); ctx.stroke();

    // 桌台与支架
    var tblY = g.lipY + 10;
    ctx.fillStyle = D.grad(ctx, 0, tblY, 0, tblY + 12, ['#E6CBA2', '#C49F6B']);
    ctx.fillRect(14, tblY, g.lipX - 18, 12);
    ctx.strokeStyle = '#8E6B38'; ctx.strokeRect(14, tblY, g.lipX - 18, 12);
    ctx.fillStyle = '#8E99A6';
    ctx.fillRect(Math.max(24, g.lipX - 96), tblY + 12, 14, g.floorY - tblY - 12);

    // 斜槽轨道（按 tiltDeg 渲染末尾上翘/水平）
    var tiltRad = (ch.tiltDeg || 0) * Math.PI / 180;
    var flatLen = 58, endX = g.lipX, endY = g.lipY - Math.sin(tiltRad) * flatLen;
    var elbowX = g.lipX - flatLen, elbowY = g.lipY;
    var topStartX = Math.max(22, elbowX - 74), topStartY = Math.max(24, elbowY - 48);
    ctx.strokeStyle = '#3B4B60'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(topStartX, topStartY); ctx.quadraticCurveTo(elbowX - 24, elbowY, elbowX, elbowY); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.strokeStyle = '#DCE4EC'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(topStartX, topStartY); ctx.quadraticCurveTo(elbowX - 24, elbowY, elbowX, elbowY); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineWidth = 1;

    // 释放标记 S
    var sX = topStartX + 16, sY = topStartY + 10;
    ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sX - 7, sY - 9); ctx.lineTo(sX + 7, sY + 5); ctx.stroke();
    D.text(ctx, '释放点 S', sX - 4, sY + 24, { align: 'center', size: 11.5, weight: 700, color: '#C7374B' });
    if (ch.tiltDeg) {
      D.text(ctx, '⚠ 末端上翘 +' + ch.tiltDeg + '°', endX + 10, endY - 8, { size: 11.5, weight: 700, color: '#C7374B' });
    } else {
      D.text(ctx, '末端水平 0°', endX + 10, endY - 8, { size: 11.5, weight: 600, color: '#17784F' });
    }

    // 重垂线定 O 点
    ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#4A5B73'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(endX, endY + 4); ctx.lineTo(endX, g.floorY - 8); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#4A5B73';
    ctx.beginPath(); ctx.moveTo(endX, g.floorY); ctx.lineTo(endX - 4, g.floorY - 9); ctx.lineTo(endX + 4, g.floorY - 9); ctx.closePath(); ctx.fill();
    D.text(ctx, 'O', endX, g.floorY + 11, { align: 'center', size: 12, weight: 700 });
    D.text(ctx, '桌面高 H = ' + ch.H.toFixed(2) + ' m（不必测量）', 16, 20, { size: 11.5, color: '#4A5B73' });

    // 分隔线
    ctx.fillStyle = '#DCE5F0'; ctx.fillRect(0, g.splitY, w, 4);

    // 下半部分：白纸落点区（俯视图）
    ctx.fillStyle = '#FBFAF5';
    D.rr(ctx, 12, g.paperTop, w - 24, g.paperH, 10); ctx.fill();
    ctx.strokeStyle = '#C9BFA8'; ctx.lineWidth = 1.2; ctx.stroke();
    D.text(ctx, '白纸落点区（俯视图）· 按住出现 3× 放大镜', 22, g.paperTop + 16, { size: 11.5, weight: 700, color: '#4A5B73' });

    // 刻度尺（从 O = 0 cm 起，延伸至 95 cm 覆盖 H = 0.80 m 射程）
    var rulerY = g.paperTop + g.paperH - 22;
    ctx.strokeStyle = '#7E8C9B'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(g.ox, rulerY); ctx.lineTo(w - 22, rulerY);
    for (var cm = 0; cm <= 95; cm += 1) {
      var rx = g.X(cm / 100);
      if (rx > w - 20) break;
      var maj = cm % 10 === 0, mid = cm % 5 === 0;
      ctx.moveTo(rx, rulerY); ctx.lineTo(rx, rulerY + (maj ? 9 : mid ? 6 : 3));
      if (maj) D.text(ctx, cm === 0 ? '0(O)' : String(cm), rx, rulerY + 19, { align: 'center', size: 10.5, weight: cm === 0 ? 700 : 500, color: '#4A5B73' });
    }
    ctx.stroke();
    D.text(ctx, 'cm', w - 22, rulerY + 19, { align: 'right', size: 10.5, color: '#4A5B73' });
    // O 点基线
    ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = '#8E99A6';
    ctx.beginPath(); ctx.moveTo(g.ox, g.paperTop + 22); ctx.lineTo(g.ox, rulerY); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#10233F'; ctx.beginPath(); ctx.arc(g.ox, g.paperMidY, 3.2, 0, Math.PI * 2); ctx.fill();
    D.text(ctx, 'O', g.ox - 10, g.paperMidY + 4, { align: 'right', size: 12, weight: 700 });
  };

  Bench.prototype.drawAirBg = function (ctx, w, hh) {
    var g = this.airGeo(w, hh), at = this.at;
    ctx.fillStyle = '#F5F9FE'; ctx.fillRect(0, 0, w, hh);
    // 实验台底座
    var baseY = g.trackY + 34;
    ctx.fillStyle = D.grad(ctx, 0, baseY, 0, hh, ['#E0C49A', '#C49F6B']);
    ctx.fillRect(0, baseY, w, hh - baseY);
    ctx.fillStyle = '#A5814F'; ctx.fillRect(0, baseY, w, 3);

    // 导轨（可随 tiltDeg 倾斜）
    ctx.save();
    var pivotX = g.X(0.05), pivotY = g.trackY + 8;
    var visualAng = -(at.tiltDeg || 0) * 2.2 * Math.PI / 180; // 放大可视倾角便于辨识
    ctx.translate(pivotX, pivotY); ctx.rotate(visualAng); ctx.translate(-pivotX, -pivotY);

    // 垫块（歪斜时右端出现垫块）
    if (at.tiltDeg > 0) {
      ctx.fillStyle = '#C7374B'; ctx.fillRect(g.X(1.10) - 10, g.trackY + 12, 20, 14);
      D.text(ctx, '右端偏高 +' + at.tiltDeg + '°', g.X(1.10), g.trackY + 38, { align: 'center', size: 11, weight: 700, color: '#C7374B' });
    }
    ctx.fillStyle = D.grad(ctx, 0, g.trackY - 4, 0, g.trackY + 12, ['#DCE4EC', '#9AA7B5']);
    D.rr(ctx, g.trackX, g.trackY - 4, g.trackW, 16, 4); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();

    // 刻度
    ctx.strokeStyle = '#4A5B73'; ctx.beginPath();
    for (var cm = 0; cm <= 120; cm += 5) {
      var sx = g.X(cm / 100);
      ctx.moveTo(sx, g.trackY + 12); ctx.lineTo(sx, g.trackY + (cm % 20 === 0 ? 5 : 8));
      if (cm % 20 === 0) D.text(ctx, String(cm), sx, g.trackY + 24, { align: 'center', size: 10, color: '#4A5B73' });
    }
    ctx.stroke();

    // 两个光电门支架
    [g.g1, g.g2].forEach(function (gp, i) {
      var gx = g.X(gp);
      ctx.fillStyle = '#3B4B60'; D.rr(ctx, gx - 6, g.trackY - 76, 12, 72, 3); ctx.fill();
      D.text(ctx, '光电门 ' + (i + 1), gx, g.trackY - 84, { align: 'center', size: 12, weight: 700 });
    });
    ctx.restore();
    D.text(ctx, '两光电门间距 0.500 m（气垫导轨）', w / 2, 22, { align: 'center', size: 12, color: '#4A5B73', weight: 600 });
  };

  /* ---------- 动态层绘制 ---------- */
  Bench.prototype.drawFg = function (ctx, w, hh) {
    this.hot = [];
    if (this.scheme === 'chute') this.drawChuteFg(ctx, w, hh);
    else this.drawAirFg(ctx, w, hh);
  };

  Bench.prototype.drawChuteFg = function (ctx, w, hh) {
    var g = this.chuteGeo(w, hh), ch = this.ch;
    var b1 = BALL_TYPES[ch.m1], b2 = BALL_TYPES[ch.m2];
    var rBall = 7.5;
    var tiltRad = (ch.tiltDeg || 0) * Math.PI / 180;
    var flatLen = 58, endX = g.lipX, endY = g.lipY - Math.sin(tiltRad) * flatLen;
    var elbowX = g.lipX - flatLen, elbowY = g.lipY;
    var topStartX = Math.max(22, elbowX - 74), topStartY = Math.max(24, elbowY - 48);

    function drawSphere(x, y, ball, lbl) {
      ctx.fillStyle = D.grad(ctx, x - rBall, y - rBall, x + rBall, y + rBall, [ball.c1, ball.c2]);
      ctx.beginPath(); ctx.arc(x, y, rBall, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.1; ctx.stroke();
      if (lbl) D.text(ctx, lbl, x, y - rBall - 4, { align: 'center', size: 11, weight: 700 });
    }

    // 上部斜槽小球与轨迹动画
    if (ch.anim) {
      var a = ch.anim, res = a.res;
      // 过往辅助轨迹弧线（淡虚线）
      if (a.phase === 'fly') {
        var dt = a.t - a.tCol;
        var drawArc = function (vL, col, tMax) {
          var rad = (ch.tiltDeg || 0) * Math.PI / 180;
          var vx = vL * Math.cos(rad), vy0 = -vL * Math.sin(rad);
          var tt = Math.min(dt, tMax);
          var bx = endX + vx * tt * g.pxPerM;
          var by = (endY - rBall) + (vy0 * tt + 0.5 * G * tt * tt) * ((g.floorY - (endY - rBall)) / ch.H);
          return { x: bx, y: Math.min(g.floorY - rBall, by) };
        };
        if (res.solo) {
          var p1 = drawArc(res.v1Launch, '#1661FF', res.tP);
          drawSphere(p1.x, p1.y, b1, 'm₁');
        } else {
          var p2 = drawArc(res.v2Launch, '#12A9C4', res.tN);
          drawSphere(p2.x, p2.y, b2, 'm₂');
          if (res.rebound && dt < 0.28) {
            // 反弹回滚动画：向斜槽倒退再滚回
            var frac = Math.sin((dt / 0.28) * Math.PI);
            drawSphere(endX - frac * 42, endY - rBall - frac * 14, b1, '反弹!');
          } else {
            var dt1 = res.rebound ? Math.max(0, dt - 0.28) : dt;
            var rad2 = (ch.tiltDeg || 0) * Math.PI / 180;
            var vx1 = res.v1Launch * Math.cos(rad2), vy1 = -res.v1Launch * Math.sin(rad2);
            var tt1 = Math.min(dt1, res.tM);
            var bx1 = endX + vx1 * tt1 * g.pxPerM;
            var by1 = (endY - rBall) + (vy1 * tt1 + 0.5 * G * tt1 * tt1) * ((g.floorY - (endY - rBall)) / ch.H);
            drawSphere(bx1, Math.min(g.floorY - rBall, by1), b1, 'm₁');
          }
        }
      } else {
        // 沿斜槽滑下阶段
        var u = Math.min(1, a.t / a.tCol);
        var sx = topStartX + 16 + (endX - (topStartX + 16)) * u * u;
        var sy = (topStartY + 10) * (1 - u * u) + (endY - rBall) * (u * u);
        drawSphere(sx, sy, b1, 'm₁');
        if (ch.hasM2) drawSphere(endX, endY - rBall, b2, 'm₂');
      }
    } else {
      drawSphere(topStartX + 16, topStartY + 4, b1, 'm₁(点击释放)');
      if (ch.hasM2) {
        drawSphere(endX, endY - rBall, b2, 'm₂');
      } else {
        ctx.save(); ctx.setLineDash([3, 2]); ctx.strokeStyle = '#12A9C4'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(endX, endY - rBall, rBall, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        D.text(ctx, '点此放 m₂', endX + 10, endY + 16, { size: 11, color: '#0E8CA3', weight: 600 });
      }
      this.hot.push({ id: 'release1', x: topStartX - 8, y: topStartY - 18, w: 68, h: 48 });
      this.hot.push({ id: 'toggleM2', x: endX - 24, y: endY - 30, w: 54, h: 48 });
    }

    // 下半部分：白纸上的落点簇 + 最小圆
    var scaleY = 180; // 横向用 g.pxPerM，横向散布垂直方向缩放
    function plotDots(dots, col, circle, lbl) {
      dots.forEach(function (d) {
        var px = g.X(d.x), py = g.paperMidY + d.y * scaleY;
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, 2.7, 0, Math.PI * 2); ctx.fill();
      });
      if (circle) {
        var cx = g.X(circle.cx), cy = g.paperMidY + circle.cy * scaleY;
        var radPx = Math.max(8, circle.r * g.pxPerM);
        ctx.strokeStyle = col; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(cx, cy, radPx, 0, Math.PI * 2); ctx.stroke();
        // 十字圆心
        ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5); ctx.stroke();
        D.text(ctx, lbl + ' (' + fmtCm(circle.dist) + 'cm)', cx, cy - radPx - 5, { align: 'center', size: 11.5, weight: 700, color: col });
      }
    }
    plotDots(ch.pDots, '#1661FF', ch.P, 'P');
    plotDots(ch.mDots, '#9A5A00', ch.M, 'M');
    plotDots(ch.nDots, '#17784F', ch.N, 'N');
    this.hot.push({ id: 'paper', x: 12, y: g.paperTop, w: w - 24, h: g.paperH });
  };

  Bench.prototype.drawAirFg = function (ctx, w, hh) {
    var g = this.airGeo(w, hh), at = this.at;
    var rad = -(at.tiltDeg || 0) * 2.2 * Math.PI / 180;
    var pivotX = g.X(0.05), pivotY = g.trackY + 8;

    ctx.save();
    ctx.translate(pivotX, pivotY); ctx.rotate(rad); ctx.translate(-pivotX, -pivotY);

    var p1x = AIR.start, p2x = AIR.target;
    if (at.airMode === 'spring') { p1x = AIR.spring1; p2x = AIR.spring2; }
    else if (at.airMode === 'level') { p1x = AIR.start; p2x = null; }
    if (at.anim) { p1x = at.anim.x1; p2x = at.anim.x2; }

    var cartW = AIR.length * g.pxPerM, cartH = 22, flagW = Math.max(3, (at.dMm / 1000) * g.pxPerM);
    function drawSlider(xm, col, lbl, flag) {
      if (xm == null) return;
      var cx = g.X(xm) - cartW / 2, cy = g.trackY - cartH - 4;
      ctx.fillStyle = D.grad(ctx, 0, cy, 0, cy + cartH, [col[0], col[1]]);
      D.rr(ctx, cx, cy, cartW, cartH, 4); ctx.fill();
      ctx.strokeStyle = '#10233F'; ctx.stroke();
      if (flag) {
        ctx.fillStyle = '#10233F';
        ctx.fillRect(g.X(xm) - flagW / 2, cy - 26, flagW, 26);
      }
      D.text(ctx, lbl, g.X(xm), cy + 15, { align: 'center', size: 11.5, weight: 700, color: '#fff' });
    }

    // 弹簧与细线（弹开模式未运行前）
    if (at.airMode === 'spring' && (!at.anim || at.anim.t < 0.03)) {
      var sx1 = g.X(p1x) + cartW / 2, sx2 = g.X(p2x) - cartW / 2;
      ctx.strokeStyle = '#4A5B73'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(sx1, g.trackY - 15);
      for (var k = 1; k <= 6; k++) ctx.lineTo(sx1 + (sx2 - sx1) * (k / 7), g.trackY - 15 + (k % 2 ? -5 : 5));
      ctx.lineTo(sx2, g.trackY - 15); ctx.stroke();
      ctx.strokeStyle = '#C7374B'; ctx.beginPath(); ctx.moveTo((sx1 + sx2) / 2, g.trackY - 32); ctx.lineTo((sx1 + sx2) / 2, g.trackY - 8); ctx.stroke();
    }

    drawSlider(p1x, ['#4E84EB', '#2653AD'], 'P ' + Math.round(at.m1 * 1000) + 'g', true);
    if (p2x != null) drawSlider(p2x, ['#22B0C9', '#0D788D'], 'Q ' + Math.round(at.m2 * 1000) + 'g', at.airMode !== 'inelastic');

    // 光电门指示灯（滑块遮光时亮琥珀）
    var g1Hit = Math.abs(p1x - g.g1) * 1000 < at.dMm + 8 || (p2x != null && Math.abs(p2x - g.g1) * 1000 < at.dMm + 8);
    var g2Hit = Math.abs(p1x - g.g2) * 1000 < at.dMm + 8 || (p2x != null && Math.abs(p2x - g.g2) * 1000 < at.dMm + 8);
    [g1Hit, g2Hit].forEach(function (hit, idx) {
      var gx = g.X(idx === 0 ? g.g1 : g.g2);
      ctx.fillStyle = hit ? '#E69B2D' : '#C7374B';
      ctx.beginPath(); ctx.arc(gx, g.trackY - 52, hit ? 4.5 : 3, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    // 底部数字计时器面板
    var bw = Math.min(w - 32, 500), bx = (w - bw) / 2, by = g.trackY + 44, bh = Math.min(78, hh - by - 6);
    if (bh >= 44) {
      ctx.fillStyle = '#10233F'; D.rr(ctx, bx, by, bw, bh, 10); ctx.fill();
      var r = at.res, done = r && (!at.anim || at.anim.done);
      var dStr = at.dMm.toFixed(at.dPrec === 3 ? 3 : 1);
      D.text(ctx, '数字计时器（遮光片 d = ' + dStr + ' mm）', bx + 12, by + 16, { size: 11, color: '#9FB3CC' });
      var t1s = done && isFinite(r.dt1) ? (r.dt1 * 1000).toFixed(2) + ' ms' : '---';
      var t2s = done && isFinite(r.dt2) ? (r.dt2 * 1000).toFixed(2) + ' ms' : '---';
      var hasPost = done && r.airMode === 'elastic';
      var yMain = hasPost && bh >= 62 ? by + 38 : by + 44;
      D.text(ctx, '光电门 1：Δt₁ = ' + t1s, bx + 14, yMain, { size: 14, color: '#7CF0B4', weight: 700, maxW: bw * 0.46 });
      D.text(ctx, '光电门 2：Δt₂ = ' + t2s, bx + bw * 0.51, yMain, { size: 14, color: '#7CF0B4', weight: 700, maxW: bw * 0.46 });
      if (hasPost && bh >= 62) {
        var pDir = r.v1Post < -1e-4 ? '反弹过门1' : Math.abs(r.v1Post) <= 1e-4 ? '碰后静止' : '追随过门2';
        var t1p = isFinite(r.dt1Post) ? (r.dt1Post * 1000).toFixed(2) + ' ms' : '∞（静止）';
        D.text(ctx, '碰后滑块 P（' + pDir + '）：Δt₁′ = ' + t1p, bx + 14, by + 62, { size: 12, color: '#A3D9FF', weight: 600, maxW: bw - 28 });
      }
    }
  };

  /* ---------- 指针与放大镜 ---------- */
  Bench.prototype.bindPointer = function () {
    var self = this;
    ML.stage.pointer(this.stage.layer('fg').canvas, {
      down: function () {},
      move: function (p, a) {
        if (a.pressed && self.scheme === 'chute') self.showMag(p);
      },
      press: function (p) {
        if (self.scheme === 'chute') self.showMag(p);
      },
      up: function (p, a) {
        self.mag.hide();
        if (a.moved || a.pressed) return;
        var hit = self.hitTest(p);
        if (self.scheme === 'chute') {
          if (hit === 'release1') self.shoot(1);
          else if (hit === 'toggleM2') { self.ch.hasM2 = !self.ch.hasM2; self.renderSide(); self.stage.invalidate('fg'); }
        }
      }
    });
  };
  Bench.prototype.showMag = function (p) {
    var g = this.chuteGeo(this.stage.w, this.stage.h);
    var label = null;
    if (p.y >= g.paperTop) {
      var xCm = ((p.x - g.ox) / g.pxPerM) * 100;
      label = 'x = ' + xCm.toFixed(1) + ' cm';
    }
    this.mag.show([this.stage.layer('bg').canvas, this.stage.layer('fg').canvas], p.x, p.y, this.stage.dpr, label);
  };
  Bench.prototype.hitTest = function (p) {
    var hs = this.hot || [];
    for (var i = hs.length - 1; i >= 0; i--) {
      var r = hs[i];
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r.id;
    }
    return null;
  };

  /* ---------- 方案一控制 ---------- */
  Bench.prototype.chuteParams = function () {
    var ch = this.ch;
    return {
      m1: BALL_TYPES[ch.m1].m,
      m2: ch.hasM2 ? BALL_TYPES[ch.m2].m : 0,
      e: ch.e, v0: 1.50, H: ch.H, tiltDeg: ch.tiltDeg,
      ideal: S.ideal, releaseJitter: ch.releaseJitter,
      seed: (seedCounter += 13)
    };
  };
  function pushDotCap(arr, dot) {
    arr.push(dot);
    if (arr.length > 30) arr.shift();
  }
  Bench.prototype.commitChuteAnim = function (a) {
    if (!a || !a.res) return;
    var ch = this.ch, res = a.res;
    if (res.solo) {
      if (!a.pAdded) { pushDotCap(ch.pDots, res.pDot); a.pAdded = true; }
    } else {
      if (!a.mAdded) { pushDotCap(ch.mDots, res.mDot); a.mAdded = true; }
      if (!a.nAdded) { pushDotCap(ch.nDots, res.nDot); a.nAdded = true; }
    }
  };
  Bench.prototype.shoot = function (n) {
    var ch = this.ch;
    if (this.guided()) {
      if (ch.tiltDeg !== 0) { this.block('请先将斜槽末端调节至水平（0°）。' + PROC.P1.why, 'E3'); return; }
      if (ch.hasM2 && BALL_TYPES[ch.m1].m <= BALL_TYPES[ch.m2].m) {
        this.block('入射球质量必须大于被碰球（m₁ > m₂），否则入射球会反弹回滚！', 'E1'); return;
      }
      if (ch.releaseJitter) { this.block('每次释放位置必须固定在 S 处，不能忽高忽低！', 'E2'); return; }
    }
    if (ch.anim) { this.commitChuteAnim(ch.anim); ch.anim = null; }
    this.setBanner(null);
    var p = this.chuteParams();
    if (n === 1) {
      var res = PH.chuteCollide(p);
      ch.lastRes = res;
      this.done.P1 = ch.tiltDeg === 0; this.done.P2 = true; this.done.P3 = BALL_TYPES[ch.m1].m > BALL_TYPES[ch.m2].m;
      if (ch.hasM2) this.done.P5 = true; else this.done.P4 = true;
      var tFly = Math.max(res.tP || 0, res.tM || 0, res.tN || 0) + (res.rebound ? 0.28 : 0);
      ch.anim = { t: 0, tCol: 0.30, end: 0.30 + tFly, phase: 'slide', res: res, pAdded: false, mAdded: false, nAdded: false };
      this.renderSide();
      this.loop.start();
    } else {
      for (var i = 0; i < n; i++) {
        var r = PH.chuteCollide(Object.assign({}, p, { seed: p.seed + i * 19 }));
        if (r.solo) pushDotCap(ch.pDots, r.pDot);
        else { pushDotCap(ch.mDots, r.mDot); pushDotCap(ch.nDots, r.nDot); }
      }
      this.done.P1 = ch.tiltDeg === 0; this.done.P2 = true; this.done.P3 = BALL_TYPES[ch.m1].m > BALL_TYPES[ch.m2].m;
      if (ch.hasM2) this.done.P5 = true; else this.done.P4 = true;
      ch.anim = null;
      ML.toast('已完成 ' + n + ' 发释放（' + (ch.hasM2 ? 'M、N 点簇' : 'P 点簇') + '）', 'ok');
      this.stage.invalidate('fg');
      this.renderSide();
    }
  };
  Bench.prototype.fitCircles = function () {
    var ch = this.ch;
    var okAny = false;
    if (ch.pDots.length >= 3) { ch.P = PH.minCircle(ch.pDots); okAny = true; }
    if (ch.mDots.length >= 3 && ch.nDots.length >= 3) {
      ch.M = PH.minCircle(ch.mDots); ch.N = PH.minCircle(ch.nDots); okAny = true;
    }
    if (!okAny) {
      if (this.guided()) this.block('请先打够至少 3 发（建议 10 发）再画最小圆取平均落点！', 'E4');
      else ML.toast('当前点数不足 3 个，请多打几发再定圆心', 'warn');
      return;
    }
    if (ch.P && ch.M && ch.N) this.done.P6 = true;
    ML.toast('已画出最小圆并标出圆心平均位置', 'ok');
    this.stage.invalidate('fg');
    this.renderSide();
  };
  Bench.prototype.clearDots = function () {
    var ch = this.ch;
    ch.pDots = []; ch.mDots = []; ch.nDots = [];
    ch.P = null; ch.M = null; ch.N = null; ch.anim = null;
    this.stage.invalidate('fg'); this.renderSide();
  };

  /* ---------- 方案二控制 ---------- */
  Bench.prototype.runAir = function (modeOverride) {
    var at = this.at;
    var mode = modeOverride || at.airMode;
    if (this.guided() && mode !== 'level' && at.tiltDeg !== 0) {
      this.block('导轨尚未调水平，先进行水平检验并调平至 0°！', 'E5'); return;
    }
    this.setBanner(null);
    var dM = at.dMm / 1000;
    var res = PH.airtrackRun({
      airMode: mode, m1: at.m1, m2: at.m2, d1: dM, d2: dM,
      tiltDeg: at.tiltDeg, ideal: S.ideal, seed: (seedCounter += 11)
    });
    at.res = res;
    if (mode === 'level') {
      if (at.tiltDeg === 0) this.done.P7 = true;
      at.anim = { t: 0, end: 1.35, mode: 'level', x1: AIR.start, x2: null, done: false };
    } else if (mode === 'spring') {
      this.done.P8 = true;
      at.anim = { t: 0, end: 1.0, mode: 'spring', x1: AIR.spring1, x2: AIR.spring2, done: false };
    } else {
      this.done.P8 = true;
      at.anim = { t: 0, end: 1.45, mode: mode, x1: AIR.start, x2: AIR.target, done: false };
    }
    this.renderSide();
    this.loop.start();
  };

  /* ---------- 动画循环 ---------- */
  Bench.prototype.tick = function (dt) {
    if (!this.el || !this.el.isConnected) return false;
    var s = dt * this.speed;
    if (this.scheme === 'chute' && this.ch.anim) {
      var a = this.ch.anim; a.t += s;
      if (a.t >= a.tCol) {
        a.phase = 'fly';
        var dtFly = a.t - a.tCol;
        if (a.res.solo) {
          if (!a.pAdded && dtFly >= a.res.tP) { pushDotCap(this.ch.pDots, a.res.pDot); a.pAdded = true; }
        } else {
          var mFly = a.res.rebound ? dtFly - 0.28 : dtFly;
          if (!a.mAdded && mFly >= a.res.tM) { pushDotCap(this.ch.mDots, a.res.mDot); a.mAdded = true; }
          if (!a.nAdded && dtFly >= a.res.tN) { pushDotCap(this.ch.nDots, a.res.nDot); a.nAdded = true; }
        }
      }
      this.stage.invalidate('fg');
      if (a.t >= a.end) {
        this.commitChuteAnim(a);
        this.ch.anim = null;
        this.stage.invalidate('fg'); this.renderSide();
        return false;
      }
      return true;
    }
    if (this.scheme === 'airtrack' && this.at.anim) {
      var b = this.at.anim, r = this.at.res; b.t += s;
      var acc = r.a || 0, v0 = r.v0 || 0.80;
      if (b.mode === 'level') {
        b.x1 = Math.max(0.08, Math.min(1.08, AIR.start + v0 * b.t + 0.5 * acc * b.t * b.t));
      } else if (b.mode === 'spring') {
        b.x1 = Math.max(0.08, Math.min(0.95, AIR.spring1 - r.v1Init * b.t - 0.5 * r.aLeft * b.t * b.t));
        b.x2 = Math.max(0.18, Math.min(1.12, AIR.spring2 + r.v2Init * b.t + 0.5 * r.aRight * b.t * b.t));
      } else {
        var tCol = r.tContact;
        if (b.t <= tCol) {
          b.x1 = AIR.start + v0 * b.t + 0.5 * acc * b.t * b.t;
          b.x2 = AIR.target;
        } else {
          var t2 = b.t - tCol;
          if (b.mode === 'inelastic') {
            var xc2 = Math.max(0.20, Math.min(1.10, AIR.target + r.v2Post * t2 + 0.5 * acc * t2 * t2));
            b.x1 = xc2 - AIR.length; b.x2 = xc2;
          } else {
            var a1Post = r.v1Post < 0 ? (r.axBack != null ? r.axBack : acc) : acc;
            b.x1 = Math.max(0.08, Math.min(1.00, r.xContact + r.v1Post * t2 + 0.5 * a1Post * t2 * t2));
            b.x2 = Math.max(0.20, Math.min(1.12, AIR.target + r.v2Post * t2 + 0.5 * acc * t2 * t2));
          }
        }
      }
      this.stage.invalidate('fg');
      if (b.t >= b.end) { b.done = true; this.stage.invalidate('fg'); this.renderSide(); return false; }
      return true;
    }
    return false;
  };

  /* ---------- 侧栏面板 ---------- */
  Bench.prototype.renderSide = function () {
    var self = this, side = this.side; if (!side) return;
    ML.clear(side);
    if (this.scheme === 'airtrack') this.renderAirSide(side);
    else this.renderChuteSide(side);
  };

      h('button.chip' + (ch.e < 0.9 ? '.on' : ''), { type: 'button', onclick: function () { ch.e = 0.75; ch.M = ch.N = null; ch.mDots = []; ch.nDots = []; ch.anim = null; self.saveBench(); self.stage.invalidate(); self.renderSide(); } }, '非弹性 0.75'),

      h('button.btn', { type: 'button', onclick: function () { self.clearDots(); } }, '清空落点')));

    // 实时校验结果卡

      ctl.appendChild(h('div.res-card.' + (okMom ? 'ok' : 'bad'), { html:
        '<div class="res-row"><span>OP = <b>' + fmtCm(ch.P.dist) + '</b> cm</span><span>OM = <b>' + fmtCm(ch.M.dist) + '</b> cm</span><span>ON = <b>' + fmtCm(ch.N.dist) + '</b> cm</span></div>' +
        '<div class="res-row"><span>m₁·OP = <b>' + (chk.pBefore * 1000).toFixed(2) + '</b></span><span>m₁·OM+m₂·ON = <b>' + (chk.pAfter * 1000).toFixed(2) + '</b> g·m</span></div>' +
        '<div>偏差：<b>' + fmtPct(chk.relErr) + '</b>　OP+OM=' + fmtCm(chk.elSum) + ' vs ON=' + fmtCm(ch.N.dist) + 'cm' +
        '<br><span class="res-badge ' + (okMom ? 'ok' : 'bad') + '">' + momText + '</span> ' +
        '<span class="res-badge ' + (okEl ? 'ok' : 'bad') + '">' + (okEl ? '✓ 弹性碰撞' : '非弹性/斜抛失真') + '</span></div>' }));

  };

  Bench.prototype.appendSteps = function (side, ids) {
    if (!this.guided()) {
      var tags = h('div.ana-tags'), hasErr = false, ch = this.ch, at = this.at;
      function addTag(txt, errId, isOk) {

        tags.appendChild(h('button.tag.' + (isOk ? 'ok' : 'err'), { type: 'button', onclick: function () { if (errId) openTry(errId); } }, txt));
      }
      if (this.scheme === 'chute') {
        if (ch.hasM2 && BALL_TYPES[ch.m1].m <= BALL_TYPES[ch.m2].m) addTag('⚠ m₁ ≤ m₂ 入射球反弹（E1）', 'E1', false);

        if (ch.tiltDeg !== 0) addTag('⚠ 斜槽末端不水平 +' + ch.tiltDeg + '°（E3）', 'E3', false);
        if ((ch.pDots.length > 0 && ch.pDots.length < 3) || (ch.mDots.length > 0 && ch.mDots.length < 3)) addTag('⚠ 单次未画最小圆（E4）', 'E4', false);
        if (Math.abs(ch.H - 0.80) < 0.05) addTag('✓ H=0.80m 等效不测 H/t（E6）', 'E6', true);

    var ox = 60, pxPerM = (w - ox - 28) / 0.85;
    rows.forEach(function (row, idx) {

      ctx.strokeStyle = '#DCE5F0'; ctx.beginPath(); ctx.moveTo(ox, cy); ctx.lineTo(w - 14, cy); ctx.stroke();
      ctx.fillStyle = '#10233F'; ctx.beginPath(); ctx.arc(ox, cy, 3, 0, Math.PI * 2); ctx.fill();
      D.text(ctx, row.label, 8, cy + 4, { size: 11.5, weight: 700, color: row.good ? '#17784F' : '#C7374B' });
      var drawCluster = function (dots, circle, col, tag) {
        if (!dots || !dots.length) return;
        dots.forEach(function (d) {
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ox + d.x * pxPerM, cy + d.y * 200, 2.3, 0, Math.PI * 2); ctx.fill();

        }
      };
      drawCluster(row.s.pDots, row.s.P, '#1661FF', 'P');
      drawCluster(row.s.mDots, row.s.M, '#9A5A00', 'M');
      drawCluster(row.s.nDots, row.s.N, '#17784F', 'N');
