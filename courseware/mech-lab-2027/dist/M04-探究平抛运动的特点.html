<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：探究平抛运动的特点</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M04 scene.css — 探究平抛运动的特点：实验台、双装置画布、波形、分析区、诊断与学习部件 */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 36px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:8px 14px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 352px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(62vh,510px);min-height:340px;background:#EAF1F8;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;max-height:min(62vh,510px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:56px}
.side-v{min-width:44px;text-align:center;font-size:13.5px}
.bench-side .chip{min-height:32px;padding:0 9px;font-size:12.5px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 4px}
.side-acts .btn{min-height:38px;padding:0 10px;font-size:13.5px}
.side-acts .btn.full{grid-column:span 2}
.side-tip{font-size:12.5px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:7px 10px;margin-top:4px}
.m04-readout{background:#F6F9FD;border:1px solid var(--line);border-radius:var(--rs);padding:6px 10px;font-size:13px;margin:4px 0;line-height:1.55}
.m04-readout b{color:var(--blue)}
.steps{padding-left:18px;margin:4px 0 0;flex:1 1 auto;overflow-y:auto}
.steps li{margin-bottom:6px;font-size:13.5px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12.5px}
.st-why{color:var(--ink2);font-size:11px;margin-top:1px;line-height:1.35}
.link.sm{font-size:12.5px;min-height:32px;padding:2px 0}
.muted{color:var(--ink2);font-size:13px}

/* 下方数据分析区 */
.analysis{margin-top:14px;background:#fff;border-radius:var(--r);padding:16px 20px;border:1px solid var(--line)}
.ana-h{margin:0 0 6px;font-size:19px}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-hint{background:#EEF4FF;border-radius:var(--rs);padding:8px 12px;margin:8px 0;font-size:14px}
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;align-items:start}
.ana-block{margin-top:10px}
.ana-block h3{font-size:15px;margin:0 0 6px}
.tbl-wrap{overflow-x:auto}
.formula{font-size:15.5px;margin:6px 0;line-height:1.7}
.warnline{color:var(--err);font-weight:600;margin-top:6px;background:#FFF4F5;border:1px solid #F2BFC8;border-radius:var(--rs);padding:8px 12px}

/* 学·原理交互小部件 */
.learn-widget{margin-top:10px}
.m04-w-stage{position:relative;height:210px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0;background:#F8FBFF}
.m04-w-stage.tall{height:236px}
.m04-w-stage.short{height:186px}
.cmp-note{font-size:13.5px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table{width:100%}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp-box{border-radius:var(--rs);padding:10px 12px;font-size:13.5px;background:#F6F9FD;border:1px solid var(--line)}
.cmp-box.good{background:#EEF9F4;border-color:#BCE6D2}
.cmp-box.bad{background:#FFF4F5;border-color:#F2BFC8}

/* 诊·误差 */
.diag{max-width:1180px;margin:0 auto;padding:16px}
.diag-h{font-size:19px;margin:14px 0 4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.err-card{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.err-card.done{border-color:#BCE6D2}
.err-name{font-weight:700}
.err-note{font-size:13px;color:var(--ink2);flex:1}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m04","title":"实验：探究平抛运动的特点","sub":"人教版 必修第二册 第五章 3","chapter":"必修第二册 第五章 3","methods":["化曲为直（正交分解）","对比实验（同时落地）","描迹法与平滑拟合","图像法（y-x² 与 y/x-x）","等间距三点法（Δy=gT²）","频闪照相法"],"learn":[{"id":"L1","title":"实验目的与“化曲为直”思路","widget":"decompose-demo","html":"<p><b>目的：<\/b>探究平抛运动在水平方向和竖直方向上的运动特点，描绘平抛运动的轨迹并求初速度 v₀。<\/p>","steps":["平抛运动的轨迹是一条抛物线。为了把复杂的曲线运动“<b>化曲为直<\/b>”，我们将其正交分解为<b>水平方向<\/b>和<b>竖直方向<\/b>两个分运动分别探究。","<b>水平方向猜想<\/b>：抛出后物体在水平方向不受外力（忽略空气阻力），猜想水平分运动是<b>匀速直线运动<\/b>（相等时间内水平位移相等）。","<b>竖直方向猜想<\/b>：抛出时竖直初速度为 0，只受重力作用，猜想竖直分运动是<b>自由落体运动<\/b>（连续相等时间内的位移差恒为 Δy = gT²）。"]},{"id":"L2","title":"探究竖直分运动：A/B 球同时落地","widget":"ab-demo","html":"<p>利用<b>平抛竖落仪<\/b>对比平抛运动与自由落体运动在竖直方向的下落规律。<\/p>","steps":["<b>实验做法<\/b>：使 A、B 两球处于<b>同一高度<\/b>，用小锤击打弹性金属片，使 A 球沿水平方向飞出（平抛），同时 B 球被松开自由下落（自由落体）。","<b>实验现象<\/b>：改变小锤击打力度（即改变 A 球初速度 v₀）或改变装置离地高度，每次听到的都是一声撞击声——A、B 两球总是<b>同时落地<\/b>。","<b>结论与辨析<\/b>：这说明平抛运动的竖直分运动是<b>自由落体运动<\/b>。注意：① 两球质量<b>不需要<\/b>相等；② 该装置<b>不能<\/b>证明水平方向是匀速直线运动。"]},{"id":"L3","title":"斜槽描迹法装置与操作要求","widget":"chute-check-demo","html":"<p>为了把平抛运动的完整轨迹记录下来并探究水平分运动，需要采用斜槽描迹法。<\/p>","steps":["<b>① 斜槽末端切线必须水平<\/b>：保证小球飞出时初速度沿水平方向。检验方法：把小球轻放在斜槽末端不同位置，小球能保持静止不滚动。","<b>② 背板平面必须竖直<\/b>：利用<b>重锤线<\/b>调整背板在竖直面内，并在白纸上沿重锤线标记竖直方向（y 轴），防止小球撞击背板或坐标系倾斜。","<b>③ 每次从斜槽同一位置由静止释放<\/b>：保证每次到达末端时平抛初速度相同、轨迹重合。<b>斜槽不需要绝对光滑<\/b>——只要释放位置相同，恒定摩擦每次做功相同，出槽速度依然不变。","<b>④ 挡板记录与连线<\/b>：上下移动接球挡板（<b>不必等间距<\/b>）记录多个印迹点，取下白纸后用<b>平滑曲线<\/b>连点，个别偏差较大的点应舍去（不要用折线硬连）。"]},{"id":"L4","title":"坐标原点：球心投影（y = R）","widget":"origin-demo","html":"<p>实验记录的不是小球下沿，而是小球离开斜槽时<b>球心<\/b>走过的轨迹！<\/p>","steps":["钢球有一定半径 R。小球在斜槽末端即将飞出时，球心位于斜槽末端边缘<b>正上方 R 处<\/b>。","因此建立坐标系时，坐标原点 O 必须选在小球出槽口时<b>球心在白纸上的投影点<\/b>（槽口正上方 R 处），而不是槽口末端下沿 O'。","若误以槽口下沿 O' 为原点，则测得的每个纵坐标都偏小 R（y' = y − R），导致 y'-x² 图像不过原点而出现截距 −R，直接套用 v₀ = x{{sqrt|{{frac|g|2y}}}} 也会偏大。"]},{"id":"L5","title":"求平抛初速度 v₀ 的两套方案","widget":"calc-methods-demo","html":"<p>根据轨迹上是否保留了抛出点 O，求初速度分为两套处理方案。<\/p>","steps":["<b>方案一：有抛出点 O<\/b>——由 x = v₀t、y = {{frac|1|2}}gt² 得轨迹方程 y = {{frac|g|2v₀²}}x²。任取离 O 较远的一点 (x, y) 得 v₀ = x{{sqrt|{{frac|g|2y}}}}；更精准的做法是描点作 <b>y-x² 图像<\/b>，若为过原点直线，由斜率 k = {{frac|g|2v₀²}} 得 v₀ = {{sqrt|{{frac|g|2k}}}}。","<b>方案二：无抛出点（已知一段轨迹）<\/b>——在轨迹上选取<b>水平间距相等<\/b>的连续三点 A、B、C（水平距离均为 x），因水平匀速，相邻时间间隔 T 相等；再由竖直方向 Δy = y<sub>BC<\/sub> − y<sub>AB<\/sub> = gT² 得 T = {{sqrt|{{frac|Δy|g}}}}，故 v₀ = {{frac|x|T}} = x{{sqrt|{{frac|g|Δy}}}}。","<b>切忌误用 1:3:5<\/b>：无抛出点时，轨迹首点 A 的竖直分速度 v<sub>Ay<\/sub> 一般不为零，<b>不能<\/b>把 y<sub>AB<\/sub>、y<sub>BC<\/sub> 当成 1:3 或套用 y = {{frac|1|2}}gt²！求中间点 B 的竖直分速度要用中间时刻速度 v<sub>By<\/sub> = {{frac|y<sub>AB<\/sub> + y<sub>BC<\/sub>|2T}}，合速度 v<sub>B<\/sub> = {{sqrt|v₀² + v<sub>By<\/sub>²}}。","<b>拓展（2026 北京卷）<\/b>：若遗忘抛出点而以轨迹上某点 O' 为原点作 <b>y/x - x<\/b> 图像，直线斜率 k = {{frac|g|2v₀²}}、纵截距 b = {{frac|v<sub>O'y<\/sub>|v₀}}，可反推抛出点在 O' 系中的坐标为 (−{{frac|b|2k}}, −{{frac|b²|4k}})。"]},{"id":"L6","title":"频闪照相法与双轨对比拓展","widget":"strobe-demo","html":"<p>人教版教材还给出了利用<b>频闪照相<\/b>或<b>双斜槽对比<\/b>一次性完成水平与竖直分运动探究的方案。<\/p>","steps":["<b>频闪照相法<\/b>：在暗室中用每隔相等时间 T 闪光一次的频闪相机拍摄小球平抛过程，<b>一次发射<\/b>即可在底片上得到等时间间隔的球影位置，避免多次释放的误差。","从频闪照片直接读取相邻水平间距 Δx（近似相等 ⇒ 验证水平匀速）和相邻竖直间距差 Δy = gT²（恒定 ⇒ 验证竖直自由落体），并可直接求 v₀ = {{frac|Δx|T}}。","<b>双斜槽水平对比法<\/b>：两个相同斜槽上下对齐固定，将两球从斜槽同一高度同时静止释放，上槽球平抛、下槽球沿光滑水平板匀速运动——两球总在竖直方向对齐并在落点相遇，直接证明水平分运动是匀速直线运动。"]}],"equipment":[{"id":"chute","name":"斜槽轨道（带定位挡片）","html":"末端必须调至<b>切线水平<\/b>（把小球轻放槽口不滚动）；斜槽上固定定位挡片，保证小球每次从<b>同一位置由静止<\/b>释放。"},{"id":"ball","name":"小钢球","html":"应选择<b>密度大、体积小<\/b>的小钢球（减小空气阻力的相对影响）；坐标原点在小球出槽口时<b>球心<\/b>（槽口正上方半径 R 处）的投影。"},{"id":"plumb","name":"重锤线","html":"靠重力自然竖直下垂，用来校准背板处于<b>竖直平面<\/b>内，并在取下白纸前据此标出竖直方向（y 轴）。"},{"id":"board","name":"竖直背板、坐标纸与复写纸","html":"用图钉把坐标纸（或白纸）与复写纸固定在竖直背板上；运动过程中小球不能碰擦背板，以免改变轨迹。"},{"id":"catcher","name":"可调接球挡板","html":"可上下移动（不必等间距）；钢球落到挡板上挤压复写纸，在坐标纸上留下清晰的轨迹印迹点。"},{"id":"hammer","name":"平抛竖落仪（小锤 + 弹性片）","html":"小锤击打弹性金属片时，A 球水平飞出（平抛）的同时 B 球被松开自由下落（自由落体），通过听落地声音判断是否同时落地。"}],"procedure":[{"id":"P1","title":"调平斜槽末端","how":"固定斜槽，把小球轻放在斜槽末端不同位置，调至小球<b>不滚动<\/b>（末端切线水平）。","why":"只有末端水平，小球离开槽口时的初速度才沿水平方向，才能做平抛运动。","errorId":"E1"},{"id":"P2","title":"重锤线调背板竖直","how":"用<b>重锤线<\/b>校准背板在竖直平面内，并在白纸上沿重锤线画出竖直向下的 y 轴。","why":"背板倾斜会导致小球碰擦背板或使建立的坐标系偏离竖直方向。","errorId":"E5"},{"id":"P3","title":"确定坐标原点（球心投影）","how":"在槽口末端正上方<b>球半径 R 处<\/b>标记小球飞出时球心的投影作为坐标原点 O。","why":"后续印迹点记录的是球心轨迹，若取槽口下沿 O' 会使 y 坐标系统偏小 R。","errorId":"E3"},{"id":"P4","title":"同一位置由静止释放","how":"使小球每次从斜槽上<b>同一位置由静止<\/b>滚下（斜槽无需绝对光滑）。","why":"保证每次飞出斜槽时的初速度相同，不同高度打出的点才能落在同一条抛物线上。","errorId":"E2"},{"id":"P5","title":"移动挡板记录多点","how":"上下移动挡板位置（不必等间距），在不同高度接住小球，记录至少 5 个印迹点。","why":"点太少难以准确拟合抛物线，不同高度充分分布能减小偶然误差。"},{"id":"P6","title":"平滑曲线连线","how":"取下白纸，用<b>平滑曲线<\/b>连接各点，个别明显偏离轨迹的点舍去。","why":"物理规律是连续光滑抛物线，舍去坏点、均匀分布在两侧可减小偶然误差。"},{"id":"P7","title":"y-x² 图像求初速度","how":"以 O 为原点测量各点坐标 (x, y)，描点作 y-x² 直线，由斜率 k = {{frac|g|2v₀²}} 求 v₀。","why":"图像法利用全部数据且能直观检验轨迹是否满足抛物线方程 y ∝ x²。"},{"id":"P8","title":"无抛出点用 Δy = gT²","how":"若只有轨迹中间一段，取水平等间距三点，用 Δy = gT² 求 T 和 v₀ = x/T（切勿套用 1:3:5）。","why":"轨迹首点竖直分速度不为零，不满足初速度为零的自由落体比例关系。","errorId":"E4"}],"errors":[{"id":"E1","name":"斜槽末端不水平（上翘 5°）","noteId":"P1","trigger":"把斜槽/金属片末端向上翘起 5°","config":{"tiltDeg":5},"observe":"对比装置 A 两球落地脉冲时间差 Δt，以及装置 B 的 y-x² 图像是否过原点直线。","consequence":"末端上翘 5° 时小球实际做<b>斜向上抛运动<\/b>：装置 A 中 A 球先微升再落，<b>比 B 球晚落地<\/b>（Δt ≈ +16 ms）；装置 B 的 y-x² 图线向下偏折、不再是过原点直线。","ask":{"stem":"若平抛竖落仪中弹性金属片略向上翘，导致平抛球初速度斜向上，则两球落地情况是？","options":["平抛球比自由落体球先落地","平抛球比自由落体球晚落地","两球依然同时落地","无法比较"],"answer":1,"quizId":"M04:try:E1"},"why":"初速度斜向上时，竖直方向具有向上的初速度分量（v₀ᵧ < 0），小球先上升到最高点再下落，空中总时间大于同高度自由落体时间，因此比自由落体球晚落地；同时轨迹方程含一次项 y = −x tanα + {{frac|g|2v₀²cos²α}}x²，不再满足 y ∝ x²。","questionIds":["G1","G2","G4"]},{"id":"E2","name":"每次从斜槽不同高度释放小球","noteId":"P4","trigger":"将释放模式切换为“每次随机高度”并连续发射 6 次","config":{"randomHeight":true},"observe":"观察白纸上 6 个印迹点能否落在同一条光滑抛物线上。","consequence":"每次释放高度不同，出槽初速度 v₀ 各不相同，印迹点分属于 6 条不同的抛物线——白纸上的点左右散乱，<b>无法连成一条平滑曲线<\/b>，y-x² 图像相关系数严重下降。","ask":{"stem":"为了保证白纸上多次记录的点位于同一条轨迹上，每次释放小球必须满足？","options":["必须用秒表记下每次滚动时间","斜槽必须绝对光滑无摩擦","从斜槽同一位置由静止释放","每次等间距移动接球挡板"],"answer":2,"quizId":"M04:try:E2"},"why":"描迹法靠多次重复实验拼出一条轨迹，前提是每次飞出的初速度 v₀ 大小和方向完全相同。只有每次从同一位置由静止释放，才能保证到达末端时的速度一致。","questionIds":["G3","G6"]},{"id":"E3","name":"坐标原点选在斜槽末端槽口（未加 R）","noteId":"P3","trigger":"把坐标原点从“球心投影 O”切换为“槽口下沿 O'”","config":{"originMode":"rim"},"observe":"对比两种原点选法下的 y-x² 图像截距，以及用单点公式 v₀ = x√(g/2y) 算出的结果。","consequence":"以槽口下沿 O' 为原点时，测得的纵坐标 y' 恒比真实值小一个球半径 R（y' = {{frac|g|2v₀²}}x² − R）：y'-x² 直线出现<b>纵截距 −R<\/b>；若仍用公式 v₀ = x{{sqrt|{{frac|g|2y'}}}} 计算，测得初速度<b>系统性偏大<\/b>（但图像斜率不变）。","ask":{"stem":"若误把斜槽末端槽口下沿当作原点（在球心正下方 R 处），某点横坐标 x 准确而纵坐标测为 y' = y − R，若直接代入 v₀ = x√(g/2y') 计算，结果比真实值？","options":["偏大","偏小","相等","无法确定"],"answer":0,"quizId":"M04:try:E3"},"why":"因 O' 比球心 O 低 R，所有 y' 都比真实下落高度 y 小了 R。由 v₀ = x√(g/2y') 可知，分母 y' 偏小会使算出的 v₀ 偏大；而作 y'-x² 图像时，斜率 k = g/(2v₀²) 不受平移截距影响，仍可求出准确的 v₀。","questionIds":["G2","G3"]},{"id":"E4","name":"无抛出点时误把首点当起点套用 1:3:5","noteId":"P8","trigger":"取轨迹中段三点 A、B、C，误把 A 点当作竖直初速度为零的点","config":{"assumeZeroV0":true},"observe":"比较中段轨迹相邻等时间竖直位移比 y<sub>AB<\/sub> : y<sub>BC<\/sub> 与 1 : 3，以及两种算法算出的 T 和 v₀。","consequence":"中段首点 A 的竖直分速度 v<sub>Ay<\/sub> ≠ 0，y<sub>AB<\/sub> : y<sub>BC<\/sub> 并不等于 1 : 3（如本组模拟为 1 : 1.40）；若错用 y<sub>AB<\/sub> = {{frac|1|2}}gT² 算时间 T，算出的 T <b>偏大<\/b>、初速度 v₀ = Δx/T <b>严重偏小<\/b>！","ask":{"stem":"未知抛出点，在轨迹上取水平等间距 Δx 的连续三点 A、B、C，测得 y<sub>AB<\/sub> = 15 cm、y<sub>BC<\/sub> = 25 cm（g = 10 m/s²），正确求时间间隔 T 的公式是？","options":["y<sub>AB<\/sub> = ½gT²","y<sub>BC<\/sub> − y<sub>AB<\/sub> = gT²","y<sub>AB<\/sub> : y<sub>BC<\/sub> = 1 : 3","y<sub>BC<\/sub> = ½g(2T)²"],"answer":1,"quizId":"M04:try:E4"},"why":"只要 A 不是抛出点，v<sub>Ay<\/sub> > 0，就不能用 ½gT² 或 1:3:5。应利用匀变速直线运动普遍规律 Δy = y<sub>BC<\/sub> − y<sub>AB<\/sub> = gT² 消去 v<sub>Ay<\/sub>，求出 T = √(Δy/g) 后再算 v₀ = Δx/T 和 v<sub>By<\/sub> = (y<sub>AB<\/sub> + y<sub>BC<\/sub>)/(2T)。","questionIds":["G7","Y2"]},{"id":"E5","name":"背板未用重锤线调竖直","noteId":"P2","trigger":"关闭重锤线校准（背板偏斜 6° 且小球易擦碰背板）","config":{"plumbCalibrated":false},"observe":"比较背板竖直校准与偏斜 6° 时记录的轨迹位置和 y-x² 拟合求得的初速度。","consequence":"背板在平面内偏斜 6° 会使坐标系轴向与真实重力方向不重合（x' 轴不再水平），加上小球撞击背板引入额外阻力，轨迹发生畸变、测得 v₀ 出现明显偏差（> 8%）。","ask":{"stem":"实验中固定白纸的背板为什么要利用重锤线调节至竖直平面内？","options":["使小球下落更快","避免小球飞行时撞击背板受额外阻力，并确保所画 y 轴沿竖直方向","为了增大斜槽的倾角","让重锤线帮助测量初速度"],"answer":1,"quizId":"M04:try:E5"},"why":"平抛运动轨迹在一个竖直平面内。若背板不竖直，既可能挡住或擦碰小球引入额外阻力改变轨迹，又会导致坐标纸上的 y 轴不沿重力方向，破坏水平与竖直分运动的独立分解。","questionIds":["G2","G5"]},{"id":"E6","name":"误区：认为斜槽轨道必须绝对光滑","noteId":"P4","trigger":"比较“光滑斜槽 (η=0.85)”与“较粗糙斜槽 (η=0.72)”同一高度多次释放","config":{"compareRough":true},"observe":"观察两条斜槽各自连续 5 次同位置释放的轨迹重合度以及 y-x² 拟合优度 R²。","consequence":"粗糙斜槽飞出的初速度确实比光滑斜槽小一些，但只要<b>每次从同一位置由静止释放<\/b>，5 次飞出的点<b>依然 100% 重合在同一条抛物线上<\/b>（R² > 0.999），完全不影响探究平抛运动特点！","ask":{"stem":"关于“探究平抛运动的特点”实验中斜槽轨道是否需要光滑，下列说法正确的是？","options":["必须绝对光滑，否则飞出后水平方向不做匀速运动","不需要绝对光滑，只要末端水平且每次从同一位置由静止释放即可","越粗糙越好，可以减小空气阻力","斜槽光滑与否不影响出槽初速度大小"],"answer":1,"quizId":"M04:try:E6"},"why":"小球离开斜槽末端后只在空中受重力，与斜槽是否粗糙毫无关系；而在斜槽上滑行时，只要轨道固定且每次从同一位置由静止释放，摩擦阻力做的功每次相同，到达末端的初速度 v₀ 就保持一致。","questionIds":[]}],"reverse":[{"id":"R1","show":{"type":"ab-pulse","config":{"tiltDeg":5}},"stem":"用平抛竖落仪做对比实验时，落地声音传感器采到两个明显分离的脉冲，且 A 球（平抛）比 B 球（自由落体）晚落地约 16 ms。最可能的原因是？","options":["弹性金属片略向上翘，A 球实际作斜向上抛运动","小锤击打力度太大，导致 A 球水平速度过大","A 球质量比 B 球大","两球离地高度太高"],"answer":[0],"replay":"E1","why":"正常水平抛出时竖直初速度为 0，不论击打力度（水平速度）和球的质量多大，A、B 都同时落地。A 比 B 晚落地说明 A 获得了向上的竖直初速度分量，即金属片末端略向上翘。","quizId":"M04:reverse:R1"},{"id":"R2","show":{"type":"scatter","config":{"randomHeight":true}},"stem":"某同学在坐标纸上共打了 6 个钢球印迹点，试图连线时发现各点左右散乱、完全无法用一条光滑抛物线穿过（如图）。最可能的原因是？","options":["斜槽轨道不够光滑","每次从斜槽不同高度由静止释放了钢球","上下移动挡板时没有等间距移动","小球直径测得偏大"],"answer":[1],"replay":"E2","why":"只要释放高度不同，每次飞出的水平初速度 v₀ 就不同，对应的抛物线开口宽窄 y = g x² / (2v₀²) 也不同，各点落在不同抛物线上从而散乱；移动挡板本身不需要等间距。","quizId":"M04:reverse:R2"},{"id":"R3","show":{"type":"yx-x","config":{"k":2.0,"b":0.4}},"stem":"（2026 北京卷思路）某同学忘了标记抛出点，改以轨迹上某点 O' 为原点建立坐标系，描点作出 y/x - x 图像为一条直线，斜率为 k、纵截距为 b。则真正抛出点在 O' 坐标系中的坐标为？","options":["(−{{frac|b|2k}}, −{{frac|b²|4k}})","({{frac|b|2k}}, {{frac|b²|4k}})","(−{{frac|b|k}}, −{{frac|b²|2k}})","(0, −{{frac|b²|2k}})"],"answer":[0],"replay":"E3","why":"设抛出点在 O' 系坐标为 (x₀, y₀)，因 O' 在轨迹上且 y₀ < 0, x₀ < 0，有 y − y₀ = k(x − x₀)²，且在 O'(0,0) 处满足 −y₀ = kx₀²。展开得 y = kx² − 2kx₀ x ⇒ {{frac|y|x}} = kx − 2kx₀。对比直线截距 b = −2kx₀ 得 x₀ = −{{frac|b|2k}}，进而 y₀ = −kx₀² = −{{frac|b²|4k}}。","quizId":"M04:reverse:R3"},{"id":"R4","show":{"type":"rough","config":{}},"stem":"某同学发现实验室的斜槽轨道生锈较粗糙，如果他仍把末端调水平，且每次从斜槽同一位置由静止释放钢球，能否描出一条重合良好的平抛轨迹？","options":["不能，斜槽粗糙会破坏平抛运动水平方向的匀速性","能，恒定摩擦只减小初速度大小，同一位置释放每次出槽速度仍相同","不能，必须在斜槽上涂抹润滑油到完全无摩擦","不能，摩擦会导致竖直方向不再是自由落体"],"answer":[1],"replay":"E6","why":"小球离开斜槽后只受重力，斜槽摩擦不会影响空中的水平匀速与竖直自由落体；同一位置静止释放保证每次在斜槽上损耗的能量相同，出槽初速度 v₀ 仍恒定，轨迹完全重合。","quizId":"M04:reverse:R4"}],"summary":{"principle":"平抛运动 = 水平方向<b>匀速直线运动<\/b>（x = v₀t）+ 竖直方向<b>自由落体运动<\/b>（y = {{frac|1|2}}gt²）。轨迹方程 y = {{frac|g|2v₀²}}x²；有抛出点 v₀ = x{{sqrt|{{frac|g|2y}}}}，无抛出点取水平等间距三点由 Δy = gT² 求 T 与 v₀ = {{frac|x|T}}。","steps":["装置 A（竖落仪）：同高度击打弹性金属片，听/测 A、B 是否同时落地","装置 B 调平：把小球轻放在斜槽末端不滚动（保证初速度水平）","调竖直：用重锤线校直背板并在白纸上标出 y 轴","定原点：取小球出槽口时<b>球心<\/b>在白纸上的投影（槽口正上方 R 处）","描轨迹：每次从斜槽<b>同一位置由静止<\/b>释放，移动挡板记录 5 个以上点","连线处理：平滑曲线连线（舍偏差大点），作 y-x² 图像或用 Δy = gT² 求 v₀"],"notes":[{"do":"斜槽末端切线必须水平","why":"否则初速度斜向上/斜向下，变成斜抛而不是平抛"},{"do":"用重锤线调背板竖直","why":"防止小球碰擦背板并保证 y 轴沿竖直方向"},{"do":"每次从斜槽同一位置由静止释放","why":"保证每次平抛初速度相同；斜槽无需绝对光滑"},{"do":"原点取槽口正上方球心投影（高 R 处）","why":"记录的是球心轨迹，误取槽口下沿会使 y 偏小 R、图像产生截距"},{"do":"用平滑曲线连线，不硬连坏点","why":"移动挡板不必等间距；拟合平滑抛物线减小偶然误差"}],"errors":["斜槽末端上翘：作斜向上抛运动，A 球晚于 B 球落地，y-x² 不再过原点","释放高度不同：每次 v₀ 不同，印迹散乱落不到同一抛物线上","原点选在槽口下沿：y 偏差 −R，单点公式算得 v₀ 偏大，y-x² 截距为 −R（斜率仍准）","未知抛出点套用 1:3:5：首点竖直速度不为 0，必须用 Δy = gT² 和 v<sub>By<\/sub> = (y<sub>AB<\/sub>+y<sub>BC<\/sub>)/2T"],"conclusions":["A/B 球同时落地只证明竖直分运动是自由落体，不能证明水平匀速","y-x² 图像斜率 k = {{frac|g|2v₀²}} ⇒ v₀ = {{sqrt|{{frac|g|2k}}}}","等水平间距三点：T = {{sqrt|{{frac|Δy|g}}}}，v₀ = {{frac|x|T}}，v<sub>By<\/sub> = {{frac|y<sub>AC<\/sub>|2T}}","y/x - x 直线（2026 北京卷）：斜率 k、截距 b ⇒ 抛出点 (−{{frac|b|2k}}, −{{frac|b²|4k}})"]}}</script>
<script type="application/json" id="ml-questions">[{"id":"G1","source":"2026·全国卷·第22题","verified":true,"stem":"某同学利用如图所示装置探究平抛运动竖直方向分运动的特点：将小钢球 A、B 置于同一高度，用小锤击打弹性金属片，使 B 球沿水平方向飞出，同时 A 球被松开做自由落体运动。<svg viewBox=\"0 0 420 205\" width=\"420\" role=\"img\" aria-label=\"平抛竖落仪示意图\"><line x1=\"24\" y1=\"185\" x2=\"396\" y2=\"185\" stroke=\"#10233F\" stroke-width=\"2\"/><g stroke=\"#10233F\" stroke-width=\"1.2\"><line x1=\"40\" y1=\"185\" x2=\"32\" y2=\"195\"/><line x1=\"70\" y1=\"185\" x2=\"62\" y2=\"195\"/><line x1=\"100\" y1=\"185\" x2=\"92\" y2=\"195\"/><line x1=\"130\" y1=\"185\" x2=\"122\" y2=\"195\"/><line x1=\"160\" y1=\"185\" x2=\"152\" y2=\"195\"/><line x1=\"190\" y1=\"185\" x2=\"182\" y2=\"195\"/><line x1=\"220\" y1=\"185\" x2=\"212\" y2=\"195\"/><line x1=\"250\" y1=\"185\" x2=\"242\" y2=\"195\"/><line x1=\"280\" y1=\"185\" x2=\"272\" y2=\"195\"/><line x1=\"310\" y1=\"185\" x2=\"302\" y2=\"195\"/><line x1=\"340\" y1=\"185\" x2=\"332\" y2=\"195\"/><line x1=\"370\" y1=\"185\" x2=\"362\" y2=\"195\"/><\/g><rect x=\"48\" y=\"78\" width=\"72\" height=\"10\" fill=\"#4A5B73\" rx=\"2\"/><rect x=\"108\" y=\"16\" width=\"8\" height=\"42\" fill=\"#8E99A6\"/><rect x=\"114\" y=\"22\" width=\"4\" height=\"64\" fill=\"#10233F\"/><rect x=\"118\" y=\"78\" width=\"40\" height=\"8\" fill=\"#4A5B73\" rx=\"2\"/><path d=\"M56 20 L88 42 L81 51 L49 29 Z\" fill=\"#8E99A6\" stroke=\"#10233F\"/><line x1=\"54\" y1=\"25\" x2=\"30\" y2=\"12\" stroke=\"#7A5C3E\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"104\" cy=\"68\" r=\"10\" fill=\"#C9D1D9\" stroke=\"#10233F\" stroke-width=\"1.4\"/><text x=\"88\" y=\"72\" font-size=\"13\" font-weight=\"700\" fill=\"#10233F\" text-anchor=\"end\">A<\/text><circle cx=\"130\" cy=\"68\" r=\"10\" fill=\"#1661FF\" stroke=\"#10233F\" stroke-width=\"1.4\"/><text x=\"144\" y=\"62\" font-size=\"13\" font-weight=\"700\" fill=\"#1661FF\">B<\/text><line x1=\"104\" y1=\"78\" x2=\"104\" y2=\"175\" stroke=\"#25A870\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><path d=\"M140 68 Q250 72 308 175\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"/><circle cx=\"104\" cy=\"175\" r=\"9\" fill=\"#E8F7F0\" stroke=\"#25A870\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/><circle cx=\"308\" cy=\"175\" r=\"9\" fill=\"#EAF1FF\" stroke=\"#1661FF\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/><text x=\"70\" y=\"13\" font-size=\"12\" fill=\"#10233F\">小锤<\/text><text x=\"126\" y=\"34\" font-size=\"12\" fill=\"#10233F\">弹性金属片<\/text><text x=\"104\" y=\"199\" font-size=\"11\" fill=\"#25A870\" text-anchor=\"middle\">自由落体<\/text><text x=\"308\" y=\"199\" font-size=\"11\" fill=\"#1661FF\" text-anchor=\"middle\">平抛<\/text><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"改变装置距地面的高度多次实验，每次均观察到两球同时落地，说明平抛运动在竖直方向上的分运动是","options":["自由落体运动","匀速直线运动","匀减速直线运动"],"answer":0,"explain":"无论高度如何变化，平抛球 B 与自由落体球 A 总是同时落地，说明两球在竖直方向上的运动规律完全相同，即平抛运动的竖直分运动是自由落体运动。","quizId":"M04:paper:G1:(1)"},{"label":"(2)","type":"text-choice","prompt":"保持高度不变，增加小锤击打弹性金属片的力度，观察到 B 球落地点更远，这说明 B 球的____增大，但两球仍同时落地。","options":["水平抛出初速度","下落加速度","空中运动时间"],"answer":0,"explain":"增加击打力度增大了 B 球的水平初速度 v₀，水平射程 x = v₀t 增大；而竖直高度不变，竖直分运动不受水平初速度影响，两球依然同时落地。","quizId":"M04:paper:G1:(2)"},{"label":"(3)","type":"choice","prompt":"假设某次实验发现 A 球比 B 球早落地，最可能的原因是此次实验中 B 球抛出方向____。","options":["斜向上","斜向下","严格水平且速度更大","严格水平且速度更小"],"answer":0,"replay":"E1","explain":"A 球做自由落体运动。若 B 球抛出方向<b>斜向上<\/b>，则 B 球竖直方向有向上的初速度分量，会先上升再下落，导致空中运动时间变长，从而 A 球比 B 球早落地。","quizId":"M04:paper:G1:(3)"}]},{"id":"G2","source":"2026·浙江1月选考·第14题","verified":true,"stem":"在“探究平抛运动的规律”实验中：<svg viewBox=\"0 0 640 200\" width=\"640\" role=\"img\" aria-label=\"2026浙江1月14题三图\"><g transform=\"translate(10,8)\"><rect x=\"0\" y=\"0\" width=\"190\" height=\"184\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"95\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 1：分运动对比装置<\/text><text x=\"48\" y=\"34\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">甲<\/text><rect x=\"22\" y=\"52\" width=\"24\" height=\"6\" fill=\"#4A5B73\"/><line x1=\"46\" y1=\"36\" x2=\"46\" y2=\"62\" stroke=\"#10233F\" stroke-width=\"2\"/><circle cx=\"40\" cy=\"48\" r=\"4.5\" fill=\"#25A870\"/><circle cx=\"53\" cy=\"48\" r=\"4.5\" fill=\"#1661FF\"/><line x1=\"40\" y1=\"54\" x2=\"40\" y2=\"92\" stroke=\"#25A870\" stroke-dasharray=\"3 2\"/><path d=\"M56 48 Q78 52 86 92\" fill=\"none\" stroke=\"#1661FF\" stroke-dasharray=\"3 2\"/><line x1=\"18\" y1=\"94\" x2=\"92\" y2=\"94\" stroke=\"#10233F\" stroke-width=\"1.4\"/><text x=\"140\" y=\"34\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">乙<\/text><path d=\"M104 38 L122 56 H140\" fill=\"none\" stroke=\"#8E99A6\" stroke-width=\"3\"/><path d=\"M104 82 L122 100 H180\" fill=\"none\" stroke=\"#8E99A6\" stroke-width=\"3\"/><circle cx=\"142\" cy=\"53\" r=\"4\" fill=\"#1661FF\"/><circle cx=\"142\" cy=\"97\" r=\"4\" fill=\"#25A870\"/><path d=\"M144 53 Q166 56 174 96\" fill=\"none\" stroke=\"#1661FF\" stroke-dasharray=\"3 2\"/><text x=\"95\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">乙：双斜槽+光滑水平轨道<\/text><\/g><g transform=\"translate(216,8)\"><rect x=\"0\" y=\"0\" width=\"190\" height=\"184\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"95\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 2：斜槽描迹装置<\/text><rect x=\"54\" y=\"26\" width=\"114\" height=\"134\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.4\"/><path d=\"M14 40 L44 68 H68\" fill=\"none\" stroke=\"#596574\" stroke-width=\"4\"/><circle cx=\"22\" cy=\"42\" r=\"5\" fill=\"#1661FF\"/><line x1=\"68\" y1=\"68\" x2=\"68\" y2=\"154\" stroke=\"#4A5B73\" stroke-dasharray=\"3 2\"/><line x1=\"56\" y1=\"122\" x2=\"164\" y2=\"136\" stroke=\"#D9B98C\" stroke-width=\"6\"/><path d=\"M68 64 Q112 72 136 128\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><circle cx=\"136\" cy=\"128\" r=\"3.5\" fill=\"#C7374B\"/><text x=\"95\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">斜槽、背板与倾斜挡板<\/text><\/g><g transform=\"translate(422,8)\"><rect x=\"0\" y=\"0\" width=\"208\" height=\"184\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"104\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 3：坐标轨迹图<\/text><line x1=\"34\" y1=\"34\" x2=\"192\" y2=\"34\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"34\" y1=\"34\" x2=\"34\" y2=\"164\" stroke=\"#10233F\" stroke-width=\"1.4\"/><text x=\"24\" y=\"34\" font-size=\"11\" fill=\"#10233F\">O<\/text><text x=\"186\" y=\"28\" font-size=\"11\" fill=\"#10233F\">x<\/text><text x=\"22\" y=\"164\" font-size=\"11\" fill=\"#10233F\">y<\/text><path d=\"M34 34 Q102 42 152 156\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"2\"/><circle cx=\"124\" cy=\"118\" r=\"3.5\" fill=\"#C7374B\"/><text x=\"116\" y=\"116\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#C7374B\">A(11.0,15.8)<\/text><circle cx=\"141\" cy=\"133\" r=\"3.8\" fill=\"#1661FF\"/><text x=\"148\" y=\"150\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"700\">B(11.8,19.6)<\/text><text x=\"104\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">单位：cm（A 偏离曲线）<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"为探究平抛运动<b>水平方向<\/b>分运动的特点，应选用图 1 中的____装置。","options":["甲","乙"],"answer":1,"explain":"图 1 甲只能验证竖直分运动是自由落体；图 1 乙中两球从双斜槽同一高度静止释放，上槽球平抛、下槽球沿光滑水平面匀速运动，两球在下方相遇，可探究水平分运动为匀速直线运动。","quizId":"M04:paper:G2:(1)"},{"label":"(2)","type":"multi","prompt":"采用图 2 装置进行实验，下列说法正确的是____（多选）。","options":["调节装置使其背板竖直","调节斜槽使其末端切线水平","以斜槽的末端在白纸上的投影点为坐标原点","钢球在斜槽静止释放的高度应等间距下降"],"answer":[0,1],"replay":"E1","explain":"背板必须竖直（A 正确），斜槽末端切线必须水平（B 正确）。C 错：原点应取球离开槽口时<b>球心<\/b>在白纸上的投影（槽口正上方 R 处）；D 错：每次必须从斜槽<b>同一位置<\/b>由静止释放，才能保证初速度相同。","quizId":"M04:paper:G2:(2)"},{"label":"(3)","type":"text-choice","prompt":"如图 3，抛出点为坐标原点，A 点 (11.0 cm, 15.8 cm) 是记录的印迹，B 点 (11.8 cm, 19.6 cm) 是平滑曲线上的点，为得到小球的水平初速度，应取____点进行计算。","options":["A","B"],"answer":1,"explain":"描迹后已作出平滑曲线，应当选取落在平滑曲线上且离原点较远的点（B 点）来计算，舍去偏离曲线较远的偶然误差点 A。","quizId":"M04:paper:G2:(3)"},{"label":"(4)","type":"numeric","prompt":"取 g = 9.8 m/s²，由所选点坐标求得小球水平初速度 v₀ =（保留两位有效数字）","unit":"m/s","answer":0.59,"tol":0.01,"sig":2,"show":"0.59","explain":"取 B 点 (0.118 m, 0.196 m)，由 y = {{frac|1|2}}gt² 得 t = {{sqrt|{{frac|2 × 0.196|9.8}}}} = 0.20 s，则 v₀ = {{frac|x|t}} = {{frac|0.118|0.20}} m/s = 0.59 m/s。","quizId":"M04:paper:G2:(4)"}]},{"id":"G3","source":"2026·北京卷·第16题","verified":true,"score":10,"stem":"用如图 1 所示装置研究平抛运动。将白纸和复写纸固定在背板上，钢球沿斜槽轨道滑下后飞出，落在水平挡板上挤压出印迹，移动挡板重复实验留下一系列印迹。<svg viewBox=\"0 0 640 198\" width=\"640\" role=\"img\" aria-label=\"2026北京16题三图\"><g transform=\"translate(8,8)\"><rect x=\"60\" y=\"12\" width=\"136\" height=\"148\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.6\"/><rect x=\"68\" y=\"20\" width=\"120\" height=\"132\" fill=\"none\" stroke=\"#4A5B73\" stroke-dasharray=\"4 3\"/><path d=\"M8 32 L46 60 H74\" fill=\"none\" stroke=\"#8E99A6\" stroke-width=\"5\"/><circle cx=\"16\" cy=\"32\" r=\"6\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.4\"/><circle cx=\"74\" cy=\"53\" r=\"6\" fill=\"none\" stroke=\"#12A9C4\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><line x1=\"74\" y1=\"59\" x2=\"74\" y2=\"142\" stroke=\"#10233F\" stroke-width=\"1.3\"/><polygon points=\"74,148 70,138 78,138\" fill=\"#10233F\"/><rect x=\"54\" y=\"114\" width=\"148\" height=\"9\" fill=\"#D9B98C\" stroke=\"#10233F\"/><circle cx=\"172\" cy=\"108\" r=\"6\" fill=\"none\" stroke=\"#12A9C4\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"128\" y=\"10\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">背板与白纸<\/text><text x=\"34\" y=\"100\" font-size=\"11\" fill=\"#10233F\">重锤线<\/text><text x=\"186\" y=\"136\" font-size=\"11\" fill=\"#10233F\">挡板<\/text><text x=\"128\" y=\"178\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 1<\/text><\/g><g transform=\"translate(230,8)\"><line x1=\"24\" y1=\"24\" x2=\"170\" y2=\"24\" stroke=\"#10233F\" stroke-width=\"1.6\"/><line x1=\"24\" y1=\"24\" x2=\"24\" y2=\"156\" stroke=\"#10233F\" stroke-width=\"1.6\"/><text x=\"14\" y=\"22\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">O<\/text><text x=\"164\" y=\"18\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">x<\/text><text x=\"12\" y=\"154\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">y<\/text><path d=\"M24 24 Q95 36 142 146\" fill=\"none\" stroke=\"#10233F\" stroke-width=\"2\"/><text x=\"96\" y=\"178\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 2<\/text><\/g><g transform=\"translate(430,8)\"><line x1=\"34\" y1=\"146\" x2=\"184\" y2=\"146\" stroke=\"#10233F\" stroke-width=\"1.6\"/><line x1=\"34\" y1=\"146\" x2=\"34\" y2=\"18\" stroke=\"#10233F\" stroke-width=\"1.6\"/><text x=\"20\" y=\"160\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">O'<\/text><text x=\"180\" y=\"160\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">x<\/text><text x=\"44\" y=\"28\" font-size=\"13\" font-style=\"italic\" fill=\"#10233F\">y/x<\/text><text x=\"22\" y=\"120\" font-size=\"12\" font-style=\"italic\" fill=\"#10233F\">b<\/text><line x1=\"34\" y1=\"116\" x2=\"174\" y2=\"44\" stroke=\"#10233F\" stroke-width=\"1.8\"/><g stroke=\"#C7374B\" stroke-width=\"1.6\"><line x1=\"54\" y1=\"101\" x2=\"62\" y2=\"109\"/><line x1=\"62\" y1=\"101\" x2=\"54\" y2=\"109\"/><line x1=\"84\" y1=\"86\" x2=\"92\" y2=\"94\"/><line x1=\"92\" y1=\"86\" x2=\"84\" y2=\"94\"/><line x1=\"114\" y1=\"70\" x2=\"122\" y2=\"78\"/><line x1=\"122\" y1=\"70\" x2=\"114\" y2=\"78\"/><line x1=\"146\" y1=\"54\" x2=\"154\" y2=\"62\"/><line x1=\"154\" y1=\"54\" x2=\"146\" y2=\"62\"/><\/g><text x=\"108\" y=\"178\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 3<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"multi","prompt":"下列实验操作必要的是____（多选）。","options":["背板调节到竖直平面内","斜槽轨道的末端保持水平","等间距移动挡板"],"answer":[0,1],"replay":"E1","explain":"背板必须竖直（A 正确），斜槽末端切线必须保持水平（B 正确）；移动挡板是为了得到不同高度的印迹点，不必等间距移动（C 错）。","quizId":"M04:paper:G3:(1)"},{"label":"(2)","type":"choice","prompt":"实验操作时，钢球每次从同一个位置由静止释放，目的是____。","options":["使钢球每次从斜槽轨道的末端飞出的速度相同","减小钢球在斜槽上受到的摩擦力","使斜槽轨道的末端切线保持水平","使相邻印迹点间的水平距离一定相等"],"answer":0,"replay":"E2","explain":"多次释放才能描出多点轨迹，每次从同一位置静止释放可保证到达末端飞出时的初速度大小相同。","quizId":"M04:paper:G3:(2)"},{"label":"(3)","type":"choice","prompt":"如图 2，以抛出点为原点建立坐标系。已知竖直分运动为自由落体运动，为探究水平分运动规律，应在轨迹上怎样选点来确定“相等的时间间隔”？","options":["在 y 轴上从 O 起取纵坐标之比为 1 : 4 : 9 : … 的点，作水平线与轨迹相交","在 y 轴上从 O 起取纵坐标之比为 1 : 2 : 3 : … 的点，作水平线与轨迹相交","在轨迹上每隔相等的弧长取一个点","在 x 轴上取等间距的点，再作竖直线与轨迹相交"],"answer":0,"explain":"因为竖直方向满足 y = {{frac|1|2}}gt²，从抛出点 O 开始，当时间 t 取 T、2T、3T… 时，纵坐标 y₁ : y₂ : y₃ = 1 : 4 : 9 : …（即连续相等时间内的竖直位移之比为 1 : 3 : 5 : …），过这些纵坐标作水平线与轨迹的交点即对应相等的时间间隔。","quizId":"M04:paper:G3:(3)"},{"label":"(4)","type":"expr","prompt":"（第 4 问第 1 空）某同学以轨迹上某点 O' 为原点建立坐标系，作出的 y/x - x 图像斜率为 k、截距为 b（图 3）。则抛出点在 O' 坐标系中的横坐标","lhs":"x₀ =","vars":{"b":"b","k":"k"},"extra":["1","2","4"],"answer":"-b/(2*k)","show":"−b ÷ (2k)","explain":"设抛出点在 O' 系中为 (x₀, y₀)，轨迹满足 y − y₀ = k(x − x₀)²，且 O'(0, 0) 在轨迹上故 −y₀ = kx₀²。展开得 {{frac|y|x}} = kx − 2kx₀，对比截距 b = −2kx₀ 得 x₀ = −{{frac|b|2k}}。","quizId":"M04:paper:G3:(4)"},{"label":"(5)","type":"expr","prompt":"（第 4 问第 2 空）抛出点在 O' 坐标系中的纵坐标","lhs":"y₀ =","vars":{"b":"b","k":"k"},"extra":["1","2","4"],"answer":"-b^2/(4*k)","show":"−b² ÷ (4k)","explain":"由 −y₀ = kx₀² 与 x₀ = −{{frac|b|2k}} 代入，得 y₀ = −k(−{{frac|b|2k}})² = −{{frac|b²|4k}}。","quizId":"M04:paper:G3:(5)"}]},{"id":"G4","source":"2025·贵州卷·第11题","verified":true,"stem":"在“探究平抛运动的特点”实验中，某同学用高速摄像机录制小钢球平抛过程，提取每隔 T = 0.05 s 小钢球的位置，测得相邻两个位置的水平间距 Δx 和竖直间距 Δy 如下表所示：<table class=\"dt\"><tr><th>间隔序号<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><tr><th>水平间距 Δx / m<\/th><td>0.0517<\/td><td>0.0514<\/td><td>0.0505<\/td><td>0.0504<\/td><\/tr><tr><th>竖直间距 Δy / m<\/th><td>0.0975<\/td><td>0.1217<\/td><td>0.1465<\/td><td>0.1704<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"text-choice","prompt":"安装器材时，固定斜槽轨道并使其末端","options":["水平","略向上翘","略向下倾"],"answer":0,"replay":"E1","explain":"只有斜槽末端切线水平，钢球飞出时初速度才沿水平方向，运动才是平抛运动。","quizId":"M04:paper:G4:(1)"},{"label":"(2)","type":"numeric","prompt":"充分利用数据算得小钢球水平方向速度大小为（保留 2 位小数）","unit":"m/s","answer":1.02,"tol":0.015,"sig":3,"show":"1.02","explain":"平均每段水平位移 {{bar|Δx}} = {{frac|0.0517 + 0.0514 + 0.0505 + 0.0504|4}} = 0.0510 m，故水平速度 vₓ = {{frac|0.0510|0.05}} m/s = 1.02 m/s。","quizId":"M04:paper:G4:(2)"},{"label":"(3)","type":"numeric","prompt":"利用逐差法算得小钢球竖直方向加速度大小为（保留 2 位小数）","unit":"m/s²","answer":9.77,"tol":0.02,"sig":3,"show":"9.77","explain":"四段逐差法：a = {{frac|(y₃ + y₄) − (y₁ + y₂)|4T²}} = {{frac|(0.1465 + 0.1704) − (0.0975 + 0.1217)|4 × 0.05²}} m/s² = 9.77 m/s²。","quizId":"M04:paper:G4:(3)"}]},{"id":"G5","source":"2025·天津卷·第9题","verified":true,"stem":"某实验小组探究平抛运动的特点：<br>（1）采用图 1 装置，在竖直背板上固定白纸和复写纸，钢球从斜槽末端水平飞出落在挡板上留下痕迹点。<br>（2）利用视频分析软件得到钢球平抛过程的水平位移和竖直位移随时间变化的图像如图 2 所示。<svg viewBox=\"0 0 600 220\" width=\"600\" role=\"img\" aria-label=\"2025天津9题实验图与位移时间图\"><g transform=\"translate(16,10)\"><rect x=\"50\" y=\"14\" width=\"140\" height=\"150\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.5\"/><path d=\"M4 22 L40 44 H76\" fill=\"none\" stroke=\"#10233F\" stroke-width=\"5\"/><circle cx=\"16\" cy=\"24\" r=\"5\" fill=\"#8E99A6\" stroke=\"#10233F\"/><line x1=\"74\" y1=\"46\" x2=\"74\" y2=\"164\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"62\" y1=\"46\" x2=\"62\" y2=\"154\" stroke=\"#4A5B73\" stroke-width=\"1.2\"/><rect x=\"72\" y=\"110\" width=\"94\" height=\"8\" fill=\"#D9B98C\" stroke=\"#10233F\"/><line x1=\"34\" y1=\"164\" x2=\"206\" y2=\"164\" stroke=\"#10233F\" stroke-width=\"1.5\"/><text x=\"108\" y=\"196\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">图 1<\/text><\/g><g transform=\"translate(250,10)\"><rect x=\"58\" y=\"10\" width=\"256\" height=\"168\" fill=\"#fff\" stroke=\"#10233F\" stroke-width=\"1.2\"/><g stroke=         : (majX ? 'rgba(18,169,196,0.32)' : 'rgba(18,169,196,0.11)');
      ctx.lineWidth = majX ? 1 : 0.7;
      ctx.beginPath(); ctx.moveTo(posX, 0); ctx.lineTo(posX, b.boardH); ctx.stroke();
      if (majX && cxIdx > 0 && cxIdx <= 55) {
        D.text(ctx, String(cxIdx), posX, -4, { align: 'center', size: 10, color: dark ? '#9FB3CC' : '#4A5B73' });
      }
    }
    for (var cyIdx = 0; cyIdx <= maxCmY; cyIdx++) {
      var posY = cyIdx * step1, majY = cyIdx % 5 === 0;
      ctx.strokeStyle = dark
        ? (majY ? 'rgba(132,181,255,0.28)' : 'rgba(132,181,255,0.10)')
        : (majY ? 'rgba(18,169,196,0.32)' : 'rgba(18,169,196,0.11)');
      ctx.lineWidth = majY ? 1 : 0.7;
      ctx.beginPath(); ctx.moveTo(0, posY); ctx.lineTo(b.boardW, posY); ctx.stroke();
      if (majY && cyIdx > 0 && cyIdx <= 45) {
        D.text(ctx, String(cyIdx), -4, posY + 3, { align: 'right', size: 10, color: dark ? '#9FB3CC' : '#4A5B73' });
      }
    }
    // x / y 轴
    var oyOff = sb.originMode === 'rim' ? PR.BALL_R * b.ppm : 0;
    ctx.strokeStyle = dark ? '#7CF0B4' : '#10233F'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, oyOff); ctx.lineTo(b.boardW + 6, oyOff); ctx.moveTo(0, oyOff); ctx.lineTo(0, b.boardH + 6); ctx.stroke();
    D.text(ctx, 'x/cm', b.boardW + 6, oyOff + 14, { align: 'right', size: 11, weight: 700, color: dark ? '#7CF0B4' : '#10233F' });
    D.text(ctx, 'y/cm', 4, b.boardH + 10, { size: 11, weight: 700, color: dark ? '#7CF0B4' : '#10233F' });

    // 原点标注（O vs O'）
    var rPx = PR.BALL_R * b.ppm;
    ctx.strokeStyle = '#12A9C4'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, rPx, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = sb.originMode === 'center' ? '#1661FF' : '#C7374B';
    ctx.beginPath(); ctx.arc(0, oyOff, 4, 0, Math.PI * 2); ctx.fill();
    D.text(ctx, sb.originMode === 'center' ? 'O(球心)' : "O'(槽口偏R)", 8, oyOff - 4, {
      size: 11, weight: 700, color: sb.originMode === 'center' ? '#1661FF' : '#C7374B'
    });
    ctx.restore();

    // 斜槽支架与轨道（末端位置在 (b.ox, b.oy + rPx)）
    var exitX = b.ox, exitY = b.oy + rPx;
    var dropPx = sb.hDrop * b.ppm * 0.72;
    var slopeLen = Math.min(b.ox - 24, 150);
    var flatLen = 46;
    var startX = exitX - flatLen - slopeLen * 0.78;
    var startY = exitY - dropPx;
    ctx.fillStyle = '#596574';
    ctx.fillRect(exitX - flatLen - 8, exitY + 4, 10, hh - 18 - exitY - 4);
    ctx.fillRect(startX + 18, startY + 20, 8, hh - 18 - startY - 20);

    // 重锤线（始终真竖直向下）
    var plumbX = exitX + 2;
    ctx.strokeStyle = sb.plumbCalibrated ? '#25A870' : '#C7374B';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(plumbX, exitY + 4); ctx.lineTo(plumbX, b.oy + b.boardH - 8); ctx.stroke();
    ctx.fillStyle = sb.plumbCalibrated ? '#25A870' : '#C7374B';
    ctx.beginPath();
    ctx.moveTo(plumbX, b.oy + b.boardH + 4);
    ctx.lineTo(plumbX - 5, b.oy + b.boardH - 8);
    ctx.lineTo(plumbX + 5, b.oy + b.boardH - 8);
    ctx.closePath(); ctx.fill();
    D.text(ctx, sb.plumbCalibrated ? '重锤线(竖直)' : '背板与重锤线偏斜 6°!', plumbX + 8, b.oy + b.boardH - 12, {
      size: 11, weight: 700, color: sb.plumbCalibrated ? '#17784F' : '#C7374B'
    });

    // 斜槽轨道
    var tiltRad = -sb.tiltDeg * Math.PI / 180; // 正角度向上翘
    var endTipX = exitX, endTipY = exitY + Math.tan(tiltRad) * 28;
    ctx.strokeStyle = sb.chuteRough ? '#7A5C3E' : '#4A5B73';
    ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(exitX - flatLen, exitY);
    ctx.lineTo(endTipX, endTipY);
    ctx.stroke();
    ctx.strokeStyle = sb.chuteRough ? '#B8895A' : '#D5DCE3';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.lineCap = 'butt';

    // 定位挡片
    var dxS = (exitX - flatLen) - startX, dyS = exitY - startY;
    var norm = Math.hypot(dxS, dyS) || 1;
    var nx = -dyS / norm, ny = dxS / norm;
    var blkX = startX + 12 * (dxS / norm), blkY = startY + 12 * (dyS / norm);
    ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(blkX - nx * 10, blkY - ny * 10); ctx.lineTo(blkX + nx * 10, blkY + ny * 10); ctx.stroke();
    D.text(ctx, sb.randomHeight ? '随机释放高度' : '定位挡片(固定高度)', startX - 4, startY - 14, {
      size: 11, weight: 600, color: sb.randomHeight ? '#C7374B' : '#10233F'
    });
    if (sb.tiltDeg !== 0) {
      D.text(ctx, '末端' + (sb.tiltDeg > 0 ? '上翘 +' : '下倾 ') + sb.tiltDeg + '°', exitX - 18, exitY - 18, {
        align: 'right', size: 11.5, weight: 700, color: '#C7374B'
      });
    }
  };

  /* ---------- 动态层 ---------- */
  Bench.prototype.drawFg = function (ctx, w, hh) {
    this.hot = [];
    if (w < 80 || hh < 80) return;
    if (this.app === 'A') { this.drawFgA(ctx, w, hh); return; }
    this.drawFgB(ctx, w, hh);
  };

  Bench.prototype.drawFgA = function (ctx, w, hh) {
    var g = this.geoA(w, hh), sa = this.stA;
    var px = g.pivotX, ly = g.launchY, r = 11;
    // 支架平台
    ctx.fillStyle = D.grad(ctx, px - 42, ly, px + 36, ly + 10, ['#9AA8B8', '#6B7A8C']);
    D.rr(ctx, px - 42, ly + r, 78, 9, 3); ctx.fill();
    // 高度拖动把手（置于平台下方，避免遮挡 B 球标签）
    ctx.fillStyle = '#12A9C4';
    D.rr(ctx, px - 58, ly + 24, 24, 24, 6); ctx.fill();
    D.text(ctx, '↕', px - 46, ly + 41, { align: 'center', size: 13, color: '#fff', weight: 700 });
    this.hot.push({ id: 'handleH', x: px - 68, y: ly + 14, w: 46, h: 46, label: '调高度 H' });
    D.text(ctx, 'H = ' + sa.H.toFixed(2) + ' m', px - 64, ly + 40, { align: 'right', size: 12, weight: 700, color: '#10233F' });

    // 弹性金属片（倾斜显示）
    var plateAngle = (sa.running ? 0.14 : 0) + (-sa.tiltDeg * Math.PI / 180);
    ctx.save();
    ctx.translate(px + 6, ly - 24);
    ctx.rotate(plateAngle);
    ctx.fillStyle = sa.tiltDeg !== 0 ? '#C7374B' : '#3B4B60';
    ctx.fillRect(-2, 0, 5, 36);
    ctx.restore();

    // 小锤
    var hamRot = sa.running || sa.done ? 0.42 : -0.35;
    ctx.save();
    ctx.translate(px - 22, ly - 32);
    ctx.rotate(hamRot);
    ctx.strokeStyle = '#7A5C3E'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-22, -14); ctx.lineTo(8, 12); ctx.stroke();
    ctx.fillStyle = '#8E99A6'; D.rr(ctx, 4, 6, 12, 18, 2); ctx.fill();
    ctx.restore();
    this.hot.push({ id: 'hammer', x: px - 48, y: ly - 56, w: 72, h: 52, label: '用小锤击打' });

    // 轨迹虚线
    if (sa.sim) {
      ctx.strokeStyle = 'rgba(22,97,255,0.42)'; ctx.lineWidth = 1.6; ctx.setLineDash([4, 4]);
      ctx.beginPath();
      var steps = 28;
      for (var i = 0; i <= steps; i++) {
        var tt = (i / steps) * Math.min(sa.t, sa.sim.tA);
        var pt = sa.sim.at(tt);
        var sx = px + 20 + pt.xA * g.ppm, sy = ly + pt.yA * g.ppm;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(37,168,112,0.42)';
      ctx.beginPath(); ctx.moveTo(px - 8, ly); ctx.lineTo(px - 8, ly + (sa.sim.at(sa.t).yB) * g.ppm); ctx.stroke();
      ctx.setLineDash([]);
    }

    // B 球（绿：自由落体）与 A 球（蓝：平抛）
    var pos = sa.sim ? sa.sim.at(sa.t) : { xA: 0, yA: 0, yB: 0 };
    var bx = px - 8, by = Math.min(g.floorY - r, ly + pos.yB * g.ppm);
    var ax = px + 20 + pos.xA * g.ppm, ay = Math.min(g.floorY - r, ly + pos.yA * g.ppm);
    drawBall(ctx, bx, by, r, '#7CF0B4', '#17784F');
    drawBall(ctx, ax, ay, r, '#84B5FF', '#1661FF');
    D.text(ctx, 'B(自由)', bx - 14, by + 4, { align: 'right', size: 11.5, weight: 700, color: '#17784F' });
    D.text(ctx, 'A(平抛)', ax + 14, ay + 4, { size: 11.5, weight: 700, color: '#1661FF' });

    if (sa.tiltDeg !== 0) {
      D.text(ctx, '金属片末端' + (sa.tiltDeg > 0 ? '上翘 +' : '下倾 ') + sa.tiltDeg + '°', px + 34, ly - 24, {
        size: 12, weight: 700, color: '#C7374B'
      });
    }
    // 声音双脉冲条
    drawSoundStrip(ctx, 16, g.floorY + 14, w - 32, g.waveH - 8, sa.sim, sa.t);
  };

  Bench.prototype.drawFgB = function (ctx, w, hh) {
    var b = this.geoB(w, hh), sb = this.stB;
    var phi = (sb.plumbCalibrated ? 0 : 6) * Math.PI / 180;
    var dark = sb.subMode === 'strobe';
    var oyOff = sb.originMode === 'rim' ? PR.BALL_R * b.ppm : 0;

    // 在纸面上绘制记录点、平滑连线或频闪球影
    ctx.save();
    ctx.translate(b.ox, b.oy);
    ctx.rotate(phi);

    // 挡板描迹模式的点与连线
    if (sb.subMode === 'catcher') {
      if (sb.analyzed && sb.dots.length >= 2) {
        var an = PR.analyzeOriginPts(sb.dots, PR.G);
        if (isFinite(an.fit.k) && an.fit.k > 0) {
          ctx.strokeStyle = '#1661FF'; ctx.lineWidth = 2;
          ctx.beginPath();
          var started = false;
          for (var xm = 0; xm <= 0.56; xm += 0.01) {
            var ym = an.fit.k * xm * xm + an.fit.b;
            if (ym < -0.04 || ym > 0.48) continue;
            var px = xm * b.ppm, py = oyOff + ym * b.ppm;
            if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
      }
      for (var i = 0; i < sb.dots.length; i++) {
        var d = sb.dots[i], dx = d.x * b.ppm, dy = oyOff + d.y * b.ppm;
        ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(dx, dy, 4.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        D.text(ctx, String(i + 1), dx + 7, dy - 4, { size: 10.5, weight: 700, color: '#C7374B' });
      }
    } else if (sb.strobePts && sb.strobePts.length) {
      // 频闪球影
      var pts = sb.strobePts;
      for (i = 0; i < pts.length; i++) {
        var sp = pts[i], sx = sp.x * b.ppm, sy = oyOff + sp.y * b.ppm;
        ctx.strokeStyle = 'rgba(124,240,180,0.45)'; ctx.setLineDash([2, 2]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, sy); ctx.moveTo(0, sy); ctx.lineTo(sx, sy); ctx.stroke();
        ctx.setLineDash([]);
        drawBall(ctx, sx, sy, 6.5, '#FFFFFF', '#84B5FF');
        D.text(ctx, String(i), sx + 9, sy - 6, { size: 10.5, weight: 700, color: '#7CF0B4' });
      }
    }
    ctx.restore();

    // 水平接球挡板（可拖动）
    if (sb.subMode === 'catcher') {
      var pyPlate = b.oy + sb.plateY * b.ppm;
      ctx.fillStyle = D.grad(ctx, 0, pyPlate, 0, pyPlate + 10, ['#E6CBA2', '#B8915C']);
      D.rr(ctx, b.ox - 6, pyPlate, b.boardW + 16, 10, 3); ctx.fill();
      ctx.strokeStyle = '#7A5C3E'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = '#12A9C4'; D.rr(ctx, b.ox + b.boardW - 18, pyPlate - 7, 26, 24, 6); ctx.fill();
      D.text(ctx, '↕', b.ox + b.boardW - 5, pyPlate + 9, { align: 'center', size: 13, color: '#fff', weight: 700 });
      D.text(ctx, '挡板 y = ' + (sb.plateY * 100).toFixed(1) + ' cm', b.ox + b.boardW - 24, pyPlate + 22, {
        align: 'right', size: 11, weight: 700, color: '#0E8CA3'
      });
      this.hot.push({ id: 'plate', x: b.ox - 10, y: pyPlate - 18, w: b.boardW + 30, h: 46, label: '上下拖动挡板' });
    }

    // 正在运动的小钢球或轻放检验球
    var rExit = PR.BALL_R * b.ppm;
    var rBall = Math.max(6, rExit);
    var exitX = b.ox, exitY = b.oy + rExit;
    var dropPx = sb.hDrop * b.ppm * 0.72;
    var slopeLen = Math.min(b.ox - 24, 150), flatLen = 46;
    var startX = exitX - flatLen - slopeLen * 0.78, startY = exitY - dropPx;

    if (this.levelTest) {
      var lt = this.levelTest;
      var tiltRad = -sb.tiltDeg * Math.PI / 180;
      var lx = exitX - 18 + lt.s * Math.cos(tiltRad);
      var ly = exitY + (lx - (exitX - flatLen)) * Math.tan(tiltRad) - rBall;
      drawBall(ctx, lx, ly, rBall, '#F1F5F9', '#64748B');
      D.text(ctx, sb.tiltDeg === 0 ? '轻放静止 → 末端水平 ✓' : '小球滚落 → 末端不水平!', exitX + 16, exitY - 20, {
        size: 12, weight: 700, color: sb.tiltDeg === 0 ? '#17784F' : '#C7374B'
      });
    } else if (sb.ball) {
      var bl = sb.ball;
      if (bl.phase === 'chute') {
        var u = bl.u, bx0, by0;
        var tipRad = -sb.tiltDeg * Math.PI / 180;
        var tipY = exitY + Math.tan(tipRad) * 28;
        if (u < 0.72) {
          var f = u / 0.72;
          bx0 = startX + 16 + f * (exitX - flatLen - startX - 16);
          var fLine = (bx0 - startX) / Math.max(1, exitX - flatLen - startX);
          by0 = startY + fLine * (exitY - startY) - rBall;
        } else {
          var f2 = (u - 0.72) / 0.28;
          bx0 = exitX - flatLen + f2 * flatLen;
          var flatEndOff = (bx0 > exitX - 28 && sb.tiltDeg !== 0) ? ((bx0 - (exitX - 28)) / 28) * (tipY - exitY) : 0;
          by0 = exitY + flatEndOff - rBall;
        }
        drawBall(ctx, bx0, by0, rBall, '#F1F5F9', '#64748B');
      } else {
        var wPt = bl.launch.worldAtT(bl.t);
        drawBall(ctx, b.ox + wPt.x * b.ppm, b.oy + wPt.y * b.ppm, rBall, '#F1F5F9', '#64748B');
      }
    } else {
      // 静止在挡片处
      var restSlope = (18 / Math.max(1, exitX - flatLen - startX)) * (exitY - startY);
      drawBall(ctx, startX + 18, startY + restSlope - rBall, rBall, '#F1F5F9', '#64748B');
    }
    if (dark) {
      D.text(ctx, '频闪暗室（T = ' + (sb.strobeT * 1000).toFixed(0) + ' ms）', b.ox + b.boardW - 8, b.oy + b.boardH - 10, {
        align: 'right', size: 11.5, weight: 700, color: '#7CF0B4'
      });
    }
  };

  /* ---------- 指针交互 ---------- */
  Bench.prototype.bindPointer = function () {
    var self = this, dragId = null, y0 = 0, v0 = 0, magOn = false;
    function showMagAt(p) {
      var b = self.geoB(self.stage.w, self.stage.h), sb = self.stB;
      var phi = (sb.plumbCalibrated ? 0 : 6) * Math.PI / 180;
      var dx = p.x - b.ox, dy = p.y - b.oy;
      var xm = (dx * Math.cos(phi) + dy * Math.sin(phi)) / b.ppm;
      var ym = (-dx * Math.sin(phi) + dy * Math.cos(phi)) / b.ppm - (sb.originMode === 'rim' ? PR.BALL_R : 0);
      var cvs = [self.stage.layer('bg').canvas, self.stage.layer('fg').canvas];
      self.mag.show(cvs, p.x, p.y, self.stage.dpr, '(' + (xm * 100).toFixed(1) + ', ' + (ym * 100).toFixed(1) + ') cm');
    }
    ML.stage.pointer(this.stage.layer('fg').canvas, {
      down: function (p) {
        var hs = self.hot || [];
        dragId = null; magOn = false;
        for (var i = hs.length - 1; i >= 0; i--) {
          var r = hs[i];
          if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { dragId = r.id; break; }
        }
        y0 = p.y;
        if (dragId === 'handleH') v0 = self.stA.H;
        else if (dragId === 'plate') v0 = self.stB.plateY;
      },
      move: function (p) {
        if (dragId === 'handleH' && !self.stA.running) {
          var g = self.geoA(self.stage.w, self.stage.h);
          self.stA.H = P.clamp(Math.round((v0 - (p.y - y0) / g.ppm) * 20) / 20, 0.40, 1.50);
          self.stA.done = false; self.stA.sim = null;
          self.stage.invalidate('fg'); self.renderSide();
        } else if (dragId === 'plate' && !(self.stB.ball)) {
          var b = self.geoB(self.stage.w, self.stage.h);
          self.stB.plateY = P.clamp(Math.round((v0 + (p.y - y0) / b.ppm) * 100) / 100, 0.04, 0.42);
          self.stage.invalidate('fg'); self.renderSide();
        } else if (magOn && self.app === 'B') {
          showMagAt(p);
        }
      },
      press: function (p) {
        if (self.app === 'B' && !dragId) {
          magOn = true;
          showMagAt(p);
        }
      },
      up: function (p, a) {
        magOn = false;
        self.mag.hide();
        if (!a.moved && dragId === 'hammer') self.fireA();
        dragId = null;
        void p;
      }
    });
  };

  /* ---------- 动作与动画 ---------- */
  Bench.prototype.fireA = function () {
    var sa = this.stA;
    if (sa.running) return;
    if (this.guided() && sa.tiltDeg !== 0) {
      this.block('弹性金属片末端必须保持水平（0°），否则 A 球做斜抛而不是平抛！', 'E1');
      return;
    }
    this.setBanner(null);
    sa.sim = PR.simulateAB({ H: sa.H, v0: sa.v0, tiltDeg: sa.tiltDeg, ideal: S.ideal }, (seedCounter += 7));
    sa.t = 0; sa.running = true; sa.done = false;
    this.loop.start();
    this.renderSide();
  };

  Bench.prototype.testLevel = function () {
    var sb = this.stB;
    if (sb.ball) return;
    this.levelTest = { t: 0, s: 0, done: false };
    this.loop.start();
    if (sb.tiltDeg === 0) {
      this.doneB.P1 = true;
      ML.toast('轻放检验：小球静止在斜槽末端，说明末端切线水平 ✓', 'ok');
    } else {
      ML.toast('轻放检验：小球沿倾斜末端滚出，请先调回 0° 水平！', 'warn');
    }
    this.renderSide();
  };

  Bench.prototype.checkGuidedB = function () {
    var sb = this.stB;
    if (sb.tiltDeg !== 0) { this.block('斜槽末端切线必须调至水平（0°）。', 'E1'); return false; }
    if (!sb.plumbCalibrated) { this.block('背板必须先用重锤线校准至竖直平面内。', 'E5'); return false; }
    if (sb.originMode === 'rim') { this.block('坐标原点应取小球出槽口时的球心投影 O（槽口正上方 R 处）。', 'E3'); return false; }
    if (sb.randomHeight) { this.block('每次必须从斜槽同一固定高度由静止释放小球。', 'E2'); return false; }
    return true;
  };

  Bench.prototype.fireB = function (instant) {
    var sb = this.stB;
    if (sb.ball) return;
    this.levelTest = null;
    if (this.guided() && !this.checkGuidedB()) return;
    this.setBanner(null);
    var launch = PR.launchChute({
      hDrop: sb.hDrop, tiltDeg: sb.tiltDeg, plumbCalibrated: sb.plumbCalibrated,
      originMode: sb.originMode, chuteRough: sb.chuteRough, randomHeight: sb.randomHeight, ideal: S.ideal
    }, (seedCounter += 11));

    if (sb.subMode === 'strobe') {
      var pts = launch.strobePoints(sb.strobeT, 0.46);
      if (instant) {
        sb.strobePts = pts; sb.analyzed = true;
        this.doneB.P5 = true; this.doneB.P6 = true; this.doneB.P8 = true;
        this.stage.invalidate('fg'); this.renderSide(); this.renderAnalysis();
        return;
      }
      sb.strobePts = [];
      sb.ball = { phase: 'chute', u: 0, t: 0, launch: launch, strobeAll: pts, endT: pts.length ? pts[pts.length - 1].t : 0.30 };
      this.loop.start();
      this.renderSide();
      return;
    }

        rngEl.value = tVal.toFixed(2);
        stg.invalidate('bg'); return true;
      });
      stg.on('bg', function (ctx, w, hh) {
        if (w < 60 || hh < 60) return;
        ctx.fillStyle = '#F8FBFF'; ctx.fillRect(0, 0, w, hh);
        var ox = 54, oy = 32, g = 9.8, v0 = 1.4, ppmX = (w - 90) / 0.44, ppmY = (hh - 54) / 0.45;
        ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.4;

        D.text(ctx, '水平分运动：x = v₀t（等距）', w - 24, oy - 10, { align: 'right', size: 11.5, weight: 700, color: '#1661FF' });
        D.text(ctx, '竖直：1:3:5', 6, oy + 14, { size: 11, weight: 700, color: '#25A870' });

          ctx.setLineDash([]);
          ctx.fillStyle = '#1661FF'; ctx.beginPath(); ctx.arc(px, oy, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#25A870'; ctx.beginPath(); ctx.arc(ox, py, 4, 0, Math.PI * 2); ctx.fill();
