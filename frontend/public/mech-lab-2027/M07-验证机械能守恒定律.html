<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：验证机械能守恒定律</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M07 scene.css — 验证机械能守恒定律：竖直落体台、气轨光电门、纸带能量分析、教学部件 */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 40px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:8px 14px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 346px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(58vh,480px);min-height:330px;background:#EAF1F8;border-radius:var(--r);overflow:hidden}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;max-height:calc(58vh + 180px);display:flex;flex-direction:column;overflow:hidden}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:7px 0 5px}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:5px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:54px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.side-acts .btn.sm{grid-column:span 2}
.side-tip{font-size:13px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:8px 10px}
.btn.pulse{border-color:var(--warn);background:#FFF3DB;color:#9A5A00}
.steps{padding-left:20px;margin:0;flex:1 1 auto;overflow-y:auto}
.steps li{margin-bottom:7px;font-size:13.5px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12.5px}
.st-why{color:var(--ink2);font-size:11px;margin-top:1px;line-height:1.35}
.link.sm{font-size:12.5px;min-height:32px;padding:2px 0}
.gate-t{width:100%;margin-top:8px}
.gate-res{margin-top:8px;font-size:14px;line-height:1.9}
.muted{color:var(--ink2);font-size:13px}
.analysis{margin-top:14px;background:#fff;border-radius:var(--r);padding:14px 18px}
.ana-h{margin:0 0 6px;font-size:20px}
.ana-tapes,.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-hint{background:#EEF4FF;border-radius:var(--rs);padding:8px 12px;margin:8px 0;font-size:14px}
.twomm-badge{border-radius:var(--rs);padding:8px 12px;margin:8px 0;font-size:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.twomm-badge.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.twomm-badge.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:#A12738}
.ana-strip{border:1px solid var(--line);border-radius:var(--rs);position:relative}
.tape-strip{position:relative;width:100%;background:#fff}
.ana-ctl{margin-top:8px}
.ana-block{margin-top:14px}
.ana-block h3{font-size:15px;margin:0 0 6px}
.tbl-wrap{overflow-x:auto}
.warnline{color:var(--err);font-weight:600;margin-top:6px;background:#FFF4F5;border:1px solid #F2BFC8;border-radius:var(--rs);padding:8px 12px}
.okline{color:#17784F;font-weight:600;margin-top:6px;background:#EEF9F4;border:1px solid #BCE6D2;border-radius:var(--rs);padding:8px 12px}
.chip.bad-on{border-color:var(--err);background:#FDECEF;color:var(--err);font-weight:700}
.learn-widget{margin-top:12px}
.widget-stage{position:relative;height:176px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.cmp-note{font-size:14px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-table th.bad{color:var(--err)}
.diag{max-width:1180px;margin:0 auto;padding:16px}
.diag-h{font-size:19px;margin:14px 0 4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.err-card{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.err-card.done{border-color:#BCE6D2}
.err-name{font-weight:700}
.err-note{font-size:13px;color:var(--ink2);flex:1}
.err-card .btn{align-self:flex-start}
@media (max-width:900px),(orientation:portrait){
  .bench-row{grid-template-columns:1fr}
  .bench-stage{height:min(46vh,68vw);min-height:270px}
  .bench-side{max-height:none;overflow:visible}
  .steps{overflow:visible}
}
@media (max-height:640px) and (orientation:landscape) and (min-width:901px){
  .bench{padding:5px 10px 6px}
  .bench-top{margin-bottom:4px;gap:5px}
  .seg .chip{min-height:31px;font-size:12.5px;padding:0 9px}
  .bench-top>.chip{min-height:31px;font-size:12.5px;padding:0 10px}

<script type="application/json" id="ml-content">{"slug":"mech-lab-m07","title":"实验：验证机械能守恒定律","sub":"人教版 必修第二册 第八章 5","chapter":"必修第二册 第八章 5","methods":["打点计时器自由落体法","图像法（½v²-h / v²-h）","倾斜气垫导轨光电门法","循环论证与恒等式辨析"],"learn":[{"id":"L1","title":"实验目的与原理（为什么不测 m）","widget":"mass-cancel","html":"<p><b>目的：<\/b>借助自由落体运动，检验重物下落过程中重力势能的减少量与动能的增加量是否相等。<\/p>","steps":["从静止开始下落高度 h 后速度为 v，机械能守恒要求：<b>mgh = {{frac|1|2}}mv²<\/b>（若从非零起点 A 到 B，则为 <b>mgΔh = {{frac|1|2}}mv<sub>B<\/sub>² − {{frac|1|2}}mv<sub>A<\/sub>²<\/b>）。","<b>为什么不需要用天平测重物质量 m？<\/b>等式两边同时含有质量 m，约去后只需验证 <b>gh = {{frac|1|2}}v²<\/b>（或 gΔh = {{frac|1|2}}v<sub>B<\/sub>² − {{frac|1|2}}v<sub>A<\/sub>²）。因此本实验<b>不需要天平<\/b>，也不需要秒表。","<b>注意：<\/b>质量 m 可以约去，但重力势能项中的 <b>g 不能约去<\/b>，必须使用<b>当地真实重力加速度<\/b>（如 9.80 m/s²）。"]},{"id":"L2","title":"竖直安装与重物选择","widget":"bob-compare","html":"<p>减小阻力做功是本实验成功的关键，主要靠<b>安装细节<\/b>和<b>重物选材<\/b>。<\/p>","steps":["<b>竖直安装：<\/b>打点计时器竖直固定在铁架台上，使两限位孔在同一竖直线上；纸带竖直拉直后再松手，减小纸带与限位孔间的侧向摩擦。","<b>重物选材：<\/b>应选用<b>密度大、体积小、质量大<\/b>的金属重锤（如 300 g 重铁锤），不要选轻木块或大泡沫块。阻力占比 {{frac|f|mg}} 越小，下落加速度 a = g − {{frac|f|m}} 越接近 g。","<b>操作要点：<\/b>手提纸带上端，使重物<b>紧靠打点计时器下方<\/b>；<b>先接通电源<\/b>，待打点稳定后再释放纸带。"]},{"id":"L3","title":"选纸带与“2 mm”判据推导","widget":"twomm-demo","html":"<p>若把纸带第 1 个点当作初速度为零的起点 O（直接比 mgh 与 {{frac|1|2}}mv²），必须先检验第 1、2 点间距。<\/p>","steps":["电源频率 50 Hz 时，打点周期 T = 0.02 s。若打第 1 个点时重锤恰好由静止开始自由下落，第 1、2 点间的距离为：h₁ = {{frac|1|2}}gT² = {{frac|1|2}} × 9.80 × (0.02)² m = <b>1.96 × 10⁻³ m ≈ 2 mm<\/b>。","如果挑出的纸带第 1、2 点间距<b>明显大于 2 mm<\/b>（例如 5 mm 以上），说明打第 1 个点时重物已有向下的初速度——最常见的原因是<b>先释放纸带、后接通电源<\/b>。若仍把第 1 点当成 v₀ = 0，算出的 {{frac|1|2}}mv² 会多算初动能，出现 <b>ΔE<sub>k<\/sub> > ΔE<sub>p<\/sub><\/b> 的异常。","若首两点间距略小于 2 mm（阻力或打点初动未同步）或不想受初速限制，可<b>舍去开头点迹<\/b>，改选清晰段中的两点 A、B，用 <b>g·h<sub>AB<\/sub> = {{frac|1|2}}v<sub>B<\/sub>² − {{frac|1|2}}v<sub>A<\/sub>²<\/b> 验证。"]},{"id":"L4","title":"瞬时速度求法红线（禁 v=gt）","widget":"speed-redline","html":"<p>测定第 n 个点的瞬时速度 v<sub>n<\/sub> 时，有一条<b>绝对不能跨越的红线<\/b>。<\/p>","steps":["<b>唯一正确求法：<\/b>利用匀变速直线运动“中间时刻的瞬时速度等于该段时间内的平均速度”，<b>v<sub>n<\/sub> = {{frac|h<sub>n+1<\/sub> − h<sub>n−1<\/sub>|2T}}<\/b>（连续打点时 T = 0.02 s，2T = 0.04 s）。","<b>严禁使用 v<sub>n<\/sub> = gt<sub>n<\/sub> 或 v<sub>n<\/sub> = {{sqrt|2gh<sub>n<\/sub>}}：<\/b>这两个公式都默认了“无阻力、加速度等于 g、机械能守恒”。用 {{sqrt|2gh<sub>n<\/sub>}} 会得出 {{frac|1|2}}v² ≡ gh、误差永远假归零；用 gt<sub>n<\/sub>（在无阻力时同样假归零，有明显阻力时则算得 {{frac|1|2}}(gt)² 虚高反超 gh）——两者都是<b>用待验证的结论作前提<\/b>，属于循环论证！","使用<b>倾斜气垫导轨 + 光电门<\/b>方案时，则利用极短遮光时间内的平均速度代替瞬时速度：v = {{frac|d|Δt}}，高度差 Δh = L·sinθ。"]},{"id":"L5","title":"图像法：½v²-h 与 v²-h 图像","widget":"graph-modes","html":"<p>用多个点的数据作线性图像，既能减小偶然误差，又能直观检验守恒与斜率。<\/p>","steps":["由 mgh = {{frac|1|2}}mv² 消去 m：以 <b>{{frac|1|2}}v² 为纵轴、h 为横轴<\/b>作图，守恒时应为过原点的直线，<b>斜率 k = g<\/b>。","以 <b>v² 为纵轴、h 为横轴<\/b>作图（如 2025·河南卷）：由 v² = 2gh 可知，直线过原点且<b>斜率 k = 2g<\/b>（理论约 19.6 m/s²），相对误差 η = {{frac|2g − k|2g}} × 100%。","<b>变换零势能点（如 2026·天津卷）：<\/b>若取下方某点 E 高度为 0、向上为正，则 {{frac|1|2}}v² = {{frac|1|2}}v<sub>E<\/sub>² − gh，此时 {{frac|1|2}}v² - h 图像的<b>斜率为 −g<\/b>。","<b>光电门变式（如 2025·甘肃/江西卷）：<\/b>滑块沿斜轨下滑，Δv² - H 图斜率为 2g；单摆通过光电门时，{{frac|1|(Δt)²}} - h 图斜率为 {{frac|2g|d²}}。"]},{"id":"L6","title":"逻辑性错误：不能用纸带 a 代替 g","widget":"logic-trap","html":"<p>为什么算出“ΔE<sub>p<\/sub> = 5.09m、ΔE<sub>k<\/sub> = 5.08m（非常接近）”却依然<b>不能<\/b>验证机械能守恒？<\/p>","steps":["<b>高频考题陷阱（2024·浙江 6 月选考）：<\/b>某同学先由纸带算出重锤下落加速度 g′ = 9.77 m/s²，再把这个 g′ 代入 mgh 计算重力势能减小量，发现与 {{frac|1|2}}mv² 几乎相等。","<b>物理实质：<\/b>对任何恒定合力的匀加速运动，运动学上恒有 <b>v² = 2a·h<\/b>，即 <b>{{frac|1|2}}mv² ≡ m·a<sub>纸带<\/sub>·h<\/b>！哪怕阻力非常大（例如木块损耗 20%），用纸带测出的 a 代替 g，两项照样相等。","<b>结论：<\/b>用纸带测出的 a 代替当地 g 只是在验证运动学恒等式，完全掩盖了阻力做功，<b>不能<\/b>验证机械能守恒，必须代入<b>当地真实重力加速度 g<\/b>。"]}],"equipment":[{"id":"stand","name":"铁架台与铁夹","html":"固定打点计时器并保持其竖直，使两个限位孔在同一竖直线上；底座下方垫缓冲软垫接住重锤。"},{"id":"timer","name":"打点计时器与电源","html":"电磁打点计时器接约 8 V <b>交流<\/b>电源；电火花计时器接 220 V <b>交流<\/b>电源（纸带阻力更小）。频率 50 Hz 时每 0.02 s 打一个点。"},{"id":"bob","name":"重物（铁锤 / 铝锤 / 木块）","html":"优先选用<b>密度大、体积小、质量大<\/b>的金属重锤（如 300 g 铁锤），使阻力与重力之比 f/(mg) 尽可能小。"},{"id":"tape","name":"纸带与重物夹","html":"一端固定在重物上，另一端穿过限位孔并用手竖直提住上端；自由释放后记录各时刻重物下落位移。"},{"id":"ruler","name":"毫米刻度尺","html":"测量各点到起点的下落距离 h<sub>n<\/sub>，需估读到 0.1 mm（0.01 cm）。本实验<b>不需要<\/b>秒表和天平。"},{"id":"airtrack","name":"倾斜气垫导轨与光电门","html":"减少导轨摩擦；滑块上装窄遮光片（宽 d），通过两光电门挡光时间 Δt₁、Δt₂，由 v = d/Δt 与 Δh = L·sinθ 验证 gΔh = {{frac|1|2}}(v₂² − v₁²)。"}],"procedure":[{"id":"P1","title":"选计时器并竖直固定","how":"选择电磁或电火花打点计时器，用铁夹竖直固定在铁架台上。（不需要用天平测质量 m。）","why":"保证限位孔竖直对齐；验证式 mgh = ½mv² 中质量 m 可约去。","errorId":"E6"},{"id":"P2","title":"接交流电源","how":"电磁打点计时器接约 8 V 交流电源；电火花计时器接 220 V 交流电源。","why":"直流电不能周期性打点；电压不匹配不能正常工作或烧坏线圈。"},{"id":"P3","title":"选重锤并穿纸带","how":"选用密度大、质量大的重铁锤固定在纸带下端，纸带穿过限位孔并竖直拉直。","why":"重锤质量大、体积小使阻力占比 f/(mg) 很小；纸带竖直拉直可减小限位孔摩擦。","errorId":"E2"},{"id":"P4","title":"手提上端并靠近计时器","how":"手提纸带上端，使重锤紧靠打点计时器下方（并保持纸带竖直）。","why":"既避免手托重锤引起初始扰动，又充分利用纸带长度打出更多落体点。","errorId":"E5"},{"id":"P5","title":"先接通电源，后释放纸带","how":"先接通电源让计时器稳定打点，再松手释放纸带上端使重物自由下落。","why":"保证第 1 个点初速度近似为零（首两点间距 ≈ 2 mm），避免 ΔEₖ > ΔEₚ 异常。","errorId":"E1"},{"id":"P6","title":"关闭电源，取下并筛选纸带","how":"重物落到软垫后关闭电源、取下纸带；检查第 1、2 点间距是否约 2 mm。","why":"h₁ = ½gT² ≈ 1.96 mm ≈ 2 mm 表明打第 1 点时初速为零。","errorId":"E1"},{"id":"P7","title":"量取各点下落高度 hₙ","how":"从起点 O 依次用毫米刻度尺读出各点位置 hₙ（估读到 0.1 mm）。","why":"一次放尺从同一起点读数，误差不累积。"},{"id":"P8","title":"用中间时刻求瞬时速度","how":"用 vₙ = {{frac|hₙ₊₁ − hₙ₋₁|2T}} 求瞬时速度（严禁用 v=gt 或 {{sqrt|2gh}}）。","why":"用待验证的自由落体结论求速度属于循环论证，必然使误差恒为 0。","errorId":"E3"},{"id":"P9","title":"用当地 g 对比能量并作图","how":"取当地 g = 9.80 m/s² 比较 ghₙ 与 {{frac|1|2}}vₙ²，或作 {{frac|1|2}}v² - h 直线看斜率是否接近 g。","why":"绝不能用纸带测出的加速度 a 代替当地 g，否则只是验证恒等式 ½v² ≡ ah。","errorId":"E4"}],"errors":[{"id":"E1","name":"先释放纸带，后接通电源","noteId":"P5","trigger":"先松手释放重物，约 0.12 s 后才接通打点计时器电源","config":{"order":"release-first","lag":0.12},"observe":"对比两条纸带第 1、2 点间距，以及把首点当“静止起点”算出的 ΔEₖ 与 ΔEₚ。","consequence":"错误纸带第 1、2 点间距高达二十多毫米（远大于 2 mm）；若误把首点当成 v₀ = 0，算出的动能增加量 {{frac|1|2}}mv² 反而<b>大于<\/b>重力势能减少量 mgh（ΔEₖ > ΔEₚ）。","ask":{"stem":"为什么误把先释放后通电纸带的首点当静止起点时，会出现 ΔEₖ > ΔEₚ？","options":["计时器开始打点时重物已具有向下的初速度 v₀ > 0，½v² 多算了这部分初动能","先释放纸带会使重物重力变大","打点周期变短了","空气阻力对重物做了正功"],"answer":0,"quizId":"M07:try:E1"},"why":"打下第 1 个点时重物已经下落了一段距离并获得初速度 v₀，实际满足 {{frac|1|2}}v² = {{frac|1|2}}v₀² + g·Δh > g·Δh（Δh 为第 1 点后的下落高度）。因此必须先通电后释放，或挑第 1、2 点间距 ≈ 2 mm 的纸带。","questionIds":["G2","Y1"]},{"id":"E2","name":"选用质量小、体积大的木块","noteId":"P3","trigger":"把 300 g 重铁锤换成 40 g 木块","config":{"bob":"wood"},"observe":"比较铁锤与木块的 {{frac|1|2}}v² - h 图线偏离 y = gx 的程度与能量损耗百分比。","consequence":"铁锤的能量相对损耗不到 2%，而轻木块的空气阻力和纸带摩擦占比很大，动能增加量明显小于势能减少量（损耗超过 20%），无法在误差允许范围内验证守恒。","ask":{"stem":"实验中应选择什么样规格的重物？理由是？","options":["质量小、体积大的木块，便于用手托住","密度大、体积小、质量大的金属重锤，减小阻力与重力之比 f/(mg)","任意物体都可以，只要测出它的质量 m","越轻越好，能减少对缓冲垫的撞击"],"answer":1,"quizId":"M07:try:E2"},"why":"下落加速度 a = g − {{frac|f|m}}，能量相对损失约为 {{frac|f|mg}}。金属重锤密度大（迎风面积小）且质量 m 大，使 {{frac|f|mg}} 降至 1%～2% 以内；轻木块质量小体积大，阻力影响放大了十倍以上。","questionIds":["G5"]},{"id":"E3","name":"错用 v = √(2gh) 或 v = gt 求速度","noteId":"P8","trigger":"在数据处理中改用 vₙ = √(2ghₙ) 或 vₙ = gtₙ 计算各点速度","config":{"speedMethod":"sqrt2gh","bob":"wood"},"observe":"即使改用阻力很大的木块，用 v = {{sqrt|2gh}} 和中间时刻公式算出两种误差。","consequence":"用中间时刻公式能真实测出木块高达约 20% 的能量损失；而用 v = {{sqrt|2gh}} 时误差恒为 <b>0.00%<\/b>，用 v = gt 时在有阻力下会算出动能虚高反超 gh（偏高 > 20%），两者都预设了 a = g 而失去检验意义。","ask":{"stem":"为什么不能用 vₙ = {{sqrt|2ghₙ}} 或 vₙ = gtₙ 计算纸带上某点的瞬时速度？","options":["这两个公式算起来太麻烦","打点计时器测不出时间 t","这两个公式已经把“a = g、机械能守恒”当作前提，属于循环论证","重物质量 m 没有代入公式"],"answer":2,"quizId":"M07:try:E3"},"why":"若假设 v = {{sqrt|2gh}}，则 {{frac|1|2}}mv² = {{frac|1|2}}m(2gh) ≡ mgh 变成数学恒等式，不管实际阻力多大都会得出“守恒”的假象。纸带速度只能用中间时刻平均速度 vₙ = {{frac|hₙ₊₁ − hₙ₋₁|2T}}。","questionIds":["Y1"]},{"id":"E4","name":"逻辑错误：用纸带算出的 a 代替当地 g","noteId":"P9","trigger":"用纸带逐差算出的加速度 a 代替当地重力加速度 g 来算势能减小量","config":{"useTapeA":true,"bob":"wood"},"observe":"同一条大阻力纸带，对比“代入当地 g = 9.80 m/s²”与“代入纸带算出的 a”两种结果。","consequence":"用当地 g 时暴露出约 20% 的能量损耗；但改用纸带算出的 a 代入后，ma·h 与 {{frac|1|2}}mv² 的偏差瞬间降到几乎为 0%——运动学恒等式掩盖了一切阻力损耗！","ask":{"stem":"（2024·浙江 6 月选考）用纸带求得 g′ = 9.77 m/s² 并算出 ΔEₚ = 5.09m、ΔEₖ = 5.08m，该结果能否验证机械能守恒？","options":["能，因为 5.09m 与 5.08m 在误差允许范围内相等","不能，因为没有使用当地的重力加速度 g，用纸带自身的 a 必然得到恒等式","能，说明当地重力加速度就是 9.77 m/s²","不能，因为没有用天平测出重物质量 m"],"answer":1,"quizId":"M07:try:E4"},"why":"由匀变速公式 v² = 2a·h 可知，无论下落过程中机械能损失了多少，动能增加量 {{frac|1|2}}mv² 永远等于 m·a<sub>纸带<\/sub>·h。拿纸带测得的加速度充当 g，无法检验重力势能是否全部转化为动能。","questionIds":["G1"]},{"id":"E5","name":"重物远离计时器或纸带未拉直","noteId":"P4","trigger":"释放前让重物远离计时器下方（悬在半空较低处）","config":{"near":false},"observe":"比较重物紧靠计时器与远离计时器时，纸带上能打出的有效落体点个数与最大下落高度。","consequence":"远离计时器时，重物很快落地，有效落体点少、最大高度 h 只有一半左右；若纸带未竖直拉直还会增大与限位孔间的摩擦，使能量损失偏大。","ask":{"stem":"释放前为什么要让重物紧靠打点计时器并竖直提住纸带上端？","options":["减小当地重力加速度 g","充分利用纸带打出更多清晰点，同时减小纸带与限位孔之间的侧向摩擦","使第 1、2 点间距变为 4 mm","防止打点计时器烧毁"],"answer":1,"quizId":"M07:try:E5"},"why":"重物紧靠计时器可获得最长下落行程和更多计数点；手提上端使纸带竖直穿孔能显著降低与限位孔壁的擦碰阻力。","questionIds":["G1"]},{"id":"E6","name":"误区：认为必须用天平测重物质量 m","noteId":"P1","trigger":"分别按 m = 100 g、200 g、300 g 计算同一条纸带的 ΔEₚ 与 ΔEₖ","config":{"compare":"mass"},"observe":"看同一条纸带代入不同质量 m 时，mgh、{{frac|1|2}}mv² 以及相对误差 η 如何变化。","consequence":"代入不同质量 m 时，ΔEₚ 与 ΔEₖ 同比例缩放，但二者的比值与相对误差 η <b>完全不变<\/b>——质量 m 在验证式中根本不起作用。","ask":{"stem":"利用自由落体验证机械能守恒定律时，是否必须用天平测出重物的质量？","options":["必须测，否则算不出重力势能减少量 mgh","不需要，因为比较 mgh 与 ½mv² 时等式两边质量 m 可以约去","必须测，天平是本实验核心测量工具","只在用电火花计时器时不需要测"],"answer":1,"quizId":"M07:try:E6"},"why":"mgh = {{frac|1|2}}mv² 等价于 gh = {{frac|1|2}}v²。因此本实验不需要天平；若遇到如“阿特伍德机”等双物体系（2025·湖北卷），表达式含 (M−m)/(M+m)，才需要测质量。","questionIds":["G2","G3"]}],"reverse":[{"id":"R1","show":{"type":"e1"},"stem":"某同学处理纸带后发现：第 1、2 点间距约为 25 mm，且用起点算出的动能增加量 ΔEₖ 明显大于重力势能减少量 ΔEₚ。最可能的操作错误是？","options":["先释放纸带，后接通电源（打首点时重物已有初速度）","选用了太重的金属锤","没有用天平测量重锤质量","空气阻力太大"],"answer":[0],"replay":"E1","why":"正常先通电后释放时首两点间距约为 2 mm，且由于阻力存在应满足 ΔEₖ 略小于 ΔEₚ。出现首两点远大于 2 mm 且 ΔEₖ > ΔEₚ，说明先释放后通电，第 1 点时重物已具有初动能。","quizId":"M07:reverse:R1"},{"id":"R2","show":{"type":"e4"},"stem":"某同学根据纸带求出重锤下落加速度 g′ = 9.77 m/s²，并用此 g′ 计算出第 1 到 13 点重力势能减小量为 5.09m、动能增加量为 5.08m（非常接近）。该结果能否验证机械能守恒？","options":["能，在误差允许范围内机械能守恒","不能，因为没有使用当地的重力加速度 g","能，只要改作 v² - h 图即可","不能，因为没有测出质量 m 的具体数值"],"answer":[1],"replay":"E4","why":"用纸带测得的加速度 a 代替当地 g，由运动学公式恒有 ½mv² = ma·h，只是在验证恒等式，把阻力消耗掉的机械能抹平了，因此不能验证守恒。","quizId":"M07:reverse:R2"},{"id":"R3","show":{"type":"e2"},"stem":"在规范操作下，几乎所有小组的实验结果都是重力势能减少量 ΔEₚ 略大于动能增加量 ΔEₖ（如铁锤偏小约 1%～2%，木块偏小 20%）。这主要是因为？","options":["读取刻度尺时没有估读","下落过程中空气阻力与纸带摩擦阻力做负功，部分机械能转化为内能","重物质量没有用天平精确测定","电源电压略偏高"],"answer":[1],"replay":"E2","why":"重物下落时克服空气阻力及纸带与限位孔间摩擦阻力做功，重力势能未能 100% 转化为动能，因此正常结果总是 ΔEₚ 略大于 ΔEₖ。","quizId":"M07:reverse:R3"},{"id":"R4","show":{"type":"v2h"},"stem":"某同学根据实验测出的多组下落高度 h 与对应速度平方 v²，绘出如图所示的 v² - h 过原点直线，拟合斜率为 k ≈ 19.3 m/s²。下列说法正确的是？","options":["该斜率 k 理论上应等于当地重力加速度 g（约 9.80 m/s²），实验完全失败","由 v² = 2gh 可知，斜率 k 理论上等于 2g（约 19.6 m/s²），在误差范围内支持机械能守恒","纵轴应该改画为 2v²，斜率才会等于 g","直线斜率一定等于纸带测出的加速度的平方"],"answer":[1],"replay":null,"why":"注意纵坐标是 v² 而不是 ½v²！由 mgh = ½mv² 得 v² = 2gh，所以 v² - h 直线理论斜率为 2g ≈ 19.6 m/s²；实测 19.3 m/s² 偏差约 1.5%，在阻力允许范围内支持机械能守恒。","quizId":"M07:reverse:R4"}],"summary":{"principle":"自由落体：mgh = {{frac|1|2}}mv²（约去 m → gh = {{frac|1|2}}v²）；非零起点：g·Δh = {{frac|1|2}}(v₂² − v₁²)。{{frac|1|2}}v² - h 图斜率 = g；v² - h 图斜率 = 2g。","steps":["竖直固定打点计时器，接交流电源（电磁约 8 V，电火花 220 V）","选重铁锤固定在纸带下端，纸带穿限位孔并竖直拉直","手提纸带上端，使重锤紧靠打点计时器下方","先接通电源，稳定后再松手释放；落至软垫后关电源取纸带","挑第 1、2 点间距 ≈ 2 mm 的纸带，量出各点下落高度 hₙ（估读到 0.1 mm）","用 vₙ = {{frac|hₙ₊₁ − hₙ₋₁|2T}} 求瞬时速度（严禁 v = gt 或 {{sqrt|2gh}}）","用当地真实 g（9.80 m/s²）对比 ghₙ 与 {{frac|1|2}}vₙ²，或作 {{frac|1|2}}v² - h 图"],"notes":[{"do":"重物选密度大、体积小、质量大的金属块","why":"减小阻力与重力之比 f/(mg)，减小系统误差"},{"do":"打点计时器竖直安装、纸带竖直拉直、重物靠近计时器","why":"减小限位孔侧向摩擦，充分利用纸带打出更多点"},{"do":"先接通电源，再释放纸带","why":"保证打第 1 点时初速为零（首两点 ≈ 2 mm），避免 ΔEₖ > ΔEₚ"},{"do":"只能用中间时刻公式求 vₙ","why":"用 v = gt 或 {{sqrt|2gh}} 属于循环论证，误差恒为 0"},{"do":"不用天平、不用秒表，但必须用当地真实 g","why":"m 可约去；用纸带算出的 a 代替 g 会把阻力损耗掩盖成恒等式"}],"errors":["系统误差：空气阻力及纸带摩擦阻力使 ΔEₖ 恒略小于 ΔEₚ（½v² - h 斜率略小于 g）","偶然误差：刻度尺读数、描点作图","逻辑性错误：用 v = √(2gh)、v = gt 或纸带测出 a 代入计算均预设结论或掩盖损耗，无法验证守恒"],"conclusions":["首两点判据：h₁ = ½gT² = 1.96 mm ≈ 2 mm（50 Hz）","“ΔEₖ > ΔEₚ”常见因：先释放后通电（有初速度）","½v² - h 图斜率 = g；v² - h 图斜率 = 2g；逆向零点 ½v² - h 斜率 = −g","斜槽滚球类注意：转动动能未计入会导致 ΔEₖ 明显小于 ΔEₚ（2025·江苏）"]}}</script>
<script type="application/json" id="ml-questions">[{"id":"G1","source":"2024·浙江6月选考·第16-Ⅰ题","verified":true,"score":4,"stem":"在“验证机械能守恒定律”的实验中：","parts":[{"label":"(1)","type":"choice","prompt":"下列释放纸带前的操作示意图正确的是____。<svg viewBox=\"0 0 600 182\" width=\"600\" role=\"img\" aria-label=\"2024浙江6月选考操作图ABC\"><g transform=\"translate(10,8)\"><rect x=\"0\" y=\"0\" width=\"180\" height=\"166\" rx=\"10\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><text x=\"90\" y=\"20\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">A<\/text><rect x=\"18\" y=\"146\" width=\"144\" height=\"8\" fill=\"#8E99A6\"/><rect x=\"30\" y=\"32\" width=\"6\" height=\"114\" fill=\"#8E99A6\"/><rect x=\"36\" y=\"48\" width=\"34\" height=\"6\" fill=\"#8E99A6\"/><rect x=\"68\" y=\"40\" width=\"32\" height=\"22\" rx=\"3\" fill=\"#4F6A8A\"/><rect x=\"81\" y=\"24\" width=\"6\" height=\"90\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><path d=\"M74 26 Q84 18 94 26\" fill=\"none\" stroke=\"#C98C6B\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"75\" y=\"114\" width=\"18\" height=\"24\" rx=\"3\" fill=\"#6B7785\"/><\/g><g transform=\"translate(210,8)\"><rect x=\"0\" y=\"0\" width=\"180\" height=\"166\" rx=\"10\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><text x=\"90\" y=\"20\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">B<\/text><rect x=\"18\" y=\"146\" width=\"144\" height=\"8\" fill=\"#8E99A6\"/><rect x=\"30\" y=\"32\" width=\"6\" height=\"114\" fill=\"#8E99A6\"/><rect x=\"36\" y=\"48\" width=\"34\" height=\"6\" fill=\"#8E99A6\"/><rect x=\"68\" y=\"40\" width=\"32\" height=\"22\" rx=\"3\" fill=\"#4F6A8A\"/><rect x=\"81\" y=\"24\" width=\"6\" height=\"44\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><path d=\"M74 26 Q84 18 94 26\" fill=\"none\" stroke=\"#C98C6B\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"75\" y=\"68\" width=\"18\" height=\"24\" rx=\"3\" fill=\"#6B7785\"/><\/g><g transform=\"translate(410,8)\"><rect x=\"0\" y=\"0\" width=\"180\" height=\"166\" rx=\"10\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><text x=\"90\" y=\"20\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">C<\/text><rect x=\"18\" y=\"146\" width=\"144\" height=\"8\" fill=\"#8E99A6\"/><rect x=\"30\" y=\"32\" width=\"6\" height=\"114\" fill=\"#8E99A6\"/><rect x=\"36\" y=\"48\" width=\"34\" height=\"6\" fill=\"#8E99A6\"/><rect x=\"68\" y=\"40\" width=\"32\" height=\"22\" rx=\"3\" fill=\"#4F6A8A\"/><rect x=\"81\" y=\"32\" width=\"6\" height=\"36\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><rect x=\"75\" y=\"68\" width=\"18\" height=\"24\" rx=\"3\" fill=\"#6B7785\"/><path d=\"M70 96 H98\" stroke=\"#C98C6B\" stroke-width=\"6\" stroke-linecap=\"round\"/><\/g><\/svg>","options":["A","B","C"],"answer":1,"replay":"E5","explain":"正确操作是手提纸带上端保持竖直，使重锤紧靠打点计时器下方由静止释放，选 B。重锤远离计时器（A）会减少有效点数；手托重锤（C）会使纸带松弛并给重锤带来额外初扰动。","quizId":"M07:paper:G1:(1)"},{"label":"(2)","type":"numeric","prompt":"实验获得一条纸带，截取点迹清晰的一段并测得各点到点 0 的距离如图所示（单位：cm）。已知打点频率为 50 Hz，则打点“13”时重锤下落的速度大小为（保留三位有效数字）<svg viewBox=\"0 0 600 104\" width=\"600\" role=\"img\" aria-label=\"2024浙江6月纸带数据\"><rect x=\"12\" y=\"26\" width=\"576\" height=\"30\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><text x=\"28\" y=\"45\" font-size=\"12\" fill=\"#4A5B73\">0 …<\/text><circle cx=\"95\" cy=\"41\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"243\" cy=\"41\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"401\" cy=\"41\" r=\"3\" fill=\"#C7374B\"/><circle cx=\"568\" cy=\"41\" r=\"3\" fill=\"#2B2B2B\"/><g font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\"><text x=\"95\" y=\"18\">11<\/text><text x=\"243\" y=\"18\">12<\/text><text x=\"401\" y=\"18\" fill=\"#C7374B\">13<\/text><text x=\"568\" y=\"18\">14<\/text><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\"><text x=\"95\" y=\"78\">41.28<\/text><text x=\"243\" y=\"78\">47.33<\/text><text x=\"401\" y=\"78\" fill=\"#C7374B\">53.83<\/text><text x=\"568\" y=\"78\">60.69<\/text><\/g><text x=\"300\" y=\"96\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4A5B73\">各点到起点 0 的距离（单位：cm）<\/text><\/svg>","unit":"m/s","answer":3.34,"tol":0.005,"sig":3,"show":"3.34","explain":"相邻打点间隔 T = 0.02 s，点 13 是点 12 到点 14 的中间时刻：v₁₃ = {{frac|(60.69 − 47.33) × 10⁻² m|2 × 0.02 s}} = 3.34 m/s。","quizId":"M07:paper:G1:(2)"},{"label":"(3)","type":"text-choice","prompt":"某同学用纸带的数据求出重力加速度 g = 9.77 m/s²，并用此 g 值计算得出打点“1”到“13”过程重锤的重力势能减小值为 5.09m，另计算得动能增加值为 5.08m（m 为重锤质量），则该结果____验证机械能守恒定律。","options":["能","不能"],"answer":1,"replay":"E4","explain":"不能。用纸带数据算出的 g′ = 9.77 m/s² 是重锤下落的真实加速度 a，其中已扣除了空气和纸带阻力；再把 a 当成 g 代入 mgh，恒有 ½mv² = ma·h，只是在验证运动学恒等式。","quizId":"M07:paper:G1:(3)"},{"label":"(4)","type":"choice","prompt":"做出上述判断的理由是____。","options":["在误差允许范围内","没有用当地的重力加速度 g"],"answer":1,"replay":"E4","explain":"验证机械能守恒时，重力势能减少量必须代入当地真实的重力加速度 g（如 9.80 m/s²），不能用纸带测得的加速度替代。","quizId":"M07:paper:G1:(4)"}]},{"id":"G2","source":"2025·河南卷·第12题（节选）","verified":true,"stem":"实验小组利用铁架台、打点计时器与重锤组成自由落体装置验证机械能守恒定律。可选用的器材有：交流电源（频率 50 Hz）、铁架台、电子天平、重锤、打点计时器、纸带、刻度尺等。","parts":[{"label":"(1)","type":"choice","prompt":"下列所给实验步骤中，有 4 个是完成实验必需且正确的，把它们选择出来并按实验顺序排列：____。<br>① 先接通电源，打点计时器开始打点，然后再释放纸带　② 先释放纸带，然后再接通电源，打点计时器开始打点　③ 用电子天平称量重锤的质量　④ 将纸带下端固定在重锤上，穿过打点计时器的限位孔，用手捏住纸带上端　⑤ 在纸带上选取一段，用刻度尺测量该段内各点到起点的距离，记录分析数据　⑥ 关闭电源，取下纸带","options":["④①⑥⑤","④②⑥⑤","③④①⑤","④①⑤⑥"],"answer":0,"replay":"E1","explain":"验证式 mgh = ½mv² 中质量 m 可约去，不需要步骤 ③ 称量质量；正确操作先装纸带 ④ → 先通电后释放 ① → 关电源取纸带 ⑥ → 测量分析数据 ⑤。","quizId":"M07:paper:G2:(1)"},{"label":"(2)","type":"numeric","prompt":"如图所示是纸带上连续打出的五个点 A、B、C、D、E 到起点的距离（单位：cm），则打出 B 点时重锤下落的速度大小为（保留 3 位有效数字）<svg viewBox=\"0 0 600 100\" width=\"600\" role=\"img\" aria-label=\"2025河南卷纸带数据\"><rect x=\"12\" y=\"24\" width=\"576\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><text x=\"30\" y=\"42\" font-size=\"12\" fill=\"#4A5B73\">O …<\/text><circle cx=\"92\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"196\" cy=\"38\" r=\"3\" fill=\"#C7374B\"/><circle cx=\"310\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"437\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"574\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><g font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\"><text x=\"92\" y=\"17\">A<\/text><text x=\"196\" y=\"17\" fill=\"#C7374B\">B<\/text><text x=\"310\" y=\"17\">C<\/text><text x=\"437\" y=\"17\">D<\/text><text x=\"574\" y=\"17\">E<\/text><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\"><text x=\"92\" y=\"72\">13.20<\/text><text x=\"196\" y=\"72\" fill=\"#C7374B\">16.60<\/text><text x=\"310\" y=\"72\">20.34<\/text><text x=\"437\" y=\"72\">24.50<\/text><text x=\"574\" y=\"72\">29.00<\/text><\/g><text x=\"300\" y=\"92\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4A5B73\">A～E 各点到起点的距离（单位：cm）<\/text><\/svg>","unit":"m/s","answer":1.79,"tol":0.005,"sig":3,"show":"1.79","explain":"连续打点 T = 0.02 s，B 为 AC 中间时刻：v<sub>B<\/sub> = {{frac|(20.34 − 13.20) × 10⁻² m|2 × 0.02 s}} = 1.785 m/s ≈ 1.79 m/s。","quizId":"M07:paper:G2:(2)"},{"label":"(3)","type":"text-choice","prompt":"纸带上各点与起点间的距离即为重锤下落高度 h，计算相应的重锤下落速度 v，并绘制 v² - h 关系图像。理论上，若机械能守恒，图中直线应____原点","options":["通过","不通过"],"answer":0,"explain":"由 mgh = ½mv² 得 v² = 2gh，当 h = 0 时 v² = 0，理论上直线应通过坐标原点。","quizId":"M07:paper:G2:(3)"},{"label":"(4)","type":"expr","prompt":"（接上问）理论上，该 v² - h 直线的斜率为（用重力加速度大小 g 表示）","lhs":"k =","vars":{"g":"g"},"extra":["1","2"],"answer":"2*g","show":"2g","explain":"由 v² = 2gh 与一次函数 y = kx 对照，可知理论斜率 k = 2g。","quizId":"M07:paper:G2:(4)"},{"label":"(5)","type":"expr","prompt":"定义单次测量的相对误差 η = |(E<sub>p<\/sub> − E<sub>k<\/sub>)/E<sub>p<\/sub>| × 100%，其中 E<sub>p<\/sub> 是重锤重力势能的减小量，E<sub>k<\/sub> 是其动能增加量。若实验测得 v² - h 拟合直线的斜率为 k（k < 2g），则由该斜率算出的相对误差 η / 100% =（用字母 k 和 g 表示）","lhs":"η / 100% =","vars":{"g":"g","k":"k"},"extra":["1","2"],"answer":"(2*g-k)/(2*g)","show":"(2g − k) ÷ (2g)","explain":"因为 v² = k·h，所以 E<sub>k<\/sub> = ½mv² = ½mkh，E<sub>p<\/sub> = mgh。代入相对误差公式得 η = |{{frac|mgh − ½mkh|mgh}}| × 100% = {{frac|2g − k|2g}} × 100%。（原卷该问后续还要求由图读取斜率 k 并代入 g = 9.80 计算百分比。）","quizId":"M07:paper:G2:(5)"}]},{"id":"G3","source":"2025·河北卷·第11题","verified":true,"stem":"某学习小组在倾斜的气垫导轨上验证机械能守恒定律，实验装置如图所示，当地重力加速度为 g。<svg viewBox=\"0 0 560 156\" width=\"560\" role=\"img\" aria-label=\"2025河北卷倾斜气垫导轨装置图\"><line x1=\"40\" y1=\"140\" x2=\"520\" y2=\"140\" stroke=\"#8E99A6\" stroke-width=\"2\"/><rect x=\"76\" y=\"77\" width=\"32\" height=\"63\" fill=\"#C9D1D9\" stroke=\"#596574\"/><polygon points=\"60,64 504,132 502,140 58,72\" fill=\"#D5DEE8\" stroke=\"#596574\"/><rect x=\"116\" y=\"52\" width=\"44\" height=\"22\" rx=\"3\" transform=\"rotate(8.7,138,63)\" fill=\"#3E6FD0\"/><rect x=\"148\" y=\"34\" width=\"5\" height=\"22\" transform=\"rotate(8.7,150,45)\" fill=\"#10233F\"/><text x=\"152\" y=\"26\" font-size=\"11\" text-anchor=\"middle\" fill=\"#10233F\">遮光条 d₁<\/text><rect x=\"246\" y=\"64\" width=\"12\" height=\"34\" transform=\"rotate(8.7,252,81)\" fill=\"#3B4B60\"/><circle cx=\"252\" cy=\"75\" r=\"2.5\" fill=\"#C7374B\"/><text x=\"252\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">光电门 A<\/text><rect x=\"406\" y=\"88\" width=\"12\" height=\"34\" transform=\"rotate(8.7,412,105)\" fill=\"#3B4B60\"/><circle cx=\"412\" cy=\"99\" r=\"2.5\" fill=\"#C7374B\"/><text x=\"412\" y=\"82\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">光电门 B<\/text><line x1=\"422\" y1=\"105\" x2=\"472\" y2=\"105\" stroke=\"#12A9C4\" stroke-dasharray=\"3 3\"/><line x1=\"258\" y1=\"81\" x2=\"472\" y2=\"81\" stroke=\"#12A9C4\" stroke-dasharray=\"3 3\"/><path d=\"M466 81 V105\" stroke=\"#12A9C4\" stroke-width=\"1.4\"/><text x=\"476\" y=\"97\" font-size=\"12\" font-weight=\"700\" fill=\"#0E8CA3\">h<\/text><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"方案设计阶段，该小组同学对需要测量哪些物理量产生了不同意见：<br><b>甲同学：<\/b>需测量滑块和遮光条的总质量、滑块通过两个光电门的速度、两个光电门间的竖直高度差。<br><b>乙同学：<\/b>只需测量滑块通过两个光电门的速度、两个光电门间的竖直高度差。<br><b>丙同学：<\/b>只需测量滑块通过两个光电门的速度、两个光电门间的距离。<br>你认为____同学的方案不可行。","options":["甲","乙","丙"],"answer":2,"explain":"验证式 mgh = ½mv<sub>B<\/sub>² − ½mv<sub>A<\/sub>² 中质量 m 可以约去（只需测速度与竖直高度差 h），甲、乙方案都可行；丙同学只测沿导轨的距离而未测竖直高度差 h（也未测倾角），无法计算重力势能减少量，因此不可行。","quizId":"M07:paper:G3:(1)"},{"label":"(2)","type":"numeric","prompt":"实验中使用的遮光条宽度 d₁ = 10.0 mm，光电门宽度 d₂ = 20.0 mm。某次测量时记录通过光电门 A 的遮光时间为 Δt = 25.0 ms，则滑块经过光电门 A 的速度大小为","unit":"m/s","answer":0.4,"tol":0.005,"show":"0.40","explain":"光电门宽度 d₂ = 20.0 mm 是干扰数据；遮光时间由滑块上的遮光条宽度 d₁ = 10.0 mm 决定。故 v<sub>A<\/sub> = {{frac|d₁|Δt}} = {{frac|10.0 × 10⁻³ m|25.0 × 10⁻³ s}} = 0.40 m/s（或 0.400 m/s）。","quizId":"M07:paper:G3:(2)"}]},{"id":"G4","source":"2025·江西卷·第11题","verified":true,"stem":"某小组利用气垫导轨、两个光电门、滑块、遮光片等，组成具有一定倾角的导轨装置，研究机械能守恒定律，装置如图 (a) 所示。重力加速度 g 取 9.80 m/s²。<svg viewBox=\"0 0 560 156\" width=\"560\" role=\"img\" aria-label=\"2025江西卷气垫导轨装置图\"><line x1=\"36\" y1=\"142\" x2=\"524\" y2=\"142\" stroke=\"#8E99A6\" stroke-width=\"2\"/><rect x=\"64\" y=\"73\" width=\"30\" height=\"69\" fill=\"#C9D1D9\" stroke=\"#596574\"/><polygon points=\"52,60 510,130 508,138 50,68\" fill=\"#D5DEE8\" stroke=\"#596574\"/><rect x=\"114\" y=\"51\" width=\"46\" height=\"20\" rx=\"3\" transform=\"rotate(8.7,137,61)\" fill=\"#3E6FD0\"/><rect x=\"134\" y=\"34\" width=\"4\" height=\"18\" transform=\"rotate(8.7,136,43)\" fill=\"#10233F\"/><text x=\"96\" y=\"30\" font-size=\"11\" fill=\"#3E6FD0\" font-weight=\"600\">释放起点<\/text><rect x=\"116\" y=\"40\" width=\"10\" height=\"32\" transform=\"rotate(8.7,121,56)\" fill=\"#C7374B\"/><text x=\"162\" y=\"28\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#C7374B\">光电门 1<\/text><rect x=\"388\" y=\"84\" width=\"10\" height=\"32\" transform=\"rotate(8.7,393,100)\" fill=\"#3B4B60\"/><text x=\"393\" y=\"76\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\">光电门 2<\/text><text x=\"265\" y=\"118\" font-size=\"11.5\" fill=\"#10233F\">L<\/text><text x=\"475\" y=\"122\" font-size=\"11.5\" fill=\"#4A5B73\">θ<\/text><text x=\"280\" y=\"152\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#4A5B73\">图 (a)<\/text><\/svg><br>实验时，导轨倾角正弦值 sinθ = 0.0613，遮光片宽度 d = 4.82 mm。从导轨最左端静止释放滑块，记录通过光电门 1、2 的遮光时间 Δt₁ 和 Δt₂，移动光电门 2 改变间距 L，部分实验数据如下：<table class=\"dt\"><tr><th>L / cm<\/th><td>10.00<\/td><td>20.00<\/td><td>30.00<\/td><td>60.00<\/td><td>65.00<\/td><td>70.00<\/td><\/tr><tr><th>Δt₁ / ms<\/th><td>9.982<\/td><td>10.019<\/td><td>10.049<\/td><td>10.073<\/td><td>10.066<\/td><td>10.170<\/td><\/tr><tr><th>Δt₂ / ms<\/th><td>8.016<\/td><td>7.032<\/td><td>6.310<\/td><td>4.938<\/td><td>4.787<\/td><td>4.677<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"text-choice","prompt":"实验前应合理安装器材。图 (a) 中位置安装不合理的是____","options":["光电门 1","光电门 2"],"answer":0,"explain":"光电门 1 放置得过于靠左，滑块尚未充分释放就已经遮光或妨碍静止释放，安装不合理的是光电门 1。","quizId":"M07:paper:G4:(1)"},{"label":"(2)","type":"choice","prompt":"针对上述不合理处，正确的调整方法是____。","options":["适当向左移动光电门 1","适当向右移动光电门 1","换用更宽的遮光片","把气垫导轨调平"],"answer":1,"explain":"应适当向右移动光电门 1，使滑块由最左端静止释放后加速一段距离再穿过光电门 1。","quizId":"M07:paper:G4:(2)"},{"label":"(3)","type":"numeric","prompt":"当 L = 65.00 cm 时，滑块通过光电门 2 的速度大小 v₂ =（保留 3 位有效数字）","unit":"m/s","answer":1.01,"tol":0.01,"sig":3,"show":"1.01","explain":"v₂ = {{frac|d|Δt₂}} = {{frac|4.82 × 10⁻³ m|4.787 × 10⁻³ s}} ≈ 1.01 m/s。","quizId":"M07:paper:G4:(3)"},{"label":"(4)","type":"numeric","prompt":"当 L = 65.00 cm 时，滑块在两光电门间下降的竖直高度 H =（保留 3 位有效数字）","unit":"cm","answer":3.98,"tol":0.01,"sig":3,"show":"3.98","explain":"H = L·sinθ = 65.00 cm × 0.0613 = 3.9845 cm ≈ 3.98 cm。","quizId":"M07:paper:G4:(4)"},{"label":"(5)","type":"choice","prompt":"根据多组数据绘出 Δv² − H 图像（其中 Δv² = v₂² − v₁²），拟合直线过原点且斜率约为 19.6 m/s²，说明机械能守恒。该直线斜率的理论表达式为____。","options":["g","2g","g / 2","g·sinθ"],"answer":1,"explain":"由 mgH = ½mv₂² − ½mv₁² 消去 m 并乘以 2，得 Δv² = v₂² − v₁² = 2g·H，故 Δv² − H 图的斜率理论值为 2g ≈ 19.6 m/s²。","quizId":"M07:paper:G4:(5)"}]},{"id":"G5","source":"2025·江苏卷·第11题","verified":true,"stem":"小明同学探究机械能守恒定律：将小钢球在斜槽上某位置 A 由静止释放，沿斜槽通过末端 O 处的光电门，测得遮光时间 t 与钢球直径 d，由 v = d/t 求出速度，再用刻度尺测出钢球下降高度 h。已知钢球质量 m = 0.02 kg，g = 9.80 m/s²。<svg viewBox=\"0 0 560 144\" width=\"560\" role=\"img\" aria-label=\"2025江苏卷斜槽钢球与游标卡尺图\"><g transform=\"translate(8,8)\"><rect x=\"0\" y=\"0\" width=\"230\" height=\"128\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><path d=\"M26 24 Q50 92 178 96\" fill=\"none\" stroke=\"#8E99A6\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"96\" x2=\"178\" y2=\"116\" stroke=\"#596574\" stroke-width=\"4\"/><line x1=\"24\" y1=\"116\" x2=\"204\" y2=\"116\" stroke=\"#10233F\" stroke-width=\"2\"/><circle cx=\"34\" cy=\"24\" r=\"7\" fill=\"#596574\"/><text x=\"46\" y=\"26\" font-size=\"11.5\" font-weight=\"700\">A<\/text><rect x=\"162\" y=\"76\" width=\"10\" height=\"24\" fill=\"#3B4B60\"/><circle cx=\"167\" cy=\"88\" r=\"2.2\" fill=\"#C7374B\"/><text x=\"167\" y=\"70\" font-size=\"11\" text-anchor=\"middle\">光电门 O<\/text><text x=\"115\" y=\"110\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">斜槽装置<\/text><\/g><g transform=\"translate(252,8)\"><rect x=\"0\" y=\"0\" width=\"144\" height=\"128\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><text x=\"72\" y=\"18\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">甲<\/text><rect x=\"22\" y=\"42\" width=\"96\" height=\"14\" fill=\"#D5DEE8\" stroke=\"#596574\"/><polygon points=\"56,56 56,94 64,78 64,56\" fill=\"#B8C4D0\" stroke=\"#596574\"/><polygon points=\"88,56 88,94 80,78 80,56\" fill=\"#B8C4D0\" stroke=\"#596574\"/><circle cx=\"72\" cy=\"78\" r=\"11.5\" fill=\"#7E8A98\" stroke=\"#10233F\"/><text x=\"72\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">外测量爪<\/text><\/g><g transform=\"translate(406,8)\"><rect x=\"0\" y=\"0\" width=\"144\" height=\"128\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><text x=\"72\" y=\"18\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">乙<\/text><rect x=\"22\" y=\"74\" width=\"96\" height=\"14\" fill=\"#D5DEE8\" stroke=\"#596574\"/><polygon points=\"56,74 56,42 64,56 64,74\" fill=\"#B8C4D0\" stroke=\"#596574\"/><polygon points=\"88,74 88,42 80,56 80,74\" fill=\"#B8C4D0\" stroke=\"#596574\"/><circle cx=\"72\" cy=\"54\" r=\"11.5\" fill=\"#7E8A98\" stroke=\"#10233F\"/><text x=\"72\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">内测量爪<\/text><\/g><\/svg><div style=\"font-size:12.5px;font-weight:700;margin-top:4px;color:#10233F\">表 1<\/div><table class=\"dt\"><tr><th>h / (10⁻² m)<\/th><td>4.00<\/td><td>5.00<\/td><td>6.00<\/td><td>7.00<\/td><td>8.00<\/td><\/tr><tr><th>ΔE<sub>k<\/sub> / (10⁻³ J)<\/th><td>4.90<\/td><td>6.25<\/td><td>7.45<\/td><td>8.78<\/td><td>10.0<\/td><\/tr><tr><th>ΔE<sub>p<\/sub> / (10⁻³ J)<\/th><td>7.84<\/td><td>9.80<\/td><td>11.8<\/td><td>13.7<\/td><td>(　)<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"choice","prompt":"安装实验装置的操作有：① 在斜槽末端安装光电门　② 调节斜槽在竖直平面内　③ 调节斜槽末端水平　④ 将斜槽安装到底座上。合理顺序是____。","options":["①②③④","④②③①","④③①②","②③④①"],"answer":1,"explain":"应先将斜槽固定在底座上（④），调至竖直平面（②）并使末端水平（③），最后在末端安装光电门（①），即 ④②③①。","quizId":"M07:paper:G5:(1)"},{"label":"(2)","type":"text-choice","prompt":"用游标卡尺测量钢球直径的正确操作是图中的____","options":["甲","乙"],"answer":0,"explain":"测量小球外径必须使用游标卡尺下方的外测量爪（甲）；内测量爪（乙）用于测圆孔内径。","quizId":"M07:paper:G5:(2)"},{"label":"(3)","type":"numeric","prompt":"将表中 h = 8.00 × 10⁻² m 处的重力势能减少量补充完整：ΔE<sub>p<\/sub> =（保留 3 位有效数字）","unit":"×10⁻³ J","answer":15.7,"tol":0.1,"sig":3,"show":"15.7","explain":"ΔE<sub>p<\/sub> = mgh = 0.02 × 9.80 × 8.00 × 10⁻² J = 15.68 × 10⁻³ J ≈ 15.7 × 10⁻³ J。","quizId":"M07:paper:G5:(3)"},{"label":"(4)","type":"expr","prompt":"实验数据表明 ΔE<sub>k<\/sub> 明显小于 ΔE<sub>p<\/sub>。为检验机械能损失是否主要由摩擦力做功引起，另取相同斜槽平滑对接，钢球从左侧 A 点静止释放后到达右侧最高点 B，A、B 高度差为 H，则全过程中克服摩擦力做功大小的理论值","lhs":"W<sub>理<\/sub> =","vars":{"m":"m","g":"g","H":"H"},"extra":["1","2"],"answer":"m*g*H","show":"mgH","explain":"钢球从 A 静止释放到 B 静止，动能变化为 0，由能量守恒得克服摩擦力做功的理论值 W<sub>理<\/sub> = mgH。","quizId":"M07:paper:G5:(4)"},{"label":"(5)","type":"text-choice","prompt":"实验测得上述对接往返过程的实际摩擦损耗远小于表中的 ΔE<sub>p<\/sub> − ΔE<sub>k<\/sub>。因此小明猜测“表中的巨大差值主要是由摩擦力做功造成的”，你是否同意该猜测？","options":["同意","不同意"],"answer":1,"explain":"不同意。实测摩擦耗功远小于 ΔE<sub>p<\/sub> − ΔE<sub>k<\/sub>，说明主要原因不是摩擦，而是还有另一部分动能未计入。","quizId":"M07:paper:G5:(5)"},{"label":"(6)","type":"choice","prompt":"产生表 1 中 ΔE<sub>k<\/sub> 明显小于 ΔE<sub>p<\/sub> 的主要原因是____。","options":["重力加速度 g 取值偏大","减少的重力势能有一部分转化为钢球的转动动能（未计入平动动能 ½mv² 中）","游标卡尺没有估读","斜槽末端没有调水平"],"answer":1,"explain":"钢球沿斜槽滚下时既平动又绕自身球心转动，减少的重力势能转化为平动动能和转动动能；用 ½mv² 只计算了平动动能，因此明显偏小。","quizId":"M07:paper:G5:(6)"}]},{"id":"G6","source":"2025·甘肃卷·第11题","verified":true,"stem":"某学习小组使用如图所示的实验装置验证机械能守恒定律：用不可伸长的细线悬挂一直径为 d 的小球，光电门置于最低点处（光线通过球心）。将小球拉至高度 h 处由静止释放，记录小球经过光电门的挡光时间 Δt。<svg viewBox=\"0 0 420 148\" width=\"420\" role=\"img\" aria-label=\"2025甘肃卷单摆光电门装置\"><line x1=\"140\" y1=\"16\" x2=\"260\" y2=\"16\" stroke=\"#596574\" stroke-width=\"4\"/><circle cx=\"200\" cy=\"16\" r=\"3\" fill=\"#10233F\"/><line x1=\"200\" y1=\"16\" x2=\"120\" y2=\"86\" stroke=\"#4A5B73\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><circle cx=\"120\" cy=\"86\" r=\"10\" fill=\"#E69B2D\" stroke=\"#10233F\"/><line x1=\"200\" y1=\"16\" x2=\"200\" y2=\"116\" stroke=\"#10233F\" stroke-width=\"1.4\"/><circle cx=\"200\" cy=\"116\" r=\"10\" fill=\"#7E8A98\" stroke=\"#10233F\"/><rect x=\"180\" y=\"110\" width=\"40\" height=\"14\" fill=\"none\" stroke=\"#3B4B60\" stroke-width=\"2\"/><line x1=\"176\" y1=\"116\" x2=\"224\" y2=\"116\" stroke=\"#C7374B\" stroke-dasharray=\"3 2\"/><line x1=\"120\" y1=\"86\" x2=\"288\" y2=\"86\" stroke=\"#12A9C4\" stroke-dasharray=\"3 3\"/><line x1=\"200\" y1=\"116\" x2=\"288\" y2=\"116\" stroke=\"#12A9C4\" stroke-dasharray=\"3 3\"/><path d=\"M280 86 V116\" stroke=\"#12A9C4\" stroke-width=\"1.5\"/><text x=\"288\" y=\"105\" font-size=\"12\" font-weight=\"700\" fill=\"#0E8CA3\">h<\/text><text x=\"236\" y=\"132\" font-size=\"11.5\" fill=\"#3B4B60\">光电门（Δt）<\/text><\/svg>","parts":[{"label":"(1)","type":"choice","prompt":"改变高度 h 测得多组 Δt，若以 h 为横坐标作线性图像来验证机械能守恒，则应选用的纵坐标与理论斜率（用 g、d 表示）分别是____。","options":["纵坐标 {{frac|1|(Δt)²}}，斜率 {{frac|2g|d²}}","纵坐标 (Δt)²，斜率 {{frac|d²|2g}}","纵坐标 {{frac|1|Δt}}，斜率 {{frac|{{sqrt|2g}}|d}}","纵坐标 {{frac|1|(Δt)²}}，斜率 {{frac|g|2d²}}"],"answer":0,"explain":"小球过最低点速度 v = {{frac|d|Δt}}。由 mgh = {{frac|1|2}}mv² 得 ({{frac|d|Δt}})² = 2gh，即 {{frac|1|(Δt)²}} = {{frac|2g|d²}}·h。因此以 h 为横坐标、{{frac|1|(Δt)²}} 为纵坐标作图，理论斜率为 {{frac|2g|d²}}。","quizId":"M07:paper:G6:(1)"},{"label":"(2)","type":"choice","prompt":"某同学用游标卡尺测得小球直径（或遮光宽），规范记录的读数为 <b>1.024 cm<\/b>，则他所用游标卡尺的规格为____。","options":["10 分度（精度 0.1 mm）","20 分度（精度 0.05 mm）","50 分度（精度 0.02 mm）"],"answer":2,"explain":"1.024 cm = 10.24 mm，小数部分 0.24 mm 只能是 50 分度游标卡尺（精度 0.02 mm）的整数倍，10 分度和 20 分度均无法读出 0.24 mm。","quizId":"M07:paper:G6:(2)"},{"label":"(3)","type":"numeric","prompt":"（接上问）该次测量中，游标尺上第____条刻度线（0 线除外）与主尺某刻度线对齐","unit":"条","answer":12,"tol":0,"sig":2,"show":"12","explain":"0.24 mm ÷ 0.02 mm = 12，即游标尺上第 12 条刻度线与主尺刻度线对齐。","quizId":"M07:paper:G6:(3)"}]},{"id":"G7","source":"2025·湖北卷·第12题（阿特伍德机压轴迁移）","verified":true,"stem":"（迁移压轴）某同学用如图 (a) 所示的阿特伍德机装置测量重力加速度 g：细绳跨过固定在铁架台上<b>不可转动的小圆柱体<\/b>，两端挂有质量为 m 的重锤 1（含遮光片，总质量 m）与质量为 M（M > m）的重锤 2。重锤 1 压在桌面上静止时，遮光片中心到光电门的竖直高度差为 H；释放后重锤 1 由静止向上运动，测得遮光片通过光电门的挡光时间为 t。<svg viewBox=\"0 0 560 164\" width=\"560\" role=\"img\" aria-label=\"2025湖北卷阿特伍德机与20分度游标卡尺\"><g transform=\"translate(8,8)\"><rect x=\"0\" y=\"0\" width=\"198\" height=\"148\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#B9C8DA\"/><rect x=\"14\" y=\"130\" width=\"170\" height=\"8\" fill=\"#C9A97A\"/><rect x=\"28\" y=\"18\" width=\"5\" height=\"112\" fill=\"#8E99A6\"/><rect x=\"33\" y=\"24\" width=\"76\" height=\"5\" fill=\"#8E99A6\"/><circle cx=\"109\" cy=\"26\" r=\"8\" fill=\"#B8C4D0\" stroke=\"#596574\"/><line x1=\"101\" y1=\"26\" x2=\"101\" y2=\"114\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"117\" y1=\"26\" x2=\"117\" y2=\"72\" stroke=\"#10233F\" stroke-width=\"1.4\"/><rect x=\"92\" y=\"114\" width=\"18\" height=\"16\" fill=\"#556272\"/><rect x=\"99\" y=\"100\" width=\"4\" height=\"14\" fill=\"#10233F\"/><rect x=\"88\" y=\"62\" width=\"24\" height=\"10\" fill=\"#3B4B60\ (M + m)d² ÷ [2(M − m)Ht²]","explain":"重锤过光电门速度 v = {{frac|d|t}}；系统减少的重力势能 (M − m)gH 等于增加的动能 {{frac|1|2}}(M + m)v²，联立解得 g = {{frac|(M + m)d²|2(M − m)Ht²}}。","quizId":"M07:paper:G7:(2)"},{"label":"(3)","type":"numeric","prompt":"考虑小圆柱体与细绳间的摩擦阻力后，保持 M + m 不变，令 β = {{frac|M − m|M + m}}，测得多组 β 与系统加速度 a 的数据如下表。利用逐差法求得当地重力加速度 g =（保留 3 位有效数字）<table class=\"dt\"><tr><th>β<\/th><td>0.04<\/td><td>0.06<\/td><td>0.08<\/td><td>0.10<\/td><\/tr><tr><th>a / (m·s⁻²)<\/th><td>0.084<\/td><td>0.281<\/td><td>0.477<\/td><td>0.673<\/td><\/tr><\/table>","unit":"m/s²","answer":9.81,"tol":0.02,"sig":3,"show":"9.81","explain":"恒定阻力下 a = βg − a<sub>f<\/sub>，四组逐差得 g = {{frac|(a₄ + a₃) − (a₂ + a₁)|(β₄ + β₃) − (β₂ + β₁)}} = {{frac|(0.673 + 0.477) − (0.281 + 0.084)|(0.10 + 0.08) − (0.06 + 0.04)}} = {{frac|0.785|0.08}} m/s² ≈ 9.81 m/s²。","quizId":"M07:paper:G7:(3)"}]},{"id":"Y1","source":"原创（2 mm 判据与 ½v²-h 图像综合）","verified":true,"score":10,"stem":"某同学使用电磁打点计时器（电源频率 50 Hz，当地 g = 9.80 m/s²）做“验证机械能守恒定律”实验，得到一条点迹清晰的纸带，以第 1 个点 O 为参考起点测得部分点到 O 的距离如图所示（单位：cm）。<svg viewBox=\"0 0 600 98\" width=\"600\" role=\"img\" aria-label=\"纸带2mm判据与速度测量示意图\"><rect x=\"12\" y=\"24\" width=\"576\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><circle cx=\"42\" cy=\"38\" r=\"3\" fill=\"#1661FF\"/><circle cx=\"66\" cy=\"38\" r=\"2.8\" fill=\"#2B2B2B\"/><circle cx=\"104\" cy=\"38\" r=\"2.8\" fill=\"#2B2B2B\"/><text x=\"162\" y=\"42\" font-size=\"12\" fill=\"#4A5B73\">……<\/text><circle cx=\"240\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><circle cx=\"385\" cy=\"38\" r=\"3\" fill=\"#C7374B\"/><circle cx=\"545\" cy=\"38\" r=\"3\" fill=\"#2B2B2B\"/><g font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#10233F\"><text x=\"42\" y=\"17\" fill=\"#1661FF\">0<\/text><text x=\"66\" y=\"17\">1<\/text><text x=\"104\" y=\"17\">2<\/text><text x=\"240\" y=\"17\">8<\/text><text x=\"385\" y=\"17\" fill=\"#C7374B\">9<\/text><text x=\"545\" y=\"17\">10<\/text><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-we       D.ring(ctx, ox0, ry + 14, 24, '#C7374B');
      D.text(ctx, '起点在 ' + (startMm / 10).toFixed(2) + ' cm，需做差！', ox0 + 28, ry + rh + 20, { size: 12, weight: 700, color: '#C7374B' });
    } else if (st.sightShiftMm) {
      var sx = X(d.endMm + st.sightShiftMm);
      ctx.save(); ctx.setLineDash([4, 3]);
      drawLine(ctx, ox1 + st.sightShiftMm * pxPerMm * 2.2, 22, ox1, oy, '#C7374B', 1.6);
      drawLine(ctx, ox1, oy, sx, ry + 12, '#C7374B', 1.6);
      ctx.restore();
      D.text(ctx, '斜视（未正对刻度线）', ox1 + 10, 26, { size: 12, weight: 700, color: '#C7374B' });
    }
    D.text(ctx, '分度值 1 mm · 估读到 0.1 mm（0.01 cm）', 14, hh - 10, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  2. 游标卡尺（10 / 20 / 50 分度）
   * ===================================================================== */
  function drawCaliper(ctx, w, hh, st) {
    st = st || {};
    var div = st.div || 10, valMm = st.valMm != null ? st.valMm : 19.0;
    var d = G.caliper.decompose(valMm, div);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 上半部分：2.5D 卡尺与被测物示意
    var compact = hh < 270;
    var jawX = 56, topY = compact ? 6 : 22, beamY = topY + (compact ? 12 : 26), beamH = compact ? 22 : 30;
    var jawDrop = compact ? 26 : 44, jawInner = compact ? 14 : 22, objOff = compact ? 6 : 14, objH = compact ? 16 : 24;
    var maxMainMm = Math.max(60, Math.ceil((d.q + 52) / 10) * 10);
    var topPxPerMm = Math.min(4.8, (w - jawX - 36) / maxMainMm);
    var mX = function (mm) { return jawX + mm * topPxPerMm; };

    // 主尺身与左固定量爪
    ctx.fillStyle = D.grad(ctx, 0, beamY, 0, beamY + beamH, ['#EEF2F6', '#CDD6E0']);
    ctx.beginPath();
    ctx.moveTo(jawX - 18, beamY); ctx.lineTo(mX(maxMainMm) + 12, beamY);
    ctx.lineTo(mX(maxMainMm) + 12, beamY + beamH); ctx.lineTo(jawX, beamY + beamH);
    ctx.lineTo(jawX, beamY + beamH + jawDrop); ctx.lineTo(jawX - 16, beamY + beamH + jawInner);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7E8C9B'; ctx.lineWidth = 1.2; ctx.stroke();

    // 主尺上刻度
    ctx.strokeStyle = '#10233F'; ctx.beginPath();
    for (var m = 0; m <= maxMainMm; m++) {
      var tx = mX(m), tl = m % 10 === 0 ? 11 : m % 5 === 0 ? 8 : 5;
      ctx.moveTo(tx, beamY + beamH); ctx.lineTo(tx, beamY + beamH - tl);
    }
    ctx.stroke();
    for (var c = 0; c <= Math.floor(maxMainMm / 10); c++) {
      D.text(ctx, String(c), mX(c * 10), beamY + (compact ? 10 : 13), { align: 'center', size: 10, weight: 700 });
    }

    // 被测圆柱（夹在两外量爪之间）
    var objW = d.q * topPxPerMm, objY = beamY + beamH + objOff;
    ctx.fillStyle = D.grad(ctx, jawX, objY, jawX + objW, objY, ['#E69B2D', '#F5C469', '#C87E1A']);
    ctx.fillRect(jawX, objY, objW, objH);
    ctx.strokeStyle = '#9A5A00'; ctx.strokeRect(jawX, objY, objW, objH);

    // 可动游标框（左边缘在 d.q - 2.0 mm，游标 0 刻线在 d.q mm）
    var vLeft = mX(d.q - 2.2), vRight = mX(d.q + (div === 10 ? 11 : div === 20 ? 21 : 51));
    var vBoxBot = compact ? 15 : 20;
    ctx.fillStyle = D.grad(ctx, 0, beamY + beamH - 2, 0, beamY + beamH + vBoxBot + 4, ['#DCE4EC', '#AEB9C6']);
    ctx.beginPath();
    ctx.moveTo(mX(d.q), beamY + beamH + jawDrop); ctx.lineTo(mX(d.q) + 16, beamY + beamH + jawInner);
    ctx.lineTo(mX(d.q) + 16, beamY + beamH + vBoxBot); ctx.lineTo(vRight, beamY + beamH + vBoxBot);
    ctx.lineTo(vRight, beamY + beamH - 2); ctx.lineTo(vLeft, beamY + beamH - 2);
    ctx.lineTo(vLeft, beamY + beamH + vBoxBot); ctx.lineTo(mX(d.q), beamY + beamH + vBoxBot);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();
    // 游标 0 刻线标记
    drawLine(ctx, mX(d.q), beamY + beamH - 1, mX(d.q), beamY + beamH + (compact ? 11 : 14), '#1661FF', 1.5);

    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, vLeft, beamY + beamH + 8, 14, '#C7374B');
      D.text(ctx, '这是游标框左边缘（不是 0 线）', vLeft - 8, beamY + beamH + (compact ? 31 : 34), { size: 11, weight: 700, color: '#C7374B' });
    }

    // 下半部分：高倍率刻度放大阅读窗（能清晰分辨 50 分度 0.02 mm）
    var zy = compact ? Math.max(Math.round(hh * 0.48), beamY + beamH + 36) : Math.round(hh * 0.45);
    var zh = hh - zy - (compact ? 22 : 26), zx = 14, zw = w - 28;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.4;
    D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '局部放大（' + div + ' 分度 · 精度 ' + d.step + ' mm）', zx + 12, zy + 17, { size: 12, weight: 700, color: '#1661FF' });

    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 4, zy + 22, zw - 8, zh - 26, 8); ctx.clip();
    var vernLen = div === 10 ? 9 : div === 20 ? 19 : 49;
    var winSpan = Math.max(18, vernLen + 9);
    var winMinMm = Math.max(0, Math.floor(d.q) - 4);
    var zScale = (zw - 36) / winSpan;
    var zX = function (mm) { return zx + 18 + (mm - winMinMm) * zScale; };
    var midY = zy + 22 + (zh - 26) * 0.48;

    // 放大主尺
    ctx.fillStyle = '#F3F7FC'; ctx.fillRect(zx, zy + 22, zw, midY - zy - 22);
    ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.1; ctx.beginPath();
    var m0 = Math.floor(winMinMm), m1 = Math.ceil(winMinMm + winSpan);
    for (m = m0; m <= m1; m++) {
      var xPos = zX(m), hT = m % 10 === 0 ? 22 : m % 5 === 0 ? 16 : 10;
      ctx.moveTo(xPos, midY); ctx.lineTo(xPos, midY - hT);
    }
    ctx.stroke();
    for (m = m0; m <= m1; m++) {
      if (m % 10 === 0) D.text(ctx, String(m / 10), zX(m), midY - 26, { align: 'center', size: 12, weight: 700 });
    }
    D.text(ctx, 'cm', zX(m1) - 10, midY - 26, { align: 'right', size: 11, color: '#4A5B73' });

    // 放大游标尺框（框左边缘明显在 0 线左 2 mm）
    var zvLeft = zX(d.q - 2.0), zvRight = zX(d.markPosMm(div) + 1.8);
    ctx.fillStyle = '#E8EEF5'; ctx.fillRect(zvLeft, midY, zvRight - zvLeft, zh);
    drawLine(ctx, zvLeft, midY, zvLeft, zy + zh, '#7E8C9B', 2);
    drawLine(ctx, zx, midY, zx + zw, midY, '#596574', 1.2);

    // 放大游标刻线
    for (var i = 0; i <= div; i++) {
      var vx = zX(d.markPosMm(i));
      var isMajor = div === 10 ? true : (div === 20 ? i % 2 === 0 : i % 5 === 0);
      var isAlign = st.hintAlign && i === d.k;
      var vLen = i === 0 || i === div ? 22 : (i % 5 === 0 ? 18 : 11);
      drawLine(ctx, vx, midY, vx, midY + vLen, isAlign ? '#25A870' : (i === 0 ? '#1661FF' : '#10233F'), isAlign || i === 0 ? 1.8 : 1);
      if (isMajor && (div !== 50 || i % 10 === 0 || i === 5)) {
        var lbl = div === 50 ? String(i / 5) : String(i);
        D.text(ctx, lbl, vx, midY + 35, { align: 'center', size: div === 50 ? 10.5 : 11, weight: i === 0 ? 700 : 500, color: i === 0 ? '#1661FF' : '#10233F' });
      }
    }
    if (st.marks && st.marks.indexOf('frameEdge') >= 0) {
      D.ring(ctx, zvLeft, midY + 12, 16, '#C7374B');
      D.ring(ctx, zX(d.q), midY + 12, 16, '#25A870');
    }
    if (st.hintAlign) {
      var ax = zX(d.markPosMm(d.k));
      ctx.save(); ctx.setLineDash([3, 3]);
      drawLine(ctx, ax, midY - 26, ax, midY + 26, '#25A870', 1.6);
      ctx.restore();
    }
    ctx.restore();

    D.text(ctx, '主尺读到游标 0 刻线左侧整毫米；拖动量爪或右侧按钮调长度，按住看放大镜', 14, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  3. 螺旋测微器（千分尺）
   * ===================================================================== */
  function drawMicSleeve(ctx, x, y, w, hh, dispMm, opts) {
    opts = opts || {};
    var pxPerMm = opts.pxPerMm || 28;
    var sleeveW = w * 0.56, zeroX = x + 16;
    var datumY = y + hh * 0.50;
    var thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    if (thimbleX > x + sleeveW - 18) {
      var shiftMm = (thimbleX - (x + sleeveW - 18)) / pxPerMm;
      zeroX -= shiftMm * pxPerMm;
      thimbleX = Math.max(zeroX, zeroX + dispMm * pxPerMm);
    }

    ctx.save();
    ctx.beginPath(); D.rr(ctx, x, y, w, hh, 8); ctx.clip();
    ctx.fillStyle = '#FBFCFE'; ctx.fillRect(x, y, w, hh);

    // 固定刻度套筒
    ctx.fillStyle = D.grad(ctx, 0, datumY - 36, 0, datumY + 36, ['#DCE3EC', '#F8FAFC', '#C7D1DC']);
    ctx.fillRect(x, datumY - 36, Math.max(0, thimbleX - x), 72);
    drawLine(ctx, x, datumY - 36, thimbleX, datumY - 36, '#8E99A6', 1);
    drawLine(ctx, x, datumY + 36, thimbleX, datumY + 36, '#8E99A6', 1);
    drawLine(ctx, Math.min(x, zeroX - 4), datumY, thimbleX, datumY, '#10233F', 1.4);

    // 整毫米（上）与 0.5 mm（下）
    var maxM = Math.ceil((thimbleX - zeroX) / pxPerMm) + 1;
    var halfExp = (Math.floor((dispMm + 1e-9) / 0.5) % 2) === 1;
    for (var m = 0; m <= maxM; m++) {
      var mx = zeroX + m * pxPerMm;
      if (mx <= thimbleX + 0.5 && mx >= x + 4) {
        drawLine(ctx, mx, datumY, mx, datumY - (m % 5 === 0 ? 18 : 12), '#10233F', m % 5 === 0 ? 1.5 : 1.1);
        if (m % 5 === 0) D.text(ctx, String(m), mx, datumY - 22, { align: 'center', size: 11, weight: 700 });
      }
      var hx = zeroX + (m + 0.5) * pxPerMm;
      if (hx <= thimbleX + 0.5 && hx >= x + 4) {
        var isHalfMark = opts.markHalf && halfExp && Math.abs(m - Math.floor(dispMm)) < 0.01;
        drawLine(ctx, hx, datumY, hx, datumY + 13, isHalfMark ? '#C7374B' : '#10233F', isHalfMark ? 2 : 1.1);
        if (isHalfMark) D.ring(ctx, hx, datumY + 7, 13, '#C7374B');
      }
    }
    if (opts.markHalf && !halfExp && dispMm > 0) {
      D.ring(ctx, thimbleX - 6, datumY + 8, 13, '#C7374B');
      D.text(ctx, '半mm未露', Math.max(x + 34, thimbleX - 18), datumY + 28, { align: 'center', size: 10.5, weight: 700, color: '#C7374B' });
    }

    // 可动刻度锥面套筒
    var bevelW = 34, bodyW = x + w - thimbleX - bevelW;
    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#B8C3CF', '#F5F8FB', '#9AA7B5']);
    ctx.beginPath();
    ctx.moveTo(thimbleX, datumY - 36); ctx.lineTo(thimbleX + bevelW, datumY - 48);
    ctx.lineTo(thimbleX + bevelW, datumY + 48); ctx.lineTo(thimbleX, datumY + 36);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#596574'; ctx.stroke();

    ctx.fillStyle = D.grad(ctx, 0, datumY - 48, 0, datumY + 48, ['#9FAAB7', '#E6ECF3', '#7E8A98']);
    ctx.fillRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);
    ctx.strokeRect(thimbleX + bevelW, datumY - 48, Math.max(20, bodyW), 96);

    // 可动刻度 50 格（向上递增）
    var thVal = +((dispMm - Math.floor((dispMm + 1e-9) / 0.5) * 0.5) * 100).toFixed(2);
    var sp = 6.2;
    for (var t = 0; t < 50; t++) {
      var diff = ((t - thVal + 75) % 50) - 25;
      var ty = datumY - diff * sp;
      if (ty < datumY - 43 || ty > datumY + 43) continue;
      var is5 = t % 5 === 0;
      drawLine(ctx, thimbleX + 3, ty, thimbleX + (is5 ? 20 : 12), ty, '#10233F', is5 ? 1.4 : 1);
      if (is5) D.text(ctx, String(t), thimbleX + 23, ty + 4, { size: 11, weight: 700 });
    }
    ctx.restore();
    ctx.strokeStyle = '#B9C8DA'; ctx.lineWidth = 1.2;
    D.rr(ctx, x, y, w, hh, 8); ctx.stroke();
  }

  function drawMicrometer(ctx, w, hh, st) {
    st = st || {};
    var trueMm = st.trueMm != null ? st.trueMm : 6.860, zeroErr = st.zeroErrMm || 0;
    var d = G.micrometer.decompose(trueMm, zeroErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：2.5D U 形尺架与被测物
    var uLeft = 24, uTop = 26, anvilX = 56, gapW = Math.max(12, Math.min(72, d.trueMm * 4.5));
    var spinX = anvilX + gapW, axisY = uTop + 34;
    ctx.strokeStyle = '#596574'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(uLeft + 52, axisY + 34, 48, Math.PI * 0.12, Math.PI * 1.12); ctx.stroke();
    ctx.strokeStyle = '#9AA7B5'; ctx.lineWidth = 8; ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineWidth = 1;

    ctx.fillStyle = '#8E99A6'; ctx.fillRect(anvilX - 10, axisY - 7, 10, 14);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 12, 0, axisY + 12, ['#D9B98C', '#C49F6B']);
    ctx.beginPath(); ctx.arc((anvilX + spinX) / 2, axisY, gapW / 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8E6B38'; ctx.stroke();
    ctx.fillStyle = '#C9D1D9'; ctx.fillRect(spinX, axisY - 6, 48, 12); ctx.strokeStyle = '#6E7B8A'; ctx.strokeRect(spinX, axisY - 6, 48, 12);
    ctx.fillStyle = D.grad(ctx, 0, axisY - 16, 0, axisY + 16, ['#DCE4EC', '#9AA7B5']);
    ctx.fillRect(spinX + 46, axisY - 16, 62, 32); ctx.strokeRect(spinX + 46, axisY - 16, 62, 32);

    var compact = hh < 270;
    // 零误差参考小窗（若存在零误差）
    if (Math.abs(zeroErr) > 1e-6) {
      var zx = w - 210, zy = compact ? 4 : 10, zh0 = compact ? 62 : 88;
      D.text(ctx, '空载零误差：' + (zeroErr >= 0 ? '+' : '') + zeroErr.toFixed(3) + ' mm', zx + 2, zy + 11, { size: 11.5, weight: 700, color: '#C7374B' });
      drawMicSleeve(ctx, zx, zy + 16, 194, zh0, zeroErr, { pxPerMm: 24 });
    } else {
      D.text(ctx, '螺距 0.5 mm · 50 格（0.01 mm/格）· 估读到 0.001 mm', w - 16, axisY - 12, { align: 'right', size: 11.5, weight: 600, color: '#10233F' });
    }

    // 下方：高清晰放大套筒读数窗
    var my = (compact && Math.abs(zeroErr) > 1e-6) ? Math.max(Math.round(hh * 0.42), 88) : Math.round(hh * 0.36);
    var mh = hh - my - 26;
    drawMicSleeve(ctx, 18, my, w - 36, mh, d.dispMm, { pxPerMm: Math.min(34, (w - 160) / Math.max(6, d.dispMm + 2)), markHalf: st.marks && st.marks.indexOf('half') >= 0 });
    D.text(ctx, '读数 = 固定刻度（注意下排 0.5 mm 刻线）+ 可动刻度格数 × 0.01 mm', 18, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  4. 弹簧测力计（0-5 N，0.1 N 分度）
   * ===================================================================== */
  function drawDynamometer(ctx, w, hh, st) {
    st = st || {};
    var f = st.trueForceN != null ? st.trueForceN : 3.70, zErr = st.zeroOffsetN || 0;
    var d = G.dynamometer.decompose(f, zErr);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：测力计整机
    var cx = Math.round(w * 0.28), by = 30, bw = 82, bh = Math.min(220, hh - 80);
    ctx.strokeStyle = '#8E99A6'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, by - 8, 12, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = D.grad(ctx, cx - bw / 2, 0, cx + bw / 2, 0, ['#F8FAFC', '#DCE4EC']);
    D.rr(ctx, cx - bw / 2, by, bw, bh, 12); ctx.fill(); ctx.strokeStyle = '#7E8C9B'; ctx.stroke();

    var sTop = by + 24, sBot = by + bh - 26, sH = sBot - sTop;
    var yOf = function (n) { return sTop + (n / 5) * sH; };
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 22, sTop - 8, 44, sH + 16);
    ctx.strokeStyle = '#B9C8DA'; ctx.strokeRect(cx - 22, sTop - 8, 44, sH + 16);
    for (var n = 0; n <= 50; n++) {
      var yy = yOf(n / 10), maj = n % 10 === 0, mid = n % 5 === 0;
      drawLine(ctx, cx - 20, yy, cx - 20 + (maj ? 14 : mid ? 10 : 6), yy, '#10233F', maj ? 1.4 : 0.9);
      if (maj) D.text(ctx, String(n / 10), cx + 14, yy + 4, { align: 'right', size: 11, weight: 700 });
    }
    var py = yOf(Math.max(0, Math.min(5, d.dispN)));
    drawLine(ctx, cx - 22, py, cx + 18, py, '#C7374B', 2.4);
    drawLine(ctx, cx, by + bh, cx, by + bh + 18, '#6E7B8A', 2.5);
    ctx.fillStyle = '#8E99A6'; ctx.fillRect(cx - 14, by + bh + 16, 28, 16);
    D.text(ctx, '0–5 N', cx, by + 16, { align: 'center', size: 11, weight: 700, color: '#4A5B73' });

    // 右侧：指针处高倍率放大窗
    var zx = Math.round(w * 0.48), zw = w - zx - 20, zy = 26, zh = hh - 62;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA'; D.rr(ctx, zx, zy, zw, zh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '指针局部放大（最小分度 0.1 N · 估读到 0.01 N）', zx + 14, zy + 20, { size: 12, weight: 700, color: '#1661FF' });
    if (Math.abs(zErr) > 1e-6) {
      D.text(ctx, '注意：空载未调零，零误差 ' + (zErr >= 0 ? '+' : '') + zErr.toFixed(2) + ' N', zx + 14, zy + 38, { size: 12, weight: 700, color: '#C7374B' });
    }
    ctx.save();
    ctx.beginPath(); D.rr(ctx, zx + 8, zy + 46, zw - 16, zh - 56, 8); ctx.clip();
    var zScale = (zh - 60) / 1.4, zCenter = d.dispN;
    var zY = function (val) { return zy + 46 + (zh - 56) / 2 + (val - zCenter) * zScale; };
    var n0 = Math.max(0, Math.floor((zCenter - 0.8) * 10)), n1 = Math.min(50, Math.ceil((zCenter + 0.8) * 10));
    var scaleX = zx + zw * 0.42;
    ctx.fillStyle = '#F8FBFF'; ctx.fillRect(scaleX - 30, zy + 46, 90, zh);
    for (n = n0; n <= n1; n++) {
      var yk = zY(n / 10), isMaj = n % 10 === 0, isMid = n % 5 === 0;
      drawLine(ctx, scaleX - 24, yk, scaleX - 24 + (isMaj ? 32 : isMid ? 22 : 14), yk, '#10233F', isMaj ? 1.8 : 1.1);
      if (isMaj || isMid) D.text(ctx, (n / 10).toFixed(1), scaleX + 20, yk + 4, { size: 12.5, weight: isMaj ? 700 : 500 });
    }
    var zpy = zY(d.dispN);
    drawLine(ctx, scaleX - 42, zpy, scaleX + 18, zpy, '#C7374B', 2.6);
    ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.moveTo(scaleX - 42, zpy - 6); ctx.lineTo(scaleX - 30, zpy); ctx.lineTo(scaleX - 42, zpy + 6); ctx.closePath(); ctx.fill();
    ctx.restore();
    D.text(ctx, '拖动挂钩或右侧按钮改变拉力', 14, hh - 8, { size: 12, color: '#4A5B73' });
  }

  /* =====================================================================
   *  5. 机械停表（0-15 min 小盘 + 0-30 s 大盘，不估读）
   * ===================================================================== */
  function drawStopwatch(ctx, w, hh, st) {
    st = st || {};
    var totalSec = st.totalSec != null ? st.totalSec : 54.0;
    var d = G.stopwatch.decompose(totalSec);
    ctx.fillStyle = '#F6F9FD'; ctx.fillRect(0, 0, w, hh);

    // 左侧：停表主体
    var R = Math.min(hh * 0.38, w * 0.22, 118), cx = Math.round(w * 0.27), cy = Math.round(hh * 0.52);
    ctx.fillStyle = '#8E99A6'; ctx.fillRect(cx - 10, cy - R - 18, 20, 14);
    ctx.fillStyle = D.grad(ctx, cx - R, cy - R, cx + R, cy + R, ['#E6ECF2', '#9AA7B5']);
    ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, Math.PI * 2); ctx.fill();

  /* ---------- 几何映射 ---------- */

    var tableY = Math.round(hh * 0.87), timerY = Math.round(hh * 0.25), timerH = Math.round(Math.min(54, hh * 0.13));

  Bench.prototype.drawGateBg = function (ctx, w, hh) {
    var tY = Math.round(hh * 0.85);

  /* ---------- 动态层 ---------- */

    this.hot = [];

    var g = this.geo(), b = this.b, bob = BOB_INFO[b.bob || 'iron'];

    var holeY = g.timerY + g.timerH * 0.5, handY = Math.max(26, g.timerY - 58);

      D.text(ctx, '纸带（点击穿入）', rx, ry - 24, { align: 'center', size: 11.5, weight: 600, color: '#12A9C4' });
      this.hot.push({ id: 'thread', x: rx - 28, y: ry - 30, w: 56, h: 56, label: '穿纸带' });
    }

    // 2. 竖直固定打点计时器（盖在纸带中段上）

    var isSpark = b.timer === 'spark';
    ctx.fillStyle = isSpark ? D.grad(ctx, 0, ty, 0, ty + th, ['#F2F5F9', '#C9D1D9']) : D.grad(ctx, 0, ty, 0, ty + th, ['#526E90', '#314864']);
    D.rr(ctx, tx, ty, tw, th, 7); ctx.fill();
    ctx.strokeStyle = '#6C7D91'; ctx.strokeRect(x - 8, ty + 2, 16, th - 4);
    ctx.fillStyle = b.powered && b.run && b.run.power.prints ? '#25A870' : b.powered ? '#E69B2D' : '#9AA8B8';
    ctx.beginPath(); ctx.arc(tx + tw - 10, ty + 11, 4.5, 0, Math.PI * 2); ctx.fill();
    D.text(ctx, b.timer ? TIMER_NAME[b.timer] : '打点计时器（点选）', tx + tw + 8, ty + th / 2 + 4, { size: 12, weight: 700, color: b.timer ? '#10233F' : '#12A9C4' });
    this.hot.push({ id: 'timer', x: tx - 6, y: ty - 6, w: tw + 12, h: th + 12, label: '打点计时器' });

    // 3. 学生电源与导线
    var px = Math.max(14, Math.round(w * 0.04)), pw = Math.min(180, Math.round(w * 0.25)), ph = 64, py = tY - ph;

    D.text(ctx, b.power ? POWER_NAME[b.power] : '未选档位', px + 10, py + 38, { size: 12.5, weight: 700, color: b.power ? (b.power === 'dc8' ? '#C7374B' : '#1661FF') : '#E69B2D' });
    var sx = px + pw - 28, sy = py + ph / 2;
    ctx.fillStyle = b.powered ? '#25A870' : '#8E99A6'; D.rr(ctx, sx - 15, sy - 9, 30, 18, 9); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.powered ? sx + 6 : sx - 6, sy, 6.5, 0, Math.PI * 2); ctx.fill();
    D.text(ctx, b.powered ? '开' : '关', sx, sy + 22, { align: 'center', size: 11 });
    ctx.strokeStyle = b.power === 'dc8' ? '#C7374B' : '#1C1C1C'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px + pw * 0.45, py); ctx.bezierCurveTo(px + pw * 0.4, py - 80, tx - 40, ty + th, tx, ty + th * 0.65); ctx.stroke(); ctx.lineWidth = 1;
    this.hot.push({ id: 'power', x: px, y: py, w: pw - 46, h: ph, label: '电源档位' });
    this.hot.push({ id: 'switch', x: sx - 24, y: sy - 22, w: 48, h: 46, label: '电源开关' });

      ctx.strokeStyle = 'rgba(18,169,196,.65)'; ctx.setLineDash([4, 4]);
      ctx.strokeRect(x - bw / 2 - 4, g.bobNearY - 2, bw + 8, bh + 4); ctx.setLineDash([]);
      if (b.startAt >= 0.03) D.text(ctx, '拖到此处靠近计时器', x + bw / 2 + 12, g.bobNearY + bh / 2 + 4, { size: 11, color: '#12A9C4', weight: 600 });

    ctx.strokeStyle = '#3B4B60'; ctx.stroke();

    var hitBw = Math.max(48, bw + 26), hitBh = Math.max(48, bh + 18);

  };
  Bench.prototype.drawGateFg = function (ctx, w, hh) {
    var tY = Math.round(hh * 0.85), x0 = w * 0.12, x1 = w * 0.88, span = x1 - x0;

      D.text(ctx, 'Δt₁ = ' + (this.b.t > r.t1 ? (r.dt1 * 1000).toFixed(2) + ' ms' : '---'), dx + 12, dy + 44, { size: 13, color: '#7CF0B4', weight: 700, maxW: boxW * 0.34 });

    }

  /* ---------- 指针交互 ---------- */
  Bench.prototype.bindPointer = function () {
    var self = this, dragging = false, startY = 0, start0 = 0;
    ML.stage.pointer(this.stage.layer('fg').canvas, {
      down: function (p) {
        if (self.apparatus !== 'timer') return false;
        var hit = self.hitTest(p);
        dragging = hit === 'bob' && !self.b.released; startY = p.y; start0 = self.b.startAt;
      },
      move: function (p) {
        if (!dragging) return;
        var g = self.geo();
        self.b.startAt = P.clamp(start0 + (p.y - startY) / g.scale, 0, 0.28);
        self.stage.invalidate('fg');
      },
      up: function (p, a) {
        if (dragging && a.moved) {
          dragging = false;
          if (self.b.startAt < 0.03) { self.b.startAt = 0; ML.toast('重锤已紧靠打点计时器下方', 'ok'); }
          self.check(); self.stage.invalidate('fg'); return;
        }
        dragging = false;
        var hit = self.hitTest(p);
        if (hit === 'hand') self.release();
        else if (hit === 'timer') self.setTimer(self.b.timer === 'em' ? 'spark' : 'em');
        else if (hit === 'power') { var ord = ['ac8', 'ac220', 'dc8'], i = ord.indexOf(self.b.power); self.setPower(ord[(i + 1) % 3]); }
        else if (hit === 'switch') self.powerOn();
        else if (hit === 'thread') self.thread();
        else if (hit === 'bob') { self.b.startAt = self.b.startAt < 0.03 ? 0.28 : 0; self.check(); self.stage.invalidate(); }
      }
    });
  };
  Bench.prototype.hitTest = function (p) {
    var hs = this.hot || [];
    for (var i = hs.length - 1; i >= 0; i--) { var r = hs[i]; if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r.id; }
    return null;
  };
  Bench.prototype.guided = function () { return this.mode === 'guided'; };
  Bench.prototype.block = function (msg, errId) {

    this.setBanner('<b>先停一下：</b>' + msg + (errId ? ' <button class="link" type="button" data-try="' + errId + '">试一试：如果这样做会怎样 →</button>' : ''));

  };
  Bench.prototype.setTimer = function (t) {
    if (this.b.released) return;

    this.check(); this.stage.invalidate();
  };
  Bench.prototype.setPower = function (p) {
    var b = this.b; if (b.released) return;

      var right = b.timer === 'em' ? 'ac8' : 'ac220';
      if (p !== right) { this.block(TIMER_NAME[b.timer] + '应接' + POWER_NAME[right] + '。' + T.powerCheck({ timer: b.timer, power: p }).msg, null); return; }
    }
    b.power = p; b.powered = false; this.setBanner(null); this.check(); this.stage.invalidate();
  };
  Bench.prototype.thread = function () {
    if (this.b.released) return;

  };
  Bench.prototype.missing = function () {
    var b = this.b, miss = [];

    return miss;
  };
  Bench.prototype.powerOn = function () {
    var b = this.b;
    if (b.powered) {
      if (!b.running) {
        b.powered = false;
        b.order = b.order.filter(function (x) { return x !== 'power'; });
        this.stage.invalidate(); this.renderSide();
      }
      return;
    }
    if (!b.timer || !b.power) { ML.toast('先选计时器并接好电源', 'warn'); return; }
    if (this.guided()) {
      var miss = this.missing(); if (miss.length) { ML.toast('还没完成：' + miss.join('、'), 'warn'); return; }
      if (b.startAt >= 0.03) { this.block('释放前重物应紧靠打点计时器下方。' + PROC.P4.why, 'E5'); return; }
    }
    var pc = T.powerCheck({ timer: b.timer, power: b.power });
    if (pc.blocked) { b.warn = '⚠ ' + pc.msg + ' 已自动断电。'; this.stage.invalidate(); var self = this; setTimeout(function () { self.b.warn = ''; self.stage.invalidate(); }, 3200); return; }
    b.powered = true; b.order.push('power');
    if (b.running) { b.lag = P.clamp(b.t, 0.06, 0.16); this.rebuild(); ML.toast('已在中途补通电源！', 'info'); }
    this.check(); this.stage.invalidate();
  };
  Bench.prototype.release = function () {

      if (b.startAt >= 0.03) { this.block('释放前重物应紧靠打点计时器下方。' + PROC.P4.why, 'E5'); return; }
      if (!b.powered) { this.block('应先接通电源让打点稳定，再松手释放纸带。' + PROC.P5.why, 'E1'); return; }
    }
    b.released = true; b.order.push('release'); b.running = true;
    b.lag = b.order[0] === 'power' ? 0.40 : (b.powered ? 0.12 : Infinity);
    b.t = b.order[0] === 'power' ? 0.40 : 0;
    this.rebuild(); this.setBanner(null); this.renderSide(); this.loop.start();
    if (!b.powered && !this.guided()) ML.toast('纸带正在下落！可在下落途中点“接通电源”观察先释放后果', 'warn');
  };
  Bench.prototype.releaseLateDemo = function () {

    if (!b.power) b.power = b.timer === 'em' ? 'ac8' : 'ac220';
    b.threaded = true; b.powered = true; b.released = true; b.order = ['release', 'power'];
