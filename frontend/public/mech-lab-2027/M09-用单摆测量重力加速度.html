<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：用单摆测量重力加速度</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M09 scene.css — 实验：用单摆测量重力加速度（1016×563 横屏一屏紧凑适配） */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 36px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:7px 12px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 352px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(62vh,500px);min-height:340px;background:#EAF1F8;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stage-acts{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:none}
.stage-acts .btn{pointer-events:auto;box-shadow:0 3px 10px rgba(16,35,63,.16)}
.stage-acts .btn.big{min-height:46px;padding:0 20px;font-size:15.5px}
.stage-acts .btn.pulse{background:#C7374B;border-color:#C7374B;color:#fff}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;max-height:min(62vh,500px);display:flex;flex-direction:column;overflow-y:auto;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:52px}
.side-v{min-width:52px;text-align:center;font-size:13.5px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 4px}
.side-acts .btn.full{grid-column:span 2}
.side-tip{font-size:12.5px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:7px 9px;margin-top:4px}
.steps{padding-left:18px;margin:2px 0 0;flex:1 1 auto;min-height:76px;overflow-y:auto}
.steps li{margin-bottom:6px;font-size:13px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12px}
.st-why{color:var(--ink2);font-size:11.5px;margin-top:2px;line-height:1.35}
.link.sm{font-size:12.5px;min-height:32px;padding:2px 0}
.muted{color:var(--ink2);font-size:13px}

/* 下方测量结果、停表表盘与 L-T² 拟合区 */
.analysis{margin-top:12px;background:#fff;border-radius:var(--r);padding:14px 18px;border:1px solid var(--line)}
.ana-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.ana-h{margin:0;font-size:19px}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.ana-card{background:#F8FBFF;border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.ana-card h3{margin:0 0 6px;font-size:15px}
.ana-kpi{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.kpi-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.kpi-item b{display:block;font-size:16px;color:var(--ink)}
.kpi-item.ok b{color:#17784F}.kpi-item.warn b{color:#9A5A00}.kpi-item.bad b{color:var(--err)}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.ana-tbl{width:100%}
.ana-tbl tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}

/* 游标卡尺弹窗 */
.cal-read-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cal-inp{width:120px;min-height:40px;border:1.5px solid var(--line);border-radius:var(--rs);padding:4px 10px;font-size:17px;font-weight:700;background:#FBFCFE}
.cal-fb{margin-top:8px;border-radius:var(--rs);padding:8px 12px;font-size:13.5px;background:#F6F9FD}
.cal-fb.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.cal-fb.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:var(--err)}

/* 学·原理小部件与诊·误差 */
.learn-widget{margin-top:10px}
.m09-widget-stage{position:relative;height:186px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0;background:#F8FBFF}
.cmp-note{font-size:14px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table{width:100%}.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp-box{border-radius:var(--rs);padding:10px 12px;font-size:14px}
.cmp-box.good{background:#EEF9F4;border:1px solid #BCE6D2}

<script type="application/json" id="ml-content">{"slug":"mech-lab-m09","title":"实验：用单摆测量重力加速度","sub":"人教版 选择性必修第一册 第二章 5","chapter":"选择性必修第一册 第二章 5","methods":["累积法测周期（n = 30）","最低点从 0 开始计时","L − T² 图像斜率法（消系统误差）","力传感器 F − t / 光电门测周期"],"learn":[{"id":"L1","title":"实验原理与简谐近似（摆角 < 5°）","widget":"angle-demo","html":"<p><b>实验目的：<\/b>用单摆测当地重力加速度。当单摆在摆角很小的情况下摆动时，可近似看作<b>简谐运动<\/b>，周期公式为 T = 2π{{sqrt|{{frac|L|g}}}}，由此得 g = {{frac|4π²L|T²}}。<\/p>","steps":["<b>回复力的来源<\/b>：单摆摆动时，重力的切向分力 F<sub>回<\/sub> = −mg sinθ 提供回复力（注意：既不是摆球所受合力，也不是细线拉力）。","<b>小角度近似<\/b>：当最大摆角 <b>θ &lt; 5°<\/b> 时，sinθ ≈ θ ≈ {{frac|x|L}}，因此 F<sub>回<\/sub> ≈ −{{frac|mg|L}}x，单摆做简谐运动，周期与摆球质量、振幅无关。","<b>大摆角与圆锥摆的危害<\/b>：若摆角过大（如 35°），实际周期比 2π{{sqrt|{{frac|L|g}}}} 偏大（近似按 1 + {{frac|θ₀²|16}} 增大），算出的 g 偏小；若摆球在水平面内做<b>圆锥摆<\/b>，周期 T = 2π{{sqrt|{{frac|L cosθ|g}}}} 偏小，算出的 g 偏大。"]},{"id":"L2","title":"摆长定义 L = l + d/2 与悬挂测量","widget":"caliper-bob-demo","html":"<p>单摆摆长 L 指<b>悬点到摆球球心<\/b>的距离，而不是摆线长度 l。<\/p>","steps":["<b>摆长公式<\/b>：L = l + {{frac|d|2}}，其中 l 为摆线长度，d 为摆球直径。","<b>分步精准测量<\/b>：先用<b>游标卡尺<\/b>测摆球直径 d（游标卡尺<b>不估读<\/b>，如 10 分度读为 19.0 mm）；再将单摆<b>自然竖直悬挂<\/b>后，用刻度尺测出悬点到摆球上端的摆线长 l（不能把线平放在桌面上测量）。","<b>器材选择与固定<\/b>：摆球选<b>质量大、体积小<\/b>的金属球（钢球/铜球），减小空气阻力和球心定位误差；摆线选细、轻、伸缩性小的丝线（约 1 m）；悬点必须用<b>铁夹夹紧<\/b>，防止摆动时绕铁杆松动使摆长变化。"]},{"id":"L3","title":"为什么从最低点开始计时？","widget":"timing-pos-demo","html":"<p>用机械停表测周期时，计时起点必须选在摆球经过<b>平衡位置（最低点）<\/b>的瞬间。<\/p>","steps":["<b>最低点速度最大<\/b>：摆球通过最低点时速率 v<sub>max<\/sub> 最大，人对位置的判断偏差 Δx 折算成时间误差 Δt = {{frac|Δx|v}} <b>最小<\/b>。","<b>最高点停顿感强<\/b>：在最高点速度为零、停留时间长，视觉上极难瞬间判定“刚好停住”的时刻，计时偶然误差显著增大。"]},{"id":"L4","title":"全振动计数规则（按下停表从 0 数起）","widget":"counting-demo","html":"<p>为了减小单次计时的反应误差，采用<b>累积法<\/b>：测出 n 次（通常取 30～50 次）全振动的总时间 t，由 T = {{frac|t|n}} 求周期。<\/p>","steps":["<b>从 “0” 开始数<\/b>：摆球某次经过最低点按下停表时同时数 <b>“0”<\/b>；此后<b>同方向<\/b>经过最低点才记作第 1、2、…、n 次（若每经过一次最低点都数，则 2 个半周期才是 1 个周期）。","<b>经典错因（差 1 次）<\/b>：若把按下停表瞬间错数成 “1”，数到 n 停表，实际只完成了 <b>(n − 1)<\/b> 次全振动。仍除以 n 会使周期 T 偏小，导致 g = {{frac|4π²L|T²}} <b>偏大<\/b>。","<b>机械停表读数<\/b>：机械停表<b>不估读<\/b>（分度 0.1 s）。先看小表盘整数分并判别是否过<b>半分钟红线<\/b>，决定大表盘读 0～30 s 还是 30～60 s。"]},{"id":"L5","title":"L − T² 图像法消除摆长恒定偏差","widget":"lt2-demo","html":"<p>由 T = 2π{{sqrt|{{frac|L|g}}}} 变形为线性关系：L = {{frac|g|4π²}}T²，改变摆线长测多组数据作 <b>L − T²<\/b> 图像。<\/p>","steps":["<b>化曲为直求斜率<\/b>：在 L − T² 图像中，直线斜率 k = {{frac|g|4π²}}，因此 g = <b>4π²k<\/b> = {{frac|4π²(L₂ − L₁)|T₂² − T₁²}}。（若纵轴是 T²、横轴是 L，则斜率 k′ = {{frac|4π²|g}}，g = {{frac|4π²|k′}}，做题先看清坐标轴！）","<b>平行平移不改斜率<\/b>：如果忘记加球半径只记录线长 l，或者摆球质量不均使重心在球心下方 Δr 处，则有 l = {{frac|g|4π²}}T² − r（或 L<sub>记<\/sub> = {{frac|g|4π²}}T² − Δr）。","<b>消除系统误差<\/b>：图像虽然不再过原点（有截距），但所有点连线的<b>斜率不变<\/b>，用直线斜率（或线上相距较远两点坐标）算出的 g 依然<b>等于真实值<\/b>。"]},{"id":"L6","title":"拉力传感器 F − t 曲线与光电门法","widget":"sensor-demo","html":"<p>现代实验常用<b>悬点拉力传感器<\/b>或<b>最低点光电门<\/b>替代人眼和机械停表，消除人手反应误差。<\/p>","steps":["<b>拉力传感器 F − t 波形<\/b>：摆球在最低点速度最大，绳拉力 F<sub>max<\/sub> = mg + {{frac|mv²|L}} 取<b>波峰<\/b>；在最高点速度为零，F<sub>min<\/sub> = mg cosθ₀ 取<b>波谷<\/b>。","<b>相邻波峰间隔是 T/2<\/b>：一个周期内摆球往返各过一次最低点，因此 F − t 图像中相邻两个波峰（或波谷）的时间间隔为 <b>{{frac|T|2}}<\/b>，周期 T = <b>2(t₂ − t₁)<\/b>。","<b>最低点光电门<\/b>：把光电门放在最低点，从第 1 次遮光开始计时，记下第 n 次遮光的时刻 t，共经历了 (n − 1) 个半周期，因此 T = <b>{{frac|2t|n − 1}}<\/b>。"]}],"equipment":[{"id":"stand","name":"铁架台与铁夹","html":"铁架台稳定支撑悬点；必须用<b>铁夹把摆线上端夹紧<\/b>，不能直接绕在横杆上，防止摆动时悬点滑动使摆长变化。"},{"id":"string","name":"摆线","html":"长度约 1 m 左右，选择<b>细、轻、伸缩性小<\/b>的丝线，忽略线的质量与摆动过程中的伸长。"},{"id":"bob","name":"摆球","html":"选用<b>质量大、体积小<\/b>的实心金属球（如钢球、铜球），尽量减小空气阻力以及球径对重心和摆长定位的影响。"},{"id":"caliper","name":"游标卡尺","html":"测量摆球直径 d（10 分度精度 0.1 mm，<b>不估读<\/b>），再除以 2 得到半径 r = d/2，用于计算摆长 L = l + d/2。"},{"id":"ruler","name":"毫米刻度尺 / 米尺","html":"在摆球<b>自然竖直悬挂<\/b>的状态下，测量悬点到摆球上端的摆线长 l，最小分度 1 mm，须估读到 0.1 mm。"},{"id":"timer","name":"机械停表 / 拉力传感器","html":"机械停表（分度 0.1 s，不估读）在最低点从 0 数起测 30 次全振动时间；拉力传感器记录 F − t 曲线，相邻波峰间隔为 T/2。"}],"procedure":[{"id":"P1","title":"固定悬点与选摆球","how":"用铁夹夹紧摆线上端（不可仅绕在铁杆上），下端拴接<b>质量大、体积小<\/b>的钢球。","why":"悬点固定保证摆长不变；钢球密度大可显著减小空气阻力与浮力误差。","errorId":"E4"},{"id":"P2","title":"游标卡尺测球径 d","how":"用 10 分度游标卡尺测摆球直径 d（不估读，本台钢球 d = 19.0 mm）。","why":"球半径 r = d/2 是摆长 L = l + r 的必要组成部分。"},{"id":"P3","title":"悬挂测线长并计摆长 L","how":"让摆球自然下垂，用米尺测悬点到球上沿线长 l，按 <b>L = l + d/2<\/b> 记录摆长。","why":"平放测量时线未拉直会偏短；漏加半径或量到球下沿会引入系统误差。","errorId":"E3"},{"id":"P4","title":"小摆角同一竖直面释放","how":"把摆球拉离平衡位置使摆角 <b>θ &lt; 5°<\/b>（如 4°），由静止在同一竖直平面内释放。","why":"大摆角下 sinθ ≠ θ 导致周期偏长；不能斜向推成圆锥摆。","errorId":"E5"},{"id":"P5","title":"最低点从 0 数起计时","how":"待摆球经过<b>最低点<\/b>时按下停表并数 <b>“0”<\/b>，此后同向经过最低点记 1 次。","why":"最低点速度最大计时误差最小；从 0 数起可避免把 (n − 1) 次记成 n 次。","errorId":"E1"},{"id":"P6","title":"测 30 次全振动求 T 与 g","how":"数到 30 时停表读数 t，计算 T = t/30 及单组 g = {{frac|4π²L|T²}}（或用拉力传感器读峰距 T/2）。","why":"累积 30 次可把单次人手反应误差缩小为 1/30。"},{"id":"P7","title":"改变摆长记录多组数据","how":"调节摆线长（如 0.50～1.10 m），至少测 5 组 (L, T) 并记入数据表。","why":"多组数据既能减小偶然误差，又能绘制 L − T² 图像。"},{"id":"P8","title":"作 L − T² 图像斜率求 g","how":"用最小二乘法或直线拟合 L − T² 图像，由斜率 k 得 g = 4π²k。","why":"图像斜率能完全消去摆长测量中的恒定系统偏差（如漏加半径或重心偏移）。","errorId":"E3"}],"errors":[{"id":"E1","name":"在最高点（而非最低点）开始计时","noteId":"P5","trigger":"把停表按下与停止时刻改在摆球最高点","config":{"timingPos":"high"},"observe":"分别在最低点和最高点重复计时 20 次，比较算出的 g 值分散程度。","consequence":"在最高点计时时，由于摆球在端点附近速度趋于 0、停顿时间长，人眼判断位置引起的计时标准差剧增，20 次测得的 g 值大幅波动。","ask":{"stem":"用停表测单摆周期时，为了减小计时误差，计时起点应选在摆球经过哪里的位置？","options":["最高点，因为摆球暂时静止容易看清","最低点，因为摆球速度最大，相同位置判断误差对应的时间误差最小","摆角一半的位置","任意位置都可以"],"answer":1,"quizId":"M09:try:E1"},"why":"计时时间不确定度 Δt ≈ {{frac|Δx|v}}。在最低点速度 v 最大，Δt 最小；在最高点 v → 0，摆球在端点附近徘徊，视觉定位偏差会放大为较大的时间误差。","questionIds":["G1"]},{"id":"E2","name":"按下停表瞬间数“1”（(n − 1) 次记成 n 次）","noteId":"P5","trigger":"按下停表时数作第 1 次，数到 30 停表（实际只摆了 29 次）","config":{"countOffset":-1},"observe":"比较“从 0 数起”与“从 1 数起”实际经历的全振动次数与算出的 g。","consequence":"实际只经历了 29 个周期却除以 n = 30，使周期测量值 T<sub>测<\/sub> = {{frac|29|30}}T<sub>真<\/sub> 偏小 3.3%，进而 g<sub>测<\/sub> = ({{frac|30|29}})² g<sub>真<\/sub> ≈ 10.49 m/s²，明显<b>偏大<\/b>（+7.0%）。","ask":{"stem":"某同学在测量周期时，误将摆球 (n − 1) 次全振动的时间记为 n 次全振动的时间，则算出的重力加速度测量值与真实值相比？","options":["偏大","偏小","不变","无法确定"],"answer":0,"quizId":"M09:try:E2"},"why":"T<sub>测<\/sub> = {{frac|t|n}} < {{frac|t|n − 1}} = T<sub>真<\/sub>，周期偏小，由 g = {{frac|4π²L|T²}} 可知，g 测量值按 ({{frac|n|n − 1}})² 偏大。","questionIds":["G8"]},{"id":"E3","name":"摆长漏加球半径（或取到球下沿）","noteId":"P3","trigger":"记录摆长时只填线长 l（漏加 r），或量到球下沿 (l + d)","config":{"LMode":"l"},"observe":"对比 5 组摆长下“单组公式算 g”与“L − T² 图像斜率算 g”的差异。","consequence":"只按线长 l 计算单组 g 时，L 偏小使单组 g 偏小（约 9.61～9.72 m/s²）；取到球下沿 l + d 则使单组 g 偏大。但作 L − T² 图像时，三条直线<b>彼此平行<\/b>、斜率相同，由斜率求出的 g 依然准确！","ask":{"stem":"若每次测摆长时都忘记加上摆球半径（直接用摆线长 l 作图），绘出的 l − T² 图像与用斜率算出的 g 值将如何变化？","options":["图像不过原点，算出的 g 偏小","图像不过原点，算出的 g 偏大","图像不过原点，但直线斜率不变，算出的 g 仍等于真实值","图像依然过原点，算出的 g 不变"],"answer":2,"quizId":"M09:try:E3"},"why":"由 T = 2π{{sqrt|{{frac|l + r|g}}}} 得 l = {{frac|g|4π²}}T² − r。漏加常数 r 只会使直线在纵轴上发生 −r（或横轴 +{{frac|4π²r|g}}）的平移，斜率 k = {{frac|g|4π²}} 保持不变，故 g = 4π²k 等于真实值。","questionIds":["G2","G3","G7","G8"]},{"id":"E4","name":"细线绕在铁杆上未夹紧（摆动中摆长变大）","noteId":"P1","trigger":"把悬点设为“绕杆松动”，观察摆动时有效摆长与周期变化","config":{"pivot":"loose"},"observe":"比较铁夹夹紧与绕杆松动两种情况下，同一摆长摆动的 θ − t 波形和周期。","consequence":"摆动过程中细线在铁杆上滑动、缠绕松开，实际摆长变长（如多出 4.2 cm），导致实际周期 T 偏大。仍按原测摆长代入 g = {{frac|4π²L|T²}}，算出的 g 明显<b>偏小<\/b>（约 9.3 m/s²）。","ask":{"stem":"实验时若悬点未用铁夹夹紧，细线绕在铁架台横杆上在摆动中逐渐松脱变长，则测得的 g 会？","options":["偏大","偏小","不变","先偏大后偏小"],"answer":1,"quizId":"M09:try:E4"},"why":"实际摆长 L<sub>实<\/sub> > 测量值 L<sub>测<\/sub>，导致测出的周期 T 偏大。代入 g = {{frac|4π²L<sub>测<\/sub>|T²}} 后分母偏大，测得的重力加速度偏小。","questionIds":["G7"]},{"id":"E5","name":"摆角过大（35° 离开简谐近似区）","noteId":"P4","trigger":"把初始摆角拉到 35° 后释放","config":{"thetaDeg":35},"observe":"用 RK4 非线性引擎同时运行 4° 与 35° 单摆，看经过几个周期后两摆是否还能同步。","consequence":"35° 时 sinθ 明显小于 θ，回复力偏弱，RK4 算出的实际周期比小摆角周期长约 2.38%（接近 1 + {{frac|θ₀²|16}}），用简谐公式算出的 g ≈ 9.35 m/s²，明显<b>偏小<\/b>！","ask":{"stem":"关于单摆的摆角，下列哪项判断正确？","options":["摆角越大周期越短，算出的 g 偏大","摆角过大（如 35°）时实际周期偏长，按 T = 2π√(L/g) 算出的 g 偏小","在摆角 35° 时只要摆球质量大，周期仍严格等于 2π√(L/g)","摆角越大计时越准，应该用大摆角实验"],"answer":1,"quizId":"M09:try:E5"},"why":"单摆周期随振幅的精确展开为 T ≈ T₀(1 + {{frac|θ₀²|16}})。摆角 35° 时周期增大约 2.4%，g 偏小约 4.6%。（另注意：若摆球误作水平面圆周运动的圆锥摆，周期 T = 2π{{sqrt|{{frac|L cosθ|g}}}} < T₀，则会导致 g 偏大。）","questionIds":["G7"]},{"id":"E6","name":"选用轻质大体积泡沫球（空气阻力与浮力大）","noteId":"P1","trigger":"把摆球从钢球换成大体积轻质泡沫球","config":{"bob":"foam"},"observe":"对比钢球与泡沫球摆动 15 s 的振幅衰减曲线与周期。","consequence":"泡沫球质量小、迎风面积大，振幅迅速衰减；且空气浮力与附加质量等效减小重力加速度，使周期变长，算出的 g 明显<b>偏小<\/b>。","ask":{"stem":"用单摆测定重力加速度时，摆球应选用下列哪种材质？","options":["体积较大的空心塑料球","体积大、质量小的泡沫球","质量大、体积小的实心金属球","质量大小与体积均无影响"],"answer":2,"quizId":"M09:try:E6"},"why":"质量大、体积小（密度大）的金属球可减小空气阻力与浮力对单摆运动的影响，也使球心位置更接近质点，减小摆长误差。","questionIds":["G4","G7"]}],"reverse":[{"id":"R1","show":{"type":"g-high"},"stem":"某小组测出的当地重力加速度为 g = 10.48 m/s²，明显大于真实值 9.80 m/s²。造成该结果的原因可能是？（多选）","options":["把按下停表瞬间记为第 1 次，误将 (n − 1) 次全振动时间记为 n 次","在摆球经过最高点时开始计时","测量摆长时，误以悬点到小球下端边缘的距离作为摆长","悬点用绕杆方式未夹紧，摆动中摆长变长"],"answer":[0,2],"replay":"E2","why":"由 g = {{frac|4π²L|T²}} 可知，g 偏大要么是 L 测量偏大（如量到球下沿 l + d），要么是 T 测量偏小（如将 (n − 1) 次记成 n 次、或摆成了圆锥摆）。最高点计时主要增大偶然离散度；绕杆松动使摆长变长、T 偏大，会导致 g 偏小。","quizId":"M09:reverse:R1"},{"id":"R2","show":{"type":"lt2-shift"},"stem":"某同学在计算时忘记加上摆球半径 r，直接以摆线长 l 为纵轴、T² 为横轴作出如图的直线（不过原点），并用该直线斜率 k 计算 g = 4π²k。所得 g 与真实值相比？","options":["偏大","等于真实值","偏小","无法确定"],"answer":[1],"replay":"E3","why":"l = {{frac|g|4π²}}T² − r，漏加固定半径 r 仅使图像纵截距变为 −r（下移），直线斜率仍严格等于 {{frac|g|4π²}}，因此用斜率求出的 g 等于真实值。","quizId":"M09:reverse:R2"},{"id":"R3","show":{"type":"ft-curve"},"stem":"用拉力传感器测单摆的拉力随时间变化如图所示，相邻两波峰时刻分别为 t₁ = 0.45 s、t₂ = 1.36 s（间隔约 0.90 s）。某同学直接把相邻两波峰间隔当作周期 T ≈ 0.90 s，按 L = 0.8095 m 算出 g ≈ 39.5 m/s²。他错在哪里？","options":["拉力传感器没有调零","单摆每周期两次经过最低点，相邻两波峰时间间隔是半周期 T/2，周期应为 2(t₂ − t₁) ≈ 1.81 s","应该取波峰与波谷之间的时间差作为周期","传感器测得的是位移而非拉力"],"answer":[1],"replay":null,"why":"摆球向右和向左经过最低点时拉力都达到最大值，一个全振动周期内出现两次波峰，因此相邻两波峰间隔为 T/2，T = 2(t₂ − t₁) ≈ 1.81 s，代入得 g ≈ 9.80 m/s²。","quizId":"M09:reverse:R3"},{"id":"R4","show":{"type":"lt2-shift-up"},"stem":"实验所用的金属球内部有偏心空洞，重心实际位于球心正下方 Δ 处。若某同学仍按“悬点到球心距离”记录 L，改变线长测出多组数据作出 L − T² 图像并取线上两点斜率计算 g = {{frac|4π²(L₂ − L₁)|T₂² − T₁²}}，则测量值与真实值相比？","options":["大于真实值","小于真实值","等于真实值","随摆长增大而增大"],"answer":[2],"replay":"E3","why":"实际摆长 L<sub>实<\/sub> = L<sub>测<\/sub> + Δ，于是 L<sub>测<\/sub> = {{frac|g|4π²}}T² − Δ。偏心距 Δ 为定值，不影响图像斜率 {{frac|g|4π²}}，故两点斜率法算出的 g 等于真实值。","quizId":"M09:reverse:R4"}],"summary":{"principle":"摆角 θ &lt; 5° 时单摆近似做简谐运动，T = 2π{{sqrt|{{frac|L|g}}}}，g = {{frac|4π²L|T²}}；其中摆长 L = l + {{frac|d|2}}。作 L − T² 图像，斜率 k = {{frac|g|4π²}}，g = 4π²k。","steps":["用铁夹夹紧细线上端，选用质量大、体积小的金属球","游标卡尺测球径 d（不估读）","自然悬挂状态下测摆线长 l（估读到 0.1 mm），记摆长 L = l + d/2","摆角 &lt; 5° 在同一竖直面内静止释放","在最低点按下停表从 “0” 数起，测 30 次全振动时间 t，得 T = t/30","改变摆长测 5 组以上数据，作 L − T² 图像由斜率求 g"],"notes":[{"do":"摆角控制在 5° 以内、同一竖直面摆动","why":"大摆角使 T 增大（g 偏小）；圆锥摆使 T 减小（g 偏大）"},{"do":"摆长 L = l + d/2（悬挂状态测 l）","why":"悬点到球心才是有效摆长；游标卡尺不估读"},{"do":"从最低点开始计时，按下停表数 “0”","why":"最低点速度最大计时误差最小；从 0 数起防 (n − 1) 次误记成 n 次"},{"do":"铁夹夹紧悬点，选用实心钢球","why":"防绕杆滑动使摆长变长；减小空气阻力与浮力"},{"do":"优先用 L − T² 图像斜率（或两点法）求 g","why":"自动消去漏加半径或重心偏移等恒定摆长系统误差"}],"errors":["g 偏大：把 (n − 1) 次记成 n 次；摆长量到球下沿 (l + d)；圆锥摆","g 偏小：摆长未加半径只用 l；悬点绕杆松动变长；摆角过大；空气阻力过大","离散度大：在最高点计时；单次测量周期而非累积多次","拉力传感器 F − t 图像相邻波峰间隔为 T/2（T = 2(t₂ − t₁)）"],"conclusions":["L − T² 图斜率 k = g/(4π²)，g = 4π²k；T² − L 图斜率 k′ = 4π²/g，g = 4π²/k′","漏加球半径或球重心偏移时，图像平移但斜率不变，两点法求出的 g 仍等于真实值","最低点光电门第 1 次遮光计时、第 n 次遮光停止用时 t：T = 2t/(n − 1)","机械停表 0.1 s 分度不估读；10 分度游标卡尺 0.1 mm 分度不估读"]}}</script>

      this.b.lastMeas.g = PM.calcG(this.b.lastMeas.L, this.b.lastMeas.T);
      this.renderAnalysis(true);
    }
    this.updateDone(); this.saveBench(); this.renderSide();
  };

  Bench.prototype.setAngle = function (deg) {
    if (this.b.running) return;
    deg = P.clamp(Math.round(deg * 10) / 10, 3, 38);
    if (deg > 5 && this.guided()) {
      this.block('单摆做简谐运动的条件是摆角小于 5°，摆角过大周期会变长。', 'E5');
      return;
    }
    this.b.thetaDeg = deg; this.touched.P4 = true;
    this.setBanner(null);
    this.updateDone(); this.saveBench(); this.stage.invalidate('fg'); this.renderSide();
  };

  Bench.prototype.updateDone = function () {
    var b = this.b;
    this.done.P1 = !!this.touched.P1 && b.pivot === 'clamp' && b.bob === 'steel';
    this.done.P2 = b.calDone;
    this.done.P3 = !!this.touched.P3 && b.LMode === 'l+r';
    this.done.P4 = !!this.touched.P4 && Math.abs(b.thetaDeg) <= 5.01;
    this.done.P5 = (!!this.done.P5 || this.rows.length > 0) && b.timingPos !== 'high' && !b.countOffset && !b.swBadStart;
    this.done.P6 = !!this.done.P6 || !!b.lastMeas || this.rows.length > 0;
    this.done.P7 = this.rows.length >= 5;
    this.done.P8 = this.rows.length >= 2;
  };

  /* ---------- 舞台几何与绘制 ---------- */
  Bench.prototype.geo = function () {
    var w = this.stage.w, hh = this.stage.h;
    var px = this.timing === 'sensor' ? Math.round(w * 0.24) : Math.round(w * 0.48);
    var py = Math.max(46, hh * 0.13);
    var availH = Math.max(160, hh - py - 68);
    var ppm = availH / 1.26;
    if (this.timing === 'sensor' && Math.abs(this.b.thetaDeg) > 12) {
      var sDeg = Math.sin(Math.abs(this.b.thetaDeg) * Math.PI / 180);
      ppm = Math.min(ppm, (px - 24) / Math.max(0.2, (this.b.l + 0.03) * sDeg));
    }
    return { w: w, h: hh, px: px, py: py, ppm: ppm, availH: availH };
  };

  Bench.prototype.drawBg = function (ctx, w, hh) {
    var g = this.geo(), b = this.b, px = g.px, py = g.py, ppm = g.ppm;
    ctx.fillStyle = '#EAF1F8'; ctx.fillRect(0, 0, w, hh);

    // 桌面与铁架台
    var tableY = hh - 28;
    ctx.fillStyle = D.grad(ctx, 0, tableY, 0, hh, ['#E3C79A', '#C49F6B']);
    ctx.fillRect(0, tableY, w, 28);
    ctx.fillStyle = '#9F7C49'; ctx.fillRect(0, tableY, w, 2.5);

    var rodX = Math.max(24, px - (this.timing === 'sensor' ? 102 : 138));
    ctx.fillStyle = D.grad(ctx, rodX - 36, 0, rodX + 36, 0, ['#CBD5E1', '#94A3B8']);
    D.rr(ctx, rodX - 36, tableY - 12, 72, 12, 3); ctx.fill();
    ctx.strokeStyle = '#64748B'; ctx.stroke();
    ctx.fillStyle = D.grad(ctx, rodX - 5, 0, rodX + 5, 0, ['#DCE4EC', '#8E99A6']);
    ctx.fillRect(rodX - 5, py - 24, 10, tableY - 12 - (py - 24));
    ctx.strokeRect(rodX - 5, py - 24, 10, tableY - 12 - (py - 24));
    // 横梁
    ctx.fillStyle = D.grad(ctx, 0, py - 8, 0, py, ['#E2E8F0', '#94A3B8']);
    ctx.fillRect(rodX - 10, py - 8, px - rodX + 26, 8);
    ctx.strokeRect(rodX - 10, py - 8, px - rodX + 26, 8);
    // 十字夹
    ctx.fillStyle = '#3B4B60'; D.rr(ctx, rodX - 9, py - 12, 18, 16, 3); ctx.fill();

    // 悬点（铁夹 / 绕杆松动 / 拉力传感器）
    if (this.timing === 'sensor') {
      ctx.fillStyle = '#1E3A8A'; D.rr(ctx, px - 18, py - 14, 36, 18, 4); ctx.fill();
      ctx.fillStyle = '#12A9C4'; ctx.beginPath(); ctx.arc(px + 10, py - 5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(px + 12, py - 14); ctx.quadraticCurveTo(px + 30, py - 30, px + 56, py - 24); ctx.stroke();
      ctx.lineWidth = 1;
      D.text(ctx, '拉力传感器', px + 22, py - 22, { size: 11, weight: 700, color: '#1661FF' });
    } else if (b.pivot === 'clamp') {
      ctx.fillStyle = '#3B4B60'; D.rr(ctx, px - 9, py - 10, 18, 13, 3); ctx.fill();
      D.text(ctx, '铁夹夹紧', px + 14, py - 12, { size: 11, weight: 600, color: '#17784F' });
    } else {
      ctx.fillStyle = '#E69B2D'; ctx.beginPath(); ctx.arc(px, py - 4, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py - 4, 9, 0.2, Math.PI * 1.6); ctx.stroke(); ctx.lineWidth = 1;
      D.text(ctx, '绕杆松动（易滑动）', px + 14, py - 12, { size: 11, weight: 700, color: '#C7374B' });
    }

    // 最低点竖直参考线 + 红色准线
    var r = this.curD() / 2;
    var eqY = py + (b.l + r) * ppm;
    ctx.save(); ctx.setLineDash([5, 4]);
    ctx.strokeStyle = 'rgba(16,35,63,0.28)';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, Math.min(tableY - 8, eqY + 26)); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, eqY + 14); ctx.lineTo(px, eqY + 30); ctx.stroke();
    D.text(ctx, '最低点准线', px, eqY + 42, { align: 'center', size: 11, weight: 700, color: '#C7374B' });

    // 量角器弧线
    var arcR = Math.min(92, g.availH * 0.34);
    ctx.fillStyle = 'rgba(37,168,112,0.14)';
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.arc(px, py, arcR, Math.PI / 2 - 5 * Math.PI / 180, Math.PI / 2 + 5 * Math.PI / 180);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, arcR, Math.PI / 2 - 0.72, Math.PI / 2 + 0.72); ctx.stroke();
    [-35, -5, 0, 5, 35].forEach(function (dg) {
      var a = Math.PI / 2 + dg * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(a) * (arcR - 5), py + Math.sin(a) * (arcR - 5));
      ctx.lineTo(px + Math.cos(a) * (arcR + 4), py + Math.sin(a) * (arcR + 4));
      ctx.strokeStyle = Math.abs(dg) === 5 ? '#17784F' : '#64748B';
      ctx.stroke();
    });
    D.text(ctx, '<5° 简谐区', px + 12, py + arcR + 13, { size: 10.5, weight: 600, color: '#17784F' });

    // 左侧标尺示意摆长
    var sx = rodX + 18;
    ctx.strokeStyle = '#9AA8B8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, py); ctx.lineTo(sx, py + 1.20 * ppm); ctx.stroke();
    [0.50, 0.80, 1.00, 1.20].forEach(function (mVal) {
      var yy = py + mVal * ppm;
      if (yy < tableY - 4) {
        ctx.beginPath(); ctx.moveTo(sx - 4, yy); ctx.lineTo(sx + 6, yy); ctx.stroke();
        D.text(ctx, mVal.toFixed(2) + 'm', sx + 9, yy + 4, { size: 10, color: '#4A5B73' });
      }
    });
  };

  Bench.prototype.drawFg = function (ctx, w, hh) {
    var g = this.geo(), b = this.b, px = g.px, py = g.py, ppm = g.ppm;
    this.hot = [];
    var r = this.curD() / 2;
    var extraL = (b.pivot === 'loose' && b.running) ? 0.042 : 0;
    var LDraw = b.l + r + extraL;
    var th = b.running && b.sim ? b.sim.theta : (b.thetaDeg * Math.PI / 180);
    var bx = px + Math.sin(th) * LDraw * ppm;
    var by = py + Math.cos(th) * LDraw * ppm;
    var br = b.bob === 'foam' ? Math.max(13, r * ppm * 1.1) : Math.max(9.5, r * ppm * 1.15);

    // 摆线
    ctx.strokeStyle = '#1E293B'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
    ctx.lineWidth = 1;

    // 摆球
    if (b.bob === 'foam') {
      ctx.fillStyle = D.grad(ctx, bx - br, by - br, bx + br, by + br, ['#FFFFFF', '#E6DEC8']);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#B8A882'; ctx.lineWidth = 1.4; ctx.stroke();
    } else {
      ctx.fillStyle = D.grad(ctx, bx - br, by - br, bx + br, by + br, ['#DCE4EC', '#6E7B8A']);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3B4B60'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.arc(bx - br * 0.32, by - br * 0.32, br * 0.25, 0, Math.PI * 2); ctx.fill();
    }

    // 最低点瞬时脉冲指示
    if (b.running && Math.abs(th) < 0.015) {
      ctx.strokeStyle = '#12A9C4'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(bx, by, br + 6, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1;
    }

    // 未摆动时可拖拽调节摆角
    var degNow = Math.abs(th * 180 / Math.PI);
    if (!b.running) {
      ctx.strokeStyle = degNow > 5 ? '#E69B2D' : '#12A9C4';
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(bx, by, br + 7, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (this.timing === 'sensor') {
        var tx = Math.min(w * 0.44 - 6, Math.max(64, bx));
        D.text(ctx, 'θ₀=' + degNow.toFixed(1) + '°(拖球调角)', tx, by - br - 10, {
          align: 'center', size: 11, weight: 700, color: degNow > 5 ? '#C7374B' : '#0E8CA3', maxW: 130
        });
      } else {
        D.text(ctx, 'θ₀ = ' + degNow.toFixed(1) + '°（拖摆球调角）', bx + br + 10, by - 4, {
          size: 11.5, weight: 700, color: degNow > 5 ? '#C7374B' : '#0E8CA3'
        });
      }
      this.hot.push({ id: 'bob', x: bx - br - 16, y: by - br - 16, w: (br + 16) * 2, h: (br + 16) * 2 });
    }

    // 信息面板（停表读数 / 力传感器实时波形）
    if (this.timing === 'stopwatch') {
      var cw = Math.min(220, w * 0.38), cx0 = w - cw - 12, cy0 = 12;
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.strokeStyle = '#CBD5E1';
      D.rr(ctx, cx0, cy0, cw, 92, 12); ctx.fill(); ctx.stroke();
      var elapsed = b.swActive ? Math.max(0, b.t - b.swStart) : (b.lastMeas ? b.lastMeas.t : 0);
      var swTitle = b.timingPos === 'high' ? '机械停表 · 最高点计时(错E1)' : (b.countOffset ? '机械停表 · 按下数 1 (错E2)' : '机械停表 · 最低点从 0 数起');
      D.text(ctx, swTitle, cx0 + 10, cy0 + 18, { size: 11, weight: 700, color: (b.timingPos === 'high' || b.countOffset) ? '#C7374B' : '#1661FF', maxW: cw - 20 });
      D.text(ctx, elapsed.toFixed(1) + ' s', cx0 + 10, cy0 + 48, { size: 24, weight: 700, color: b.swActive ? '#C7374B' : '#10233F' });
      var shownN = b.swActive ? Math.max(0, b.swCount - (b.countOffset || 0)) : (b.lastMeas ? b.lastMeas.n : 0);
      D.text(ctx, '全振动计数 n = ' + shownN + ' 次', cx0 + 10, cy0 + 70, { size: 12, weight: 600, color: '#17784F' });
      D.text(ctx, '记录摆长 L = ' + (this.curLRec() * 100).toFixed(2) + ' cm', cx0 + 10, cy0 + 86, { size: 11, color: '#4A5B73' });
    } else {
      this.drawSensorScope(ctx, w, hh);
    }
  };

  Bench.prototype.drawSensorScope = function (ctx, w, hh) {
    var b = this.b;
    var sx = Math.round(w * 0.46), sy = 12, sw = w - sx - 12, sh = Math.max(140, hh - 74);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B9C8DA';
    D.rr(ctx, sx, sy, sw, sh, 12); ctx.fill(); ctx.stroke();
    D.text(ctx, '拉力传感器 F − t 实时曲线（相邻波峰间隔 = T/2）', sx + 12, sy + 20, { size: 11.5, weight: 700, color: '#1661FF', maxW: sw - 24 });

    var px0 = sx + 46, px1 = sx + sw - 12, py0 = sy + 34, py1 = sy + sh - 32;
    var p = b.params || PM.effectiveParams(this.simOpts());
    var mg = p.m * p.gEff;
    var th0 = Math.max(2, Math.abs(b.thetaDeg || 4)) * Math.PI / 180;
    var dF = Math.max(3 * mg * (1 - Math.cos(th0)), 1e-5);
    var tr = b.trace || [];
    if (tr.length >= 2) {
      var obMin = Infinity, obMax = -Infinity;
      for (var k = 0; k < tr.length; k++) {
        if (tr[k].F < obMin) obMin = tr[k].F;
        if (tr[k].F > obMax) obMax = tr[k].F;
      }
      if (obMax - obMin > dF) dF = obMax - obMin;
    }
    var totalSpan = dF / 0.60;
    var fMid = mg + 0.5 * mg * (1 - Math.cos(th0));
    var fMin = fMid - totalSpan * 0.50, fMax = fMid + totalSpan * 0.50;

    ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1;
    ctx.strokeRect(px0, py0, px1 - px0, py1 - py0);
    var mgY = py1 - ((mg - fMin) / (fMax - fMin)) * (py1 - py0);
    ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#94A3B8';
    ctx.beginPath(); ctx.moveTo(px0, mgY); ctx.lineTo(px1, mgY); ctx.stroke();
    ctx.restore();
    D.text(ctx, 'mg', px0 - 6, mgY + 4, { align: 'right', size: 10.5, color: '#64748B' });
    D.text(ctx, fMax.toFixed(3), px0 - 6, py0 + 8, { align: 'right', size: 9.5, color: '#94A3B8' });
    D.text(ctx, fMin.toFixed(3), px0 - 6, py1, { align: 'right', size: 9.5, color: '#94A3B8' });
    var tEnd = tr.length ? tr[tr.length - 1].t : 5.0;
    var win = 5.0, tStart = Math.max(0, tEnd - win);
    function toX(t) { return px0 + ((t - tStart) / win) * (px1 - px0); }
    function toY(F) { return py1 - P.clamp((F - fMin) / (fMax - fMin), 0, 1) * (py1 - py0); }

    if (tr.length >= 2) {
      ctx.save();
      ctx.beginPath(); ctx.rect(px0, py0, px1 - px0, py1 - py0); ctx.clip();
      ctx.strokeStyle = '#1661FF'; ctx.lineWidth = 2;
      ctx.beginPath();
      var started = false;
      for (var i = 0; i < tr.length; i++) {
        if (tr[i].t < tStart - 0.05) continue;
        var xx = toX(tr[i].t), yy = toY(tr[i].F);
        if (!started) { ctx.moveTo(xx, yy); started = true; } else ctx.lineTo(xx, yy);
      }
      ctx.stroke();

      var visPeaks = b.peaks.filter(function (pk) { return pk.t >= tStart && pk.t <= tStart + win; });
      visPeaks.forEach(function (pk) {
        var xk = toX(pk.t), yk = toY(pk.F);
        ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(xk, yk, 3.6, 0, Math.PI * 2); ctx.fill();
      });
      if (visPeaks.length >= 2) {
        var pA = visPeaks[visPeaks.length - 2], pB = visPeaks[visPeaks.length - 1];
        var xA = toX(pA.t), xB = toX(pB.t), yBar = py0 + 18;
        ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(xA, toY(pA.F) - 4); ctx.lineTo(xA, yBar); ctx.lineTo(xB, yBar); ctx.lineTo(xB, toY(pB.F) - 4); ctx.stroke();
        D.text(ctx, 'Δt = ' + (pB.t - pA.t).toFixed(3) + ' s = T/2', (xA + xB) / 2, yBar - 4, { align: 'center', size: 11, weight: 700, color: '#C7374B' });
      }
      ctx.restore();
    } else {
      D.text(ctx, '点击“由静止释放摆球”观察 F − t 波形', (px0 + px1) / 2, (py0 + py1) / 2, { align: 'center', size: 12.5, color: '#64748B' });
    }
    D.text(ctx, 't / s', px1, py1 + 18, { align: 'right', size: 11, color: '#4A5B73' });
  };

  /* ---------- 指针拖拉改摆角 ---------- */
  Bench.prototype.bindPointer = function () {
    var self = this, dragBob = false;
    ML.stage.pointer(this.stage.layer('fg').canvas, {
      down: function (p) {
        if (self.b.running) return false;
        var hit = false;
        (self.hot || []).forEach(function (r) {
          if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) hit = true;
        });
        if (!hit) return false;
        dragBob = true;
      },
      move: function (p, a) {
        if (!dragBob || !a.moved) return;
        var g = self.geo(), dx = p.x - g.px, dy = Math.max(16, p.y - g.py);
        var deg = Math.atan2(dx, dy) * 180 / Math.PI;
        deg = P.clamp(deg, -38, 38);
        var absDeg = Math.abs(deg);
        if (Math.abs(absDeg - 4) < 1.2) absDeg = 4;
        else if (Math.abs(absDeg - 35) < 1.5) absDeg = 35;
        self.b.thetaDeg = Math.round((deg < 0 ? -absDeg : absDeg) * 10) / 10;
        self.stage.invalidate('fg');
      },
      up: function (p, a) {
        if (!dragBob) return;
        dragBob = false;
        if (!a.moved) { self.startSwing(); return; }
        var absDeg = Math.abs(self.b.thetaDeg);
        if (absDeg > 5 && self.guided()) {
          self.b.thetaDeg = 4;
          self.block('单摆做简谐运动时摆角应小于 5°（引导模式下已帮你回到 4°）。', 'E5');
        } else {
          if (absDeg < 3) self.b.thetaDeg = self.b.thetaDeg < 0 ? -3 : 3;
          self.updateDone(); self.saveBench();
        }
        self.stage.invalidate('fg'); self.renderSide();
      }
    });
  };

  /* ---------- 物理运行与计时 ---------- */
  Bench.prototype.simOpts = function () {
    var b = this.b;
    return {
      l: b.l, d: this.curD(), bob: b.bob, pivot: b.pivot,
      thetaDeg: b.thetaDeg, ideal: S.ideal, LMode: b.LMode,
      countOffset: b.countOffset || 0, timingPos: b.timingPos || 'low'
    };
  };

  Bench.prototype.startSwing = function () {
    var self = this, b = this.b;
    if (this.guided()) {
      if (b.pivot !== 'clamp') { this.block('请先用铁夹夹紧悬点（不能绕杆松动）。', 'E4'); return; }
      if (b.bob !== 'steel') { this.block('请先选用质量大、体积小的实心钢球。', 'E6'); return; }
      if (!b.calDone) {
        ML.toast('先点击“游标卡尺测球径”测量钢球直径 d', 'warn');
        openCaliperModal(function (d) { b.dMm = d; b.calDone = true; self.updateDone(); self.saveBench(); self.renderSide(); }, 19.0);
        return;
      }
      if (b.LMode !== 'l+r') { this.block('摆长应记为 L = l + d/2（悬点到球心）。', 'E3'); return; }
      if (Math.abs(b.thetaDeg) > 5) {
        this.block('摆角应小于 5° 再释放。', 'E5');
        return;
      }
    }
    var opts = this.simOpts();
    b.params = PM.effectiveParams(opts);
    b.sim = PM.createState(opts);
    b.running = true;
    b.t = 0;
    b.swActive = false; b.swCount = 0; b.lastCrossT = 0; b.autoTarget = 0; b.swBadStart = false;
    b.trace = [{ t: 0, theta: b.sim.theta, omega: 0, F: PM.tension(b.sim.theta, 0, b.params) }];
    b.peaks = [];
    this.setBanner(null);
    this.loop.start();
    this.renderStageActs();
    this.renderSide();
  };

  Bench.prototype.stopSwing = function () {
    this.b.running = false;
    this.b.swActive = false;
    this.b.autoTarget = 0;
    this.loop.stop();
    this.stage.invalidate();
    this.renderStageActs();
    this.renderSide();
  };

  Bench.prototype.startManualSw = function () {
    var b = this.b;
    if (!b.running || b.swActive) return;
    var amp = Math.max(0.005, Math.abs(b.sim.theta0 || (b.thetaDeg * Math.PI / 180)));
    var offCenter = b.timingPos === 'high' || Math.abs(b.sim.theta) > Math.min(0.045, amp * 0.35);
    if (this.guided() && offCenter) { ML.toast('请在摆球经过最低点时开始计时。', 'warn'); return; }
    b.swActive = true;
    b.swStart = b.t;
    b.lastCrossT = b.t;
    b.swDir = b.sim.omega >= 0 ? 1 : -1;
    b.swCount = 0;
    b.autoTarget = 0;
    b.swBadStart = offCenter;
    if (b.swBadStart) {
      ML.toast('注意：你按表时摆球不在最低点（或设了最高点计时），会引入较大的计时误差！', 'warn');
    } else {
      ML.toast('已从最低点开始计时，请数全振动次数！', 'info');
    }
    this.renderStageActs();
  };

  Bench.prototype.stopManualSw = function () {
    var b = this.b;
    if (!b.swActive) return;
    if (b.swCount < 1) { ML.toast('至少完成 1 次全振动（同向再次过计时点）后再停表', 'warn'); return; }
    var nearLastCrossing = b.t - b.lastCrossT <= b.params.T0 * 0.06 &&
      (b.sim.omega >= 0 ? 1 : -1) === b.swDir;
    if (this.guided() && !nearLastCrossing) {
      ML.toast('请等摆球下一次沿计时起始方向经过最低点，再按停表。', 'warn'); return;
    }
    if (!nearLastCrossing && b.timingPos === 'low') b.swBadStart = true;
    var shownN = Math.max(1, b.swCount - (b.countOffset || 0));
    var dt = +(b.t - b.swStart).toFixed(1);
    if (!S.ideal && b.swBadStart) {
      var rErr = P.rng((seedCounter += 11)).gauss(0.16);
      dt = Math.max(0.5, +(dt + rErr).toFixed(1));
    }
    b.swActive = false;
    this.finishMeasurement(dt, shownN, 'stopwatch');
  };

  Bench.prototype.autoMeasure30 = function () {
    var b = this.b;
    if (!b.running) {
      this.startSwing();
      if (!b.running) return;
    }
    b.autoTarget = 30;
    b.swActive = false;
    b.swCount = 0;
    ML.toast('自动在最低点从 0 开始计时并完成 30 次全振动…', 'info');
    this.renderStageActs();
  };

  Bench.prototype.readSensorPeriod = function () {
    var b = this.b;
    if (b.peaks.length < 3) { ML.toast('等波形出现至少 3 个波峰再读取', 'warn'); return; }
    var n = b.peaks.length - 1;
    var halfAvg = (b.peaks[n].t - b.peaks[0].t) / n;
    var T = 2 * halfAvg;
    this.finishMeasurement(+(T * 10).toFixed(2), 10, 'sensor', T);
  };

  Bench.prototype.finishMeasurement = function (totalTime, nMeas, src, exactT) {
    var b = this.b;
    var T = exactT != null ? exactT : totalTime / nMeas;
    var L = this.curLRec();
    var g = PM.calcG(L, T);
    b.lastMeas = {
      l: b.l, d: this.curD(), L: L, LMode: b.LMode, bob: b.bob, pivot: b.pivot,
      thetaDeg: Math.abs(b.thetaDeg), t: totalTime, n: nMeas, T: T, g: g, src: src,
      tags: this.detectTags()
    };
    this.done.P5 = true;
    this.done.P6 = true;
    this.stopSwing();
    this.updateDone();
    this.renderSide();
    this.renderAnalysis(false);
    ML.toast('测得周期 T = ' + T.toFixed(3) + ' s，单组 g = ' + g.toFixed(2) + ' m/s²', 'ok');
  };

  Bench.prototype.detectTags = function () {
    var b = this.b, tags = [];
    if (b.swBadStart || b.timingPos === 'high') tags.push('E1');
    if (b.countOffset) tags.push('E2');
    if (b.LMode !== 'l+r') tags.push('E3');
    if (b.pivot === 'loose') tags.push('E4');
    if (Math.abs(b.thetaDeg) > 5.01) tags.push('E5');
    if (b.bob === 'foam') tags.push('E6');
    return tags;
  };

  Bench.prototype.tick = function (dt) {
    if (!this.el || !this.el.isConnected) return false;
    var b = this.b;
    if (!b.running || !b.sim) return false;
    var mult = b.autoTarget ? 10 : this.speed;
    var simDt = dt * mult;
    var steps = Math.max(1, Math.round(simDt / PM.DT));
    var hStep = simDt / steps;
    var lastSampleT = b.trace.length ? b.trace[b.trace.length - 1].t : 0;
    var minGap = (b.params ? b.params.T0 : 1.5) * 0.55;

    for (var i = 0; i < steps; i++) {
      var ev = PM.rk4Step(b.sim, b.params, hStep);
      b.t = b.sim.t;
      var useHigh = b.timingPos === 'high';
      var hitEv = useHigh
        ? (ev.highTurn && ev.highTurn.theta > 0 ? { t: ev.highTurn.t, dir: -1 } : null)
        : ev.lowCross;

      if (b.autoTarget && !b.swActive && hitEv && hitEv.dir === -1) {
        b.swActive = true;
        b.swStart = hitEv.t;
        b.lastCrossT = hitEv.t;
        b.swDir = -1;
        b.swCount = 0;
        b.swBadStart = useHigh;
        this.renderStageActs();
      } else if (b.swActive && hitEv && (useHigh || hitEv.dir === b.swDir)) {
        if (hitEv.t - b.swStart >= minGap && hitEv.t - (b.lastCrossT || b.swStart) >= minGap) {
          b.swCount++;
          b.lastCrossT = hitEv.t;
          var realTarget = b.autoTarget + (b.countOffset || 0);
          if (b.autoTarget && b.swCount >= realTarget) {
            var rawT = hitEv.t - b.swStart;
            var trial = PM.measureTrial(Object.assign({}, this.simOpts(), { nMeasured: 30, seed: (seedCounter += 7), roundStopwatch: true }));
            var useT = S.ideal ? Math.round(rawT * 10) / 10 : trial.totalTime;
            this.finishMeasurement(useT, 30, 'stopwatch');
            return false;
          }
        }
      }

      if (this.timing === 'sensor' && b.t - lastSampleT >= 1 / 90) {
        lastSampleT = b.t;
        var F = PM.tension(b.sim.theta, b.sim.omega, b.params);
        b.trace.push({ t: b.t, theta: b.sim.theta, omega: b.sim.omega, F: F });
        if (b.trace.length > 520) b.trace.shift();
        var len = b.trace.length;
        if (len >= 3 && b.trace[len - 2].F > b.trace[len - 3].F && b.trace[len - 2].F >= b.trace[len - 1].F) {
          b.peaks.push({ t: b.trace[len - 2].t, F: b.trace[len - 2].F });
          if (b.peaks.length > 16) b.peaks.shift();
        }
      }
    }
    this.stage.invalidate('fg');
    return true;
  };

  Bench.prototype.renderStageActs = function () {
    var self = this, b = this.b, box = this.stageActs;
    if (!box) return;
    ML.clear(box);
    if (!b.running) {
      box.appendChild(h('button.btn.primary.big', { type: 'button', onclick: function () { self.startSwing(); } }, '由静止释放摆球'));
      if (this.timing === 'stopwatch' && !this.guided()) {
        box.appendChild(h('button.btn.cyan', { type: 'button', onclick: function () { self.autoMeasure30(); } }, '自由演示：自动测 30 次'));
      }
      return;
    }
    if (this.timing === 'stopwatch') {
      if (b.autoTarget > 0) {
        box.appendChild(h('button.btn.cyan', { type: 'button', disabled: true }, '自动累积测 30 次中…'));
      } else if (!b.swActive) {
        var startLbl = b.timingPos === 'high'
          ? '过最高点：开始计时（错点 E1）'
          : '过最低点：开始计时（从 ' + (b.countOffset ? '1' : '0') + ' 数起）';
        box.appendChild(h('button.btn.primary.big', { type: 'button', onclick: function () { self.startManualSw(); } }, startLbl));
        if (!this.guided()) box.appendChild(h('button.btn.cyan', { type: 'button', onclick: function () { self.autoMeasure30(); } }, '自由演示：自动测完 30 次'));
      } else {
        var stopLbl = b.timingPos === 'high' ? '过最高点：停止计时' : '过最低点：停止计时';
        box.appendChild(h('button.btn.big.pulse', { type: 'button', onclick: function () { self.stopManualSw(); } }, stopLbl));
      }
      box.appendChild(h('button.btn', { type: 'button', onclick: function () { self.stopSwing(); } }, '停止'));
    } else {
      box.appendChild(h('button.btn.primary.big', { type: 'button', onclick: function () { self.readSensorPeriod(); } }, '读取 F−t 相邻峰距求周期'));
      box.appendChild(h('button.btn', { type: 'button', onclick: function () { self.stopSwing(); } }, '停止'));
    }
  };

  /* ---------- 右侧操作面板 ---------- */
  Bench.prototype.renderSide = function () {
    var self = this, b = this.b, side = this.side; if (!side) return;
    ML.clear(side);
    var row = function () { return h('div.side-row', Array.prototype.slice.call(arguments)); };
    function chip(label, on, act, dis) { return h('button.chip' + (on ? '.on' : ''), { type: 'button', onclick: act, disabled: !!dis }, label); }

    var ctl = h('div.side-ctl');
    ctl.appendChild(h('div.side-k', h('span', '器材与参数'), h('button.link.sm', { type: 'button', onclick: function () {
      openCaliperModal(function (d) { b.dMm = d; b.calDone = true; self.updateDone(); self.saveBench(); self.renderSide(); }, b.bob === 'foam' ? 38.0 : 19.0);
    } }, (b.calDone ? '✓ 球径 ' + b.dMm.toFixed(1) + ' mm' : '游标卡尺测球径 →'))));

    ctl.appendChild(row(h('span.side-l', '悬点'),
      chip('铁夹夹紧', b.pivot === 'clamp', function () { self.setPivot('clamp'); }, b.running),
      chip('绕杆松动', b.pivot === 'loose', function () { self.setPivot('loose'); }, b.running)));
    ctl.appendChild(row(h('span.side-l', '摆球'),
      chip('钢球(19mm)', b.bob === 'steel', function () { self.setBob('steel'); }, b.running),
      chip('泡沫球(38mm)', b.bob === 'foam', function () { self.setBob('foam'); }, b.running)));
    ctl.appendChild(row(h('span.side-l', '摆线 l'),
      chip('−', false, function () { self.setLength(b.l - 0.05); }, b.running),
      h('b.side-v', b.l.toFixed(2) + ' m'),
      chip('+', false, function () { self.setLength(b.l + 0.05); }, b.running),
      chip('0.50', Math.abs(b.l - 0.50) < 0.01, function () { self.setLength(0.50); }, b.running),
      chip('0.80', Math.abs(b.l - 0.80) < 0.01, function () { self.setLength(0.80); }, b.running),
      chip('1.10', Math.abs(b.l - 1.10) < 0.01, function () { self.setLength(1.10); }, b.running)));
    ctl.appendChild(row(h('span.side-l', '摆角 θ₀'),
      chip('4°', Math.abs(Math.abs(b.thetaDeg) - 4) < 0.5, function () { self.setAngle(4); }, b.running),
      chip('35°', Math.abs(Math.abs(b.thetaDeg) - 35) < 0.5, function () { self.setAngle(35); }, b.running),
      h('span.muted', '（或舞台拖摆球）')));
    ctl.appendChild(row(h('span.side-l', '摆长记法'),
      chip('l + d/2', b.LMode === 'l+r', function () { self.setLMode('l+r'); }),
      chip('只记 l', b.LMode === 'l', function () { self.setLMode('l'); }),
      chip('l + d', b.LMode === 'l+d', function () { self.setLMode('l+d'); })));
    if (!this.guided() && this.timing === 'stopwatch') {
      ctl.appendChild(row(h('span.side-l', '计时规则'),
        chip('最低点', b.timingPos !== 'high', function () { b.timingPos = 'low'; b.swBadStart = false; self.updateDone(); self.saveBench(); self.stage.invalidate('fg'); self.renderStageActs(); self.renderSide(); }, b.running),
        chip('最高点(E1)', b.timingPos === 'high', function () { b.timingPos = 'high'; self.updateDone(); self.saveBench(); self.stage.invalidate('fg'); self.renderStageActs(); self.renderSide(); }, b.running),
        chip('数 0 起', !b.countOffset, function () { b.countOffset = 0; self.updateDone(); self.saveBench(); self.stage.invalidate('fg'); self.renderStageActs(); self.renderSide(); }, b.running),
        chip('数 1 起(E2)', b.countOffset === -1, function () { b.countOffset = -1; self.updateDone(); self.saveBench(); self.stage.invalidate('fg'); self.renderStageActs(); self.renderSide(); }, b.running)));
    }

    ctl.appendChild(h('div.side-acts',
      h('button.btn.primary', { type: 'button', onclick: function () { self.recordCurrentRow(); }, disabled: !b.lastMeas }, '记入多组表 (' + this.rows.length + ')'),
      !this.guided() ? h('button.btn', { type: 'button', onclick: function () { self.collect5Groups(); } }, '自由演示：快速采齐 5 组') : null,
      h('button.btn.sm.full', { type: 'button', onclick: function () { self.resetAll(); } }, '清空数据表并复位')));
    side.appendChild(ctl);

    if (this.guided()) {
      side.appendChild(h('div.side-k', '实验步骤'));
      var ids = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'], curId = null;
      for (var i = 0; i < ids.length; i++) { if (!this.done[ids[i]]) { curId = ids[i]; break; } }
      var curEl = null;
      var ol = h('ol.steps', ids.map(function (id) {
        var p = PROC[id], ok = !!self.done[id], isCur = id === curId;
        var li = h('li' + (ok ? '.ok' : '') + (isCur ? '.cur' : ''),
          h('div.st-t', (ok ? '✓ ' : isCur ? '▸ ' : '') + p.title),
          h('div.st-how', { html: M.tex(p.how) }),
          p.why ? h('div.st-why', { html: M.tex('理由：' + p.why) }) : null,
          p.errorId ? h('button.link.sm', { type: 'button', onclick: function () { openTry(p.errorId); } }, '为什么？试一试 →') : null);
        if (isCur) curEl = li;
        return li;
      }));
      side.appendChild(ol);
      if (curEl) setTimeout(function () { if (ol.scrollHeight > ol.clientHeight + 4) ol.scrollTop = Math.max(0, curEl.offsetTop - ol.offsetTop - 4); }, 0);
    } else {
      var freeTags = this.detectTags();
      var tBox = h('div.ana-tags', { style: 'margin-top:4px' });
      if (freeTags.length) {
        freeTags.forEach(function (eid) {
          if (ERR[eid]) tBox.appendChild(h('button.tag.err', { type: 'button', onclick: function () { openTry(eid); } }, '⚠ ' + ERR[eid].name));
        });
      } else {
        tBox.appendChild(h('span.tag.ok', '✓ 当前参数与计时规范'));
      }
      side.appendChild(tBox);
      side.appendChild(h('div.side-tip', '自由模式：可任意改变摆角（35°）、悬点（绕杆松动）、泡沫球、摆长记法或计时规则，实验台与数据表会真实反映全部误差。'));
    }
  };

  Bench.prototype.recordCurrentRow = function () {
    var m = this.b.lastMeas;
    if (!m) { ML.toast('请先完成一次测量', 'warn'); return; }
    var entry = {
      l: m.l, d: m.d, LMode: m.LMode, L: m.L, T: m.T, t: m.t, n: m.n, g: m.g, tags: m.tags.slice()
    };
    var existIdx = -1;
    for (var i = 0; i < this.rows.length; i++) {
      if (Math.abs(this.rows[i].l - m.l) < 0.005) { existIdx = i; break; }
    }
    if (existIdx >= 0) {
      this.rows[existIdx] = entry;
      ML.toast('已更新线长 l = ' + m.l.toFixed(2) + ' m 的测量记录（请改变摆线长测下一组）', 'info');
    } else {
      this.rows.push(entry);
      if (this.rows.length > 8) this.rows.shift();
    }
    this.updateDone(); this.saveBench(); this.renderSide(); this.renderAnalysis(false);
  };

  Bench.prototype.collect5Groups = function () {
    var self = this, b = this.b;
    if (this.guided()) {
      if (b.pivot !== 'clamp') { this.block('请先用铁夹夹紧悬点。', 'E4'); return; }
      if (b.bob !== 'steel') { this.block('请先选用实心钢球。', 'E6'); return; }
      if (!b.calDone) {
        ML.toast('请先用游标卡尺测摆球直径 d', 'warn');
        openCaliperModal(function (d) { b.dMm = d; b.calDone = true; self.updateDone(); self.saveBench(); self.renderSide(); }, 19.0);
        return;
      }
      if (b.LMode !== 'l+r') { this.block('摆长应记为 L = l + d/2。', 'E3'); return; }
      if (Math.abs(b.thetaDeg) > 5) { this.block('摆角应控制在 5° 以内。', 'E5'); return; }
    }
    var ls = [0.50, 0.65, 0.80, 0.95, 1.10];
    var rows = [], curD = this.curD(), curTags = this.detectTags();
    for (var i = 0; i < ls.length; i++) {
      if (this.timing === 'sensor') {
        var simP = PM.simulatePeriod(Object.assign({}, this.simOpts(), { l: ls[i], nCycles: 6 }));
        var Ts = S.ideal ? simP.T : simP.T * (1 + P.rng(70 + i * 13).gauss(0.0005));
        var Ls = PM.recordedLength(ls[i], curD, b.LMode);
        rows.push({
          l: ls[i], d: curD, LMode: b.LMode, L: Ls, T: Ts, t: +(10 * Ts).toFixed(2), n: 10, g: PM.calcG(Ls, Ts), tags: curTags.slice()
        });
      } else {
        var opts = Object.assign({}, this.simOpts(), { l: ls[i], nMeasured: 30, seed: 50 + i * 11, roundStopwatch: true });
        var tr = PM.measureTrial(opts);
        rows.push({
          l: ls[i], d: tr.d, LMode: b.LMode, L: tr.L, T: tr.T, t: tr.totalTime, n: 30, g: tr.g, tags: curTags.slice()
        });
      }
    }
    this.rows = rows;
    b.lastMeas = Object.assign({}, rows[2], { src: this.timing });
    this.done.P5 = true; this.done.P6 = true;
    this.updateDone(); this.saveBench(); this.renderSide(); this.renderAnalysis(false);
    ML.toast('已用 RK4 模型测完 5 组摆长，下方查看 L − T² 拟合图像', 'ok');
  };

  Bench.prototype.resetAll = function () {
    this.stopSwing();
    this.rows = [];
    this.b.lastMeas = null;
    this.b.pivot = 'clamp'; this.b.bob = 'steel'; this.b.dMm = 19.0; this.b.LMode = 'l+r';
    this.b.thetaDeg = 4; this.b.l = 0.80; this.b.countOffset = 0; this.b.timingPos = 'low'; this.b.swBadStart = false;
    this.touched = {};
    this.done = { P2: this.b.calDone };
    this.analysis.hidden = true;
    this.setBanner(null);
    this.saveBench(); this.stage.invalidate(); this.renderStageActs(); this.renderSide();
  };

  /* ---------- 下方数据分析区（停表盘面 + 多组表 + L-T² 图） ---------- */
  Bench.prototype.renderAnalysis = function (noScroll) {
    var self = this, el = this.analysis, b = this.b, m = b.lastMeas;
    if (!m && !this.rows.length) { el.hidden = true; return; }
    el.hidden = false;
    ML.clear(el);

    var allTags = [];
    if (m && m.tags) allTags = allTags.concat(m.tags);
    this.rows.forEach(function (r) { if (r.tags) allTags = allTags.concat(r.tags); });
    allTags = allTags.filter(function (x, i, a) { return a.indexOf(x) === i && ERR[x]; });

    var tagBox = h('div.ana-tags');
    if (allTags.length) {
      tagBox.appendChild(h('span.tag.err', '⚠ 检测到操作偏差'));

        tagBox.appendChild(h('button.tag', { type: 'button', onclick: function () { openTry(id); } }, ERR[id].name + ' → 看看后果'));
      });
    } else {
      tagBox.appendChild(h('span.tag.ok', '✓ 操作规范'));
    }
    el.appendChild(h('div.ana-head', h('h2.ana-h', '测量读数与 L − T² 数据分析'), tagBox));

    var leftCard = h('div.ana-card');
    if (m) {
      var devPct = ((m.g - PM.G) / PM.G * 100);
      var kpiCls = Math.abs(devPct) < 1.2 ? 'ok' : Math.abs(devPct) < 3.5 ? 'warn' : 'bad';
      leftCard.appendChild(h('h3', '本次测量读数（' + (m.src === 'sensor' ? '拉力传感器' : '机械停表') + '）'));
      leftCard.appendChild(h('div.ana-kpi',
        h('div.kpi-item', '记录摆长 L', h('b', (m.L * 100).toFixed(2) + ' cm')),
        h('div.kpi-item', '全振动时间 t (' + m.n + '次)', h('b', m.t.toFixed(1) + ' s')),
        h('div.kpi-item', '单摆周期 T', h('b', m.T.toFixed(3) + ' s')),
        h('div.kpi-item.' + kpiCls, '单组重力加速度 g', h('b', m.g.toFixed(2) + ' m/s²（' + (devPct >= 0 ? '+' : '') + devPct.toFixed(1) + '%）'))));
      if (m.src !== 'sensor') {
        var swHost = h('div');
        leftCard.appendChild(swHost);
        new GV.GaugeBench(swHost, { height: 196, state: { type: 'stopwatch', totalSec: Math.min(179, m.t), locked: true } });
      }
    } else {
      leftCard.appendChild(h('h3', '测量记录'));
    }

    if (this.rows.length) {
      var trs = this.rows.map(function (r, idx) {
        var dv = ((r.g - PM.G) / PM.G * 100);
        return h('tr' + (Math.abs(dv) > 2.5 ? '.hl' : ''),
          h('td', String(idx + 1)),
          h('td', (r.l * 100).toFixed(1)),
          h('td', (r.L * 100).toFixed(2)),
          h('td', r.T.toFixed(3)),
          h('td', (r.T * r.T).toFixed(3)),
          h('td', r.g.toFixed(2)));
      });
      leftCard.appendChild(h('div.tbl-wrap', h('table.dt.ana-tbl',
        h('tr', h('th', '#'), h('th', '线长 l/cm'), h('th', '记录 L/cm'), h('th', 'T/s'), h('th', 'T²/s²'), h('th', '单组 g')),
        trs)));
    }

    var rightCard = h('div.ana-card');
    rightCard.appendChild(h('h3', 'L − T² 图像法求重力加速度（g = 4π²k）'));
    if (this.rows.length >= 2) {
      var viewMode = this._chartMode || b.LMode;
      var zoomO = !!this._zoomOrigin && viewMode === 'compare';
      var swRow = h('div.side-row',
        h('span.side-l', '作图口径'),
        ['l+r', 'l', 'l+d', 'compare'].map(function (vm) {
          var lbl = vm === 'l+r' ? 'l + r (球心)' : vm === 'l' ? '只用 l (漏半径)' : vm === 'l+d' ? 'l + d (球下沿)' : '三条同图对比';
          return h('button.chip' + (viewMode === vm ? '.on' : ''), { type: 'button', onclick: function () { self._chartMode = vm; self.renderAnalysis(true); } }, lbl);
        }),
        viewMode === 'compare' ? h('button.chip' + (zoomO ? '.on' : ''), { type: 'button', onclick: function () { self._zoomOrigin = !self._zoomOrigin; self.renderAnalysis(true); } }, zoomO ? '返回全局视图' : '放大原点看 ±r 截距') : null);
      rightCard.appendChild(swRow);
      var chartBox = h('div');
      rightCard.appendChild(chartBox);
      var chartOpts = { xLabel: 'T² / s²', yLabel: 'L / m', height: 260, paper: true };

          h('tr.hl', h('td', 'l + d（球下沿）'), h('td', PM.calcG(rD[0].L, rD[0].T).toFixed(3) + '（偏大）'), h('td', fD.gFit.toFixed(3) + '（准确）'), h('td', fD.b.toFixed(4) + ' m'))));

        drawWaveChart(area, [

        ], { xLabel: 't / s', yLabel: err.id === 'E5' ? '归一化角度 θ/θ₀' : '摆角 θ / °', height: 220, x: [0, dur] });
        var pG = PM.simulatePeriod(Object.assign({ l: 0.80 }, goodCfg));
        var pB = PM.simulatePeriod(Object.assign({ l: 0.80 }, badCfg));

        area.appendChild(h('table.dt.cmp-table',
          h('tr', h('th', '条件'), h('th', '周期 T / s'), h('th', '用名义摆长算得 g / (m·s⁻²)'), h('th', '相对偏差')),

          h('tr.hl', h('td', err.name), h('td', pB.T.toFixed(4)), h('td', gB.toFixed(3)), h('td', ((gB - PM.G) / PM.G * 100).toFixed(2) + '%'))));

    show: function (c, vis) {

      shell.main.scrollTop = 0;
    }
  };

      stg.on('bg', function (ctx, w, hh) {
        ctx.fillStyle = '#F8FBFF'; ctx.fillRect(0, 0, w, hh);
        var p3 = PM.effectiveParams({ l: 0.80, d: PM.STEEL_D, thetaDeg: 4, ideal: true });
        var th0 = 4 * Math.PI / 180, dx = dxMm / 1000;
        var vMax = Math.sqrt(2 * p3.gEff * p3.LEff * (1 - Math.cos(th0)));
        var aMax = p3.gEff * Math.sin(th0);
        var dtLow = dx / vMax;
        var dtHigh = Math.sqrt(2 * dx / aMax) * 1.8;
        var px = w * 0.30, py = 20, Lpx = hh - 52, ang = 0.40;
        ctx.strokeStyle = '#94A3B8'; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + Lpx); ctx.stroke(); ctx.setLineDash([]);
        var xL = px, yL = py + Lpx, xH = px + Math.sin(ang) * Lpx, yH = py + Math.cos(ang) * Lpx;
        ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(xL, yL); ctx.moveTo(px, py); ctx.lineTo(xH, yH); ctx.stroke();
        ctx.fillStyle = '#25A870'; ctx.beginPath(); ctx.arc(xL, yL, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(xH, yH, 10, 0, Math.PI * 2); ctx.fill();
        D.text(ctx, '最低点 v=' + vMax.toFixed(2) + 'm/s', xL, yL + 22, { align: 'center', size: 11.5, weight: 700, color: '#17784F' });
        D.text(ctx, '最高点 v=0', xH + 14, yH + 4, { size: 11.5, weight: 700, color: '#C7374B' });
        var bx = w * 0.54, bw = w - bx - 18;
        D.text(ctx, '位置判断偏差 ±' + dxMm.toFixed(1) + ' mm 引起的时间误差：', bx, 42, { size: 12, weight: 700 });
        var wLow = Math.max(12, bw * Math.min(0.3, dtLow / dtHigh));
        ctx.fillStyle = '#DCF4EA'; ctx.fillRect(bx, 58, wLow, 24);
        D.text(ctx, '最低点 Δt ≈ ' + dtLow.toFixed(3) + ' s', bx + wLow + 8, 75, { size: 12, weight: 700, color: '#17784F' });
        ctx.fillStyle = '#FDECEF'; ctx.fillRect(bx, 98, bw * 0.85, 24);
        D.text(ctx, '最高点 Δt ≈ ' + dtHigh.toFixed(3) + ' s（约 ' + (dtHigh / dtLow).toFixed(0) + ' 倍）', bx + 8, 115, { size: 12, weight: 700, color: '#C7374B' });
        cap.innerHTML = '模型计算（L = ' + p3.LTrue.toFixed(4) + ' m, θ₀ = 4°）：最低点速率 v<sub>max</sub> = ' + vMax.toFixed(3) + ' m/s，Δt = Δx/v ≈ ' + (dtLow * 1000).toFixed(1) + ' ms；最高点速度为 0，误差达 ' + (dtHigh * 1000).toFixed(0) + ' ms。';
      });
    } else if (p.widget === 'counting-demo') {
      var modeC = 'ok';
      var swC = h('div.side-row',
        h('button.chip.on', { type: 'button', data: { c: 'ok' }, onclick: function () { setC('ok'); } }, '规范：按下数 “0”，同向记 1'),
        h('button.chip', { type: 'button', data: { c: 'bad' }, onclick: function () { setC('bad'); } }, '错法：按下即数 “1”，数到 30'));
      var resC = h('div.cmp-note');
      box.appendChild(swC); box.appendChild(resC);
      function setC(m) {
        modeC = m;
        ML.$$('.chip', swC).forEach(function (c) { c.classList.toggle('on', c.dataset.c === m); });
        var tr = PM.measureTrial({ l: 0.80, d: PM.STEEL_D, thetaDeg: 4, nMeasured: 30, countOffset: m === 'bad' ? -1 : 0, ideal: true });
        resC.innerHTML = m === 'ok'
          ? '计数序列：<b>0</b>（按下）→ 1 → 2 → … → <b>30</b>（停表）｜ 实际经历 <b>30</b> 个周期，t = ' + tr.totalTime.toFixed(2) + ' s → T = ' + tr.T.toFixed(4) + ' s → g = <b>' + tr.g.toFixed(2) + ' m/s²</b>'
          : '计数序列：<b style="color:#C7374B">1</b>（按下）→ 2 → … → <b style="color:#C7374B">30</b>（停表）｜ 实际只摆了 <b>29</b> 个周期，t = ' + tr.totalTime.toFixed(2) + ' s，却除以 30 → T = ' + tr.T.toFixed(4) + ' s（偏小）→ g = <b style="color:#C7374B">' + tr.g.toFixed(2) + ' m/s²（偏大 +7.0%）</b>';
      }
      setC('ok');
    } else if (p.widget === 'lt2-demo') {
      var zoomL5 = false;
      var swL5 = h('div.side-row',
        h('span.side-l', '视图'),
        h('button.chip.on', { type: 'button', onclick: function () { zoomL5 = false; renderL5(); } }, '全局拟合直线'),
        h('button.chip', { type: 'button', onclick: function () { zoomL5 = true; renderL5(); } }, '放大原点看截距 −r'));
      var hostL5 = h('div');
      box.appendChild(swL5); box.appendChild(hostL5);
      var ls = [0.50, 0.65, 0.80, 0.95, 1.10];
      var sR = [], sL = [], rR = [], rL = [];
      ls.forEach(function (l) {
        var T = PM.simulatePeriod({ l: l, d: PM.STEEL_D, thetaDeg: 4, ideal: true }).T;
        sR.push([T * T, l + PM.STEEL_D / 2]); sL.push([T * T, l]);
        rR.push({ L: l + PM.STEEL_D / 2, T: T }); rL.push({ L: l, T: T });
      });
      function renderL5() {
        ML.$$('.chip', swL5).forEach(function (c, i) { c.classList.toggle('on', (i === 1) === zoomL5); });
        ML.clear(hostL5);
        var opts5 = { xLabel: 'T² / s²', yLabel: 'L / m', height: 220, paper: true };
        if (zoomL5) { opts5.x = [0, 0.35]; opts5.y = [-0.025, 0.095]; }
        var chL = new ML.Chart(hostL5, opts5);
        chL.set([
          { pts: sR, fit: true, color: '#25A870', label: '记 l+r（过原点）：g=' + PM.fitLT2(rR).gFit.toFixed(3) },
          { pts: sL, fit: true, color: '#1661FF', dash: true, mark: 'x', label: '只记 l（下移 −r）：g=' + PM.fitLT2(rL).gFit.toFixed(3) }
        ]);
      }
      renderL5();
    } else if (p.widget === 'sensor-demo') {
      var tr = PM.simulateTrace({ l: 0.80, d: PM.STEEL_D, thetaDeg: 8, ideal: true }, 4.2, 1 / 100);
      var notes = [];
      if (tr.peaks.length >= 2) {
        notes.push({ x: tr.peaks[0].t, y: tr.peaks[0].F, text: 't₁', color: '#C7374B' });
        notes.push({ x: tr.peaks[1].t, y: tr.peaks[1].F, text: 't₂ (间距 T/2)', color: '#C7374B' });
      }
      drawWaveChart(box, [{ pts: tr.samples.map(function (s) { return [s.t, s.F]; }), color: '#1661FF', label: '拉力传感器 F−t（T = 2(t₂−t₁) = ' + tr.T_fromPeaks.toFixed(3) + ' s）' }], { xLabel: 't / s', yLabel: 'F / N', height: 215, x: [0, 4.2], notes: notes });
    }
  }

  /* =====================================================================
   *  组装四区一卡外壳
   * ===================================================================== */
  var shell = new ML.Shell({
    title: C.title, sub: C.sub, summary: C.summary,
    tabs: [
      { id: 'learn', label: '学·原理', mount: function (el) { ML.Learn(el, C.learn, C.equipment, { onPage: learnWidget, onFinish: function () { shell.go('bench'); } }); } },
      { id: 'bench', label: '做·实验', mount: function (el) { bench = new Bench(el); } },
      { id: 'diag', label: '诊·误差', mount: function (el) {
        var wrap = h('div.diag'); el.appendChild(wrap);
        wrap.appendChild(h('h2.diag-h', 'A. 错误操作实验室'));
        wrap.appendChild(h('p.muted', '每个“试一试”按四拍进行：布置 → 运行 → 对比 → 追问与揭示。所有后果都由 RK4 非线性单摆物理模型实时算出。'));
        var grid = h('div.err-grid'), cardMap = {};
        C.errors.forEach(function (e) {
          var note = PROC[e.noteId];
          var card = h('div.err-card' + ((S.done || {})[e.id] ? '.done' : ''),
            h('div.err-name', ((S.done || {})[e.id] ? '✓ ' : '') + e.name),
            note ? h('div.err-note', { html: '<b>注意事项：</b>' + M.tex(note.how) }) : null,
            h('button.btn.primary.sm', { type: 'button', onclick: function () { openTry(e.id); } }, '试一试'));
          cardMap[e.id] = card; grid.appendChild(card);
        });
        ML.bus.on('try:done', function (id) {
          var card = cardMap[id]; if (!card || card.classList.contains('done')) return;
          card.classList.add('done');
          var nm = ML.$('.err-name', card); if (nm && nm.textContent.indexOf('✓ ') !== 0) nm.textContent = '✓ ' + nm.textContent;
        });
        wrap.appendChild(grid);
        wrap.appendChild(h('h2.diag-h', 'B. 结果反推'));
        wrap.appendChild(h('p.muted', '观察异常实验结果或图像，反推错误原因并去实验台复现。'));
        var rev = h('div.rev'); wrap.appendChild(rev);
        ML.Reverse(rev, C.reverse, adapter);
      } },
      { id: 'paper', label: '练·真题', mount: function (el) { new ML.Paper(el, Q, { title: C.title.replace('实验：', '') + ' · 真题训练', onReplay: adapter.replay }); } }
    ]
  });
  ML.bus.on('tab', function (id) {
    if (id !== 'bench' && bench) bench.stopSwing();
  });
  shell.go(S.tab);
  ML.perf.probe();
  ML.m09 = { bench: function () { return bench; }, adapter: adapter, shell: shell };
})(window.ML);

</script>
</body>
