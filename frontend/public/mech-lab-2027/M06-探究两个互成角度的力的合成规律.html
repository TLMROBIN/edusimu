<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：探究两个互成角度的力的合成规律</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M06 scene.css — 探究两个互成角度的力的合成规律（1016×563 横屏一屏适配） */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 36px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:7px 12px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 352px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(62vh,500px);min-height:340px;background:#EAF1F8;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stage-acts{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
.stage-acts .btn,.stage-acts .chip{pointer-events:auto;box-shadow:0 3px 10px rgba(16,35,63,.14)}
.stage-acts .btn.sm{min-height:34px;padding:0 11px;font-size:12.5px}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;height:min(62vh,500px);display:flex;flex-direction:column;overflow-y:auto;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 4px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0}
.side-l{font-size:12.5px;color:var(--ink2);min-width:48px}
.side-v{min-width:46px;text-align:center;font-size:13px}
.bench-side .chip{min-height:30px;padding:0 9px;font-size:12.5px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0 4px}
.side-acts .btn{min-height:36px;padding:0 10px;font-size:13px}
.side-acts .btn.full{grid-column:span 2}
.side-tip{font-size:12.5px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:6px 9px;margin-top:4px;line-height:1.45}
.m06-readout{background:#F6F9FD;border:1px solid var(--line);border-radius:var(--rs);padding:6px 9px;font-size:12.5px;margin:4px 0;line-height:1.5}
.m06-readout b{color:var(--blue)}
.m06-readout.warn{background:#FFF4F5;border-color:#F2BFC8}
.m06-readout.warn b{color:var(--err)}
.steps{padding-left:18px;margin:4px 0 0;flex:1 1 auto;min-height:60px;overflow-y:auto}
.steps li{margin-bottom:5px;font-size:13px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12px}
.st-why{color:var(--ink2);font-size:11px;margin-top:1px;line-height:1.35}
.link.sm{font-size:12px;min-height:28px;padding:2px 0}
.muted{color:var(--ink2);font-size:12.5px}

/* 下方数据分析区 */
.analysis{margin-top:12px;background:#fff;border-radius:var(--r);padding:16px 20px;border:1px solid var(--line)}
.ana-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.ana-h{margin:0;font-size:18px}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:10px;align-items:start}
.ana-block h3{font-size:15px;margin:0 0 6px}
.tbl-wrap{overflow-x:auto}
.ana-tbl{width:100%}
.ana-tbl tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.formula{font-size:14.5px;margin:6px 0;line-height:1.65}
.warnline{color:var(--err);font-weight:600;margin-top:6px;background:#FFF4F5;border:1px solid #F2BFC8;border-radius:var(--rs);padding:8px 12px;font-size:13.5px}

/* 测力计读数校准弹窗 */
.cal-read-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cal-inp{width:116px;min-height:40px;border:1.5px solid var(--line);border-radius:var(--rs);padding:4px 10px;font-size:17px;font-weight:700;background:#FBFCFE}
.cal-fb{margin-top:8px;border-radius:var(--rs);padding:8px 12px;font-size:13.5px;background:#F6F9FD}
.cal-fb.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.cal-fb.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:var(--err)}

/* 学·原理交互小部件 */
.learn-widget{margin-top:10px}
.m06-w-stage{position:relative;height:208px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0;background:#F8FBFF}
.m06-w-stage.short{height:184px}
.cmp-note{font-size:13.5px;margin:6px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m06","title":"实验：探究两个互成角度的力的合成规律","sub":"人教版 必修第一册 第三章 4","chapter":"必修第一册 第三章 4","methods":["等效替代法","作图法（力的图示）","平行四边形定则","多角度重复验证","矢量三角形动态分析"],"learn":[{"id":"L1","title":"实验目的与“等效替代法”","widget":"equiv-demo","html":"<p><b>目的：<\/b>探究两个互成角度的力 F₁、F₂ 与它们的合力 F 之间满足的合成规律（平行四边形定则）。<\/p>","steps":["<b>等效替代思想<\/b>：如果用两个互成角度的力 F₁、F₂ 共同拉橡皮条，与只用一个力 F' 单独拉同一根橡皮条，产生的<b>作用效果完全相同<\/b>，那么 F' 就是 F₁ 和 F₂ 的合力。","<b>如何保证作用效果相同<\/b>：在同一次实验中，两次拉伸必须使橡皮条的固定端 A 不动，且橡皮条和细绳的<b>结点每次都到达同一位置 O<\/b>（即橡皮条伸长的长度和方向完全一致）。","<b>同次固定、不同次可变<\/b>：在<b>同一次<\/b>实验（两拉对比单拉）中，结点 O 位置绝对不能变；但在换用不同角度和大小进行<b>下一次<\/b>重复实验时，结点 O 的位置可以改变。"]},{"id":"L2","title":"理论值 F 与实际值 F' 的区分","widget":"ffprime-demo","html":"<p>实验最后会在白纸上同时画出两个合力箭头：平行四边形对角线 <b>F<\/b>（理论值）与单计实测拉力 <b>F'<\/b>（实际值）。<\/p>","steps":["<b>理论值 F<\/b>：根据记录的 F₁、F₂ 大小和方向，按统一标度利用<b>平行四边形定则<\/b>作出的对角线。由于测力计读数、描点及平行线作图存在误差，F 的方向<b>不一定<\/b>严格沿着橡皮条方向。","<b>实际值 F'<\/b>：用<b>一只<\/b>弹簧测力计单独把结点拉回到 O 点时的拉力。因为 F' 直接与橡皮条的弹力二力平衡，所以 F' 的方向<b>必定沿着橡皮条伸长方向 AO<\/b>。","<b>考题审题提醒<\/b>：部分真题会互换字母记号（如记作图合力为 F'、单拉实际值为 F），做题时务必看清图注与文字，抓住“<b>单只测力计直接拉到 O 点的力必定沿 AO 方向<\/b>”这一物理本质！"]},{"id":"L3","title":"弹簧测力计水平对拉校准与读数","widget":"dyn-demo","html":"<p>本实验通过两只 0–5 N 弹簧测力计测量分力与合力，使用前必须调零并对拉校准，读数时必须估读。<\/p>","steps":["<b>调零与水平对拉检验<\/b>：实验在水平木板上进行，应让弹簧测力计<b>水平放置调零<\/b>。把两只测力计挂钩互勾后沿水平方向对拉，根据牛顿第三定律，两表示数应严格相等；若始终差一恒定数值，说明至少有一只未正确调零。","<b>最小分度与估读<\/b>：实验室常用 0–5 N 弹簧测力计最小分度为 <b>0.1 N<\/b>，按照“十分度估读到下一位”原则，通常须估读到 <b>0.01 N<\/b>（若试题明确要求保留一位小数则按题设保留）。","<b>正视读数<\/b>：读数时视线要<b>正对刻度盘且垂直于刻度线<\/b>，避免仰视或俯视带来视差。"]},{"id":"L4","title":"力的图示作图法规范","widget":"diagram-demo","html":"<p>不能只画“力的示意图”，必须严格按照<b>同一标度<\/b>画出“力的图示”，才能定量验证平行四边形定则。<\/p>","steps":["<b>选定统一标度<\/b>：例如取 <b>1 cm 代表 1.0 N<\/b>（标度应使线段长度适中，一般 3～6 cm 较清晰），在同一次作图中 F₁、F₂、F、F' 必须共用同一标度。","<b>规范线条与箭头<\/b>：力的作用线画<b>实线<\/b>且长度严格按标度截取，末端画<b>箭头<\/b>（箭头尖端落在长度终点处）；平行四边形的邻边对边辅助线必须画<b>虚线<\/b>。","<b>三角板平移法作对边<\/b>：用两块三角板配合（靠尺+推尺）严格作 F₁、F₂ 邻边的平行虚线交出对角线顶点，比较 F 与 F' 的大小相对误差与方向偏角。"]},{"id":"L5","title":"关键操作要领与误差来源","widget":"ops-demo","html":"<p>看似简单的木板拉橡皮条实验，每一步操作背后都有严格的力学与几何依据。<\/p>","steps":["<b>① 与木板平面平行<\/b>：测力计、细绳套和橡皮条都必须与木板保持平行（不抬起也不摩擦卡壳）。若向上抬起角度 α，测力计读数 F<sub>读<\/sub> = {{frac|F<sub>水平<\/sub>|cos α}} + f<sub>摩擦<\/sub> 偏大，导致作出的理论合力 F 明显大于实际值 F'。","<b>② 细绳套适当长、描点适当远<\/b>：过短的细绳或离 O 点过近（如 2.5 cm）的铅笔点，微小位置偏差 Δs 会造成很大的角度误差 Δθ ≈ {{frac|Δs|d}}；细绳长且在远端描点（10～12 cm）可将角度误差减小到约五分之一。","<b>③ 两分力夹角适宜（60°～120°）<\/b>：夹角过大（如 145°）时为平衡同一橡皮条拉力，分力迅速增大极易超过 5 N 量程；夹角过小（如 18°）时平行四边形过于狭长，微小作图线偏斜会被 {{frac|1|sin α}} 放大。"]},{"id":"L6","title":"三力动态平衡矢量三角形","widget":"dynamic-demo","html":"<p>当结点 O 位置不变时，橡皮条的拉力 F<sub>eq<\/sub> 大小和方向都恒定；若同时保持 F₁ 方向不变而转动 F₂，三力构成封闭的动态矢量三角形。<\/p>","steps":["<b>几何作图模型<\/b>：在矢量三角形中，合力矢 F<sub>eq<\/sub> 的长度和方向固定，分力 F₁ 射线方向固定，分力 F₂ 的矢量末端必须落在 F₁ 所在直线上。","<b>垂直时 F₂ 最小<\/b>：点到直线的距离以<b>垂线段最短<\/b>。当旋转 F₂ 使 <b>F₂ ⊥ F₁<\/b>（即 θ₁ + θ₂ = 90°）时，F₂ 达到极小值 F<sub>2,min<\/sub> = F<sub>eq<\/sub> sin θ₁；若未垂直就读数，F₂ 必定偏大。","<b>夹角变化规律<\/b>：若初始两分力夹角 α < 90° 且继续逆时针增大 α 至钝角，F₂ 大小会<b>先减小后增大<\/b>，而 F₁ 大小随 θ₂ 增大而持续增大。"]}],"equipment":[{"id":"board","name":"方木板、白纸与图钉","html":"用图钉把白纸平整固定在水平放置的方木板上（实验过程中白纸不可相对木板移动）。"},{"id":"band","name":"橡皮条与细绳套","html":"橡皮条一端用图钉固定在 A 点，另一端系两根<b>适当长<\/b>的细绳套（不可过短，也不必严格等长）。"},{"id":"dyn","name":"两只弹簧测力计（0–5 N）","html":"最小分度 0.1 N（估读到 0.01 N）。使用前需水平调零并用两表水平对拉校验示数一致。"},{"id":"ruler","name":"三角板与刻度尺","html":"用刻度尺按统一标度截取线段长度，用两块三角板推拉平移作出平行四边形的平行虚线。"},{"id":"pencil","name":"铅笔（描点与作图）","html":"每次记录结点 O 位置和沿细绳方向离 O 较远的点（描点时竖直向下轻点，避免拉动细绳）。"},{"id":"level","name":"水平仪（拓展）","html":"2026 年考题引入：使用前先用水平仪检验实验台面是否水平，保证两表与纸面处于同一水平面内。"}],"procedure":[{"id":"P1","title":"测力计调零与水平对拉","how":"将两只 0–5 N 弹簧测力计水平放置调零，挂钩互勾后水平对拉检验示数是否相等。","why":"消除零点误差，确保弹簧测力计处于同一精度基准且无卡壳故障。","errorId":"E2"},{"id":"P2","title":"固定白纸与橡皮条、选择适宜夹角","how":"用图钉把白纸固定在方木板上，橡皮条一端固定于 A 点，两细绳套夹角选在 60°～120° 之间拉至结点 O。","why":"夹角过大易使分力超 5 N 量程，过小则平行四边形狭长、作图误差显著放大。","errorId":"E5"},{"id":"P3","title":"保持与木板平面平行","how":"拉伸过程中使弹簧测力计、细绳套与橡皮条始终贴近并平行于木板平面。","why":"若向上抬起，竖直分力不贡献水平形变却增大表读数，且易导致弹簧指针刮擦外壳。","errorId":"E3"},{"id":"P4","title":"沿长细绳远端描点与正视读数","how":"记录结点 O 位置，正视刻度盘读出 F₁、F₂（估读到 0.01 N），并用铅笔沿细绳在离 O 较远处描点 P₁、P₂。","why":"描点距离 d 越大，同样铅笔偏差引起的方向角误差 Δθ ≈ Δs/d 越小。","errorId":"E4"},{"id":"P5","title":"单只测力计拉到同一位置 O","how":"改用一只弹簧测力计钩住一根细绳套，把橡皮条结点拉到<b>与刚才完全重合的 O 点<\/b>，记下 F' 大小和方向。","why":"只有结点到达同一位置 O，橡皮条的形变大小和方向才完全一致，F' 才与 (F₁, F₂) 等效。","errorId":"E1"},{"id":"P6","title":"按标度作图对比 F 与 F'","how":"选定标度（如 1 cm = 1.0 N），用实线带箭头画出 F₁、F₂，用虚线作平行四边形求理论合力 F，再画出实际合力 F'。","why":"在误差允许范围内检验平行四边形对角线 F 与单拉实际值 F' 的大小和方向是否重合。"},{"id":"P7","title":"改变分力大小与夹角多组验证","how":"改变两分力大小和夹角（无需 90° 或等大，可改变新 O 点位置）重复实验多组验证。","why":"排除特殊角巧合，确认平行四边形定则对任意夹角与不等分力普适成立。","errorId":"E6"}],"errors":[{"id":"E1","name":"单计拉橡皮条时未拉到同一结点 O","noteId":"P5","trigger":"改用单只测力计时将结点多拉或偏移（dx = +0.8 cm, dy = +1.4 cm）","config":{"knotOffset":{"dx":0.008,"dy":0.014}},"observe":"观察橡皮条长度与最终画出的理论合力 F 和单拉实际值 F' 的大小与方向差距。","consequence":"单拉结点偏离 O 点 1.6 cm 后，橡皮条形变改变，单计拉力 F' 变成 4.71 N 并偏转 2.6°，与双力合成理论值 F = 4.00 N 产生<b>超过 15%<\/b> 的严重偏差，等效替代前提失效。","ask":{"stem":"“探究两个互成角度的力的合成规律”实验中，先后用两个力与一个力拉橡皮条时必须把结点拉到同一位置 O，原因是？","options":["保证两只测力计弹簧伸长量相同","保证两次拉橡皮条产生的作用效果（形变大小与方向）完全相同","使两分力的夹角恰好等于 90°","减小测力计外壳与木板间的摩擦"],"answer":1,"quizId":"M06:try:E1"},"why":"本实验采用等效替代法。只有将橡皮条结点拉到同一位置 O，橡皮条的伸长量和拉伸方向才完全一致，才能认为单个力 F' 与两个力 F₁、F₂ 共同作用的效果等效。","questionIds":["G1","Y1"]},{"id":"E2","name":"弹簧测力计使用前未调零","noteId":"P1","trigger":"未水平调零（设两只测力计均存在 +0.30 N 零点正误差）","config":{"zeroErr1":0.3,"zeroErr2":0.3},"observe":"对比未调零前后对拉示数，以及所作平行四边形理论合力 F 与实际值 F' 的大小偏差。","consequence":"两分力读数各系统偏大 +0.30 N，导致平行四边形合成得到的理论合力 F = 4.46 N，比实际值 F' = 4.00 N 系统偏大 <b>+11.5%<\/b>（且分力不对称时还会导致方向偏斜）。","ask":{"stem":"将甲、乙两只测力计水平勾在一起对拉校准，若无论拉力多大，甲表读数始终比乙表大 0.20 N，最可能的原因是？","options":["两只测力计内弹簧的劲度系数不同","对拉时速度过快未达到平衡","使用前至少有一只测力计未正确调零","两根细绳套长度不相等"],"answer":2,"quizId":"M06:try:E2"},"why":"水平对拉时两表所受拉力和弹力大小严格相等。若读数始终差一个恒定值，必定是至少有一只测力计在无载荷时指针未对准零刻线（存在零点误差）。","questionIds":["G7"]},{"id":"E3","name":"测力计与细绳未与木板平行（抬起 22°）","noteId":"P3","trigger":"将两测力计及细绳向斜上方抬起 22°（同时产生 0.10 N 壳体摩擦）","config":{"liftDeg":22,"fCase":0.1},"observe":"对比测力计读数及白纸平面内平行四边形合成合力 F 与单拉 F' 的大小关系。","consequence":"只有沿木板平面的水平分力平衡橡皮条，测力计实际示数放大为 F<sub>读<\/sub> = F<sub>true<\/sub>/cos 22° + 0.10 N，所作理论合力 F = 4.47 N 显著<b>大于<\/b>单拉实际值 F' = 4.00 N（偏大 +11.7%）。","ask":{"stem":"若拉两根细绳时测力计和细绳明显向上抬离木板平面（倾斜角约 22°），而作图时仍把表盘读数当作木板平面内的分力，最终作出的理论合力 F 与规范单拉时的实际值 F' 相比？","options":["F 明显偏大（F > F'）","F 明显偏小（F < F'）","F 与 F' 仍严格相等","仅方向改变、大小完全不变"],"answer":0,"quizId":"M06:try:E3"},"why":"结点在木板平面内平衡时，斜向上拉力的水平分力 F<sub>读<\/sub> cos θ 才等于平面内的真实分力 F<sub>true<\/sub>，故读数本身比平面分力偏大（且容易蹭卡外壳产生额外摩擦），致使由读数作出的平行四边形合力 F 显著偏大。","questionIds":["G1","G5"]},{"id":"E4","name":"细绳套过短、描点离 O 点太近","noteId":"P4","trigger":"把细绳套缩短为 2.5 cm（对比规范长细绳 12.0 cm）连续采样 12 组","config":{"markDist":0.025},"observe":"比较短细绳（2.5 cm）与长细绳（12.0 cm）在相同铅笔描点抖动下的方向散度与合成误差。","consequence":"铅笔描点仅 1.5 mm 的随机偏移在 2.5 cm 距离下会造成约 3.4° 的角度误差（是 12.0 cm 长绳的 <b>4.8 倍<\/b>），导致多次重复作出的合力 F 方向和大小剧烈分散。","ask":{"stem":"为了减小记录分力方向时带来的误差，本实验中关于细绳套与描点的正确做法是？","options":["细绳套越短越好，且尽量在紧靠 O 点处描点","细绳套适当长一些，且沿细绳方向在离 O 点较远处描点","两根细绳套必须裁剪得绝对等长","可用弹性极强的橡皮筋代替细绳套"],"answer":1,"quizId":"M06:try:E4"},"why":"两点确定一条直线时，两标记点间距 d 越大，固定位置偏差 Δs 引发的角偏差 Δθ ≈ Δs/d 就越小；两根细绳套只需适当长（不需等长），且不可用有明显伸缩的橡皮筋代替细绳。","questionIds":["Y1"]},{"id":"E5","name":"两分力夹角过大（145°）或过小（18°）","noteId":"P2","trigger":"将两分力总夹角分别调至极端值 145°（72.5°+72.5°）和 18°（9°+9°）","config":{"theta1Deg":72.5,"theta2Deg":72.5},"observe":"查看 145° 时两弹簧测力计读数是否超出 5.0 N 量程，以及 18° 时狭长平行四边形的误差灵敏度。","consequence":"当夹角达到 145° 时，为维持 4.00 N 等效拉力，两分力骤增至 <b>6.65 N > 5.0 N<\/b> 直接超量程打底；而夹角小至 18° 时平行四边形极为狭长，微小作图偏斜会被 1/sin 18° ≈ 3.2 倍放大。","ask":{"stem":"某同学固定橡皮条结点 O 拉力为 4.00 N，使用的弹簧测力计量程为 0～5 N。若将两分力对称拉成 145° 夹角，此时两测力计示数将？","options":["约为 2.00 N，读数更精确","约为 4.00 N，恰好接近满量程","约为 6.65 N，严重超出 5 N 量程","等于 0 N"],"answer":2,"quizId":"M06:try:E5"},"why":"两等大分力夹角为 α 时有 F₁ = F₂ = {{frac|F<sub>eq<\/sub>|2 cos(α/2)}}。α = 145° 时 cos 72.5° ≈ 0.3007，F₁ ≈ 6.65 N 远超 5 N 量程；而 α 过小时三角作图交点对角线极其敏感，故教材建议夹角选在 60°～120° 之间。","questionIds":["G3","Y2"]},{"id":"E6","name":"误区：认为两分力夹角必须 90° 或必须等大","noteId":"P7","trigger":"设置非对称、非直角分力（θ₁ = 30°，θ₂ = 50°，总夹角 80°）","config":{"theta1Deg":30,"theta2Deg":50},"observe":"观察不等大分力（F₁ = 3.11 N, F₂ = 2.03 N）按平行四边形合成的结果是否与单拉 F' 一致。","consequence":"当 θ₁ = 30°、θ₂ = 50° 时，两分力大小明显不等、夹角也不是直角，但理论合力 F 与单拉 F' 大小相对误差 <b>< 0.5%<\/b>，平行四边形定则依然精确成立！","ask":{"stem":"关于“探究两个互成角度的力的合成规律”实验中分力大小与夹角的要求，下列说法正确的是？","options":["两分力大小必须相等，夹角必须严格取 90°","两分力夹角不必取 90°、大小也不必相等，只要大小与夹角适当且多组重复即可","两根细绳套长度必须严格相等","不同次实验中结点 O 的位置绝对不能改变"],"answer":1,"quizId":"M06:try:E6"},"why":"实验旨在验证任意互成角度的两力合成规律。刻意取 90° 或等大反而局限于特殊情况；只需保证同一次实验中结点 O 位置不变、夹角适中（60°～120°）并更换多组不等力角度重复验证即可。","questionIds":["Y1"]}],"reverse":[{"id":"R1","show":{"type":"diagram-ff","config":{"angleErrDeg":4.2,"magRatio":1.03}},"stem":"某同学在白纸上完成实验后画出了如图所示的两个合力矢量 F 和 F'（其中一个为按平行四边形作出的理论合力，另一个为一只弹簧测力计直接拉橡皮条到 O 点时的力）。图中方向一定沿橡皮条 AO 延长线方向的是哪一个？","options":["一定是矢量 F'（虚线/单拉箭头），它直接与橡皮条弹力平衡","一定是平行四边形的对角线 F","两个矢量的方向都不一定沿 AO 方向","取决于两根细绳套是否等长"],"answer":[0],"replay":"E1","why":"用一只弹簧测力计将橡皮条结点拉到 O 点时，细绳拉力 F' 与橡皮条沿 AO 方向的弹力二力平衡，因此其方向一定严格沿 AO；而平行四边形对角线 F 会受测量和作图误差影响而略微偏离 AO。","quizId":"M06:reverse:R1"},{"id":"R2","show":{"type":"diagram-lift","config":{"liftDeg":22,"fCase":0.1}},"stem":"某同学在实验前确认两只测力计已调零，且单拉与双拉时结点都准确重合在 O 点，但作图发现由 F₁、F₂ 合成的理论合力 F = 4.47 N，显著大于单拉实际值 F' = 4.00 N（约大 12%）。最可能的操作失误是？","options":["双拉时测力计和细绳没有与木板平行，向上抬起了约 22°","选用了太长的细绳套","两分力夹角取成了 80° 而不是 90°","作图时不小心把标度选成了 1 cm = 1.0 N"],"answer":[0],"replay":"E3","why":"结点在 O 点说明橡皮条水平弹力确实为 4.00 N；测力计与细绳抬离木板成角 α 时，表盘读数 F<sub>读<\/sub> = F<sub>水平<\/sub>/cos α + f<sub>摩擦<\/sub> 明显偏大，从而使平行四边形作出的理论合力 F 系统性大于单拉实际值 F'。","quizId":"M06:reverse:R2"},{"id":"R3","show":{"type":"dynamic-tri","config":{"theta1Deg":35,"theta2Sweep":[20,55,85]}},"stem":"（动态矢量三角形）保持结点 O 位置不动（F<sub>eq<\/sub> = 4.00 N）及 F₁ 方向（θ₁ = 35°）不变，将 F₂ 从 θ₂ = 20° 逆时针缓慢增大到 θ₂ = 85°。则在此过程中 F₂ 的大小变化及取得最小值的时刻是？","options":["F₂ 一直增大，不存在极小值","F₂ 先减小后增大，当 θ₂ = 55°（即 F₂ ⊥ F₁）时达到最小","F₂ 先增大后减小，当 θ₂ = 55° 时达到最大","F₂ 保持不变，始终等于 F₁"],"answer":[1],"replay":"E5","why":"由 F₂ = {{frac|F<sub>eq<\/sub> sin θ₁|sin(θ₁ + θ₂)}} 可知，当 θ₁ + θ₂ = 90°（即 θ₂ = 90° − 35° = 55°，F₂ ⊥ F₁）时 sin(θ₁ + θ₂) = 1，F₂ 取极小值 F<sub>eq<\/sub> sin 35° ≈ 2.29 N；θ₂ 从 20° 到 85° 经过 55°，故 F₂ 先减小后增大。","quizId":"M06:reverse:R3"},{"id":"R4","show":{"type":"pair-pull","config":{"zeroDiff":0.2}},"stem":"（2026 河北卷思路）在实验校准环节，某同学将甲、乙两只相同的弹簧测力计挂钩互勾，在水平桌面上用不同力度向两侧对拉，记录多组示数发现甲表读数始终比乙表大 0.20 N（例如乙 2.00 N 时甲 2.20 N，乙 3.50 N 时甲 3.70 N）。产生这一恒定差值的原因是？","options":["至少有一只弹簧测力计使用前未水平调零","甲、乙两只测力计内弹簧原长不同","拉动时桌面产生了不同的滑动摩擦方向","作用力与反作用力仅在静止时才大小相等"],"answer":[0],"replay":"E2","why":"互勾对拉的两只测力计受到的相互作用力大小在任意载荷下都严格相等。无论拉力如何变化示数始终恒差 0.20 N，是典型的零点未对齐（零点误差）。","quizId":"M06:reverse:R4"}],"summary":{"principle":"核心思想是<b>等效替代法<\/b>：两次拉伸将橡皮条结点拉至<b>同一位置 O<\/b>，保证形变大小与方向相同。根据平行四边形定则合成的理论值 <b>F<\/b>（对角线）与单计实测值 <b>F'<\/b>（一定沿 AO 方向）在误差允许范围内重合，即可验证力的合成遵循平行四边形定则。","steps":["水平调零与对拉校准两只 0–5 N 弹簧测力计","方木板上固定白纸与橡皮条一端 A，双计呈 60°～120° 拉结点至 O","保持测力计与细绳套<b>平行于木板<\/b>，沿长细绳远端描点 P₁、P₂ 并正视读数（估读到 0.01 N）","改用单只测力计拉结点至<b>同一位置 O<\/b>，记录 F' 大小与 AO 方向","按统一标度作力的图示（实线+箭头，辅助对边虚线），对比 F 与 F' 并换用多组角度（不限 90° 或等大）重复验证"],"notes":[{"do":"两次拉伸结点必须到达同一位置 O","why":"只有结点重合，橡皮条形变的大小和方向才相同，F' 才真正等效替代 F₁、F₂"},{"do":"测力计、细绳套与木板平面保持平行","why":"向上抬起会使竖直分量混入读数且增加壳体摩擦，导致理论合力 F > F'"},{"do":"细绳套适当长、描点离 O 点适当远","why":"可把铅笔描点误差引发的角度偏差 Δθ ≈ Δs/d 减小数倍"},{"do":"两分力夹角适中（60°～120°），不强求 90° 或等大","why":"夹角过大易超 5 N 量程，过小则平行四边形狭长放大作图误差"},{"do":"作图须用统一标度且区别虚实线","why":"力的图示实线表示力矢量、虚线表示平行四边形辅助线，不可画成无标度的示意图"}],"errors":["单拉未到同一 O 点：等效条件失效，F' 大小和方向偏离，误差极大","测力计未调零：水平对拉恒差常数，系统性偏置 F","抬离木板平面：F<sub>读<\/sub> = F<sub>水平<\/sub>/cos θ + f<sub>摩擦<\/sub> 偏大 ⇒ 理论合力 F > F'","细绳过短描点过近：多组数据角度方向散度放大近 5 倍"],"conclusions":["单只测力计拉至 O 点的拉力方向<b>一定沿橡皮条 AO 方向<\/b>","同一次实验 O 点不可变，不同次重复实验 O 点可以变","动态平衡：O 点及 F₁ 方向固定，旋转 F₂ 至 <b>F₂ ⊥ F₁<\/b>（θ₁ + θ₂ = 90°）时 F₂ 取极小值 F<sub>eq<\/sub> sin θ₁"]}}</script>

面上并将测力计水平调零，能确保拉动过程中力的方向在同一水平面内。","quizId":"M06:paper:G2:(1)"},{"label":"(2)","type":"numeric","prompt":"由图乙读出弹簧测力计的示数 F₁ =（按题目要求保留一位小数）","unit":"N","answer":3.0,"tol":0.05,"sig":2,"show":"3.0","explain":"指针正对 3.0 N 刻线；按该题要求保留一位小数，读作 3.0 N。","quizId":"M06:paper:G2:(2)"},{"label":"(3)","type":"numeric","prompt":"在图丙方格纸上按平行四边形定则作出 Fₐ 与 F<sub>b<\/sub> 的合力，求得合力的大小为（保留一位小数）","unit":"N","answer":4.0,"tol":0.1,"sig":2,"show":"4.0","explain":"方格纸上 Fₐ = (−3 格, +5 格)，F<sub>b<\/sub> = (+3 格, +3 格)，由平行四边形定则得合力矢量为 (0 格, +8 格)，即竖直向上共 8 小格。每小格代表 0.5 N，故合力大小 F = 8 × 0.5 N = 4.0 N。","quizId":"M06:paper:G2:(3)"}]},{"id":"G3","source":"2024·重庆卷·第11题","verified":true,"score":6,"stem":"元代王祯《农书》记载了一种用“戽斗”汲水的方法。某同学据此原理设计了如图 1 所示的实验装置：两轻质定滑轮 P、Q 固定在同一水平高度，细线绕过滑轮，一端固定，另一端连在可水平拉动的力传感器上，下方悬挂沙桶（总质量 m = 136.0 g）。最初沙桶静止在较低位置 A，随后迅速向右拉动力传感器将沙桶拉升，沙桶越过平衡位置到达最高点 B 后经过小幅摆动，最终静止停在较高平衡位置 C 点。视频跟踪得到的沙桶高度变化 y-t 图像如图 2 所示（以初始静止位置 A 为 y = 0，B 点为最高点，最终平衡位置 C 点高度 y<sub>C<\/sub> = 0.082 m）。<svg viewBox=\"0 0 600 186\" width=\"600\" role=\"img\" aria-label=\"2024重庆11题戽斗装置与y-t图\"><g transform=\"translate(10,8)\"><rect x=\"0\" y=\"0\" width=\"264\" height=\"170\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"132\" y=\"18\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">图 1：两绳悬吊沙桶示意图<\/text><line x1=\"24\" y1=\"36\" x2=\"240\" y2=\"36\" stroke=\"#596574\" stroke-width=\"3\"/><circle cx=\"66\" cy=\"48\" r=\"10\" fill=\"#DCE4EC\" stroke=\"#4A5B73\" stroke-width=\"1.4\"/><circle cx=\"198\" cy=\"48\" r=\"10\" fill=\"#DCE4EC\" stroke=\"#4A5B73\" stroke-width=\"1.4\"/><text x=\"48\" y=\"50\" font-size=\"11\" font-weight=\"700\" text-anchor=\"end\">P<\/text><text x=\"216\" y=\"50\" font-size=\"11\" font-weight=\"700\">Q<\/text><line x1=\"66\" y1=\"48\" x2=\"132\" y2=\"108\" stroke=\"#1661FF\" stroke-width=\"2\"/><line x1=\"198\" y1=\"48\" x2=\"132\" y2=\"108\" stroke=\"#1661FF\" stroke-width=\"2\"/><line x1=\"24\" y1=\"58\" x2=\"66\" y2=\"58\" stroke=\"#1661FF\" stroke-width=\"1.5 逐渐增大，在此过程中每根细线的拉力将","options":["逐渐增大","逐渐减小","保持不变"],"answer":0,"replay":"E5","explain":"合力大小恒等于沙桶重力 mg。由平衡条件 2T cos(θ/2) = mg 得 T = {{frac|mg|2 cos(θ/2)}}，两线夹角 θ 增大时 cos(θ/2) 减小，故每根细线的拉力 T 逐渐增大。","quizId":"M06:paper:G3:(1)"},{"label":"(2)","type":"text-choice","prompt":"结合 y-t 图像判断，沙桶运动到最高点 B 时的加速度方向为","options":["竖直向下","竖直向上","水平向左"],"answer":0,"explain":"B 点为上升的最高点，速度为零并即将向下回落，因此沙桶受到的重力大于细线拉力的竖直分量，合外力和加速度方向均为竖直向下。","quizId":"M06:paper:G3:(2)"},{"label":"(3)","type":"numeric","prompt":"取 g = 9.80 m/s²，从初位置 A 到最终静止在平衡位置 C 的过程中，沙桶机械能的增加量为（保留两位有效数字）","unit":"J","answer":0.11,"tol":0.01,"sig":2,"show":"0.11","explain":"初态 A 和末态 C 沙桶均静止（动能变化为 0），机械能增加量等于重力势能增加量：ΔE = mgy<sub>C<\/sub> = 0.1360 × 9.80 × 0.082 J ≈ 0.11 J。","quizId":"M06:paper:G3:(3)"}]},{"id":"G4","source":"2025·黑吉辽蒙卷·第12题（节选·力的平衡迁移）","verified":true,"score":4,"stem":"某同学利用橡皮筋与轻绳设计了一个测量水杯质量的实验装置（图甲）：轻绳 1 一端固定在 O 点，与竖直方向夹角保持 θ = 30° 不变；橡皮筋连接结点 A 与弹簧测力计挂钩，结点 A 下方悬挂待测水杯（总重力 mg）。图乙为保持结点 A 和绳 1 方向不变、缓慢转动橡皮筋方向时的动态矢量三角形。<svg viewBox=\"0 0 430 176\" width=\"430\" role=\"img\" aria-label=\"2025黑吉辽蒙12题动态平衡矢量图\"><g transform=\"translate(8,8)\"><rect x=\"0\" y=\"0\" width=\"200\" height=\"160\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"100\" y=\"17\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">图甲：实验装置<\/text><line x1=\"36\" y1=\"28\" x2=\"164\" y2=\"28\" stroke=\"#596574\" stroke-width=\"3\"/><line x1=\"56\" y1=\"28\" x2=\"92\" y2=\"90\" stroke=\"#10233F\" stroke-width=\"2\"/><line x1=\"56\" y1=\"28\" x2=\"56\" y2=\"78\" stroke=\"#94A3B8\" stroke-dasharray=\"3 2\"/><text x=\"60\" y=\"58\" font-size=\"10.5\" fill=\"#4A5B73\">θ<\/text><text x=\"84\" y=\"56\" font-size=\"10.5\" font-weight=\"700\" fill=\"#10233F\">绳 1<\/text><line x1=\"92\" y1=\"90\" x2=\"168\" y2=\"60\" stroke=\"#7A5C3E\" stroke-width=\"2.6\"/><text x=\"134\" y=\"62\" font-size=\"10.5\" font-weight=\"700\" fill=\"#7A5C3E\">橡皮筋<\/text><circle cx=\"92\" cy=\"90\" r=\"3.5\" fill=\"#12A9C4\"/><text x=\"80\" y=\"96\" font-size=\"11\" font-weight=\"700\">A<\/text><line x1=\"92\" y1=\"90\" x2=\"92\" y2=\"116\" stroke=\"#10233F\" stroke-width=\"1.6\"/><rect x=\"80\" y=\"116\" width=\"24\" height=\"28\" rx=\"3\" fill=\"#DCE8FF\" stroke=\"#1661FF\"/><text x=\"92\" y=\"134\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1661FF\">mg<\/text><\/g><g transform=\"translate(222,8)\"><rect x=\"0\" y=\"0\" width=\"200\" height=\"160\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"100\" y=\"17\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">图乙：动态矢量三角形<\/text><line x1=\"128\" y1=\"38\" x2=\"128\" y2=\"130\" stroke=\"#25A870\" stroke-width=\"2.4\"/><polygon points=\"128,130 124,120 132,120\" fill=\"#25A870\"/><text x=\"136\" y=\"90\" font-size=\"11.5\" font-weight=\"700\" fill=\"#17784F\">mg<\/text><line x1=\"128\" y1=\"130\" x2=\"68\" y2=\"26\" stroke=\"#12A9C4\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"/><line x1=\"128\" y1=\"130\" x2=\"88\" y2=\"61\" stroke=\"#0E8CA3\" stroke-width=\"2.0\"/><polygon points=\"88,61 90,71 97,67\" fill=\"#0E8CA3\"/><text x=\"66\" y=\"98\" font-size=\"11\" font-weight=\"700\" text-anchor=\"end\" fill=\"#0E8CA3\">F₁<\/text><line x1=\"88\" y1=\"61\" x2=\"128\" y2=\"38\" stroke=\"#1661FF\" stroke-width=\"2.4\"/><polygon points=\"128,38 118,39 122,46\" fill=\"#1661FF\"/><polyline points=\"94,70 103,65 98,56\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.2\"/><text x=\"114\" y=\"33\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1661FF\">F₂(min)<\/text><line x1=\"77\" y1=\"42\" x2=\"128\" y2=\"38\" stroke=\"#C7374B\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\"/><text x=\"100\" y=\"149\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#4A5B73\">垂线段最短：F₂ ⊥ F₁<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"在保持结点 A 位置及轻绳 1 方向不变的条件下，只有橡皮筋与轻绳 1 垂直时橡皮筋拉力最小。若某次读数时橡皮筋尚未垂直于轻绳 1，则此时的拉力读数比理论最小值","options":["偏大","偏小","相等"],"answer":0,"replay":"E5","explain":"在平衡矢量三角形中，重力 mg 恒定、绳 1 拉力 F₁ 方向恒定，橡皮筋拉力 F₂ 的末端落在 F₁ 方向线上。点到直线以垂线段最短，未垂直时为斜线段，故拉力读数一定偏大。","quizId":"M06:paper:G4:(1)"},{"label":"(2)","type":"text-choice","prompt":"若想在橡皮筋与弹簧测力计量程不变的前提下，增大该装置所能测量物体的质量上限，应____轻绳 1 与竖直方向的夹角 θ。","options":["减小","增大","保持不变"],"answer":0,"explain":"当橡皮筋与绳 1 垂直时 F<sub>2,min<\/sub> = mg sin θ。当最大量程 F<sub>max<\/sub> 一定时，可测最大质量 m<sub>max<\/sub> = {{frac|F<sub>max<\/sub>|g sin θ}}，因此<b>减小<\/b>夹角 θ 可增大测量质量上限。","quizId":"M06:paper:G4:(2)"}]},{"id":"G5","source":"2025·云南卷·第11题","verified":true,"stem":"某物理兴趣小组利用电动机匀速拉动长木板测量木质滑块（质量 250 g）与木板间的动摩擦因数 μ。实验中在滑块上加放不同质量的配重，测得多组正压力与滑动摩擦力数据如下表；如图为实验装置示意图（滑块保持静止，细线连接滑块左侧挂钩、绕过固定在左侧的定滑轮后接在竖直测力计上）。<br><svg viewBox=\"0 0 460 128\" width=\"460\" role=\"img\" aria-label=\"2025云南11题测动摩擦因数装置图\"><rect x=\"8\" y=\"6\" width=\"444\" height=\"116\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><rect x=\"124\" y=\"76\" width=\"246\" height=\"16\" fill=\"#D9B98C\" stroke=\"#7A5C3E\"/><line x1=\"370\" y1=\"84\" x2=\"420\" y2=\"84\" stroke=\"#10233F\" stroke-width=\"2\"/><polygon points=\"426,84 416,79 416,89\" fill=\"#10233F\"/><text x=\"402\" y=\"76\" font-size=\"10.5\" fill=\"#10233F\">木板运动<\/text><rect x=\"216\" y=\"48\" width=\"68\" height=\"28\" rx=\"3\" fill=\"#C9A97A\" stroke=\"#7A5C3E\"/><text x=\"250\" y=\"66\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">滑块+配重<\/text><circle cx=\"112\" cy=\"72\" r=\"10\" fill=\"#DCE4EC\" stroke=\"#4A5B73\" stroke-width=\"1.4\"/><line x1=\"216\" y1=\"54\" x2=\"112\" y2=\"62\" stroke=\"#1661FF\" stroke-width=\"2\"/><line x1=\"102\" y1=\"72\" x2=\"102\" y2=\"108\" stroke=\"#1661FF\" stroke-width=\"1.8\"/><rect x=\"92\" y=\"92\" width=\"20\" height=\"22\" rx=\"3\" fill=\"#fff\" stroke=\"#12A9C4\" stroke-width=\"1.4\"/><text x=\"164\" y=\"46\" font-size=\"10.5\" fill=\"#1661FF\" text-anchor=\"middle\">挂钩略高于滑轮（斜向下拉）<\/text><\/svg><table class=\"dt\"><tr><th>滑块+配重总质量 m / kg<\/th><td>0.250<\/td><td>0.300<\/td><td>0.350<\/td><td>0.400<\/td><\/tr><tr><th>正压力 F<sub>N<\/sub> / N<\/th><td>2.45<\/td><td>2.94<\/td><td>3.43<\/td><td>3.92<\/td><\/tr><tr><th>滑动摩擦力 f / N<\/th><td>1.13<\/td><td>1.35<\/td><td>1.58<\/td><td>1.80<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"numeric","prompt":"当滑块与配重总质量为 0.300 kg 时，测力计示数为 1.35 N（取 g = 9.80 m/s²），由此求得滑块与木板间的动摩擦因数 μ =（保留三位有效数字）","unit":"","answer":0.459,"tol":0.005,"sig":3,"show":"0.459","explain":"当细线水平时 f = μmg，故 μ = {{frac|1.35|0.300 × 9.80}} ≈ 0.459。","quizId":"M06:paper:G5:(1)"},{"label":"(2)","type":"choice","prompt":"分析表中多组数据可知，在同一接触面下滑动摩擦力 f 与正压力 F<sub>N<\/sub>____，动摩擦因数 μ 与正压力大小____。","options":["成正比；无关","成反比；成正比","成正比；成正比","无关；无关"],"answer":0,"explain":"表中各组比值 f / F<sub>N<\/sub> 均在 0.46 左右恒定不变，说明滑动摩擦力 f 与正压力 F<sub>N<\/sub> 成正比，比例系数 μ 仅与接触面材料和粗糙程度有关，与压力大小无关。","quizId":"M06:paper:G5:(2)"},{"label":"(3)","type":"text-choice","prompt":"若实际实验时滑块左侧固定细线的挂钩略高于定滑轮（导致细线向左下方倾斜拉着滑块），数据处理时仍按 μ = F / (mg) 计算，则测得的动摩擦因数 μ 比真实值","options":["偏大","偏小","不变"],"answer":0,"replay":"E3","explain":"细线向左下方成角 θ 拉住静止滑块时，滑块受向下的拉力分力 F sin θ，正压力增大为 N = mg + F sin θ；水平方向 F cos θ = μ(mg + F sin θ)。因此 μ<sub>测<\/sub> = {{frac|F|mg}} = {{frac|μ|cos θ − μ sin θ}} > μ，测得结果系统性偏大。","quizId":"M06:paper:G5:(3)"}]},{"id":"G6","source":"2026·山东卷·第13题（节选·压轴迁移）","verified":true,"stem":"某同学利用内置拉力传感器的智能小车在左侧拉动水平桌面上的物块（重力 G = 4.00 N）测量动摩擦因数，采样得到细绳拉力随时间变化的 F-t 图像如图 2 所示。<svg viewBox=\"0 0 600 176\" width=\"600\" role=\"img\" aria-label=\"2026山东13题智能小车拉力F-t图\"><g transform=\"translate(8,8)\"><rect x=\"0\" y=\"0\" width=\"246\" height=\"160\" rx=\"8\" fill=\"#FBFCFE\" stroke=\"#DCE5F0\"/><text x=\"123\" y=\"18\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#10233F\">图 1：智能小车向左拉动物块<\/text><line x1=\"18\" y1=\"114\" x2=\"228\" y2=\"114\" stroke=\"#4A5B73\" stroke-width=\"2.5\"/><rect x=\"30\" y=\"76\" width=\"54\" height=\"30\" rx=\"5\" fill=\"#DCE8FF\" stroke=\"#1661FF\" stroke-width=\"1.5\"/><circle cx=\"42\" cy=\"109\" r=\"5\" fill=\"#4A5B73\"/><circle cx=\"72\" cy=\"109\" r=\"5\" fill=\"#4A5B73\"/ ext-anchor=\"end\">0<\/text><text x=\"42\" y=\"105\" font-size=\"10\" text-anchor=\"end\">1.0<\/text><text x=\"42\" y=\"75\" font-size=\"10\" text-anchor=\"end\">2.0<\/text><text x=\"42\" y=\"45\" font-size=\"10\" text-anchor=\"end\">3.0<\/text><text x=\"34\" y=\"28\" font-size=\"10.5\">F/N<\/text><line x1=\"46\" y1=\"64.8\" x2=\"286\" y2=\"64.8\" stroke=\"#25A870\" stroke-dasharray=\"3 2\"/><text x=\"288\" y=\"62\" font-size=\"10.5\" font-weight=\"700\" fill=\"#17784F\">2.24<\/text><path d=\"M46 132 L150 42 L156 80 L174 60 L190 66 L206 64.8 L286 64.8\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"2.2\"/><line x1=\"150\" y1=\"42\" x2=\"150\" y2=\"132\" stroke=\"#C7374B\" stroke-dasharray=\"3 2\"/><text x=\"150\" y=\"145\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#C7374B\">2.6<\/text><\/g><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"在 t < 2.6 s 的时间内，物块尚未克服最大静摩擦力，物块处于","options":["静止","匀速直线运动","匀加速直线运动"],"answer":0,"explain":"t < 2.6 s 时细绳拉力随时间线性增大但仍小于最大静摩擦力（3.00 N），物块受静摩擦力平衡而处于静止状态。","quizId":"M06:paper:G6:(1)"},{"label":"(2)","type":"choice","prompt":"为了准确得出物块与桌面间的动摩擦因数，应当截取图 2 中哪一段的拉力数据？","options":["0～2.6 s","2.6～4.0 s","4.0～6.0 s","t = 2.6 s 峰值点"],"answer":2,"explain":"2.6～4.0 s 内物块刚启动存在加减速振荡；4.0～6.0 s 内拉力保持恒定 2.24 N，说明物块做匀速直线运动，此时传感器拉力等于滑动摩擦力。","quizId":"M06:paper:G6:(2)"},{"label":"(3)","type":"numeric","prompt":"已知物块重力 G = 4.00 N，求得动摩擦因数 μ =（保留两位有效数字）","unit":"","answer":0.56,"tol":0.02,"sig":2,"show":"0.56","explain":"匀速阶段滑动摩擦力 f = F = 2.24 N，正压力 N = G = 4.00 N，故 μ = {{frac|2.24|4.00}} = 0.56。","quizId":"M06:paper:G6:(3)"},{"label":"(4)","type":"text-choice","prompt":"若实验中桌面右端略高（物块在智能小车向左牵引下沿略微倾斜的桌面向左下方匀速滑行），仍按水平桌面公式 μ = F / G 计算，则测得的 μ 比真实值","options":["偏小","偏大","不变"],"answer":0,"explain":"桌面右端略高时，物块沿斜面向下匀速运动，重力沿斜面向下的分力 mg sin α 助推运动：F + mg sin α = μ mg cos α ⇒ μ<sub>测<\/sub> = {{frac|F|mg}} = μ cos α − sin α < μ，故测得 μ 偏小。","quizId":"M06:paper:G6:(4)"}]},{"id":"G7","source":"改编自 2026·河北卷·第11(1)题","verified":true,"score":4,"stem": \"/><line x1=\"74\" y1=\"77\" x2=\"98\" y2=\"77\" stroke=\"#10233F\" stroke-width=\"1.6\"/><text x=\"106\" y=\"81\" font-size=\"12\" font-weight=\"700\" fill=\"#10233F\">2.0<\/text><line x1=\"74\" y1=\"85.6\" x2=\"86\" y2=\"85.6\" stroke=\"#10233F\"/><line x1=\"74\" y1=\"94.2\" x2=\"86\" y2=\"94.2\" stroke=\"#10233F\"/><line x1=\"74\" y1=\"102.8\" x2=\"86\" y2=\"102.8\" stroke=\"#10233F\"/><line x1=\"74\" y1=\"111.4\" x2=\"86\" y2=\"111.4\" stroke=\"#10233F\"/><line x1=\"74\" y1=\"120\" x2=\"92\" y2=\"120\" stroke=\"#10233F\"/><text x=\"106\" y=\"124\" font-size=\"11\" fill=\"#10233F\">2.5<\/text><line x1=\"48\" y1=\"77\" x2=\"102\" y2=\"77\" stroke=\"#C7374B\" stroke-width=\"2.4\"/><polygon points=\"48,72 60,77 48,82\" fill=\"#C7374B\"/><\/g><\/svg>","parts":[{"label":"(1)","type":"numeric","prompt":"按弹簧测力计最小分度 0.1 N 估读到下一位，图乙中测力计乙的示数为","unit":"N","answer":2.0,"tol":0.02,"sig":3,"show":"2.00","explain":"0.1 N 分度的弹簧测力计须估读到 0.01 N，指针恰好对齐 2.0 N 刻线，故读数为 2.00 N。","quizId":"M06:paper:G7:(1)"},{"label":"(2)","type":"choice","prompt":"两只测力计互勾对拉时，甲表读数始终比乙表大 0.20 N 的原因是____。","options":["两只弹簧测力计的弹簧劲度系数不同","甲测力计拉力大于乙测力计拉力","使用前至少有一只弹簧测力计未正确调零","对拉时桌面产生了大小相等的摩擦力"],"answer":2,"replay":"E2","explain":"依据牛顿第三定律，甲、乙挂钩之间的作用力与反作用力大小始终相等；两表示数恒差 0.20 N（与拉力大小无关），说明使用前至少有一只弹簧测力计未水平调零。","quizId":"M06:paper:G7:(2)"}]},{"id":"Y1","source":"原创","verified":true,"stem":"某实验小组用方木板、白纸、橡皮条、两根细绳套和两只 0–5 N 弹簧测力计做“探究两个互成角度的力的合成规律”实验。如图为记录的结点 O、细绳方向点 P₁、P₂ 及 AO 延长线示意图。<svg viewBox=\"0 0 380 166\" width=\"380\" role=\"img\" aria-label=\"力的合成规范操作示意图\"><rect x=\"8\" y=\"8\" width=\"364\" height=\"150\" rx=\"8\" fill=\"#D9B98C\" stroke=\"#7A5C3E\"/><rect x=\"28\" y=\"18\" width=\"324\" height=\"130\" rx=\"4\" fill=\"#fff\" stroke=\"#9AA8B8\"/><circle cx=\"190\" cy=\"30\" r=\"4\" fill=\"#10233F\"/><text x=\"202\" y=\"34\" font-size=\"11.5\" font-weight=\"700\">A<\/text><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"72\" stroke=\"#7A5C3E\" stroke-width=\"3.5\"/><circle cx=\"190\" cy=\"72\" r=\"4\" fill=\"#12A9C4\" stroke=\"#10233F\"/><text x=\"176\" y=\"74\" font-size=\"11.5\" font-weight=\"700\">O<\/text><line x1=\"190\" y1=\"72\" x2=\"190\" y2=\"142\" stroke=\"#94A3B8\" stroke-dasharray=\"4 3\"/><line x1=\"190\" y1=\"72\" x2=\"120\" y2=\"136\" stroke=\"#1661FF\" stroke-width=\"1.8\"/><circle cx=\"124\" cy=\"132\" r=\"3\" fill=\"#C7374B\"/><text x=\"112\" y=\"132\" font-size=\"11\" font-weight=\"700\" fill=\"#C7374B\">P₁<\/text><line x1=\"190\" y1=\"72\" x2=\"268\" y2=\"134\" stroke=\"#E07B24\" stroke-width=\"1.8\"/><circle cx=\"264\" cy=\"131\" r=\"3\" fill=\"#C7374B\"/><text x=\"276\" y=\"132\" font-size=\"11\" font-weight=\"700\" fill=\"#C7374B\">P₂<\/text><text x=\"198\" y=\"142\" font-size=\"10.5\" fill=\"#4A5B73\">AO 延长线<\/text><\/svg>","parts":[{"label":"(1)","type":"text-choice","prompt":"本实验中“两力共同拉至 O 点”与“单力单独拉至 O 点”必须重合在同一个 O 点，目的是使两次拉橡皮条产生的","options":["作用效果（形变大小和方向）相同","两分力之和等于单力大小","两细绳伸长量相等"],"answer":0,"replay":"E1","explain":"本实验运用等效替代法，将橡皮条结点拉到同一位置 O，保证橡皮条的伸长长度和方向均相同，即力的作用效果完全等效。","quizId":"M06:paper:Y1:(1)"},{"label":"(2)","type":"multi","prompt":"关于实验操作的规范性，下列说法正确的是____（多选）。","options":["弹簧测力计、细绳套与橡皮条均应与木板平面保持平行","用铅笔沿细绳描点记录方向时，描点位置应尽量靠近结点 O","同一次实验中结点 O 位置不可变，不同次重复实验时结点 O 位置可以改变","两分力的夹角必须严格取 90° 且两分力大小必须相等"],"answer":[0,2],"replay":"E4","explain":"A 正确：必须贴近并平行于木板平面；B 错：描点 P₁、P₂ 应离结点 O 适当远以减小角度误差；C 正确：不同次实验换用不同力与夹角时可重新确定新 O 点；D 错：夹角选 60°～120° 即可，不需 90° 或等大。","quizId":"M06:paper:Y1:(2)"},{"label":"(3)","type":"choice","prompt":"保持结点 O 位置不动及分力 F₁ 方向（与 AO 延长线成 35°）不变，将另一分力 F₂ 从 θ₂ = 20° 逆时针缓慢增大至 θ₂ = 80°（两力夹角由 55° 增至 115°），此过程中 F₂ 的大小变化是____。","options":["一直增大","一直减小","先减小后增大，且在 F₂ ⊥ F₁（两力夹角 90°）时达到最小","先增大后减小"],"answer":2,"replay":"E5","explain":"在矢量三角形中 F₂ = {{frac|F<sub>eq<\/sub> sin 35°|sin(35° + θ₂)}}。当 θ₂ 从 20° 增至 80° 时，夹角 α = 35° + θ₂ 由 55° 经过 90° 增至 115°，sin α 先增大到 1 再减小，故 F₂ 先减小后增大，并在 F₂ ⊥ F₁（即 θ₂ = 55°）时取最小。","quizId":"M06:paper:Y1:(3)"}]},{"id":"Y2","source":"原创","verified":true,"stem":"某同学想通过实验进一步定量检验互成角度两力的合成公式 F² = F₁² + F₂² + 2F₁F₂ cos α。他保持两只测力计的拉力大小恒为 F₁ = 3.00 N、F₂ = 4.00 N，改变两分力夹角 α，测得单拉等效力 F 并计算出 cos α 与 F² 的多组数据如下表：<table class=\"dt\"><tr><th>cos α<\/th><td>−0.80<\/td><td>−0.50<\/td><td>0.00<\/td><td>0.20<\/td><td>0.50<\/td><td>0.80<\/td><\/tr><tr><th>F² / N²<\/th><td>5.8<\/td><td>13.0<\/td><td>25.0<\/td><td>29.8<\/td><td>37.0<\/td><td>44.2<\/td><\/tr><\/table>","parts":[{"label":"(1)","type":"plot","prompt":"请在坐标纸上描出表中的 6 组 (cos α, F²) 数据点，并拖动直线手柄作出 F² - cos α 拟合直线。","x":[-1,1],"y":[0,50],"xLabel":"cos α","yLabel":"F² / N²","points":[[-0.8,5.8],[-0.5,13.0],[0,25.0],[0.2,29.8],[0.5,37.0],[0.8,44.2]],"snap":[0.1,0.2],"ptTol":[0.1,1.0],"slope":24.0,"tol":1.5,"lineInit":[[-0.8,12],[0.8,36]],"explain":"根据 F² = (F₁² + F₂²) + 2F₁F₂ cos α，当 F₁ = 3.00 N、F₂ = 4.00 N 时，纵截距为 F₁² + F₂² = 25.0 N²，直线斜率为 k = 2F₁F₂ = 2 × 3.00 × 4.00 = 24.0 N²。","quizId":"M06:paper:Y2:(1)"},{"label":"(2)","type":"expr","prompt":"当两分力大小 F₁、F₂ 的夹角恰好为直角（α = 90°）时，合力大小 F 的表达式为","lhs":"F =","vars":{"F1":"F₁","F2":"F₂"},"extra":["2"],"answer":"sqrt(F1^2+F2^2)","show":"√(F₁² + F₂²)","explain":"当 α = 90° 时 cos α = 0，平行四边形退化为矩形，由勾股定理得合力大小 F = {{sqrt|F₁² + F₂²}}。","quizId":"M06:paper:Y2:(2)"}]}]</script>

    D.rr(ctx, g.px, g.py, g.pw, g.ph, 4); ctx.fill();

    [[g.px + 10, g.py + 10], [g.px + g.pw - 10, g.py + 10], [g.px + 10, g.py + g.ph - 10], [g.px + g.pw - 10, g.py + g.ph - 10]].forEach(function (pt) {
      ctx.fillStyle = '#8E99A6'; ctx.beginPath(); ctx.arc(pt[0], pt[1], 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#DCE4EC'; ctx.beginPath(); ctx.arc(pt[0] - 1, pt[1] - 1, 1.8, 0, Math.PI * 2); ctx.fill();
    });

    if (this.stageId === 'cal') return;

    // 白纸上的浅蓝 2 cm 标度格
    ctx.save();
    ctx.beginPath(); D.rr(ctx, g.px + 1, g.py + 1, g.pw - 2, g.ph - 2, 4); ctx.clip();
    var step2 = 0.02 * g.ppm;
    ctx.strokeStyle = 'rgba(18,169,196,0.12)'; ctx.lineWidth = 0.8;
    for (var x = g.ax; x < g.px + g.pw; x += step2) { ctx.beginPath(); ctx.moveTo(x, g.py); ctx.lineTo(x, g.py + g.ph); ctx.stroke(); }
    for (x = g.ax - step2; x > g.px; x -= step2) { ctx.beginPath(); ctx.moveTo(x, g.py); ctx.lineTo(x, g.py + g.ph); ctx.stroke(); }
    for (var y = g.ay; y < g.py + g.ph; y += step2) { ctx.beginPath(); ctx.moveTo(g.px, y); ctx.lineTo(g.px + g.pw, y); ctx.stroke(); }

    // 标准 AO 参考虚线与目标 O 点圆圈
    var oPt = this.toPx(g, 0, FF.Y_O);
    ctx.strokeStyle = 'rgba(148,163,184,0.65)'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(g.ax, g.py + g.ph - 12); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#12A9C4'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(oPt[0], oPt[1], 7, 0, Math.PI * 2); ctx.stroke();
    D.text(ctx, 'O', oPt[0] - 14, oPt[1] + 4, { align: 'right', size: 12, weight: 700, color: '#0E8CA3' });

    // 固定图钉 A
    ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(g.ax, g.ay, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(g.ax - 1.5, g.ay - 1.5, 2, 0, Math.PI * 2); ctx.fill();
    D.text(ctx, 'A (图钉)', g.ax + 10, g.ay + 4, { size: 11.5, weight: 700, color: '#10233F' });

    // 右上角标度尺标
    D.text(ctx, '标度：1 cm = 1.0 N', g.px + g.pw - 14, g.py + 22, { align: 'right', size: 11, weight: 700, color: '#4A5B73' });
    ctx.restore();
  };

  /* ---------- 动态前景层 ---------- */
  Bench.prototype.drawFg = function (ctx, w, hh) {
    this.hot = [];
    if (w < 80 || hh < 80) return;
    var g = this.geo(w, hh), st = this.st;

    if (this.stageId === 'cal') {
      this.drawCalStage(ctx, g);
      return;
    }

    var oPt = this.toPx(g, 0, FF.Y_O);
    if (this.stageId === 'two') {
      var ky = FF.L0 + (FF.Y_O - FF.L0) * st.pullPct;
      var kPt = this.toPx(g, 0, ky);
      var atO = Math.abs(st.pullPct - 1.0) < 0.025;

      // 橡皮条 A -> 结点
      ctx.strokeStyle = '#7A5C3E'; ctx.lineWidth = P.clamp(5.2 - st.pullPct * 1.4, 3.0, 5.5); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(kPt[0], kPt[1]); ctx.stroke(); ctx.lineCap = 'butt';
      ctx.fillStyle = atO ? '#25A870' : '#E69B2D';
      ctx.beginPath(); ctx.arc(kPt[0], kPt[1], 4.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.2; ctx.stroke();
      D.text(ctx, atO ? '结点已到位 O ✓' : '拉动把手使结点到达 O', kPt[0] + 10, kPt[1] - 6, {
        size: 11.5, weight: 700, color: atO ? '#17784F' : '#9A5A00'
      });

      var bandCur = FF.rubberBandForce(0, ky, FF.K_BAND, FF.L0);
      var two = FF.twoForceEquilibrium(bandCur.mag, st.theta1Deg, st.theta2Deg);
      var cosL = Math.max(0.2, Math.cos(st.liftDeg * Math.PI / 180));
      var fCase = st.liftDeg > 0 ? 0.10 : 0;
      var disp1 = two.F1 / cosL + fCase + st.zeroErr1;
      var disp2 = two.F2 / cosL + fCase + st.zeroErr2;

      var r1 = st.theta1Deg * Math.PI / 180, r2 = st.theta2Deg * Math.PI / 180;
      var strLenPx = Math.min(g.ppm * st.markDist * 0.42, 38);
      var hx1 = kPt[0] - Math.sin(r1) * strLenPx, hy1 = kPt[1] + Math.cos(r1) * strLenPx;
      var hx2 = kPt[0] + Math.sin(r2) * strLenPx, hy2 = kPt[1] + Math.cos(r2) * strLenPx;

      // 细绳与方向描点 P₁、P₂
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(kPt[0], kPt[1]); ctx.lineTo(hx1, hy1); ctx.moveTo(kPt[0], kPt[1]); ctx.lineTo(hx2, hy2); ctx.stroke();
      var mDistPx = st.markDist * g.ppm * 0.38;
      var p1x = kPt[0] - Math.sin(r1) * mDistPx, p1y = kPt[1] + Math.cos(r1) * mDistPx;
      var p2x = kPt[0] + Math.sin(r2) * mDistPx, p2y = kPt[1] + Math.cos(r2) * mDistPx;
      [[p1x, p1y, 'P₁'], [p2x, p2y, 'P₂']].forEach(function (pt, idx) {
        ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(pt[0], pt[1], 3.4, 0, Math.PI * 2); ctx.fill();
        D.text(ctx, pt[2], pt[0] + (idx === 0 ? -10 : 10), pt[1] - 8, { align: idx === 0 ? 'right' : 'left', size: 11, weight: 700, color: '#C7374B' });
      });

      var dLen = Math.min(92, Math.max(66, g.ph * 0.25));
      var g1 = drawDyn2D(ctx, hx1, hy1, r1, disp1, 'F₁', { bodyLen: dLen, liftDeg: st.liftDeg, labelSide: -22, active: this._dragId === 'h1' });
      var g2 = drawDyn2D(ctx, hx2, hy2, -r2, disp2, 'F₂', { bodyLen: dLen, liftDeg: st.liftDeg, labelSide: 22, active: this._dragId === 'h2' });
      this.hot.push({ id: 'h1', x: g1.gx - 26, y: g1.gy - 26, w: 52, h: 52, label: '拖动 F₁ 测力计' });
      this.hot.push({ id: 'h2', x: g2.gx - 26, y: g2.gy - 26, w: 52, h: 52, label: '拖动 F₂ 测力计' });

      if (st.liftDeg > 0) D.text(ctx, '⚠ 测力计向上抬起 ' + st.liftDeg + '°', g.px + 12, g.py + 22, { size: 12, weight: 700, color: '#C7374B' });
      if (st.markDist < 0.05) D.text(ctx, '⚠ 短细绳（描点离 O 仅 2.5 cm）', g.px + 12, g.py + 38, { size: 11.5, weight: 700, color: '#C7374B' });
      if (two.overRange || disp1 > 5.0 || disp2 > 5.0) {
        D.text(ctx, '⚠ 拉力超过 5.0 N 量程上限！', g.px + g.pw / 2, g.py + g.ph - 12, { align: 'center', size: 12.5, weight: 700, color: '#C7374B' });
      }
      return;
    }

    if (this.stageId === 'single') {
      var kPtS = this.toPx(g, st.singleKnotX, st.singleKnotY);
      var distO = Math.hypot(st.singleKnotX, st.singleKnotY - FF.Y_O);
      var atOS = distO < 0.0025;
      ctx.strokeStyle = '#7A5C3E'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(kPtS[0], kPtS[1]); ctx.stroke(); ctx.lineCap = 'butt';
      ctx.fillStyle = atOS ? '#25A870' : '#C7374B';
      ctx.beginPath(); ctx.arc(kPtS[0], kPtS[1], 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.2; ctx.stroke();

      var bS = FF.rubberBandForce(st.singleKnotX, st.singleKnotY, FF.K_BAND, FF.L0);
      var radS = Math.atan2(-bS.fx, bS.fy);
      var strS = 24;
      var hxs = kPtS[0] - Math.sin(radS) * strS, hys = kPtS[1] + Math.cos(radS) * strS;
      ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(kPtS[0], kPtS[1]); ctx.lineTo(hxs, hys); ctx.stroke();
      var gS = drawDyn2D(ctx, hxs, hys, radS, bS.mag, "F'", { bodyLen: Math.min(92, g.ph * 0.25), labelSide: 26, active: this._dragId === 'hS' });
      this.hot.push({ id: 'hS', x: gS.gx - 28, y: gS.gy - 28, w: 56, h: 56, label: '拖动单只测力计' });
      D.text(ctx, atOS ? '✓ 结点与 O 点重合（等效替代成立）' : '⚠ 结点偏离 O 点 ' + (distO * 100).toFixed(1) + ' cm!', kPtS[0] + 12, kPtS[1] - 4, {
        size: 11.5, weight: 700, color: atOS ? '#17784F' : '#C7374B'
      });
      return;
    }

    // ④ 作图检验：在白纸上按标度绘制 F₁、F₂、虚线平行四边形、蓝 F、绿/红 F'
    var res = st.lastResult || this.computeResult();
    var scPx = 0.022 * g.ppm; // 1.0 N 在纸面上的矢量图长度（按清晰比例展示）
    scPx = Math.min(scPx, (g.py + g.ph - oPt[1] - 26) / Math.max(4.2, res.F_theory.mag, res.F_actual.mag));
    // 橡皮条
    ctx.strokeStyle = '#7A5C3E'; ctx.lineWidth = 3.8;
    ctx.beginPath(); ctx.moveTo(g.ax, g.ay); ctx.lineTo(oPt[0], oPt[1]); ctx.stroke();
    ctx.fillStyle = '#12A9C4'; ctx.beginPath(); ctx.arc(oPt[0], oPt[1], 4.2, 0, Math.PI * 2); ctx.fill();

    var t1r = res.theta1Meas * Math.PI / 180, t2r = res.theta2Meas * Math.PI / 180;
    var f1x = -res.F1Read * Math.sin(t1r) * scPx, f1y = res.F1Read * Math.cos(t1r) * scPx;
    var f2x = res.F2Read * Math.sin(t2r) * scPx, f2y = res.F2Read * Math.cos(t2r) * scPx;
    var fxThPx = f1x + f2x, fyThPx = f1y + f2y;
    var rAct = res.F_actual.angleDeg * Math.PI / 180;
    var fxAcPx = res.F_actual.mag * Math.sin(rAct) * scPx, fyAcPx = res.F_actual.mag * Math.cos(rAct) * scPx;

    // 平行四边形虚线辅助线
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#64748B'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(oPt[0] + f1x, oPt[1] + f1y); ctx.lineTo(oPt[0] + fxThPx, oPt[1] + fyThPx);
    ctx.moveTo(oPt[0] + f2x, oPt[1] + f2y); ctx.lineTo(oPt[0] + fxThPx, oPt[1] + fyThPx);
    ctx.stroke(); ctx.restore();

    // F₁ 与 F₂ 实线箭头
    drawArrow(ctx, oPt[0], oPt[1], oPt[0] + f1x, oPt[1] + f1y, '#12A9C4', 2.2);
    D.text(ctx, 'F₁=' + res.F1Read.toFixed(2) + 'N', oPt[0] + f1x - 8, oPt[1] + f1y + 12, { align: 'right', size: 11, weight: 700, color: '#0E8CA3' });
    drawArrow(ctx, oPt[0], oPt[1], oPt[0] + f2x, oPt[1] + f2y, '#E07B24', 2.2);
    D.text(ctx, 'F₂=' + res.F2Read.toFixed(2) + 'N', oPt[0] + f2x + 8, oPt[1] + f2y + 12, { size: 11, weight: 700, color: '#C25E0A' });

    // F' (实际单拉，绿色) 与 F (理论对角线，蓝色/红色)
    var okMatch = res.relMagErr < 0.03 && res.angleDiffDeg < 2.5;
    drawArrow(ctx, oPt[0], oPt[1], oPt[0] + fxAcPx, oPt[1] + fyAcPx, '#25A870', 2.8);
    D.text(ctx, "F'=" + res.F_actual.mag.toFixed(2) + 'N', oPt[0] + fxAcPx - 10, oPt[1] + fyAcPx + 14, { align: 'right', size: 12, weight: 700, color: '#17784F' });

    drawArrow(ctx, oPt[0], oPt[1], oPt[0] + fxThPx, oPt[1] + fyThPx, okMatch ? '#1661FF' : '#C7374B', 2.4);
    D.text(ctx, 'F=' + res.F_theory.mag.toFixed(2) + 'N', oPt[0] + fxThPx + 10, oPt[1] + fyThPx + 14, { size: 12, weight: 700, color: okMatch ? '#1661FF' : '#C7374B' });

    D.text(ctx, (okMatch ? '✓ 理论 F 与实际 F\' 基本重合' : '⚠ 存在显著偏差：ΔF/F\' = ' + (res.relMagErr * 100).toFixed(1) + '%, Δθ = ' + res.angleDiffDeg.toFixed(1) + '°'),
      g.px + 26, g.py + g.ph - 12, { size: 12, weight: 700, color: okMatch ? '#17784F' : '#C7374B' });
  };

  Bench.prototype.drawCalStage = function (ctx, g) {
    var st = this.st, cy = g.py + g.ph * 0.50, cx = g.px + g.pw * 0.50;
    D.text(ctx, '水平对拉校准：两只测力计挂钩互勾，检验空载调零与对拉示数一致性', cx, g.py + 28, { align: 'center', size: 12.5, weight: 700, color: '#10233F' });

    var gap = 6;
    var disp1 = st.calPullN + st.zeroErr1;
    var disp2 = st.calPullN + st.zeroErr2;
    // 左表向右拉，挂钩在右 (cx - gap)，角度 = +pi/2 (hook at origin, body extends left along -x)
    var gL = drawDyn2D(ctx, cx - gap, cy, Math.PI / 2, disp1, '甲表', { bodyLen: 124, labelSide: -30, active: this._dragId === 'calPull' });
    // 右表向左拉，挂钩在左 (cx + gap)，角度 = -pi/2 (body extends right along +x)
    var gR = drawDyn2D(ctx, cx + gap, cy, -Math.PI / 2, disp2, '乙表', { bodyLen: 124, labelSide: 30, active: this._dragId === 'calPull' });

    // 互勾连接环
    ctx.strokeStyle = '#12A9C4'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - gap, cy); ctx.lineTo(cx + gap, cy); ctx.stroke();

    this.hot.push({ id: 'calPull', x: gL.gx - 28, y: gL.gy - 28, w: 56, h: 56, label: '拖动改对拉拉力' });
    this.hot.push({ id: 'calPull', x: gR.gx - 28, y: gR.gy - 28, w: 56, h: 56, label: '拖动改对拉拉力' });

    var diff = Math.abs(disp1 - disp2);
    var zeroBad = Math.abs(st.zeroErr1) >= 0.01 || Math.abs(st.zeroErr2) >= 0.01;
    var status = diff < 0.02 && !zeroBad;
    var calMsg = status
      ? '✓ 两表读数完全一致（' + disp1.toFixed(2) + ' N = ' + disp2.toFixed(2) + ' N），零点已对齐'
      : (diff >= 0.02
          ? '⚠ 对拉示数不等（甲 ' + disp1.toFixed(2) + ' N vs 乙 ' + disp2.toFixed(2) + ' N，差 ' + diff.toFixed(2) + ' N）——需调零！'
          : '⚠ 两表均未调零（各偏 +' + st.zeroErr1.toFixed(2) + ' N，示数虚高）——需水平调零！');
    D.text(ctx, calMsg, cx, cy + 78, { align: 'center', size: 12.5, weight: 700, color: status ? '#17784F' : '#C7374B' });
    D.text(ctx, '提示：可左右拖动任意测力计拉环改变对拉力，长按呼出 3× 放大镜看刻度', cx, g.py + g.ph - 14, { align: 'center', size: 11.5, color: '#4A5B73' });
  };

  /* ---------- 指针与 3× 放大镜 ---------- */
  Bench.prototype.bindPointer = function () {
    var self = this, dragId = null, magOn = false, x0 = 0, y0 = 0, pull0 = 0, knot0X = 0, knot0Y = 0;
    this._dragId = null;

    function showMag(p) {
      var cvs = [self.stage.layer('bg').canvas, self.stage.layer('fg').canvas];
      var g = self.geo(self.stage.w, self.stage.h), st = self.st;
      var lbl = '';
      if (self.stageId === 'cal') lbl = '甲 ' + (st.calPullN + st.zeroErr1).toFixed(2) + 'N | 乙 ' + (st.calPullN + st.zeroErr2).toFixed(2) + 'N';
      else if (self.stageId === 'two') {
        var bandCur = FF.rubberBandForce(0, FF.L0 + (FF.Y_O - FF.L0) * st.pullPct, FF.K_BAND, FF.L0);
        var two = FF.twoForceEquilibrium(bandCur.mag, st.theta1Deg, st.theta2Deg);
        lbl = 'F₁ ' + two.F1.toFixed(2) + 'N | F₂ ' + two.F2.toFixed(2) + 'N';
      } else {
        var xm = ((p.x - g.ax) / g.ppm * 100).toFixed(1), ym = ((p.y - g.ay) / g.ppm * 100).toFixed(1);
        lbl = '(' + xm + ', ' + ym + ') cm';
      }
      self.mag.show(cvs, p.x, p.y, self.stage.dpr, lbl);
    }

    ML.stage.pointer(this.stage.layer('fg').canvas, {
      down: function (p) {
        var hs = self.hot || [];
        dragId = null; magOn = false;
        for (var i = hs.length - 1; i >= 0; i--) {
          var r = hs[i];
          if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) { dragId = r.id; break; }
        }
        self._dragId = dragId;
        x0 = p.x; y0 = p.y; pull0 = self.st.calPullN;
        knot0X = self.st.singleKnotX; knot0Y = self.st.singleKnotY;
        if (dragId) self.stage.invalidate('fg');
      },
      move: function (p, a) {
        if (magOn || a.pressed) { showMag(p); return; }
        if (!dragId) return;
        var g = self.geo(self.stage.w, self.stage.h), st = self.st;
        if (dragId === 'calPull') {
          var cx = g.px + g.pw * 0.50;
          var d0 = Math.abs(x0 - cx), dNow = Math.abs(p.x - cx);
          st.calPullN = P.clamp(Math.round((pull0 + (dNow - d0) * 0.025) * 20) / 20, 0.50, 3.50);
          self.stage.invalidate('fg'); self.renderSide();
        } else if (dragId === 'h1' || dragId === 'h2') {
          var ky = FF.L0 + (FF.Y_O - FF.L0) * st.pullPct;
          var kPt = self.toPx(g, 0, ky);
          var dx = p.x - kPt[0], dy = Math.max(18, p.y - kPt[1]);
          if (dragId === 'h1') {
            var ang1 = P.clamp(Math.round(Math.atan2(-dx, dy) * 180 / Math.PI), 9, 75);
            if (self.guided() && ang1 + st.theta2Deg > 115) ang1 = Math.max(15, 115 - st.theta2Deg);
            st.theta1Deg = ang1;
          } else {
            var ang2 = P.clamp(Math.round(Math.atan2(dx, dy) * 180 / Math.PI), 9, 75);
            if (self.guided() && st.theta1Deg + ang2 > 115) ang2 = Math.max(15, 115 - st.theta1Deg);
            st.theta2Deg = ang2;
          }
          var dist = Math.hypot(p.x - kPt[0], p.y - kPt[1]);
          var baseDist = Math.min(g.ppm * st.markDist * 0.42, 38) + Math.min(92, Math.max(66, g.ph * 0.25)) + 26;
          var pct = P.clamp(0.60 + 0.40 * (dist / Math.max(60, baseDist)), 0.55, 1.06);
          if (Math.abs(pct - 1.0) < 0.08) pct = 1.0;
          st.pullPct = pct;
          self.stage.invalidate('fg'); self.renderSide();
        } else if (dragId === 'hS') {
          var xm = P.clamp(knot0X + (p.x - x0) / g.ppm, -0.04, 0.04);
          var ym = P.clamp(knot0Y + (p.y - y0) / g.ppm, 0.11, 0.21);
          if (Math.hypot(xm, ym - FF.Y_O) < 0.006) { xm = 0; ym = FF.Y_O; }
          st.singleKnotX = xm; st.singleKnotY = ym;
          self.stage.invalidate('fg'); self.renderSide();
        }
      },
      press: function (p) {
        magOn = true;
        showMag(p);
      },
      up: function () {
        magOn = false;
        self.mag.hide();
        dragId = null; self._dragId = null;
        self.stage.invalidate('fg');
      }
    });
  };

  /* ---------- 舞台底部快捷操作条（按钮替代拖拽） ---------- */
  Bench.prototype.renderStageActs = function () {
    var self = this, box = this.stageActs, st = this.st;
    ML.clear(box);
    if (this.stageId === 'cal') {
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () { st.calPullN = st.calPullN > 2.5 ? 1.50 : 2.50; self.stage.invalidate('fg'); self.renderSide(); } }, '切换对拉力度'));
      box.appendChild(h('button.btn.primary.sm', { type: 'button', onclick: function () {
        st.zeroErr1 = 0; st.zeroErr2 = 0; st.calDone = true; self.done.P1 = true;
        self.stage.invalidate('fg'); self.renderSide();
        ML.toast('两只测力计已完成调零与对拉校准 ✓', 'ok');
      } }, '一键水平调零并确认'));
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () { openDynModal(st.calPullN, st.zeroErr1, '弹簧测力计（甲）刻度放大读数'); } }, '测力计读数窗'));
    } else if (this.stageId === 'two') {
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () { st.pullPct = 1.0; self.stage.invalidate('fg'); self.renderSide(); ML.toast('结点已对齐 O 点', 'ok'); } }, '拉到 O 点'));
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () {
        var b = FF.rubberBandForce(0, FF.L0 + (FF.Y_O - FF.L0) * st.pullPct, FF.K_BAND, FF.L0);
        var two = FF.twoForceEquilibrium(b.mag, st.theta1Deg, st.theta2Deg);
        openDynModal(two.F1, st.zeroErr1, '读出左表 F₁ 示数（估读到 0.01 N）');
      } }, '读 F₁ 表盘'));
      box.appendChild(h('button.btn.cyan.sm', { type: 'button', onclick: function () {
        if (Math.abs(st.pullPct - 1.0) > 0.03) { ML.toast('请先点“拉到 O 点”或拖动使结点到达 O', 'warn'); return; }
        var two = FF.twoForceEquilibrium(FF.F_EQ_STD, st.theta1Deg, st.theta2Deg);
        if (self.guided() && two.overRange) { self.block('当前夹角过大导致分力超过 5.0 N 量程，请减小两力夹角。', 'E5'); return; }
        st.twoRecorded = true;
        self.done.P2 = true; self.done.P3 = st.liftDeg === 0; self.done.P4 = st.markDist >= 0.08;
        self.setStage('single');
        ML.toast('已记录 O 点、F₁/F₂ 示数及方向点 P₁/P₂，进入单计等效拉伸', 'ok');
      } }, '记录并进入 ③ 单计等效 →'));
    } else if (this.stageId === 'single') {
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () { st.singleKnotX = 0; st.singleKnotY = FF.Y_O; self.stage.invalidate('fg'); self.renderSide(); ML.toast('单计已将结点拉到同一 O 点', 'ok'); } }, '精准拉到 O 点'));
      if (!this.guided()) {
        box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () { st.singleKnotX = 0.008; st.singleKnotY = FF.Y_O + 0.014; self.stage.invalidate('fg'); self.renderSide(); } }, '故意偏移 O 点 (E1)'));
      }
      box.appendChild(h('button.btn.cyan.sm', { type: 'button', onclick: function () {
        var dist = Math.hypot(st.singleKnotX, st.singleKnotY - FF.Y_O);
        if (self.guided() && dist > 0.003) { self.block('用单只测力计拉橡皮条时必须拉到与刚才完全重合的 O 点！', 'E1'); return; }
        st.singleRecorded = true; self.done.P5 = dist <= 0.003;
        self.setStage('plot');
        ML.toast('已记录单拉 F\' 与 AO 方向，完成平行四边形作图检验', 'ok');
      } }, '记录并作图检验 →'));
    } else if (this.stageId === 'plot') {
      box.appendChild(h('button.btn.primary.sm', { type: 'button', onclick: function () { self.recordTrial(); } }, '记录本组并展开分析'));
      box.appendChild(h('button.btn.sm', { type: 'button', onclick: function () {
        st.twoRecorded = false; st.singleRecorded = false; st.lastResult = null;
        st.theta1Deg = 30; st.theta2Deg = 50; st.pullPct = 1.0;
        self.setStage('two');
      } }, '换新角度再做一组'));
    }
  };

  /* ---------- 右侧控制面板 ---------- */
  Bench.prototype.renderSide = function () {
    var self = this, side = this.side, st = this.st;
    if (!side) return;
    ML.clear(side);
    function row() { return h('div.side-row', Array.prototype.slice.call(arguments)); }
    function chip(label, on, fn, aria) {
      var attrs = { type: 'button', onclick: fn };
      if (aria) attrs['aria-label'] = aria;
      return h('button.chip' + (on ? '.on' : ''), attrs, label);
    }

    var ctl = h('div.side-ctl');
    if (this.stageId === 'cal') {
      ctl.appendChild(h('div.side-k', '① 对拉校准参数'));
      ctl.appendChild(row(h('span.side-l', '零点偏差'),
        chip('正常 0.00 N', st.zeroErr1 === 0 && st.zeroErr2 === 0, function () { st.zeroErr1 = 0; st.zeroErr2 = 0; self.stage.invalidate('fg'); self.renderSide(); }),
        chip('甲 +0.30 N', st.zeroErr1 > 0.1 && Math.abs(st.zeroErr2) < 0.05, function () {
          if (self.guided()) { self.block('使用前必须水平调零，消除零点误差。', 'E2'); return; }
          st.zeroErr1 = 0.30; st.zeroErr2 = 0; self.stage.invalidate('fg'); self.renderSide();
        }),
        chip('双表 +0.30 N', st.zeroErr1 > 0.1 && st.zeroErr2 > 0.1, function () {
          if (self.guided()) { self.block('使用前必须水平调零，消除零点误差。', 'E2'); return; }
          st.zeroErr1 = 0.30; st.zeroErr2 = 0.30; self.stage.invalidate('fg'); self.renderSide();
        })));
      ctl.appendChild(row(h('span.side-l', '对拉力度'),
        chip('−', false, function () { st.calPullN = P.clamp(st.calPullN - 0.5, 0.5, 3.5); self.stage.invalidate('fg'); self.renderSide(); }, '减小对拉拉力'),
        h('b.side-v', st.calPullN.toFixed(2) + ' N'),
        chip('+', false, function () { st.calPullN = P.clamp(st.calPullN + 0.5, 0.5, 3.5); self.stage.invalidate('fg'); self.renderSide(); }, '增大对拉拉力')));
      ctl.appendChild(h('div.m06-readout', {
        html: '甲表：<b>' + (st.calPullN + st.zeroErr1).toFixed(2) + ' N</b>　｜　乙表：<b>' + (st.calPullN + st.zeroErr2).toFixed(2) + ' N</b><br>' +
          '差值：' + Math.abs(st.zeroErr1 - st.zeroErr2).toFixed(2) + ' N（需两表均调零一致）'
      }));
    } else if (this.stageId === 'two' || this.stageId === 'single' || this.stageId === 'plot') {
      ctl.appendChild(h('div.side-k', '分力角度与实验条件'));
      ctl.appendChild(row(h('span.side-l', '左角 θ₁'),
        chip('−5°', false, function () { st.theta1Deg = P.clamp(st.theta1Deg - 5, 9, 75); if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide(); }, '减小左角 θ₁'),
        h('b.side-v', st.theta1Deg + '°'),
        chip('+5°', false, function () {
          var next = P.clamp(st.theta1Deg + 5, 9, 75);
          if (self.guided() && next + st.theta2Deg > 115) { self.block('两分力夹角过大易超 5 N 量程，建议保持在 60°～120° 内。', 'E5'); return; }
          st.theta1Deg = next; if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide();
        }, '增大左角 θ₁')));
      ctl.appendChild(row(h('span.side-l', '右角 θ₂'),
        chip('−5°', false, function () { st.theta2Deg = P.clamp(st.theta2Deg - 5, 9, 75); if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide(); }, '减小右角 θ₂'),
        h('b.side-v', st.theta2Deg + '°'),
        chip('+5°', false, function () {
          var next = P.clamp(st.theta2Deg + 5, 9, 75);
          if (self.guided() && st.theta1Deg + next > 115) { self.block('两分力夹角过大易超 5 N 量程，建议保持在 60°～120° 内。', 'E5'); return; }
          st.theta2Deg = next; if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide();
        }, '增大右角 θ₂')));
      if (!this.guided()) {
        ctl.appendChild(row(h('span.side-l', '错误注入'),
          chip(st.liftDeg ? '抬起22°' : '平行0°', st.liftDeg > 0, function () { st.liftDeg = st.liftDeg ? 0 : 22; if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide(); }),
          chip(st.markDist < 0.05 ? '短绳2.5cm' : '长绳12cm', st.markDist < 0.05, function () { st.markDist = st.markDist < 0.05 ? 0.120 : 0.025; if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide(); }),
          chip('145°超程', st.theta1Deg + st.theta2Deg >= 140, function () { st.theta1Deg = 72.5; st.theta2Deg = 72.5; if (self.stageId === 'plot') self.computeResult(); self.stage.invalidate('fg'); self.renderSide(); })));
      }
      var two = FF.twoForceEquilibrium(FF.F_EQ_STD, st.theta1Deg, st.theta2Deg);
      var res = st.lastResult;
      var roClass = (two.overRange || (res && res.relMagErr > 0.04)) ? 'm06-readout.warn' : 'm06-readout';
      if (this.stageId === 'plot' && res) {
        ctl.appendChild(h('div.' + roClass, {
          html: 'F₁ = <b>' + res.F1Read.toFixed(2) + ' N</b>, F₂ = <b>' + res.F2Read.toFixed(2) + ' N</b> (α=' + res.alphaDeg.toFixed(1) + '°)<br>' +
            '理论 F = <b>' + res.F_theory.mag.toFixed(2) + ' N</b> ｜ 实际 F\' = <b>' + res.F_actual.mag.toFixed(2) + ' N</b> (误差 ' + (res.relMagErr * 100).toFixed(1) + '%)'
        }));
      } else {
        ctl.appendChild(h('div.' + roClass, {
          html: '夹角 α = ' + (st.theta1Deg + st.theta2Deg).toFixed(1) + '° ｜ F₁ ≈ <b>' + two.F1.toFixed(2) + ' N</b>, F₂ ≈ <b>' + two.F2.toFixed(2) + ' N</b>' +
            (two.overRange ? '<br><b>⚠ 超出 5.0 N 量程！</b>' : '')
        }));
