<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：探究弹簧弹力与形变量的关系</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M02 scene.css — 实验：探究弹簧弹力与形变量的关系（1016×563 横屏一屏紧凑适配） */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 36px}
.bench-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:36px}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:7px 12px;margin-bottom:8px;font-size:14px}
.bench-row{display:grid;grid-template-columns:1fr 352px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(64vh,510px);min-height:340px;background:#EAF1F8;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stage-tools{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px;align-items:center}
.stage-tools .chip{min-height:32px;padding:0 10px;font-size:12px;background:rgba(255,255,255,0.92)}
.bench-side{background:#fff;border-radius:var(--r);padding:11px 13px;max-height:min(64vh,510px);display:flex;flex-direction:column;overflow-y:auto;border:1px solid var(--line)}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:6px 0 3px;display:flex;justify-content:space-between;align-items:center}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:4px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:46px}
.side-v{min-width:46px;text-align:center;font-size:13.5px}
.bench-side .chip{min-height:32px;padding:0 9px;font-size:12.5px}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 4px}
.side-acts .btn{min-height:36px;padding:0 8px;font-size:13px}
.side-acts .btn.full{grid-column:span 2}
.side-tip{font-size:12.5px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:7px 9px;margin-top:4px}
.m02-readout{background:#F6F9FD;border:1px solid var(--line);border-radius:var(--rs);padding:6px 10px;font-size:13px;margin:0 0 4px;line-height:1.5}
.m02-readout b{color:var(--blue)}
.m02-readout .warn-txt{color:var(--err);font-weight:700}
.steps{padding-left:18px;margin:3px 0 0;flex:1 1 auto;min-height:70px;overflow-y:auto}
.steps li{margin-bottom:5px;font-size:13px;padding:3px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:12px}
.st-why{color:var(--ink2);font-size:11px;margin-top:1px;line-height:1.35}
.link.sm{font-size:12px;min-height:28px;padding:1px 0}
.muted{color:var(--ink2);font-size:13px}

/* 下方数据分析区（初始 hidden，保证首屏零纵向滚动） */
.analysis{margin-top:12px;background:#fff;border-radius:var(--r);padding:14px 18px;border:1px solid var(--line)}
.ana-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.ana-h{margin:0;font-size:19px}
.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:30px}
.ana-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;margin-top:8px;align-items:start}
.ana-card{background:#F8FBFF;border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.ana-card h3{font-size:15px;margin:0 0 6px}
.tbl-wrap{overflow-x:auto;margin-top:6px}
.ana-tbl{width:100%}
.ana-tbl tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.formula{font-size:14.5px;margin:6px 0;line-height:1.65}
.warnline{color:var(--err);font-weight:600;margin-top:6px;background:#FFF4F5;border:1px solid #F2BFC8;border-radius:var(--rs);padding:8px 12px;font-size:13.5px}

/* 刻度尺练读弹窗与原理小部件 */
.cal-read-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cal-inp{width:120px;min-height:40px;border:1.5px solid var(--line);border-radius:var(--rs);padding:4px 10px;font-size:17px;font-weight:700;background:#FBFCFE}
.cal-fb{margin-top:8px;border-radius:var(--rs);padding:8px 12px;font-size:13.5px;background:#F6F9FD}
.cal-fb.ok{background:#EEF9F4;border:1px solid #BCE6D2;color:#17784F}
.cal-fb.bad{background:#FFF4F5;border:1px solid #F2BFC8;color:var(--err)}
.learn-widget{margin-top:10px}
.m02-w-stage{position:relative;height:186px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0;background:#F8FBFF}
.m02-w-stage.tall{height:212px}
.cmp-note{font-size:13.5px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table{width:100%}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m02","title":"实验：探究弹簧弹力与形变量的关系","sub":"人教版 必修第一册 第三章 1","chapter":"必修第一册 第三章 1","methods":["控制变量与静态平衡","毫米刻度尺估读（0.01 cm）","图像法（F-x 与 F-l）","舍去坏点平滑拟合","斜率/截距消系统误差","水桶加水与传感器迁移"],"learn":[{"id":"L1","title":"实验目的与胡克定律","widget":"hooke-demo","html":"<p><b>目的：<\/b>探究在弹性限度内弹簧弹力 <i>F<\/i> 与弹簧伸长量 <i>x<\/i> 的定量关系，并测定弹簧的劲度系数 <i>k<\/i>。<\/p>","steps":["<b>静态平衡测弹力<\/b>：将轻弹簧竖直悬挂在铁架台上，下端挂质量为 <i>m<\/i> 的钩码。待钩码<b>完全静止<\/b>时，弹簧对钩码的弹力大小等于钩码重力：<i>F<\/i> = <i>mg<\/i>。","<b>形变量的定义<\/b>：用毫米刻度尺测出弹簧不挂钩码时的自然长度（原长 <i>l<\/i>₀）及挂不同数量钩码时的总长度 <i>l<\/i>，则伸长量 <i>x<\/i> = <i>l<\/i> − <i>l<\/i>₀（注意不是弹簧总长 <i>l<\/i>）。","<b>胡克定律<\/b>：在弹性限度内，弹簧弹力大小与形变量成正比，即 <b><i>F<\/i> = <i>kx<\/i><\/b>。比例系数 <i>k<\/i> 叫作弹簧的<b>劲度系数<\/b>（单位 N/m），只由弹簧自身材料、长度、粗细和匝数决定，与所挂拉力无关。"]},{"id":"L2","title":"为什么必须竖直悬挂测原长 l₀","widget":"selfweight-demo","html":"<p>弹簧自身有质量，竖直悬挂时因自重本身就会略有伸长！这直接决定了测 <i>l<\/i>₀ 的操作规范。<\/p>","steps":["<b>正确做法<\/b>：先把弹簧<b>竖直悬挂<\/b>在铁架台横杆上，等它自然下垂静止后测出原长 <i>l<\/i>₀<sub>悬<\/sub>。挂钩码后再测总长 <i>l<\/i>，此时 <i>x<\/i> = <i>l<\/i> − <i>l<\/i>₀<sub>悬<\/sub> 已经扣除了弹簧自重的影响，<i>F<\/i>-<i>x<\/i> 图像严格过原点。","<b>若改为水平平放测原长 <i>l<\/i>₀<sub>平<\/sub><\/b>：竖直悬挂后弹簧会先因自身重力伸长 Δ<i>l<\/i><sub>自重<\/sub> = {{frac|<i>m<\/i><sub>弹<\/sub><i>g<\/i>|2<i>k<\/i>}}。若误以 <i>l<\/i>₀<sub>平<\/sub> 为起点算 <i>x<\/i>′ = <i>l<\/i> − <i>l<\/i>₀<sub>平<\/sub>，则 <i>F<\/i>-<i>x<\/i>′ 图像将在 <b><i>x<\/i> 轴正半轴产生截距 Δ<i>l<\/i><sub>自重<\/sub><\/b>。","<b>关键辨析<\/b>：虽然自重会使 <i>F<\/i>-<i>x<\/i>′ 图线向右平移（单点计算 <i>F<\/i>/<i>x<\/i>′ 偏小），但图线<b>斜率 <i>k<\/i> 完全不变<\/b>！若直接以总长度 <i>l<\/i> 为横坐标作 <i>F<\/i>-<i>l<\/i> 图像，更无需提前测 <i>l<\/i>₀，斜率依然是真实 <i>k<\/i>。"]},{"id":"L3","title":"毫米刻度尺规范读数","widget":"ruler-demo","html":"<p>测量弹簧长度使用最小分度为 <b>1 mm<\/b> 的刻度尺，读数规则是高考实验高频得分点。<\/p>","steps":["<b>必须估读到下一位<\/b>：毫米刻度尺最小分度为 1 mm（0.1 cm），读数必须估读到 <b>0.1 mm<\/b>（即以 cm 为单位保留<b>两位小数<\/b>，如 13.14 cm）。","<b>对齐整刻线要补 0<\/b>：当指针恰好对准 15.0 cm 或 15.2 cm 刻线时，不能简写为 15 cm 或 15.2 cm，必须记作 <b>15.00 cm<\/b> 或 <b>15.20 cm<\/b>。","<b>正视消除视差<\/b>：指针在刻度尺前方一定距离处，读数时眼睛必须<b>正对指针与刻度线<\/b>（视线垂直尺面）。刻度尺上 0 刻线在上方时，俯视读数偏大、仰视读数偏小。"]},{"id":"L4","title":"F-x 与 F-l 图像法求劲度系数 k","widget":"chart-demo","html":"<p>相比逐组算 <i>k<\/i> = <i>F<\/i>/<i>x<\/i> 再求平均，作 <i>F<\/i>-<i>x<\/i> 或 <i>F<\/i>-<i>l<\/i> 图像能一次剔除坏点并消除原长系统误差。<\/p>","steps":["<b>作图规范<\/b>：至少测量 6 组不同拉力下的长度。描点后用直尺画一条直线，使尽量多的点落在线上，其余点均匀分布在直线两侧，<b>个别偏差很大的坏点应舍去<\/b>（切勿用折线硬连所有点）。","<b><i>F<\/i>-<i>x<\/i> 图像<\/b>：在弹性限度内为过原点的倾斜直线，斜率 <i>k<\/i> = {{frac|Δ<i>F<\/i>|Δ<i>x<\/i>}} = {{frac|<i>F<\/i>₂ − <i>F<\/i>₁|<i>x<\/i>₂ − <i>x<\/i>₁}} 即为劲度系数（选直线上较远两点计算）。","<b><i>F<\/i>-<i>l<\/i> 图像<\/b>：由 <i>F<\/i> = <i>k<\/i>(<i>l<\/i> − <i>l<\/i>₀) = <i>kl<\/i> − <i>kl<\/i>₀ 可知，图线斜率仍等于 <b><i>k<\/i><\/b>，图线与横轴（<i>l<\/i> 轴）的交点横坐标即等于竖直悬挂原长 <b><i>l<\/i>₀<\/b>。"]},{"id":"L5","title":"弹性限度与图像末端弯曲","widget":"limit-demo","html":"<p>胡克定律只在<b>弹性限度<\/b>内成立。挂钩码过多或拉力过大，会永久损坏弹簧！<\/p>","steps":["<b>超限现象<\/b>：当拉力 <i>F<\/i> 超过弹性限度 <i>F<\/i><sub>限<\/sub> 后，每增加相同拉力，弹簧的伸长增量 Δ<i>x<\/i> 明显变大，且卸去钩码后弹簧<b>无法恢复到原来的自然长度<\/b>（留下永久塑性伸长）。","<b>图像弯曲方向（必考辨析）<\/b>：在纵轴为 <i>F<\/i>、横轴为 <i>x<\/i> 的 <b><i>F<\/i>-<i>x<\/i> 图像<\/b>中，超限后图线斜率变小，末端<b>向横轴（<i>x<\/i> 轴）方向弯曲<\/b>；若横纵轴互换作 <i>x<\/i>-<i>F<\/i> 图像，则末端向纵轴（<i>x<\/i> 轴）弯曲。","<b>数据处理注意<\/b>：求劲度系数 <i>k<\/i> 时，必须只利用前面线性良好的区段拟合直线，切忌把末端已弯曲的超限点也拉入拟合。"]},{"id":"L6","title":"高考创新变式汇总","widget":"variant-demo","html":"<p>近年高考常把弹簧弹力与生活场景、传感器和串并联结合考查，本质仍是胡克定律与图像斜率截距。<\/p>","steps":["<b>① 水桶加水法（2025 四川卷）<\/b>：轻弹簧挂空水桶（质量 <i>m<\/i><sub>桶<\/sub>），每次倒入体积为 <i>V<\/i> 的水（密度 <i>ρ<\/i>），由 <i>kx<\/i> = (<i>m<\/i><sub>桶<\/sub> + <i>ρV<\/i>)<i>g<\/i> 得 <b><i>x<\/i> = {{frac|<i>ρg<\/i>|<i>k<\/i>}}<i>V<\/i> + {{frac|<i>m<\/i><sub>桶<\/sub><i>g<\/i>|<i>k<\/i>}}<\/b>，由 <i>x<\/i>-<i>V<\/i> 直线斜率求 <i>k<\/i>、纵截距求 <i>m<\/i><sub>桶<\/sub>。","<b>② 压力传感器 + 螺旋测微器（2025 重庆卷）<\/b>：测量竖直压缩弹簧时，<i>F<\/i> = <i>k<\/i>(<i>l<\/i>₀ − <i>l<\/i>)，<i>F<\/i>-<i>l<\/i> 图像为<b>斜率为 −<i>k<\/i> 的向下倾斜直线<\/b>，与 <i>l<\/i> 轴交点为原长 <i>l<\/i>₀；类似气弹簧可用 <i>F<\/i>-<i>x<\/i> 图面积求做功。","<b>③ 双弹簧串并联<\/b>：两弹簧串联时拉力相等、伸长相加，<b><i>k<\/i><sub>串<\/sub> = {{frac|<i>k<\/i>₁<i>k<\/i>₂|<i>k<\/i>₁ + <i>k<\/i>₂}}<\/b>（变软）；并联时伸长相等、拉力相加，<b><i>k<\/i><sub>并<\/sub> = <i>k<\/i>₁ + <i>k<\/i>₂<\/b>（变硬）。"]}],"equipment":[{"id":"stand","name":"铁架台与横杆","html":"底座厚重稳固，立柱竖直固定在实验桌上，横杆夹紧后用来竖直悬挂弹簧及固定刻度尺，防止实验过程中晃动或滑移。"},{"id":"spring","name":"轻质弹簧（带指针）","html":"待测被试弹簧，下端装有细长水平指针，指向刻度尺以便读出长度。注意弹簧自身有一定质量，且绝对不能超过其弹性限度使用。"},{"id":"weights","name":"50 g 钩码组","html":"每个质量 50 g（重力约 0.49 N，<i>g<\/i> 取 9.80 m/s²）。逐个增挂可提供均匀递增的已知拉力 <i>F<\/i> = <i>nmg<\/i>，挂放时需轻挂轻放并待静止。"},{"id":"ruler","name":"毫米刻度尺","html":"最小分度为 1 mm（0.1 cm），必须竖直紧贴指针一侧固定。读数时视线要垂直刻度面，并估读到 0.1 mm（0.01 cm）。"},{"id":"dynamometer","name":"弹簧测力计","html":"常用量程 0–5 N，最小分度 0.1 N，读数时须估读到 0.01 N（使用前需沿受力方向检查并调零）。"},{"id":"sensor","name":"压力传感器与螺旋测微器","html":"高考创新方案器材：压力传感器可直接实时采集压缩弹力 <i>F<\/i>，螺旋测微器（估读到 0.001 mm）精确测量微小的弹簧压缩量或长度。"}],"procedure":[{"id":"P1","title":"组装铁架台并悬挂弹簧","how":"将铁架台置于水平桌面，把轻弹簧竖直悬挂在横杆挂钩上，确认指针水平指向右侧。","why":"保证弹簧只沿竖直方向自由伸长，不与背板或刻度尺发生摩擦。"},{"id":"P2","title":"竖直悬挂测自然原长 l₀","how":"在弹簧<b>竖直悬挂<\/b>且不挂任何钩码、静止状态下，用毫米刻度尺读出原长 <i>l<\/i>₀。","why":"竖直悬挂测出的 <i>l<\/i>₀ 已包含弹簧自重引起的伸长，避免后续 <i>F<\/i>-<i>x<\/i> 图出现正横截距。","errorId":"E2"},{"id":"P3","title":"校准毫米刻度尺竖直","how":"将毫米刻度尺<b>竖直<\/b>固定在弹簧旁（0 刻线对齐弹簧悬点），紧靠指针但不阻挡指针运动。","why":"若刻度尺倾斜角度 <i>θ<\/i>，读取的长度差会变为 <i>x<\/i>/cos<i>θ<\/i>（偏大），导致算出的 <i>k<\/i> 偏小。","errorId":"E5"},{"id":"P4","title":"挂钩码并待完全静止","how":"轻轻挂上 50 g 钩码，等待弹簧振幅衰减至<b>完全静止<\/b>后再读取示数。","why":"弹簧上下振动时弹力不等于钩码重力，未静止就读数会产生很大的随机误差。","errorId":"E3"},{"id":"P5","title":"正视指针并估读到 0.01 cm","how":"眼睛与指针保持在同一水平高度（<b>正视刻度线<\/b>），按 0.01 cm 精度记录总长 <i>l<\/i>。","why":"指针与尺面有间隙，俯视或仰视会引入系统视差；毫米刻度尺必须估读一位。","errorId":"E4"},{"id":"P6","title":"逐次加码且不超弹性限度","how":"每次增加 1 个钩码，至少测满 6 组数据，总拉力严禁超过弹簧弹性限度。","why":"超出弹性限度后胡克定律失效，<i>F<\/i>-<i>x<\/i> 末端向 <i>x<\/i> 轴弯曲且弹簧会产生永久伸长。","errorId":"E1"},{"id":"P7","title":"描点作平滑拟合直线","how":"计算各组伸长量 <i>x<\/i> = <i>l<\/i> − <i>l<\/i>₀，在坐标纸上作 <i>F<\/i>-<i>x<\/i>（或 <i>F<\/i>-<i>l<\/i>）直线，舍去坏点。","why":"用一条直线让点均匀分布在两侧能减小偶然误差，折线硬连会放大个别错点影响。","errorId":"E6"},{"id":"P8","title":"由直线斜率求劲度系数 k","how":"在拟合直线上取相距较远的两点，按 <i>k<\/i> = {{frac|Δ<i>F<\/i>|Δ<i>x<\/i>}} 计算劲度系数并验证规律。","why":"斜率法利用全部线性点求 <i>k<\/i>，可消除原长测量中的恒定系统偏差。"}],"errors":[{"id":"E1","name":"超出弹性限度（钩码过重）","noteId":"P6","trigger":"在标准弹簧（限度 4.00 N）上连续挂至 10 个钩码（4.90 N）再卸载","config":{"weights":10},"observe":"观察 4.00 N 以上 F-x 曲线的弯曲方向，以及全部取下钩码后弹簧能否回到原长。","consequence":"拉力超过 4.00 N 后，弹簧伸长急剧加快，<b><i>F<\/i>-<i>x<\/i> 图像末端明显向横轴（<i>x<\/i> 轴）弯曲<\/b>（4.90 N 处切线斜率已跌破 16 N/m）；全部卸载后弹簧仍留有约 <b>1.11 cm 的永久伸长<\/b>！","ask":{"stem":"在以伸长量 <i>x<\/i> 为横坐标、弹力 <i>F<\/i> 为纵坐标的 <i>F<\/i>-<i>x<\/i> 图像中，若所挂钩码超出弹簧弹性限度，图线末端将？","options":["向纵轴（<i>F<\/i> 轴）方向弯曲，卸载后能完全恢复","向横轴（<i>x<\/i> 轴）方向弯曲，卸载后留有永久伸长","依然保持直线，只是斜率突然变为 2<i>k<\/i>","突然向下折返到原点"],"answer":1,"quizId":"M02:try:E1"},"why":"超过弹性限度后产生塑性形变，较小的外力增量就能引起更大的伸长增量 Δ<i>x<\/i>，即斜率 Δ<i>F<\/i>/Δ<i>x<\/i> 变小，故 <i>F<\/i>-<i>x<\/i> 图线偏向 <i>x<\/i> 轴弯曲；内部分子滑移使卸载后不能恢复原长。","questionIds":["Y1"]},{"id":"E2","name":"水平平放测原长而非竖直悬挂","noteId":"P2","trigger":"使用 60 g 大自重弹簧，在水平桌面测出原长 l₀ = 14.00 cm 后竖直挂码测 l","config":{"springId":"heavy","l0Mode":"horiz"},"observe":"对比“竖直测 l₀”与“水平测 l₀”两条 F-x 图线的横截距和直线斜率。","consequence":"弹簧竖直悬挂时因自重已伸长 Δ<i>l<\/i><sub>自重<\/sub> = {{frac|<i>m<\/i><sub>弹<\/sub><i>g<\/i>|2<i>k<\/i>}} = <b>0.60 cm<\/b>。若按水平原长计算 <i>x<\/i>′ = <i>l<\/i> − <i>l<\/i>₀<sub>平<\/sub>，<i>F<\/i>-<i>x<\/i>′ 直线在 <b><i>x<\/i> 轴正半轴截距为 0.60 cm<\/b>，但直线斜率依然严格等于 <b>49.0 N/m<\/b>！","ask":{"stem":"若把较重的弹簧水平放在桌面上测出原长 <i>l<\/i>₀，再竖直悬挂测出各拉力下的总长 <i>l<\/i>，以 <i>x<\/i> = <i>l<\/i> − <i>l<\/i>₀ 作 <i>F<\/i>-<i>x<\/i> 图像，则所得图线特征是？","options":["图线过原点，求出的劲度系数 <i>k<\/i> 偏小","图线不过原点、在 <i>x<\/i> 轴正半轴有截距，斜率求出的 <i>k<\/i> 准确","图线在 <i>F<\/i> 轴正半轴有截距，斜率求出的 <i>k<\/i> 偏大","图线为曲线，无法求 <i>k<\/i>"],"answer":1,"quizId":"M02:try:E2"},"why":"竖直悬挂后自然长度变为 <i>l<\/i>₀<sub>悬<\/sub> = <i>l<\/i>₀<sub>平<\/sub> + Δ<i>l<\/i><sub>自重<\/sub>，故 <i>F<\/i> = <i>k<\/i>(<i>l<\/i> − <i>l<\/i>₀<sub>悬<\/sub>) = <i>k<\/i>(<i>x<\/i>′ − Δ<i>l<\/i><sub>自重<\/sub>)。图像只是整体向右平移了 Δ<i>l<\/i><sub>自重<\/sub>，直线斜率 <i>k<\/i> 完全不受影响。","questionIds":["Y1"]},{"id":"E3","name":"弹簧未静止就急着读数","noteId":"P4","trigger":"挂上钩码后在弹簧仍在上下剧烈振动时（t ≈ 0.1–0.4 s）直接采样读数","config":{"oscillating":true},"observe":"观察阻尼振动波形及未静止状态下采集的 6 组 (x, F) 数据点的分布规律。","consequence":"指针在平衡位置上下往复振动（振幅约 1.4 cm），各组采样落在不同振动相位上，<i>F<\/i>-<i>x<\/i> 数据点剧烈上下抖动偏离直线，相关系数 <i>R<\/i>² 明显下降（可跌至 0.96 以下），单点测得 <i>k<\/i> 误差很大。","ask":{"stem":"每次增挂钩码后，必须等待弹簧静止后再读取指针刻度，主要原因是？","options":["弹簧振动时劲度系数 <i>k<\/i> 会随速度改变","静止时弹簧弹力才严格等于钩码重力，否则动态位置偏差极大","振动会使刻度尺刻度发生热胀冷缩","静止后就不需要估读最后一位了"],"answer":1,"quizId":"M02:try:E3"},"why":"振动过程中钩码具有加速度 <i>a<\/i>，弹力 <i>F<\/i> = <i>m<\/i>(<i>g<\/i> ± <i>a<\/i>) 并不等于 <i>mg<\/i>，且瞬时长度围绕平衡位置以 <i>x<\/i>(<i>t<\/i>) = <i>x<\/i><sub>eq<\/sub> + <i>Ae<\/i><sup>−ζω₀t<\/sup>cos(ω<sub>d<\/sub><i>t<\/i>) 剧烈变化，只有静止时才满足 <i>F<\/i> = <i>mg<\/i> = <i>kx<\/i>。","questionIds":["G4"]},{"id":"E4","name":"读数时未正视指针（俯视视差）","noteId":"P5","trigger":"保持刻度尺 0 刻线在上，读数时眼睛俯视指针 +18°（指针距尺面 1.2 cm）","config":{"viewAngleDeg":18},"observe":"观察俯视视线穿过前方指针投射到刻度尺上的位置偏移。","consequence":"刻度尺 0 刻线在上方、数值向下递增。俯视 18° 时视线斜向下穿过距尺面 1.2 cm 的指针，投影到刻度尺更下方，导致每组长度读数系统<b>偏大 +0.39 cm<\/b>（<i>F<\/i>-<i>l<\/i> 拟合原长 <i>l<\/i>₀ 偏大 +0.39 cm；若 <i>l<\/i>₀ 正视而挂码后俯视，单组算出的 <i>k<\/i> 明显偏小）。","ask":{"stem":"毫米刻度尺竖直放置且 0 刻线在上方（数值向下增大），指针在刻度尺前方 1.2 cm 处。若读数时俯视指针，读出的刻度值比真实位置？","options":["偏大","偏小","不变","随机偏大或偏小"],"answer":0,"quizId":"M02:try:E4"},"why":"俯视时视线从上方斜向下穿过指针落在刻度尺的更低位置，由于向下刻度数值增大，读出的刻度值偏大 Δ<i>l<\/i> = <i>d<\/i>·tan<i>θ<\/i>。仰视则相反（偏小）。","questionIds":["G1","G3"]},{"id":"E5","name":"毫米刻度尺未竖直（倾斜 12°）","noteId":"P3","trigger":"将固定毫米刻度尺绕顶端零刻度线倾斜 12°","config":{"rulerTiltDeg":12},"observe":"比较竖直尺与倾斜 12° 尺对同一竖直伸长量测出的刻度差及拟合斜率 k。","consequence":"由于尺身斜放，竖直高度差 Δ<i>h<\/i> 在斜尺上对应的刻度长度变为 <i>x<\/i><sub>测<\/sub> = {{frac|<i>x<\/i><sub>真<\/sub>|cos12°}} ≈ 1.022 <i>x<\/i><sub>真<\/sub>（<b>偏大 2.2%<\/b>），导致作 <i>F<\/i>-<i>x<\/i> 图求得的劲度系数变为 <i>k<\/i><sub>测<\/sub> = <i>k<\/i> cos12° ≈ <b>47.9 N/m（偏小 2.2%）<\/b>。","ask":{"stem":"实验中弹簧保持竖直下垂，但固定在旁的毫米刻度尺倾斜了角度 <i>θ<\/i> = 12°，这会使测得的劲度系数 <i>k<\/i>？","options":["偏大（<i>k<\/i><sub>测<\/sub> = <i>k<\/i> / cos<i>θ<\/i>）","偏小（<i>k<\/i><sub>测<\/sub> = <i>k<\/i> cos<i>θ<\/i>）","完全不变","图像变成抛物线"],"answer":1,"quizId":"M02:try:E5"},"why":"倾斜尺上的刻度间距在竖直方向上的投影缩短为 cos<i>θ<\/i> 倍，因此同一竖直伸长量 <i>x<\/i><sub>真<\/sub> 读出的斜尺长度 <i>x<\/i><sub>测<\/sub> = <i>x<\/i><sub>真<\/sub>/cos<i>θ<\/i> 偏大，进而斜率 <i>k<\/i><sub>测<\/sub> = <i>F<\/i>/<i>x<\/i><sub>测<\/sub> = <i>k<\/i> cos<i>θ<\/i> 系统性偏小。","questionIds":["Y1"]},{"id":"E6","name":"用折线硬连所有点（含坏点/超限点）","noteId":"P7","trigger":"数据中混入 1 个读数失误坏点和 1 个超限点，强行用折线逐点连接","config":{"badLineConnect":true},"observe":"对比“折线逐点硬连”与“舍坏点平滑直线拟合”对劲度系数判读的影响。","consequence":"强行用折线连接每一个点会把偶然读数误差和超限弯曲全部当成真实规律，不仅无法验证 <i>F<\/i> ∝ <i>x<\/i> 的线性关系，而且局部线段斜率偏差可达 30% 以上。","ask":{"stem":"关于本实验用图像法处理数据时的连线方法，下列操作规范的是？","options":["用折线顺次连接相邻两点，一点不能漏","只取首尾两点连线，中间点全部忽略","舍去明显偏离的坏点和超限弯曲点，画一条直线使多数点落在线上或均匀分居两侧","强制直线必须经过最后一组实验数据点"],"answer":2,"quizId":"M02:try:E6"},"why":"理想物理规律是过原点的直线。让直线穿过尽可能多的点、其余误差点均匀分布两侧并果断舍去坏点，能够最大程度抵消随机误差。","questionIds":["G7","Y1"]}],"reverse":[{"id":"R1","show":{"type":"fx-intercept"},"stem":"某同学利用一根质量较大的弹簧做实验，作出的 <i>F<\/i>-<i>x<\/i> 图像是一条直线，但未经过坐标原点，而是在横轴正半轴上有截距 <i>x<\/i>₀ = 0.60 cm（斜率正常）。最可能的原因是？","options":["将弹簧水平平放在桌面上测出了原长 <i>l<\/i>₀，未考虑竖直悬挂时弹簧自身重力引起的伸长","所挂钩码远远超出了弹簧的弹性限度","把 <i>l<\/i>₀ 测得偏大了 0.60 cm","读取每个长度时刻度尺倾斜了 12°"],"answer":[0],"replay":"E2","why":"水平测出的 <i>l<\/i>₀<sub>平<\/sub> 比竖直悬挂后的自然原长 <i>l<\/i>₀<sub>悬<\/sub> 短了 Δ<i>l<\/i><sub>自重<\/sub> = <i>m<\/i><sub>弹<\/sub><i>g<\/i>/(2<i>k<\/i>) = 0.60 cm。在未挂钩码（<i>F<\/i> = 0）时，用 <i>l<\/i>₀<sub>悬<\/sub> − <i>l<\/i>₀<sub>平<\/sub> 算出的“伸长量”就已经是 0.60 cm，所以 <i>F<\/i>-<i>x<\/i> 图线在 <i>x<\/i> 轴正半轴有截距 0.60 cm，且斜率仍为真实 <i>k<\/i>。","quizId":"M02:reverse:R1"},{"id":"R2","show":{"type":"fx-bend"},"stem":"某同学实验作出的 <i>F<\/i>-<i>x<\/i> 图像前段为过原点直线，但在 <i>F<\/i> > 4.00 N 的后段明显向横轴（<i>x<\/i> 轴）方向弯曲（如图）。产生该现象的原因及求 <i>k<\/i> 时的正确做法是？","options":["弹簧自重过大；应将全段点连成折线求平均斜率","拉力超过了弹簧的弹性限度；求 <i>k<\/i> 时应舍去弯曲段，只取前段线性区段作直线求斜率","刻度尺未竖直；只需把横纵坐标互换即可恢复直线","弹簧发生了弹性硬化；后段弯曲说明劲度系数变大"],"answer":[1],"replay":"E1","why":"拉力超过弹性限度后弹簧发生塑性变形，<i hoice","prompt":"若橡皮筋的最大安全拉力一定，为增大该装置能测量的最大质量（量程），应____绳 1 与竖直方向的夹角。","options":["增大","减小"],"answer":1,"explain":"因平衡时 F = m g sinθ，可得最大可测质量 m<sub>max<\/sub> = {{frac|F<sub>max<\/sub>|g sinθ}}。要增大量程 m<sub>max<\/sub>，须减小 sinθ，即减小绳 1 与竖直方向的夹角 θ。","quizId":"M02:paper:G6:(3)"}]},{"id":"G7","source":"改编自 2026·河北卷·第12(2)题","verified":true,"stem":"某同学研究电控气动门缓冲弹簧的弹力 <i>F<\/i> 与压缩形变量 <i>x<\/i> 的关系，测得 6 组实验数据如下表：<table class=\"dt\"><tr><th>形变量 x / mm<\/th><td>5<\/td><td>10<\/td><td>15<\/td><td>20<\/td><td>25<\/td><td>30<\/td><\/tr><tr><th>弹力 F / N<\/th><td>1.10<\/td><td>2.20<\/td><td>3.30<\/td><td>4.40<\/td><td>5.50<\/td><td>6.60<\/td><\/tr><\/table>请在下面坐标纸上描出全部 6 个数据点，并拖动蓝色直线手柄作出 <i>F<\/i>-<i>x<\/i> 拟合直线。","parts":[{"label":"(1)","type":"plot","prompt":"在坐标纸上描点作 <i>F<\/i>-<i>x<\/i> 直线（验证线性并拟合出正确斜率）","xLabel":"x / mm","yLabel":"F / N","x":[0,35],"y":[0,7],"points":[[5,1.1],[10,2.2],[15,3.3],[20,4.4],[25,5.5],[30,6.6]],"snap":[1,0.1],"ptTol":[1,0.2],"slope":0.22,"tol":0.02,"lineInit":[[0,0.5],[25,4.0]],"replay":"E6","explain":"依次在 (5, 1.10)、(10, 2.20)、(15, 3.30)、(20, 4.40)、(25, 5.50)、(30, 6.60) 描点，6 个点严格落在过原点的直线上，斜率 k = {{frac|6.60|30}} = 0.22 N/mm（即 220 N/m）。","quizId":"M02:paper:G7:(1)"}]},{"id":"Y1","source":"原创","verified":true,"stem":"在“探究弹簧弹力与形变量的关系”实验中，某同学记录了弹簧原长测定及超限弯曲的实验现象，如图所示。<svg viewBox=\"0 0 460 164\" width=\"460\" role=\"img\" aria-label=\"水平测原长截距与超弹性限度弯曲示意图\"><rect x=\"8\" y=\"8\" width=\"216\" height=\"148\" rx=\"8\" fill=\"#fff\" stroke=\"#B9C8DA\"/><text x=\"18\" y=\"23\" font-size=\"11\" font-weight=\"700\" fill=\"#10233F\">图甲：自重对比<\/text><line x1=\"40\" y1=\"134\" x2=\"212\" y2=\"134\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"40\" y1=\"134\" x2=\"40\" y2=\"32\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"40\" y1=\"134\" x2=\"165\" y2=\"40\" stroke=\"#25A870\" stroke-width=\"2\"/><line x1=\"66\" y1=\"134\" x2=\"191\" y2=\"40\" stroke=\"#C7374B\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><text x=\"128\" y=\"52\" font-size=\"10.5\" font-weight=\"700\" fill=\"#17784F\">竖直测 l₀<\/text><text x=\"152\" y=\"96\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C7374B\">水平测 l₀<\/text><text x=\"72\" y=\"147\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C7374B\">x₀<\/text><text x=\"216\" y=\"148\" font-size=\"10.5\" text-anchor=\"end\">x<\/text><text x=\"34\" y=\"42\" font-size=\"10.5\" text-anchor=\"end\">F<\/text><rect x=\"236\" y=\"8\" width=\"216\" height=\"148\" rx=\"8\" fill=\"#fff\" stroke=\"#B9C8DA\"/><text x=\"246\" y=\"23\" font-size=\"11\" font-weight=\"700\" fill=\"#10233F\">图乙：超弹性限度<\/text><line x1=\"268\" y1=\"134\" x2=\"440\" y2=\"134\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"268\" y1=\"134\" x2=\"268\" y2=\"32\" stroke=\"#10233F\" stroke-width=\"1.4\"/><path d=\"M268,134 L348,66 Q388,46 432,44\" fill=\"none\" stroke=\"#C7374B\" stroke-width=\"2.2\"/><line x1=\"348\" y1=\"66\" x2=\"390\" y2=\"30\" stroke=\"#94A3B8\" stroke-dasharray=\"3 3\"/><text x=\"440\" y=\"148\" font-size=\"10.5\" text-anchor=\"end\">x<\/text><text x=\"262\" y=\"42\" font-size=\"10.5\" text-anchor=\"end\">F<\/text><text x=\"362\" y=\"84\" font-size=\"10.5\" font-weight=\"700\" fill=\"#C7374B\">向 x 轴弯曲<\/text><\/svg>","parts":[{"label":"(1)","type":"choice","prompt":"使用自身重力不可忽略的弹簧时，若先将弹簧水平放平测出原长 <i>l<\/i>₀，再竖直悬挂挂钩码测总长 <i>l<\/i> 并以 <i>x<\/i> = <i>l<\/i> − <i>l<\/i>₀ 作 <i>F<\/i>-<i>x<\/i> 图像（图甲红线），与规范操作相比？","options":["图像仍过原点，测得劲度系数 <i>k<\/i> 偏大","图像在 <i>x<\/i> 轴正半轴有截距 <i>x<\/i>₀，斜率仍等于真实 <i>k<\/i>","图像在 <i>F<\/i> 轴正半轴有截距，测得 <i>k<\/i> 偏小","图像在 <i>x<\/i> 轴负半轴有截距，测得 <i>k<\/i> 偏小"],"answer":1,"replay":"E2","explain":"水平原长比竖直悬挂自然原长短了 Δl<sub>自重<\/sub> = m<sub>弹<\/sub> g/(2k)，所以 F = 0 时 x = Δl<sub>自重<\/sub> > 0，图像在 x 轴正半轴出现截距，但斜率 k 不受影响。","quizId":"M02:paper:Y1:(1)"},{"label":"(2)","type":"multi","prompt":"关于本实验的图像处理与误差分析，下列说法正确的有（多选）：","options":["直接作 <i>F<\/i>-<i>l<\/i> 图像时，图线与 <i>l<\/i> 轴的交点横坐标即等于弹簧竖直悬挂时的自然原长","毫米刻度尺未竖直放置而倾斜 <i>θ<\/i> 角，会使测得的劲度系数 <i>k<\/i> 偏小","当所挂钩码超出弹性限度时，<i>F<\/i>-<i>x<\/i> 图像（横轴 <i>x<\/i>）末端将向 <i>F<\/i> 轴方向弯曲","坐标纸描点后应舍去偏差过大的坏点，画平滑直线让其余点均匀分布在两侧"],"answer":[0,1,3],"replay":"E5","explain":"A 正确（F = k(l−l₀) 令 F=0 得 l=l₀）；B 正确（x<sub>测<\/sub> = x/cosθ 偏大，故 k<sub>测<\/sub> = k cosθ 偏小）；C 错误（超限后斜率减小，F-x 图像向 x 轴弯曲）；D 正确。","quizId":"M02:paper:Y1:(2)"}]},{"id":"Y2","source":"原创","verified":true,"stem":"请拼写以下两种情景中的劲度系数表达式：<br>(1) 作出弹簧弹力 <i>F<\/i> 与总长度 <i>l<\/i> 的 <i>F<\/i>-<i>l<\/i> 直线，在直线上取相距较远的两点 (<i>l<\/i>₁, <i>F<\/i>₁) 和 (<i>l<\/i>₂, <i>F<\/i>₂)（其中 <i>l<\/i>₂ > <i>l<\/i>₁）；<br>(2) 将劲度系数分别为 <i>k<\/i>₁、<i>k<\/i>₂ 的两根轻质弹簧串联悬挂，受到相同拉力 <i>F<\/i> 时总伸长量等于两弹簧伸长量之和。<svg viewBox=\"0 0 460 156\" width=\"460\" role=\"img\" aria-label=\"F-l两点求斜率与双弹簧串联示意图\"><rect x=\"8\" y=\"8\" width=\"246\" height=\"140\" rx=\"8\" fill=\"#fff\" stroke=\"#B9C8DA\"/><line x1=\"44\" y1=\"128\" x2=\"238\" y2=\"128\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"44\" y1=\"128\" x2=\"44\" y2=\"24\" stroke=\"#10233F\" stroke-width=\"1.4\"/><line x1=\"78\" y1=\"128\" x2=\"216\" y2=\"34\" stroke=\"#1661FF\" stroke-width=\"2.2\"/><circle cx=\"116\" cy=\"102\" r=\"3.5\" fill=\"#C7374B\"/><circle cx=\"190\" cy=\"52\" r=\"3.5\" fill=\"#C7374B\"/><line x1=\"116\" y1=\"102\" x2=\"190\" y2=\"102\" stroke=\"#94A3B8\" stroke-dasharray=\"3 2\"/><line x1=\"190\" y1=\"52\" x2=\"190\" y2=\"102\" stroke=\"#94A3B8\" stroke-dasharray=\"3 2\"/><text x=\"114\" y=\"94\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#C7374B\">(l₁,F₁)<\/text><text x=\"186\" y=\"46\" font-size=\"10.5\" text-anchor=\"end\" fill=\"#C7374B\">(l₂,F₂)<\/text><text x=\"240\" y=\"142\" font-size=\"10.5\" text-anchor=\"end\">l<\/text><text x=\"50\" y=\"28\" font-size=\"10.5\">F<\/text><rect x=\"266\" y=\"8\" width=\"186\" height=\"140\" rx=\"8\" fill=\"#F8FBFF\" stroke=\"#B9C8DA\"/><line x1=\"320\" y1=\"20\" x2=\"396\" y2=\"20\" stroke=\"#596574\" stroke-width=\"3\"/><path d=\"M358,20 L358,28 L350,32 L366,38 L350,44 L366,50 L358,54 L358,64\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"2\"/><path d=\"M358,64 L358,72 L350,76 L366,82 L350,88 L366,94 L358,98 L358,108\" fill=\"none\" stroke=\"#25A870\" stroke-width=\"2\"/><rect x=\"344\" y=\"108\" width=\"28\" height=\"20\" rx=\"2\" fill=\"#8E99A6\"/><text x=\"358\" y=\"122\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">F<\/text><text x=\"374\" y=\"44\" font-size=\"11\" font-weight=\"700\" fill=\"#1661FF\">k₁<\/text><text x=\"374\" y=\"88\" font-size=\"11\" font-weight=\"700\" fill=\"#17784F\">k₂<\/text><\/svg>","parts":[{"label":"(1)","type":"expr","prompt":"用直线上两点的坐标写出弹簧劲度系数表达式：","lhs":"<i>k<\/i> =","vars":{"F1":"F₁","F2":"F₂","l1":"l₁","l2":"l₂"},"extra":["1","2"],"answer":"(F2-F1)/(l2-l1)","show":"(F2 - F1) / (l2 - l1)","explain":"由 F₁ = k(l₁ − l₀) 与 F₂ = k(l₂ − l₀) 两式相减消去未知原长 l₀，即得 k = {{frac|F₂ − F₁|l₂ − l₁}}。","quizId":"M02:paper:Y2:(1)"},{"label":"(2)","type":"expr","prompt":"写出两弹簧串联后的等效劲度系数表达式：","lhs":"<i>k<\/i><sub>串<\/sub> =","vars":{"k1":"k₁","k2":"k₂"},"extra":["1","2"],"answer":"k1*k2/(k1+k2)","show":"k1 * k2 / (k1 + k2)","explain":"串联时两弹簧弹力均为 F，总伸长 x = x₁ + x₂ = {{frac|F|k₁}} + {{frac|F|k₂}} = {{frac|F|k<sub>串<\/sub>}}，整理得 {{frac|1|k<sub>串<\/sub>}} = {{frac|1|k₁}} + {{frac|1|k₂}}，即 k<sub>串<\/sub> = {{frac|k₁ k₂|k₁ + k₂}}。","quizId":"M02:paper:Y2:(2)"}]}]</script>

        l0Mode: this.l0Mode,
        l0Meas: l0,
        oscAmp: this.oscAmp || 0.015,
        rulerTiltDeg: this.rulerTiltDeg,
        viewAngleDeg: this.viewAngleDeg,
        seed: this.seedCounter
      });
      for (var i = 0; i < oscPts.length; i++) {
        var mpOsc = oscPts[i];
        var tOsc = ['E3'];
        if (mpOsc.overloaded || mpOsc.damaged) tOsc.push('E1');
        if (this.l0Mode === 'horiz') tOsc.push('E2');
        if (this.viewAngleDeg !== 0) tOsc.push('E4');
        if (this.rulerTiltDeg !== 0) tOsc.push('E5');
        out.push({ n: mpOsc.n, F: mpOsc.F, l: mpOsc.l, l0: l0, x: mpOsc.l - l0, overloaded: mpOsc.overloaded, osc: true, tags: tOsc });
      }
      if (!this.oscAmp) { this.oscAmp = 0.015; this.oscT = 0; this.loop.start(); }
    } else {
      for (var i = 0; i < counts.length; i++) {
        var nw = counts[i];
        var F = nw * SP.WEIGHT_M * SP.G;
        if (F > fPeak) fPeak = F;
        var mp = SP.measurePoint(this.spring, nw, {
          ideal: S.ideal,
          l0Mode: this.l0Mode,
          l0Meas: l0,
          fMax: fPeak,
          rulerTiltDeg: this.rulerTiltDeg,
          viewAngleDeg: this.viewAngleDeg,
          seed: this.seedCounter + i * 23
        });
        var tags = [];
        if (mp.overloaded || mp.damaged) tags.push('E1');
        if (this.l0Mode === 'horiz') tags.push('E2');
        if (this.viewAngleDeg !== 0) tags.push('E4');
        if (this.rulerTiltDeg !== 0) tags.push('E5');
        out.push({ n: nw, F: mp.F, l: mp.l, l0: l0, x: mp.l - l0, overloaded: mp.overloaded, osc: false, tags: tags });
      }
    }
    this.rows = out;
    this.showAna = true;
    this.updateDone();
    this.renderSide();
    this.renderAnalysis(false);
    ML.toast(oscUse ? ('已按振动未静止状态采样 ' + out.length + ' 组数据，线性相关系数明显下降') : ('已采齐 ' + out.length + ' 组实验数据，下方已生成拟合图像'), oscUse ? 'warn' : 'ok');
  };

  Bench.prototype.updateDone = function () {
    this.done.P1 = true;
    this.done.P2 = this.l0Measured != null && this.l0Mode === 'hang';
    this.done.P3 = this.rulerTiltDeg === 0;
    this.done.P4 = !this.oscAmp;
    this.done.P5 = this.viewAngleDeg === 0;
    this.done.P6 = this.curForce() <= this.spring.fYield;
    this.done.P7 = this.rows.length >= 6;
    this.done.P8 = this.rows.length >= 6 && this.showAna;
  };

  /* ---------- 舞台几何与绘制 ---------- */
  Bench.prototype.geo = function (w, hh) {
    var tableY = hh - 26;
    var yTop = 34;
    var availH = Math.max(140, tableY - yTop - 92);
    var ppm = Math.min(820, availH / 0.41);
    var rodX = Math.max(46, Math.round(w * 0.20));
    var springX = Math.max(rodX + 68, Math.round(w * 0.41));
    var rulerX = springX + 62;
    var trayX = Math.max(rulerX + 66, Math.round(w * 0.72));
    trayX = Math.min(w - 72, trayX);
    return {
      w: w, h: hh, tableY: tableY, yTop: yTop, ppm: ppm,
      rodX: rodX, springX: springX, rulerX: rulerX, trayX: trayX
    };
  };

  Bench.prototype.drawBg = function (ctx, w, hh) {
    if (w < 80 || hh < 80) return;
    var g = this.geo(w, hh);
    ctx.fillStyle = '#EAF1F8'; ctx.fillRect(0, 0, w, hh);

    // 实验桌
    ctx.fillStyle = D.grad(ctx, 0, g.tableY, 0, hh, ['#DFC295', '#C29A63']);
    ctx.fillRect(0, g.tableY, w, 26);
    ctx.fillStyle = '#9F7C49'; ctx.fillRect(0, g.tableY, w, 2);

    // 铁架台（底座 + 竖杆 + 横梁）
    ctx.fillStyle = D.grad(ctx, g.rodX - 42, 0, g.rodX + 42, 0, ['#CBD5E1', '#8E99A6']);
    D.rr(ctx, g.rodX - 42, g.tableY - 12, 84, 12, 3); ctx.fill();
    ctx.strokeStyle = '#64748B'; ctx.stroke();
    ctx.fillStyle = D.grad(ctx, g.rodX - 5, 0, g.rodX + 5, 0, ['#DCE4EC', '#8E99A6']);
    ctx.fillRect(g.rodX - 5, g.yTop - 16, 10, g.tableY - 12 - (g.yTop - 16));
    ctx.strokeRect(g.rodX - 5, g.yTop - 16, 10, g.tableY - 12 - (g.yTop - 16));
    ctx.fillStyle = D.grad(ctx, 0, g.yTop - 10, 0, g.yTop - 2, ['#E2E8F0', '#94A3B8']);
    ctx.fillRect(g.rodX - 10, g.yTop - 10, g.rulerX - g.rodX + 48, 8);
    ctx.strokeRect(g.rodX - 10, g.yTop - 10, g.rulerX - g.rodX + 48, 8);
    ctx.fillStyle = '#3B4B60'; D.rr(ctx, g.rodX - 9, g.yTop - 14, 18, 16, 3); ctx.fill();
    ctx.fillStyle = '#3B4B60'; D.rr(ctx, g.springX - 8, g.yTop - 12, 16, 14, 3); ctx.fill();

    // 悬点零基准线
    ctx.save(); ctx.setLineDash([4, 3]);
    ctx.strokeStyle = 'rgba(22,97,255,0.35)';
    ctx.beginPath(); ctx.moveTo(g.springX - 24, g.yTop); ctx.lineTo(g.rulerX, g.yTop); ctx.stroke();
    ctx.restore();

    // 右侧竖直毫米刻度尺（0 在上方对齐悬点）
    var maxCm = Math.min(45, Math.floor((g.tableY - g.yTop - 18) / g.ppm * 100 / 5) * 5);
    drawVerticalRuler(ctx, g.rulerX, g.yTop, g.ppm, Math.max(25, maxCm), this.rulerTiltDeg);
    if (this.rulerTiltDeg) {
      D.text(ctx, '⚠ 刻度尺倾斜 ' + this.rulerTiltDeg + '°', g.rulerX + 46, g.yTop + 18, { size: 11.5, weight: 700, color: '#C7374B' });
    }
    if (this.l0Mode === 'horiz') {
      D.text(ctx, '⚠ 按水平原长 l₀ = ' + cmStr(this.spring.l0Horiz) + ' cm 计算', 12, 20, { size: 11.5, weight: 700, color: '#C7374B' });
    }

    // 钩码托盘（右下桌面）
    ctx.fillStyle = '#E2E8F0';
    D.rr(ctx, g.trayX - 38, g.tableY - 10, 76, 10, 4); ctx.fill();
    ctx.strokeStyle = '#64748B'; ctx.stroke();
    D.text(ctx, '50 g 钩码盘', g.trayX, g.tableY + 16, { align: 'center', size: 11, weight: 600, color: '#4A5B73' });
  };

  Bench.prototype.drawFg = function (ctx, w, hh) {
    if (w < 80 || hh < 80) return;
    var g = this.geo(w, hh);
    this.hot = [];
    var lInst = this.curLengthInst();
    var yBot = Math.min(g.tableY - 24, g.yTop + lInst * g.ppm);
    var damaged = this.fMax > this.spring.fYield;
    var overloaded = this.curForce() > this.spring.fYield;

    // 弹簧本体（超弹性限度变红）
    drawCoilSpring(ctx, g.springX, g.yTop, yBot, 13, 14, damaged ? '#C7374B' : '#3B4B60');

    // 指针（伸向右侧毫米刻度尺，保留微小物理间隙）
    var ptrEndX = g.rulerX - 3;
    ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(g.springX, yBot); ctx.lineTo(ptrEndX, yBot); ctx.stroke();
    ctx.fillStyle = '#C7374B';
    ctx.beginPath(); ctx.moveTo(ptrEndX + 2, yBot); ctx.lineTo(ptrEndX - 7, yBot - 4); ctx.lineTo(ptrEndX - 7, yBot + 4); ctx.closePath(); ctx.fill();
    if (this.rulerTiltDeg) {
      var rulerFaceX = g.rulerX + Math.max(0, yBot - g.yTop) * Math.tan(Math.abs(this.rulerTiltDeg) * Math.PI / 180);
      ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(ptrEndX + 2, yBot); ctx.lineTo(rulerFaceX, yBot); ctx.stroke();
      ctx.restore();
    }

    // 视差视线示意（俯视/仰视）
    if (this.viewAngleDeg !== 0) {
      var viewRad = this.viewAngleDeg * Math.PI / 180;
      var eyeX = g.rulerX - 66, eyeY = yBot - Math.tan(viewRad) * 66;
      var hitY = yBot + (SP.D_GAP * Math.tan(viewRad)) * g.ppm;
      ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = '#C7374B'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(eyeX, eyeY); ctx.lineTo(g.rulerX + 4, hitY); ctx.stroke();
      ctx.restore();
      D.text(ctx, (this.viewAngleDeg > 0 ? '俯视 +' : '仰视 ') + this.viewAngleDeg + '°', eyeX - 4, eyeY - 4, { align: 'right', size: 11, weight: 700, color: '#C7374B' });
    }

    // 挂钩与所挂 50 g 钩码叠放
    var hookY = yBot + 10;
    ctx.strokeStyle = '#4A5B73'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g.springX, yBot); ctx.lineTo(g.springX, hookY); ctx.arc(g.springX, hookY + 3, 4, -Math.PI / 2, Math.PI * 1.1); ctx.stroke();

    var compact = this.nWeights > 6;
    var wStackH = compact ? 5.5 : 8.5, wGap = compact ? 1.0 : 1.5, wHalf = 14;
    for (var i = 0; i < this.nWeights; i++) {
      var wy = hookY + 6 + i * (wStackH + wGap);
      if (wy + wStackH > g.tableY - 2) break;
      ctx.fillStyle = D.grad(ctx, g.springX - wHalf, wy, g.springX + wHalf, wy, ['#D6DEE8', '#8E99A6']);
      D.rr(ctx, g.springX - wHalf, wy, wHalf * 2, wStackH, 2); ctx.fill();
      ctx.strokeStyle = '#4A5B73'; ctx.lineWidth = 1; ctx.stroke();
    }
    var stackBotY = hookY + 6 + this.nWeights * (wStackH + wGap);
    this.hot.push({
      id: 'hook',
      x: g.springX - 34, y: yBot - 10, w: 68, h: Math.max(54, stackBotY - yBot + 24)
    });

    if (this.nWeights > 0) {
      D.text(ctx, this.nWeights + '×50g', g.springX - 20, hookY + 14, { align: 'right', size: 11, weight: 700, color: '#10233F' });
    }

    // 右下托盘中的备用钩码（可拖到挂钩上）
    var avail = Math.max(0, 10 - this.nWeights);
    if (avail > 0) {
      var showCount = Math.min(4, avail);
      for (var j = 0; j < showCount; j++) {
        var ty = g.tableY - 19 - j * 9.5;
        ctx.fillStyle = D.grad(ctx, g.trayX - wHalf, ty, g.trayX + wHalf, ty, ['#DCE4EC', '#8E99A6']);
        D.rr(ctx, g.trayX - wHalf, ty, wHalf * 2, 8.5, 2); ctx.fill();
        ctx.strokeStyle = '#12A9C4'; ctx.lineWidth = 1.2; ctx.stroke();
      }
      D.text(ctx, '拖钩码到挂钩（余' + avail + '）', g.trayX, g.tableY - 24 - showCount * 9.5, { align: 'center', size: 11, weight: 700, color: '#0E8CA3' });
      this.hot.push({ id: 'tray', x: g.trayX - 38, y: g.tableY - 72, w: 76, h: 68 });
    }

    // 标尺按住放大提示区
    this.hot.push({ id: 'ruler', x: g.rulerX - 18, y: g.yTop, w: 74, h: g.tableY - g.yTop });

    // 超限 / 振动状态标签
    if (overloaded || damaged) {
      D.text(ctx, overloaded ? '⚠ 超出弹性限度！' : '⚠ 已产生永久伸长', g.springX, g.yTop - 16, { align: 'center', size: 11.5, weight: 700, color: '#C7374B' });
    } else if (this.oscAmp) {
      D.text(ctx, '弹簧振动中，请等待静止…', g.springX, g.yTop - 16, { align: 'center', size: 11.5, weight: 700, color: '#E69B2D' });
    }

    // 正在拖拽的钩码 + 挂钩吸附环
    if (this.drag) {
      ctx.strokeStyle = '#12A9C4'; ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
      var snapTargetY = this.drag.kind === 'tray' ? stackBotY : g.tableY - 20;
      var snapTargetX = this.drag.kind === 'tray' ? g.springX : g.trayX;
      ctx.beginPath(); ctx.arc(snapTargetX, snapTargetY, 24, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = D.grad(ctx, this.drag.x - 16, this.drag.y - 5, this.drag.x + 16, this.drag.y - 5, ['#E2E8F0', '#64748B']);
      D.rr(ctx, this.drag.x - 16, this.drag.y - 5, 32, 10, 2); ctx.fill();
      ctx.strokeStyle = '#1661FF'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  };

  Bench.prototype.pointerPosForMag = function () {
    var g = this.geo(this.stage.w, this.stage.h);
    var lInst = this.curLengthInst();
    var yBot = Math.min(g.tableY - 24, g.yTop + lInst * g.ppm);
    return { x: g.rulerX + 6, y: yBot };
  };

  Bench.prototype.updateStickyMag = function () {
    if (!this.magLocked) { this.mag.hide(); return; }
    var pos = this.pointerPosForMag();
    var lShow = this.curReading(0);
    this.mag.show([this.stage.layer('bg').canvas, this.stage.layer('fg').canvas], pos.x, pos.y, this.stage.dpr, this.guided() ? '从指针与标尺读数' : 'l ≈ ' + cmStr(lShow) + ' cm');
  };

  Bench.prototype.bindPointer = function () {
    var self = this;
    function hitHot(p, id) {
      for (var i = 0; i < (self.hot || []).length; i++) {
        var r = self.hot[i];
        if (r.id === id && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return true;
      }
      return false;
    }
    ML.stage.pointer(this.stage.el, {
      down: function (p) {
        if (hitHot(p, 'tray') && self.nWeights < 10) {
          self.drag = { kind: 'tray', x: p.x, y: p.y };
          self.stage.invalidate('fg');
          return;
        }
        if (hitHot(p, 'hook') && self.nWeights > 0) {
          self.drag = { kind: 'stack', x: p.x, y: p.y };
          self.stage.invalidate('fg');
          return;
        }
        if (hitHot(p, 'ruler')) {
          self.drag = { kind: 'mag', x: p.x, y: p.y };
          return;
        }
        return false;
      },
      move: function (p, a) {
        if (!self.drag) return;
        if (self.drag.kind === 'mag') {
          if (a.pressed) {
            var lShow = self.curReading(0);
            self.mag.show([self.stage.layer('bg').canvas, self.stage.layer('fg').canvas], p.x, p.y, self.stage.dpr, self.guided() ? '从指针与标尺读数' : 'l ≈ ' + cmStr(lShow) + ' cm');
          }
          return;
        }
        self.drag.x = p.x; self.drag.y = p.y;
        self.stage.invalidate('fg');
      },
      press: function (p) {
        var lShow = self.curReading(0);
        self.mag.show([self.stage.layer('bg').canvas, self.stage.layer('fg').canvas], p.x, p.y, self.stage.dpr, self.guided() ? '从指针与标尺读数' : 'l ≈ ' + cmStr(lShow) + ' cm');
      },
      up: function (p) {
        var d = self.drag; self.drag = null;
        if (!self.magLocked) self.mag.hide();
        if (!d) return;
        var g = self.geo(self.stage.w, self.stage.h);
        if (d.kind === 'tray') {
          var lInst = self.curLengthInst();
          var hookY = g.yTop + lInst * g.ppm + 10;
          if (Math.hypot(p.x - g.springX, p.y - hookY) < 90 || p.x < g.rulerX + 10) {
            self.setWeights(self.nWeights + 1);
          }
        } else if (d.kind === 'stack') {
          if (p.x > g.rulerX + 10 || Math.abs(p.x - g.springX) > 48) {
            self.setWeights(self.nWeights - 1);
          }
        }
        self.stage.invalidate('fg');
      }
    });
  };

  /* ---------- 侧栏与数据分析 ---------- */
  Bench.prototype.updateReadout = function () {
    if (!this.readoutEl) return;
    var F = this.curForce();
    var lShow = this.curReading(0);
    var l0Ref = this.l0Measured;
    var xShow = l0Ref != null ? lShow - l0Ref : NaN;
    var overloaded = F > this.spring.fYield;
    var damaged = this.fMax > this.spring.fYield;

    var statusHtml = overloaded ? '<span class="warn-txt">⚠ 超出弹性限度</span>'
      : damaged ? '<span class="warn-txt">⚠ 存在永久伸长</span>'
      : this.oscAmp ? '<span style="color:#9A5A00;font-weight:700">振动中…</span>'
      : '<span style="color:#17784F;font-weight:700">静止 ✓</span>';

    this.readoutEl.innerHTML = '钩码 <b>' + this.nWeights + ' 个</b>（<i>F</i> = <b>' + F.toFixed(2) + ' N</b>） · ' + statusHtml + '<br>' +
      (this.guided()
        ? '长度读数请从指针与标尺获得并手工提交；已记原长 <b>' + (l0Ref != null ? cmStr(l0Ref) + ' cm' : '未测') + '</b>。'
        : '示数 <i>l</i> = <b>' + cmStr(lShow) + ' cm</b> · 原长 <i>l</i>₀ = <b>' + (l0Ref != null ? cmStr(l0Ref) + ' cm' : '未测') + '</b> · 伸长 <i>x</i> = <b>' + (isFinite(xShow) ? cmStr(xShow) + ' cm' : '—') + '</b>');
  };

  Bench.prototype.renderSide = function () {
    var self = this, side = this.side;
    ML.clear(side);
    this.readoutEl = h('div.m02-readout');
    this.updateReadout();
    side.appendChild(this.readoutEl);

    var ctl = h('div.side-ctl');
    if (this.pendingReading) {
      var readingInput = h('input', { type: 'text', inputmode: 'decimal', placeholder: '例如 13.14', 'aria-label': '弹簧长度读数（cm）', style: { width: '100px' } });
      ctl.appendChild(h('div.side-row', h('span.side-l', this.pendingReading.kind === 'l0' ? '原长 l₀' : '当前长度 l'), readingInput, h('span', 'cm'),
        h('button.btn.primary.sm', { type: 'button', onclick: function () { self.confirmReading(readingInput.value); } }, '提交读数')));
      ctl.appendChild(h('div.side-tip', '请正视指针，借助标尺放大观察；毫米刻度尺以 cm 记录时要保留两位小数。'));
    }
    ctl.appendChild(h('div.side-row',
      h('span.side-l', '钩码'),
      h('button.chip', { type: 'button', 'aria-label': '减少1个50g钩码', disabled: this.nWeights <= 0, onclick: function () { self.setWeights(self.nWeights - 1); } }, '−1 钩码'),
      h('b.side-v', this.nWeights + ' 个'),
      h('button.chip', { type: 'button', 'aria-label': '增加1个50g钩码', disabled: this.nWeights >= 10, onclick: function () { self.setWeights(self.nWeights + 1); } }, '+1 钩码'),
      h('button.chip', { type: 'button', disabled: this.nWeights === 0, onclick: function () { self.setWeights(0); } }, '清空')));

    ctl.appendChild(h('div.side-row',
      h('span.side-l', '原长'),
      h('button.chip' + (this.l0Measured != null && this.l0Mode === 'hang' ? '.on' : ''), {
        type: 'button',
        onclick: function () {
          self.l0Mode = 'hang';
          if (self.nWeights === 0 && !self.oscAmp) self.measureL0();
          else { self.updateDone(); self.stage.invalidate(); self.renderSide(); }
        }
      }, '竖直测 l₀'),
      h('button.chip' + (this.l0Mode === 'horiz' ? '.on' : ''), {
        type: 'button',
        onclick: function () {
          if (self.guided()) { self.block('弹簧有自重，必须竖直悬挂测自然原长 l₀，不能水平平放测量！', 'E2'); return; }
          self.l0Mode = 'horiz'; self.measureL0(); self.stage.invalidate();
        }
      }, '水平测 l₀'),
      h('button.chip', {
        type: 'button',
        onclick: function () {
          var lmMm = Math.round(self.curReading(0) * 10000) / 10;
          openRulerModal((lmMm / 10).toFixed(2), lmMm);
        }
      }, '标尺练读')));

    ctl.appendChild(h('div.side-row',
      h('span.side-l', '视线'),
      h('button.chip' + (this.viewAngleDeg === 0 ? '.on' : ''), {
        type: 'button',
        onclick: function () { self.viewAngleDeg = 0; self.updateDone(); self.stage.invalidate('fg'); self.renderSide(); }
      }, '正视 0°'),
      h('button.chip' + (this.viewAngleDeg === 18 ? '.on' : ''), {
        type: 'button',
        onclick: function () {
          if (self.guided()) { self.block('读数时眼睛必须正视指针与刻度线，俯视会引起偏大视差！', 'E4'); return; }
          self.viewAngleDeg = self.viewAngleDeg === 18 ? 0 : 18;
          self.updateDone(); self.stage.invalidate('fg'); self.renderSide();
        }
      }, '俯视 +18°'),
      h('button.chip' + (this.rulerTiltDeg === 12 ? '.on' : ''), {
        type: 'button',
        onclick: function () {
          if (self.guided()) { self.block('毫米刻度尺必须竖直放置，倾斜会使读数偏大、k 偏小！', 'E5'); return; }
          self.rulerTiltDeg = self.rulerTiltDeg ? 0 : 12;
          self.updateDone(); self.stage.invalidate(); self.renderSide();
        }
      }, this.rulerTiltDeg ? '已倾斜 12°' : '尺竖直 0°')));

    ctl.appendChild(h('div.side-acts',
      h('button.btn.primary', { type: 'button', onclick: function () { self.recordRow(); } }, '记录当前数据'),
      !this.guided() ? h('button.btn', { type: 'button', onclick: function () { self.collectSix(); } }, '自由演示：采齐 6 组') : null,
      h('button.btn.cyan', {
        type: 'button',
        disabled: this.rows.length < 2,
        onclick: function () {
          self.showAna = !self.showAna;
          if (self.showAna) self.renderAnalysis(false);
          else { self.analysis.hidden = true; self.renderSide(); }
        }

          var chV = new ML.Chart(vBody, { xLabel: '加水体积 V / mL', yLabel: '伸长 x / cm', height: 180, paper: true, x: [0, 280], y: [0, 6.2], legendPos: 'br' });
          chV.set([{ pts: [0, 50, 100, 150, 200, 250].map(function (v) { return [v, 0.56 + 0.02 * v]; }), fit: true, color: '#1661FF', label: '斜率 200 m⁻² ⇒ k = ' + bRes.k.toFixed(0) + ' N/m' }]);
          vBody.appendChild(h('div.cmp-note', { html: M.tex('2025 四川真题模型：<i>x</i> = {{frac|<i>ρg</i>|<i>k</i>}}<i>V</i> + {{frac|<i>m</i><sub>桶</sub><i>g</i>|<i>k</i>}}，代入斜率 200 m⁻² 得 <i>k</i> = <b>' + bRes.k.toFixed(1) + ' N/m</b>，截距 0.0056 m 得 <i>m</i><sub>桶</sub> = <b>' + bRes.mBucket.toFixed(3) + ' kg</b>。') }));
        } else if (vMode === 'comp') {
          var chC = new ML.Chart(vBody, { xLabel: '弹簧长度 l / mm', yLabel: '压力 F / N', height: 180, paper: true, x: [6, 20], y: [0, 2.2] });
          chC.set([{ pts: [[7.6, 1.84], [10.1, 1.38], [12.6, 0.92], [15.1, 0.46], [17.6, 0]], fit: true, color: '#25A870', label: '斜率绝对值 k = 184 N/m，原长 l₀ = 17.6 mm' }]);
          vBody.appendChild(h('div.cmp-note', '2025 重庆真题模型：弹簧受压时 F = k(l₀ − l)，F-l 图向下倾斜，斜率绝对值为劲度系数 k，l 轴截距即原长 l₀。'));
        } else {
          var ctlV = h('div.side-row',
            h('span.side-l', 'k₁ = ' + k1),
            h('button.chip', { type: 'button', onclick: function () { k1 = k1 === 40 ? 60 : k1 === 60 ? 80 : 40; renderV(); } }, '切换 k₁'),
            h('span.side-l', 'k₂ = ' + k2),
            h('button.chip', { type: 'button', onclick: function () { k2 = k2 === 60 ? 120 : k2 === 120 ? 40 : 60; renderV(); } }, '切换 k₂'));
          vBody.appendChild(ctlV);
          vBody.appendChild(h('div.cmp-split',
            h('div.cmp-box.good', '串联等效（更软）', h('b', { html: 'k<sub>串</sub> = ' + SP.comboK(k1, k2, 'series').toFixed(1) + ' N/m' }), h('span', { html: '1/k<sub>串</sub> = 1/k₁ + 1/k₂' })),
            h('div.cmp-box', '并联等效（更硬）', h('b', { html: 'k<sub>并</sub> = ' + SP.comboK(k1, k2, 'parallel').toFixed(1) + ' N/m' }), h('span', { html: 'k<sub>并</sub> = k₁ + k₂' }))));
        }
      }
      renderV();
    }
  }

  /* =====================================================================
   *  组装四区一卡
   * ===================================================================== */
  shell = new ML.Shell({
    title: C.title, sub: C.sub, summary: C.summary,
    tabs: [
      { id: 'learn', label: '学·原理', mount: function (el) { ML.Learn(el, C.learn, C.equipment, { onPage: learnWidget, onFinish: function () { shell.go('bench'); } }); } },
      { id: 'bench', label: '做·实验', mount: function (el) { bench = new Bench(el); } },
      { id: 'diag', label: '诊·误差', mount: function (el) {
        var wrap = h('div.diag'); el.appendChild(wrap);
        wrap.appendChild(h('h2.diag-h', 'A. 错误操作实验室'));
        wrap.appendChild(h('p.muted', '每个“试一试”按四拍进行：布置 → 运行 → 对比 → 追问与揭示。所有数据与图像均由物理模型实时生成。'));
        var grid = h('div.err-grid'), cardMap = {};
        C.errors.forEach(function (e) {
          var note = PROC[e.noteId];
          var card = h('div.err-card' + ((S.done || {})[e.id] ? '.done' : ''),
            h('div.err-name', ((S.done || {})[e.id] ? '✓ ' : '') + e.name),
            note ? h('div.err-note', { html: '<b>注意事项：</b>' + M.tex(note.how) }) : null,
            h('button.btn.primary.sm', { type: 'button', onclick: function () { openTry(e.id); } }, '试一试'));
          cardMap[e.id] = card; grid.appendChild(card);
        });
        ML.bus.on('try:done', function (id) {
          var card = cardMap[id];
          if (!card || card.classList.contains('done')) return;
          card.classList.add('done');
          var nm = ML.$('.err-name', card);
          if (nm && nm.textContent.indexOf('✓ ') !== 0) nm.textContent = '✓ ' + nm.textContent;
        });
        wrap.appendChild(grid);
        wrap.appendChild(h('h2.diag-h', 'B. 结果反推'));
        wrap.appendChild(h('p.muted', '观察异常实验图像或结果，反推操作原因，并可一键回到实验台复现。'));
        var rev = h('div.rev'); wrap.appendChild(rev);
        ML.Reverse(rev, C.reverse, adapter);
      } },
      { id: 'paper', label: '练·真题', mount: function (el) {
        new ML.Paper(el, Q, { title: C.title.replace('实验：', '') + ' · 真题训练', onReplay: adapter.replay });
      } }
    ]
  });

  ML.bus.on('tab', function (id) {
    if (id !== 'bench' && bench) {
      bench.magLocked = false;
      if (bench.magBtn) {
        bench.magBtn.classList.remove('on');
        bench.magBtn.textContent = '🔍 指针放大镜';
      }
      bench.settleNow();
    }
  });

  shell.go(S.tab);
  ML.perf.probe();
  ML.m02 = { bench: function () { return bench; }, adapter: adapter, shell: shell };
})(typeof window !== 'undefined' ? window.ML : null);

</script>
</body>
</html>
