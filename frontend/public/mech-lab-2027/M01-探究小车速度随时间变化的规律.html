<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>实验：探究小车速度随时间变化的规律</title>
<style>
/* core/base.css — 四区一卡外壳 + 公共控件。色板见 SERIES §6 */
:root{--blue:#1661FF;--cyan:#12A9C4;--ink:#10233F;--ink2:#4A5B73;--bg:#F3F8FD;--card:#fff;--line:#DCE5F0;--ok:#25A870;--warn:#E69B2D;--err:#C7374B;--paper:#FBFAF5;--r:22px;--rs:12px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--serif:"Songti SC","SimSun","Noto Serif SC",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.ml-app{display:flex;flex-direction:column;height:100%}
.ml-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.ml-brand{min-width:0;flex:0 1 auto}
.ml-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ml-sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.ml-tabs{display:flex;gap:4px;flex:1 1 auto;justify-content:center}
.ml-tab{border:0;background:transparent;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.ml-tab.on{background:var(--blue);color:#fff}
.ml-tab-no{font-size:14px}
.ml-tools{display:flex;gap:8px;align-items:center}
.ml-icon{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 10px;border-radius:var(--rs);font-size:13px;color:var(--ink2);cursor:pointer}
.ml-icon.on{border-color:var(--cyan);color:var(--cyan)}
.ml-main{flex:1 1 auto;overflow:auto;position:relative}
.ml-panel{min-height:100%}
.btn{border:1px solid var(--line);background:#fff;min-height:44px;padding:0 16px;border-radius:var(--rs);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C8DA}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.big{min-height:52px;padding:0 28px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.chip.on{border-color:var(--blue);background:#EAF1FF;color:var(--blue);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#FFF4E3;color:#9A5A00;border:1px solid #F3D3A1}
.tag.err{background:#FDECEF;color:var(--err);border-color:#F2BFC8}
.tag.ok{background:#E8F7F0;color:#17784F;border-color:#BCE6D2}
.ml-toast{position:fixed;left:50%;top:58px;bottom:auto;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:8px;align-items:center;transition:all .2s;z-index:90;max-width:90vw}
.ml-toast.show{opacity:1;transform:translate(-50%,0)}
.ml-toast b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px}
.ml-toast.ok b{background:var(--ok);color:#fff}.ml-toast.warn b{background:var(--warn);color:#fff}.ml-toast.err b{background:var(--err);color:#fff}
/* 画布 */
.ml-stage{position:relative;width:100%;height:100%;touch-action:none}
.ml-gauge{position:relative;width:100%;background:#F6F9FD;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}
.ml-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.ml-mag{position:fixed;display:none;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(16,35,63,.28);pointer-events:none;z-index:80}
.ml-chart{position:relative;width:100%;background:#fff;border-radius:var(--rs)}
.ml-chart.paper{background:#fff}
/* 公式 */
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25}
.mf-n{border-bottom:1.2px solid currentColor;padding:0 3px}
.mf-d{padding:0 3px}
.msq-in{border-top:1.2px solid currentColor;padding:0 2px}
.mbar{display:inline-block;border-top:1.4px solid currentColor;line-height:1.05;padding:1px 1px 0;margin:0 1px}
/* 学·原理 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
.learn-nav{display:flex;flex-direction:column;gap:6px}
.learn-dot{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;min-height:44px;border-radius:var(--rs);padding:4px 10px;cursor:pointer;color:var(--ink2)}
.learn-dot span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:13px;flex:0 0 auto}
.learn-dot em{font-style:normal;font-size:14px}
.learn-dot.on{background:#fff;color:var(--blue);font-weight:700}
.learn-card{background:#fff;border-radius:var(--r);padding:22px 26px;min-height:420px;display:flex;flex-direction:column}
.learn-k{font-size:12px;color:var(--ink2)}
.learn-card h2{margin:2px 0 12px;font-size:22px}
.learn-body{font-size:16px}
.learn-steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.learn-step{border-left:3px solid var(--cyan);background:#F4FBFD;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:16px;animation:mlIn .2s ease}
.learn-bar{margin-top:auto;padding-top:18px;display:flex;gap:10px;justify-content:flex-end}
.learn-methods{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff;border-radius:var(--rs);padding:10px 14px;border:1px solid var(--line)}
.method-title{font-weight:700;font-size:13px;color:var(--ink2);margin-right:2px}
.method-list{display:flex;flex-wrap:wrap;gap:6px}
.method-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#EEF4FF;color:var(--blue);font-size:13px;font-weight:600}
.learn-eq{margin-top:14px}
.eq-title{font-weight:700;font-size:14px;margin-bottom:8px}
.eq-list{display:flex;flex-wrap:wrap;gap:8px}
.eq-chip{border:1px solid var(--line);background:#fff;min-height:40px;padding:0 12px;border-radius:999px;cursor:pointer}
.eq-card{margin-top:10px;background:#fff;border-radius:var(--rs);padding:12px 16px;border:1px solid var(--line)}
.eq-card b{display:block;margin-bottom:4px}
.fig{display:block;max-width:100%;height:auto;margin:8px 0}
table.dt{border-collapse:collapse;font-size:14px;margin:6px 0}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 9px;text-align:center}
table.dt th{background:#F3F7FC;font-weight:600}
@keyframes mlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 模态 + 试一试 */
.ml-modal,.ml-sum{position:fixed;inset:0;background:rgba(16,35,63,.42);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.ml-sum[hidden]{display:none}
.ml-modal-card,.ml-sum-card{background:#fff;border-radius:var(--r);width:min(1080px,100%);max-height:100%;overflow:auto;padding:18px 22px}
.try-head,.ml-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.try-head h2,.ml-sum-head h2{margin:0;font-size:20px}
.try-k{font-size:12px;color:var(--cyan);font-weight:700}
.try-beats{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0}
.try-beats li{flex:1;text-align:center;font-size:13px;padding:6px;border-radius:999px;background:#F0F4F9;color:var(--ink2)}
.try-beats li.on{background:var(--blue);color:#fff;font-weight:700}
.try-beats li.done{background:#E2ECFF;color:var(--blue)}
.try-msg{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:10px 14px}
.try-trigger{font-size:13px;color:var(--ink2);margin-top:4px}
.try-area{margin:12px 0;min-height:120px}
.try-ready{display:grid;place-items:center;min-height:140px}
.try-q{font-weight:700;margin:6px 0}
.try-reveal{margin-top:10px;border-radius:var(--rs);padding:12px 16px;background:#FFF4F5;border:1px solid #F2BFC8}
.try-reveal.ok{background:#EEF9F4;border-color:#BCE6D2}
.try-reveal p{margin:6px 0}
.try-note{color:var(--ink2)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmp-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.cmp-k{flex:0 0 120px;font-size:13px;font-weight:700}
.cmp-k.bad{color:var(--err)}.cmp-k.good{color:#17784F}
.cmp-row .tape-strip{flex:1}
.cmp-table{width:100%}
/* 小结卡 */
.ml-sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.sum-box{border-radius:16px;padding:12px 16px;background:#F6F9FD;font-size:15px}
.sum-box h3{margin:0 0 6px;font-size:15px;color:var(--blue)}
.sum-box ul,.sum-box ol{margin:0;padding-left:20px}
.sum-box.c3{grid-row:span 2}
.sum-notes li{margin-bottom:6px}
.sum-notes li b{display:block;font-weight:700}
.sum-notes li span{color:var(--ink2)}
/* 反推 */
.rev-card{background:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.rev-k{font-size:12px;font-weight:700;color:var(--cyan)}
.rev-stem{font-weight:600;margin:4px 0 8px}
.rev-vis{margin:8px 0}
/* 选项（试一试/反推/题目共用） */
.pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pp-opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--rs);min-height:44px;padding:8px 12px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EEF4FF}
.opt.right{border-color:var(--ok);background:#EEF9F4}
.opt.wrong{border-color:var(--err);background:#FFF4F5}
.ml-low *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px),(orientation:portrait){
  .ml-head{flex-wrap:wrap}.ml-title{max-width:62vw}.ml-tabs{order:3;width:100%;justify-content:space-between}.ml-tab{padding:0 8px;font-size:14px}
  .learn{grid-template-columns:1fr}.learn-nav{flex-direction:row;overflow:auto}.learn-dot em{display:none}
  .ml-sum-grid{grid-template-columns:1fr}.sum-box.c3{grid-row:auto}.pp-opts{grid-template-columns:1fr}
}

/* 实测基线：联想 M9 WebView 窗口 1016×563（docs/平板性能测试结果-20261118.md） */
@media (max-height:640px) and (orientation:landscape){
  .ml-head{padding:3px 10px;gap:10px}.ml-sub{display:none}.ml-title{font-size:15px}
  .ml-tab{min-height:40px;padding:0 12px}.ml-icon,.ml-head .btn{min-height:38px}
  .learn{padding:10px;gap:10px}.learn-card{min-height:0;padding:14px 18px}.learn-card h2{font-size:19px;margin-bottom:6px}
  .learn-methods{margin-top:8px;padding:7px 12px}.learn-eq{margin-top:10px}
  .chip{min-height:36px;padding:0 10px}
}

/* core/paper.css — 仿纸质真题区 */
.paper-sheet{max-width:920px;margin:16px auto 260px;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 #E6E1D2,0 6px 24px rgba(16,35,63,.06);padding:28px 40px;font-family:var(--serif);color:#1C1C1C}
.paper-head{text-align:center;border-bottom:1.5px solid #1C1C1C;padding-bottom:10px;margin-bottom:18px}
.paper-title{font-size:22px;font-weight:700;letter-spacing:2px}
.paper-sub{font-family:var(--font);font-size:13px;color:#6B6B6B}
.pq{padding:6px 0 18px;border-bottom:1px dashed #D6D0BE;margin-bottom:18px}
.pq-head{font-family:var(--font);font-size:14px;margin-bottom:4px}
.pq-no{font-weight:700;margin-right:4px}
.pq-src{color:#555}
.pq-score{margin-left:8px;color:#8A6D1E}
.pq-stem{font-size:16.5px;line-height:1.9}
.pq-stem svg,.pp-prompt svg{max-width:100%;height:auto;display:block;margin:8px auto}
.pp{margin:12px 0 4px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent}
.pp-prompt{font-size:16.5px;line-height:1.9}
.pp-label{font-weight:700;margin-right:4px}
.pp-body{font-family:var(--font)}
.pp-fill{display:flex;align-items:center;gap:6px;margin:6px 0}
.blank{display:inline-block;min-width:140px;min-height:40px;line-height:40px;border-bottom:1.6px solid #1C1C1C;padding:0 8px;font-size:18px;font-family:var(--font);cursor:text;white-space:pre}
.blank.focus{background:#EEF4FF;border-bottom-color:var(--blue);outline:none}
.blank:focus-visible{outline:2px solid var(--blue)}
.unit{font-size:16px}
.pp-expr{display:flex;align-items:center;gap:8px;margin:6px 0}
.expr-lhs{font-size:18px;font-style:italic}
.expr-disp{flex:1;min-height:44px;border-bottom:1.6px solid #1C1C1C;font-size:19px;padding:6px 8px;letter-spacing:.5px}
.expr-disp.empty{color:#999;font-size:14px}
.expr-pal{display:flex;flex-wrap:wrap;gap:6px}
.tok{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:17px;cursor:pointer}
.tok.fn{font-size:13px;color:var(--ink2)}
.pp-plot-status{font-size:13.5px;font-weight:600;color:var(--blue);background:#EEF4FF;border-radius:8px;padding:6px 10px;margin-top:6px}
.pp-tip{font-size:13px;color:#666;margin-top:4px}
.pp-fb{font-family:var(--font);font-size:14px;font-weight:600;margin-top:4px}
.pp.ok{border-color:#BCE6D2;background:#F3FBF7}.pp.ok .pp-fb{color:#17784F}
.pp.bad{border-color:#F2BFC8;background:#FFF7F8}.pp.bad .pp-fb{color:var(--err)}
.pp-explain{display:none;font-family:var(--font);font-size:14.5px;background:#fff;border-radius:8px;padding:8px 12px;margin-top:6px;border:1px solid #E6E1D2}
.submitted .pp-explain{display:block}
.pq-actions{display:flex;gap:10px;margin-top:10px;font-family:var(--font)}
.pq-result{font-family:var(--font);font-weight:700;margin-top:8px}
.pq-result.ok{color:#17784F}.pq-result.some{color:#9A5A00}
.ml-keypad{position:fixed;display:grid;width:326px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:#E9EEF5;padding:10px;border-radius:18px;z-index:70;box-shadow:0 4px 18px rgba(16,35,63,.2);overflow:auto;overscroll-behavior:contain}
.kp-key{min-height:50px;border:0;border-radius:10px;background:#fff;font-size:18px;cursor:pointer}
.kp-key.primary{background:var(--blue);color:#fff;font-weight:700}
@media (max-width:900px){.paper-sheet{padding:18px 16px;margin:8px 8px 260px}}

/* M01 scene.css — 实验台、纸带处理、诊断页 */
.bench{max-width:1360px;margin:0 auto;padding:10px 14px 40px}
.bench-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bench-top .spacer{flex:1}
.seg{display:flex;gap:4px;background:#fff;padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg .chip{border:0;min-height:38px}
.chip.freq-warn{border-color:var(--warn);background:#FFF8EC;color:#9A5A00;font-weight:700}
.bench-banner{background:#FFF8EC;border:1px solid #F3D3A1;border-radius:var(--rs);padding:8px 14px;margin-bottom:8px}
.bench-row{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.bench-stage{position:relative;height:min(56vh,470px);min-height:330px;background:#EAF1F8;border-radius:var(--r);overflow:hidden}
.hold{position:absolute;right:16px;top:16px;z-index:3;background:var(--warn);border-color:var(--warn);color:#fff}
.bench-side{background:#fff;border-radius:var(--r);padding:12px 14px;max-height:calc(56vh + 200px);display:flex;flex-direction:column;overflow:hidden}
.side-ctl{flex:0 0 auto}
.side-k{font-weight:700;font-size:13px;color:var(--cyan);margin:8px 0 6px}
.side-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.side-l{font-size:13px;color:var(--ink2);min-width:56px}
.side-v{min-width:48px;text-align:center}
.side-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.side-acts .btn.sm{grid-column:span 2}
.side-tip{font-size:13px;color:var(--ink2);background:#F6F9FD;border-radius:var(--rs);padding:8px 10px}
.steps{padding-left:20px;margin:0;flex:1 1 auto;overflow-y:auto}
.steps li{margin-bottom:8px;font-size:14px;padding:4px 6px;border-radius:8px;border-left:3px solid transparent}
.steps li.ok .st-t{color:#17784F}
.steps li.cur{background:#EEF4FF;border-left-color:var(--blue)}
.steps li.cur .st-t{color:var(--blue)}
.st-t{font-weight:700}
.st-how{color:var(--ink2);font-size:13px}.st-why{color:var(--ink2);margin-top:2px}
.link.sm{font-size:13px;min-height:32px;padding:2px 0}
.gate-scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.gate-t{width:100%;margin-top:8px}
.gate-res{margin-top:8px;font-size:14px;line-height:2}
.muted{color:var(--ink2);font-size:13px}
.analysis{margin-top:14px;background:#fff;border-radius:var(--r);padding:14px 18px}
.ana-h{margin:0 0 6px;font-size:20px}
.ana-tapes,.ana-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.ana-tags .tag{cursor:pointer;min-height:34px}
.ana-hint{background:#EEF4FF;border-radius:var(--rs);padding:8px 12px;margin:8px 0;font-size:14px}
.ana-strip{border:1px solid var(--line);border-radius:var(--rs);position:relative}
.tape-strip{position:relative;width:100%;background:#fff}
.ana-ctl{margin-top:8px}
.ana-block{margin-top:14px}
.ana-block h3{font-size:15px;margin:0 0 6px}
.tbl-wrap{overflow-x:auto}
.formula{font-size:17px;margin:6px 0}
.warnline{color:var(--err);font-weight:600;margin-top:6px}
.learn-widget{margin-top:12px}
.timer-widget-stage{position:relative;height:142px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.mid-widget-stage{position:relative;height:172px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.zc-widget-stage{position:relative;height:96px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.gate-widget-stage{position:relative;height:262px;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:6px 0}
.learn-step svg.fig{background:#F8FBFF;border:1px solid var(--line);border-radius:var(--rs);padding:4px 6px}
.cmp-note{font-size:14px;margin:8px 0;background:#F6F9FD;border-radius:var(--rs);padding:8px 12px}
.cmp-table tr.hl td{background:#FFF4F5;color:var(--err);font-weight:700}
.cmp-table th.bad{color:var(--err)}
.diag{max-width:1180px;margin:0 auto;padding:16px}
.diag-h{font-size:19px;margin:14px 0 4px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.err-card{background:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent}
.err-card.done{border-color:#BCE6D2}
.err-name{font-weight:700}
.err-note{font-size:13px;color:var(--ink2);flex:1}
.err-card .btn{align-self:flex-start}
@media (max-width:900px),(orientation:portrait){
  .bench-row{grid-template-columns:1fr}
  .bench-stage{height:min(46vh,64vw);min-height:260px}
  .bench-side{max-height:none;overflow:visible}
  .steps{overflow:visible}
}
@media (max-height:640px) and (orientation:landscape) and (min-width:901px){
  .bench{padding:5px 10px 6px}
  .bench-top{margin-bottom:4px;gap:6px}
  .seg .chip{min-height:32px}
  .bench-row{grid-template-columns:1fr 318px;gap:8px}

<body>
<script type="application/json" id="ml-content">{"slug":"mech-lab-m01","title":"实验：探究小车速度随时间变化的规律","sub":"人教版 必修第一册 第二章 1 · 含光电门测速","chapter":"必修第一册 第二章 1","methods":["逐差法","平均速度代替瞬时速度（极限思想）","图像法","剪纸带化曲为直"],"learn":[{"id":"L1","title":"实验目的与思路","html":"<p><b>目的：<\/b>用打点计时器（或光电门）记录小车运动，探究小车速度随时间变化的规律。<\/p>","steps":["要知道“速度随时间怎样变”，就要测出<b>多个时刻的瞬时速度<\/b>。","打点计时器每隔相同时间在纸带上打一个点：点记录了<b>位置<\/b>，点的序号记录了<b>时刻<\/b>。","由纸带算出各计数点的瞬时速度 → 作 <i>v-t<\/i> 图像 → 看是不是一条倾斜直线。","本实验只研究“小车怎么运动”，<b>不需要补偿阻力，也不需要槽码质量远小于小车质量<\/b>——阻力恒定时小车照样做匀加速运动。（③诊·误差里可以亲手验证）"]},{"id":"L2","title":"两种打点计时器","widget":"timers","html":"<table class=\"dt\"><tr><th><\/th><th>电磁打点计时器<\/th><th>电火花计时器<\/th><\/tr><tr><th>电源<\/th><td>约 8 V <b>交流<\/b><\/td><td>220 V <b>交流<\/b><\/td><\/tr><tr><th>打点方式<\/th><td>振针振动，通过复写纸打点<\/td><td>放电针火花放电，烧出墨粉点<\/td><\/tr><tr><th>纸带安装<\/th><td>穿过限位孔，压在<b>复写纸下面<\/b><\/td><td>穿过限位孔，墨粉纸盘夹在<b>两条纸带之间<\/b><\/td><\/tr><tr><th>阻力<\/th><td>振针与纸带接触，阻力较大<\/td><td>阻力较小，误差较小<\/td><\/tr><tr><th>周期<\/th><td colspan=\"2\">电源频率 50 Hz 时，每隔 <b>0.02 s<\/b> 打一个点<\/td><\/tr><\/table>","steps":["为什么必须用<b>交流<\/b>电？——振针（或放电）要周期性地动作，靠的是交流电方向周期性变化；接直流电纸带上不打点。","打点周期由<b>电源频率<\/b>决定：T₀ = 1/f。如果实际频率不是 50 Hz 而仍按 0.02 s 算，计算结果会有系统误差。"]},{"id":"L3","title":"纸带上的点告诉我们什么","widget":"tape-demo","html":"<p>下面是实验台打出的一条真实纸带（可左右拖动，<b>按住<\/b>出现放大镜）。<\/p>","steps":["开头一段点非常密，甚至叠成一团：那是小车还没动、计时器已经在打点。处理时要<b>舍去开头过于密集的点<\/b>。","<b>计数点<\/b>：为便于测量，常“每 5 个点取 1 个计数点”（或说“相邻计数点间还有 4 个点未画出”），相邻计数点的时间间隔 T = 5 × 0.02 s = <b>0.1 s<\/b>。","测量时让刻度尺 0 刻度对准起点 O，<b>依次读出各计数点到 O 的距离<\/b>，再相减得各段长度——比逐段测量误差小。"]},{"id":"L4","title":"瞬时速度：中间时刻速度","widget":"midtime-demo","html":"<p>纸带上只能量到“一段位移”，怎样得到某一时刻的瞬时速度？先看清题目给的是<b>分段长度<\/b>还是<b>到起点的距离<\/b>。<\/p>","steps":["匀变速直线运动中，一段时间内的平均速度等于这段时间<b>中间时刻的瞬时速度<\/b>：{{bar|v}} = {{frac|v₀ + v|2}} = v<sub>t/2<\/sub>。","<b>情况①（给“相邻段长” x<sub>n<\/sub>）<\/b>：若 x<sub>n<\/sub> 表示<b>第 n 段的位移<\/b>（点 n−1 到点 n），x<sub>n+1<\/sub> 表示<b>第 n+1 段的位移<\/b>（点 n 到点 n+1），计数点 n 恰好是这两段总时间 2T 的中间时刻，所以 v<sub>n<\/sub> = {{frac|x<sub>n<\/sub> + x<sub>n+1<\/sub>|2T}}。","<b>情况②（给“距起点 O 的距离/坐标” d<sub>n<\/sub>）<\/b>：若给出各计数点<b>到起点 O 的距离<\/b> d₁、d₂、…、d<sub>n+1<\/sub>（有些题也记作坐标 x₁、x₂、…），则点 n−1 到点 n+1 的位移等于坐标之差 d<sub>n+1<\/sub> − d<sub>n−1<\/sub>，此时 v<sub>n<\/sub> = {{frac|d<sub>n+1<\/sub> − d<sub>n−1<\/sub>|2T}}（若坐标记为 x，即 {{frac|x<sub>n+1<\/sub> − x<sub>n−1<\/sub>|2T}}）。","即使不确定是不是匀变速，Δt 很短时平均速度也可近似代替瞬时速度（极限思想）——光电门测速用的也是这个思想。"]},{"id":"L5","title":"Δx = aT² 与逐差法","widget":"zhucha-demo","html":"<p>设纸带上连续相等时间 T 内的<b>各段位移<\/b>依次为 x₁、x₂、x₃、x₄、x₅、x₆（相邻计数点依次为 O、1、2、3、4、5、6）。<\/p>","steps":["<b>判据 Δx = aT²<\/b>：匀变速直线运动中，相邻相等时间内的位移差恒定：Δx = x<sub>n+1<\/sub> − x<sub>n<\/sub> = <b>aT²<\/b>。“看各 Δx 是否近似相等”即可判断是否匀变速。<svg class=\"fig\" viewBox=\"0 0 640 108\" width=\"640\" role=\"img\" aria-label=\"纸带相邻位移差示意图\"><rect x=\"16\" y=\"34\" width=\"600\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><g fill=\"#2B2B2B\"><circle cx=\"40\" cy=\"48\" r=\"3\"/><circle cx=\"82\" cy=\"48\" r=\"3\"/><circle cx=\"138\" cy=\"48\" r=\"3\"/><circle cx=\"210\" cy=\"48\" r=\"3\"/><circle cx=\"298\" cy=\"48\" r=\"3\"/><circle cx=\"404\" cy=\"48\" r=\"3\"/><circle cx=\"530\" cy=\"48\" r=\"3\"/><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#10233F\" font-weight=\"600\"><text x=\"40\" y=\"26\">O<\/text><text x=\"82\" y=\"26\">1<\/text><text x=\"138\" y=\"26\">2<\/text><text x=\"210\" y=\"26\">3<\/text><text x=\"298\" y=\"26\">4<\/text><text x=\"404\" y=\"26\">5<\/text><text x=\"530\" y=\"26\">6<\/text><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\"><text x=\"61\" y=\"78\">x₁<\/text><text x=\"110\" y=\"78\">x₂<\/text><text x=\"174\" y=\"78\">x₃<\/text><text x=\"254\" y=\"78\">x₄<\/text><text x=\"351\" y=\"78\">x₅<\/text><text x=\"467\" y=\"78\">x₆<\/text><\/g><text x=\"320\" y=\"100\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#10233F\">相邻两段差：x₂ − x₁ = x₃ − x₂ = x₄ − x₃ = … = aT²<\/text><\/svg>","<b>为什么不能把 5 个 Δx 直接平均？<\/b>{{frac|(x₂−x₁)+(x₃−x₂)+…+(x₆−x₅)|5T²}} = {{frac|x₆ − x₁|5T²}} ——中间数据一正一负全部抵消，<b>只用到了 x₁ 和 x₆ 两段<\/b>，偶然误差大。<svg class=\"fig\" viewBox=\"0 0 640 112\" width=\"640\" role=\"img\" aria-label=\"相邻差平均抵消示意图\"><rect x=\"16\" y=\"30\" width=\"600\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><rect x=\"40\" y=\"31\" width=\"42\" height=\"26\" fill=\"#DCE8FF\"/><rect x=\"82\" y=\"31\" width=\"322\" height=\"26\" fill=\"#EAEFF5\"/><rect x=\"404\" y=\"31\" width=\"126\" height=\"26\" fill=\"#DCF4EA\"/><g fill=\"#2B2B2B\"><circle cx=\"40\" cy=\"44\" r=\"3\"/><circle cx=\"82\" cy=\"44\" r=\"3\"/><circle cx=\"138\" cy=\"44\" r=\"3\"/><circle cx=\"210\" cy=\"44\" r=\"3\"/><circle cx=\"298\" cy=\"44\" r=\"3\"/><circle cx=\"404\" cy=\"44\" r=\"3\"/><circle cx=\"530\" cy=\"44\" r=\"3\"/><\/g><g font-size=\"12\" text-anchor=\"middle\"><text x=\"40\" y=\"22\" fill=\"#10233F\">O<\/text><text x=\"82\" y=\"22\" fill=\"#10233F\">1<\/text><text x=\"138\" y=\"22\" fill=\"#10233F\">2<\/text><text x=\"210\" y=\"22\" fill=\"#10233F\">3<\/text><text x=\"298\" y=\"22\" fill=\"#10233F\">4<\/text><text x=\"404\" y=\"22\" fill=\"#10233F\">5<\/text><text x=\"530\" y=\"22\" fill=\"#10233F\">6<\/text><text x=\"61\" y=\"74\" fill=\"#1661FF\" font-weight=\"700\">−x₁<\/text><text x=\"110\" y=\"74\" fill=\"#8E99A6\" text-decoration=\"line-through\">x₂<\/text><text x=\"174\" y=\"74\" fill=\"#8E99A6\" text-decoration=\"line-through\">x₃<\/text><text x=\"254\" y=\"74\" fill=\"#8E99A6\" text-decoration=\"line-through\">x₄<\/text><text x=\"351\" y=\"74\" fill=\"#8E99A6\" text-decoration=\"line-through\">x₅<\/text><text x=\"467\" y=\"74\" fill=\"#17784F\" font-weight=\"700\">+x₆<\/text><\/g><text x=\"320\" y=\"100\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#C7374B\" font-weight=\"600\">中间 x₂、x₃、x₄、x₅ 相互抵消，相当于只靠 x₁ 和 x₆ 算加速度！<\/text><\/svg>","<b>逐差法（隔 3 段相减，前后分组）<\/b>：a₁ = {{frac|x₄ − x₁|3T²}}，a₂ = {{frac|x₅ − x₂|3T²}}，a₃ = {{frac|x₆ − x₃|3T²}}，取平均得 a = {{frac|(x₄ + x₅ + x₆) − (x₁ + x₂ + x₃)|9T²}}，<b>6 段数据全部用上<\/b>。（4 段时：{{frac|(x₃ + x₄) − (x₁ + x₂)|4T²}}；若给距 O 点坐标 d₃、d₆，即为 {{frac|d₆ − 2d₃|9T²}}）<svg class=\"fig\" viewBox=\"0 0 640 132\" width=\"640\" role=\"img\" aria-label=\"逐差法分组示意图\"><path d=\"M61 48 V26 H254 V48\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.4\"/><text x=\"158\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1661FF\">x₄ − x₁ = 3aT²<\/text><path d=\"M110 48 V36 H351 V48\" fill=\"none\" stroke=\"#12A9C4\" stroke-width=\"1.4\"/><text x=\"230\" y=\"33\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0E8CA3\">x₅ − x₂ = 3aT²<\/text><path d=\"M174 48 V14 H467 V48\" fill=\"none\" stroke=\"#25A870\" stroke-width=\"1.4\"/><text x=\"330\" y=\"11\" font-size=\"11\" text-anchor=\"middle\" fill=\"#17784F\">x₆ − x₃ = 3aT²<\/text><rect x=\"16\" y=\"50\" width=\"600\" height=\"28\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><rect x=\"40\" y=\"51\" width=\"170\" height=\"26\" fill=\"#DCE8FF\"/><rect x=\"210\" y=\"51\" width=\"320\" height=\"26\" fill=\"#DCF4EA\"/><g fill=\"#2B2B2B\"><circle cx=\"40\" cy=\"64\" r=\"3\"/><circle cx=\"82\" cy=\"64\" r=\"3\"/><circle cx=\"138\" cy=\"64\" r=\"3\"/><circle cx=\"210\" cy=\"64\" r=\"3\"/><circle cx=\"298\" cy=\"64\" r=\"3\"/><circle cx=\"404\" cy=\"64\" r=\"3\"/><circle cx=\"530\" cy=\"64\" r=\"3\"/><\/g><g font-size=\"12\" text-anchor=\"middle\" font-weight=\"600\"><text x=\"61\" y=\"94\" fill=\"#1661FF\">x₁<\/text><text x=\"110\" y=\"94\" fill=\"#1661FF\">x₂<\/text><text x=\"174\" y=\"94\" fill=\"#1661FF\">x₃<\/text><text x=\"254\" y=\"94\" fill=\"#17784F\">x₄<\/text><text x=\"351\" y=\"94\" fill=\"#17784F\">x₅<\/text><text x=\"467\" y=\"94\" fill=\"#17784F\">x₆<\/text><\/g><path d=\"M40 102 V108 H208 V102\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.4\"/><text x=\"124\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\">前 3 段（共 3T）<\/text><path d=\"M212 102 V108 H530 V102\" fill=\"none\" stroke=\"#17784F\" stroke-width=\"1.4\"/><text x=\"371\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#17784F\" font-weight=\"600\">后 3 段（共 3T）<\/text><\/svg>","<b>注意区分打点周期 T 与计数间隔 5T<\/b>：若题目说“打点周期为 T，相邻计数点间还有 4 个点未画出”，则两计数点间共有 5 个打点间隔，计数间隔为 5T，逐差公式分母变成 9×(5T)² = <b>225T²<\/b>。<svg class=\"fig\" viewBox=\"0 0 640 96\" width=\"640\" role=\"img\" aria-label=\"计数点间隔5T示意图\"><rect x=\"20\" y=\"28\" width=\"600\" height=\"26\" fill=\"#F6F1E3\" stroke=\"#CDBF98\"/><g fill=\"#1661FF\"><circle cx=\"70\" cy=\"41\" r=\"4\"/><circle cx=\"340\" cy=\"41\" r=\"4\"/><circle cx=\"590\" cy=\"41\" r=\"4\"/><\/g><g fill=\"#7D8B9D\"><circle cx=\"118\" cy=\"41\" r=\"2.2\"/><circle cx=\"169\" cy=\"41\" r=\"2.2\"/><circle cx=\"223\" cy=\"41\" r=\"2.2\"/><circle cx=\"280\" cy=\"41\" r=\"2.2\"/><circle cx=\"386\" cy=\"41\" r=\"2.2\"/><circle cx=\"434\" cy=\"41\" r=\"2.2\"/><circle cx=\"484\" cy=\"41\" r=\"2.2\"/><circle cx=\"536\" cy=\"41\" r=\"2.2\"/><\/g><g font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"700\"><text x=\"70\" y=\"18\">计数点 1<\/text><text x=\"340\" y=\"18\">计数点 2<\/text><text x=\"590\" y=\"18\">计数点 3<\/text><\/g><text x=\"205\" y=\"20\" font-size=\"11\" text-anchor=\"middle\" fill=\"#4A5B73\">中间 4 个点未画出（5 个 T）<\/text><path d=\"M70 60 V66 H340 V60\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.4\"/><text x=\"205\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\">计数间隔 T₀ = 5T（0.1 s）<\/text><path d=\"M340 60 V66 H590 V60\" fill=\"none\" stroke=\"#1661FF\" stroke-width=\"1.4\"/><text x=\"465\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1661FF\" font-weight=\"600\">计数间隔 T₀ = 5T（0.1 s）<\/text><\/svg>"]},{"id":"L6","title":"v-t 图像与剪纸带","widget":"vt-demo","html":"<p>用 v<sub>n<\/sub> = {{frac|x<sub>n<\/sub> + x<sub>n+1<\/sub>|2T}} 算出各计数点速度，在坐标纸上描点。<\/p>","steps":["用一条直线拟合各点：让尽可能多的点落在线上，不在线上的点<b>均匀分布在两侧<\/b>，明显偏离的点舍去。","若是一条倾斜直线，说明 v 随 t 均匀增加——小车做匀加速直线运动；<b>斜率就是加速度<\/b> a = Δv/Δt（取线上相距较远的两点计算）。","纵轴截距是计数起点 O 时刻的速度，<b>一般不为零<\/b>——图线不过原点并不是错误。","<b>剪纸带<\/b>：把各计数段剪下按顺序并排贴好。每段宽度相当于时间 T，长度 x<sub>n<\/sub> = {{bar|v}}·T ∝ 该段平均速度，所以纸带上端连线就是 v-t 图像的形状。"]},{"id":"L7","title":"光电门测速","widget":"gate-demo","html":"<p>遮光片宽 d，挡光时间 Δt，数字计时器可精确到 0.01 ms。<\/p>","steps":["v = {{frac|d|Δt}} 是遮光片通过光电门的<b>平均速度<\/b>，d 越窄、Δt 越短，越接近瞬时速度。","两个光电门相距 x：由 v₂² − v₁² = 2ax 得 a = {{frac|v₂² − v₁²|2x}}。","若改用 a = {{frac|v₂ − v₁|t}}（t 为两光电门开始遮光的时间差）：v₁、v₂ 实际是两次遮光<b>中间时刻<\/b>的速度，它们之间的时间间隔比 t 略短，所以算出的 a <b>偏小<\/b>，遮光片越宽偏差越大。"]}],"equipment":[{"id":"em","name":"电磁打点计时器","html":"接约 8 V 交流电。线圈中交流电使振片带动振针上下振动，振针打在复写纸上，在纸带上留下点。纸带穿过限位孔、压在复写纸下面。"},{"id":"spark","name":"电火花计时器","html":"接 220 V 交流电。按下脉冲输出开关，放电针与纸盘轴之间产生火花放电，在纸带上烧出墨粉点。纸带与墨粉纸盘接触面小，阻力较小。"},{"id":"tape","name":"纸带","html":"一端固定在小车尾部，另一端穿过计时器限位孔。纸带随小车运动，点之间的距离记录了小车的位移。"},{"id":"cart","name":"小车","html":"在长木板上运动，由跨过定滑轮的细绳拉动。释放前应停在<b>靠近打点计时器<\/b>的位置。"},{"id":"board","name":"一端附有定滑轮的长木板","html":"打点计时器固定在<b>没有滑轮<\/b>的一端；细绳跨过滑轮，应与木板平行。"},{"id":"weights","name":"槽码","html":"通过细绳拉动小车。质量大小影响加速度大小，但本实验不要求槽码质量远小于小车质量。"},{"id":"ruler","name":"毫米刻度尺","html":"测量计数点间距，读数要估读到最小分度的下一位（0.1 mm），以 cm 为单位时记到小数点后两位。"},{"id":"gate","name":"光电门 + 数字计时器","html":"遮光片挡住光电门的光线时开始计时，离开时停止，显示挡光时间 Δt。两个光电门可同时测出两次遮光时间与两门之间的时间。"}],"procedure":[{"id":"P1","title":"选打点计时器","how":"选电磁打点计时器或电火花计时器，固定在长木板<b>没有滑轮<\/b>的一端。","why":"小车要朝滑轮一端运动，纸带从计时器拉出。"},{"id":"P2","title":"接电源","how":"电磁打点计时器接约 8 V <b>交流<\/b>；电火花计时器接 220 V <b>交流<\/b>。","why":"直流电不能使计时器周期性打点；电压不匹配不能正常工作，电磁计时器接 220 V 会损坏。","errorId":"E2"},{"id":"P3","title":"穿纸带","how":"纸带穿过限位孔：电磁计时器压在复写纸下面；电火花计时器让墨粉纸盘夹在两条纸带之间。纸带一端固定在小车后面。","why":"保证打出的点清晰，纸带运动时与计时器摩擦小。"},{"id":"P4","title":"挂槽码","how":"细绳一端系小车，跨过定滑轮，另一端挂上适量槽码；调节滑轮使细绳与木板平行。","why":"槽码太少小车拉不动或点太密；太多则小车太快、点太少。"},{"id":"P5","title":"小车靠近打点计时器","how":"把小车停在<b>靠近打点计时器<\/b>的位置。","why":"充分利用纸带，打出更多的点。","errorId":"E6"},{"id":"P6","title":"先接通电源，后释放小车","how":"先接通电源，待打点稳定后再释放小车。","why":"否则小车已经运动一段距离计时器才开始打点，纸带开头空白，第一个点不是起点，可用的点变少。","errorId":"E1"},{"id":"P7","title":"到滑轮前按住小车","how":"小车到达定滑轮前及时按住。","why":"防止小车撞击滑轮、槽码落地，损坏器材。","errorId":"E7"},{"id":"P8","title":"关闭电源，取下纸带","how":"关闭电源，取下纸带；换上新纸带重复实验 3 次，选一条点迹清晰的纸带处理。","why":"多次实验，选最好的一条，减小偶然误差。"},{"id":"P9","title":"选计数点","how":"舍去开头过于密集的点，从清晰的点开始，每 5 个点取 1 个计数点，T = 0.1 s。","why":"密集点间距太小，测量相对误差大；取计数点便于测量和计算。","errorId":"E4"},{"id":"P10","title":"测量","how":"刻度尺 0 刻度对准起点 O，依次读出各计数点到 O 的距离，估读到 0.1 mm。","why":"一次放尺、各次读数误差相互独立；逐段测量每段都要重新对零，误差会累积。","errorId":"E5"},{"id":"P11","title":"处理数据","how":"求各计数点速度，作 v-t 图像；用逐差法或图像斜率求 a。计数间隔 T 取 0.1 s。","why":"逐差法用上全部数据；图像法能剔除偏差大的点。","errorId":"E3"}],"errors":[{"id":"E1","name":"先释放小车，后接通电源","noteId":"P6","trigger":"先点“释放小车”，0.3 s 后才“接通电源”","config":{"order":"release-first"},"observe":"把两条纸带的起点对齐，看开头一段有什么不同。","consequence":"错误纸带开头<b>没有<\/b>密集的点，第一段间距就很大；整条纸带上的点也明显变少。","ask":{"stem":"错误纸带开头为什么没有密集的点？","options":["小车质量太大","计时器开始打点时小车已经在运动了","电源电压太低","纸带没有穿过限位孔"],"answer":1,"quizId":"M01:try:E1"},"why":"先释放后通电，计时器开始工作前小车已经运动了一段距离，这段运动没有被记录；第一个点不是运动起点，也浪费了纸带。","questionIds":[]},{"id":"E2","name":"电源接错","noteId":"P2","trigger":"电磁打点计时器接 8 V <b>直流<\/b>","config":{"power":"dc8"},"observe":"接通电源、释放小车后，看纸带上有没有点。","consequence":"接直流电：纸带上<b>一个点也没有<\/b>。（电火花计时器接 8 V 同样不打点；电磁计时器接 220 V 会烧坏线圈，实验台会拒绝运行。）","ask":{"stem":"为什么接直流电不打点？","options":["直流电电压太低","振针要靠电流方向周期性变化才能上下振动","直流电会使小车不动","纸带被烧断了"],"answer":1,"quizId":"M01:try:E2"},"why":"打点计时器靠交流电方向的周期性变化让振针（或放电）周期性动作；直流电只能把振片吸向一边，不会周期性打点。","questionIds":[]},{"id":"E3","name":"计数周期取成 0.02 s","noteId":"P11","trigger":"每 5 个点取 1 个计数点，但计算时 T 取 0.02 s","config":{"Tcalc":0.02},"observe":"用同一组测量数据、两种 T 分别计算加速度，比较结果。","consequence":"T 取 0.02 s 算出的 a 是正确值的 <b>25 倍<\/b>（约 20 m/s²，比自由落体还大，明显不合理）。","ask":{"stem":"为什么偏大恰好是 25 倍？","options":["0.1 / 0.02 = 5，a ∝ 1/T²，所以 5² = 25","因为取了 5 个点","因为逐差法要除以 9","测量误差累积了 25 次"],"answer":0,"quizId":"M01:try:E3"},"why":"相邻计数点间有 5 个打点间隔，T = 5 × 0.02 s = 0.1 s。由 a = Δx/T² 可知，T 取小为 1/5，a 变为 25 倍。看到“还有 4 个点未画出”或“每 5 个点取 1 个计数点”就要想到 T = 0.1 s。","questionIds":[]},{"id":"E4","name":"从开头密集点开始取计数点","noteId":"P9","trigger":"起点 O 选在纸带开头叠在一起的点上","config":{"startAtBlob":true},"observe":"两种起点各重复测量 20 次，看算出的 a 散布有多大。","consequence":"从密集点起取，x₁ 只有零点几厘米，读数误差占比大；且这一团点里分不清哪个才是真正运动开始的点，计数周期对不齐——多次测量的 a 更分散。","ask":{"stem":"为什么要舍去开头过于密集的点？","options":["这些点不是打点计时器打的","点间距太小、相互重叠，测量的相对误差大，也难确定起始时刻","这些点会使小车加速度变大","人教版规定必须舍去 5 个点"],"answer":1,"quizId":"M01:try:E4"},"why":"开头小车静止或速度很小，点重叠或间距极小，既难分辨，也使长度测量的相对误差变大；从点迹清晰处开始取计数点更可靠。","questionIds":[]},{"id":"E5","name":"逐段测量计数点间距","noteId":"P10","trigger":"每一段都重新对零测量","config":{"method":"segment"},"observe":"两种测量方法各重复 20 次，比较各计数点位置误差和 a 的散布。","consequence":"逐段测量时，每段都多了一次“对零”误差，位置误差随段数<b>累积增大<\/b>；算出的 a 也更分散。","ask":{"stem":"从同一起点读数为什么更好？","options":["刻度尺只放一次，各读数的误差相互独立、不累积","可以少读几个数","能消除阻力的影响","可以不估读"],"answer":0,"quizId":"M01:try:E5"},"why":"刻度尺 0 刻度对准 O 后一次放好，依次读各点位置；每个读数只含一次估读误差。逐段测量每段都有对零误差和两次读数误差，累加后越到后面误差越大。","questionIds":[]},{"id":"E6","name":"小车没有靠近打点计时器","noteId":"P5","trigger":"小车放在木板中部释放","config":{"near":false},"observe":"比较两条纸带上有效点的个数。","consequence":"小车只运动了一半距离就到滑轮前，纸带上的有效点<b>少了很多<\/b>，可能不够取 6 段。","ask":{"stem":"小车为什么要靠近打点计时器释放？","options":["可以减小阻力","能充分利用纸带，打出更多点","这样加速度更大","防止纸带被拉断"],"answer":1,"quizId":"M01:try:E6"},"why":"小车离计时器越近，可运动的距离越长，打在纸带上的点越多，便于选取足够多的计数点。","questionIds":[]},{"id":"E7","name":"没有在滑轮前按住小车","noteId":"P7","trigger":"小车运动到末端时不按住","config":{"caught":false},"observe":"看小车到达末端时发生了什么，以及纸带末端的点。","consequence":"小车撞上滑轮突然停下，槽码落地；纸带末端的点突然由疏变成堆在一起。","ask":{"stem":"这样做主要的问题是？","options":["会损坏器材（小车撞滑轮、槽码落地）","加速度会变小","前面的点也会全部作废","计时器会停止打点"],"answer":0,"quizId":"M01:try:E7"},"why":"到滑轮前按住小车是为了保护器材；末端那几段已不是匀加速运动，处理时不要用。","questionIds":[]},{"id":"E9","name":"实际频率 51 Hz，仍按 50 Hz 计算","trigger":"电源实际频率为 51 Hz","config":{"freq":51},"observe":"把两条纸带起点对齐，比较点的疏密，再按 T = 0.1 s 计算 a。","consequence":"51 Hz 时打点周期比 0.02 s 略短，相同时间里点更密、每段更短；仍按 0.1 s 计算，a 的测量值<b>偏小<\/b>。","ask":{"stem":"电源频率实际为 51 Hz，按 50 Hz 计算，a 的测量值？","options":["偏大","偏小","不变","无法判断"],"answer":1,"quizId":"M01:try:E9"},"why":"实际计数间隔 T′ = 5/51 s < 0.1 s，纸带上 Δx = aT′²。计算时用 a测 = Δx/T² = a·(T′/T)² < a，所以偏小。频率偏小（如 49 Hz）则偏大。","questionIds":[]},{"id":"E8","name":"遮光片过宽，且用 a = (v₂ − v₁)/t","trigger":"遮光片宽 30 mm","config":{"flag":0.03},"observe":"比较窄遮光片（2 mm）和宽遮光片（30 mm）两种情况下，两种公式算出的 a。","consequence":"宽遮光片时 a = (v₂² − v₁²)/2x 仍很准，但 a = (v₂ − v₁)/t 明显<b>偏小<\/b>（约 2%）。","ask":{"stem":"用 (v₂ − v₁)/t 算出的 a 为什么偏小？","options":["d/Δt 是遮光过程中间时刻的速度，两个中间时刻的间隔小于 t","遮光片太宽挡住了光","宽遮光片质量大，加速度小","数字计时器精度不够"],"answer":0,"quizId":"M01:try:E8"},"why":"v = d/Δt 是遮光过程的平均速度，等于中间时刻的速度。第一次遮光时间长、第二次短，两次中间时刻的间隔 t′ = t − (Δt₁ − Δt₂)/2 < t；用 t 代替 t′ 使 a 偏小。遮光片越窄，Δt 越短，偏差越小。","questionIds":[]},{"id":"M1","name":"误区：本实验需要补偿阻力吗？","trigger":"比较“不补偿阻力”与“垫高木板恰好补偿阻力”","config":{"compare":"friction"},"observe":"两条纸带的相邻计数段之差 Δx 是否都是常量？v-t 图是否都是直线？","consequence":"两种情况 Δx 都恒定，v-t 图都是直线——小车都做匀加速直线运动，只是加速度大小不同。","ask":{"stem":"“探究小车速度随时间变化的规律”是否需要补偿阻力？","options":["需要，否则小车不做匀变速运动","不需要，阻力恒定时小车仍做匀加速运动","需要，否则打点计时器不工作","不需要，因为本实验没有阻力"],"answer":1,"quizId":"M01:try:M1"},"why":"本实验只研究速度随时间的变化规律，阻力恒定时合力恒定，小车仍做匀加速直线运动；同理也不需要槽码质量远小于小车质量。这两条是“探究加速度与力、质量的关系”实验的要求，不要混淆。","questionIds":[]}],"reverse":[{"id":"R1","show":{"type":"tape","config":{"order":"release-first"}},"stem":"某同学交上来的纸带如下：开头没有密集的点，第一段间距就比较大，点数也偏少。最可能的原因是？","options":["先释放小车，后接通电源","电源电压偏高","槽码太轻","计数点取错"],"answer":[0],"replay":"E1","why":"正确操作（先通电后释放）时，小车静止期间打的点会叠在起点附近。没有这团点，说明打点开始时小车已经在运动。","quizId":"M01:reverse:R1"},{"id":"R2","show":{"type":"calc","config":{"Tcalc":0.02}},"stem":"某同学按“每 5 个点取 1 个计数点”处理纸带，算出 a ≈ 21 m/s²，而同组其他人约 0.85 m/s²。最可能的原因是？","options":["读数时没有估读","计算时计数间隔 T 取成了 0.02 s","小车没有靠近打点计时器","没有补偿阻力"],"answer":[1],"replay":"E3","why":"21 ÷ 0.85 ≈ 25 = 5²，正是把 T = 0.1 s 错取成 0.02 s 的结果。","quizId":"M01:reverse:R2"},{"id":"R3","show":{"type":"calc","config":{"freq":51}},"stem":"实验时电源实际频率为 51 Hz，而做实验的同学并不知道，仍按 50 Hz 计算。加速度的测量值与真实值相比？","options":["偏大","偏小","相等","无法确定"],"answer":[1],"replay":"E9","why":"实际打点周期更短，纸带上 Δx = aT′² 更小，用较大的 T 去除，a 测量值偏小。","quizId":"M01:reverse:R3"},{"id":"R4","show":{"type":"vt"},"stem":"某同学作出的 v-t 图像是一条倾斜直线，但不过原点（纵轴截距为正）。这说明？","options":["实验操作有错误，需要重做","计数起点 O 时刻小车的速度不为零，属正常现象","没有补偿阻力","先释放了小车"],"answer":[1],"replay":null,"why":"计数起点 O 一般选在点迹清晰处，那时小车已经运动了一段，速度不为零。v-t 图的纵截距就是 O 时刻的速度；斜率才是加速度。","quizId":"M01:reverse:R4"}],"summary":{"principle":"打点计时器每隔 0.02 s 打一点；v<sub>n<\/sub> = {{frac|x<sub>n<\/sub>+x<sub>n+1<\/sub>|2T}}；Δx = aT² 判匀变速；逐差法 a = {{frac|(x₄+x₅+x₆)−(x₁+x₂+x₃)|9T²}}；v-t 图斜率 = a。光电门 v = {{frac|d|Δt}}，a = {{frac|v₂²−v₁²|2x}}。","steps":["计时器固定在无滑轮一端，接交流电源","纸带穿限位孔（电磁：压复写纸下）","细绳跨滑轮挂槽码，与木板平行","小车靠近计时器","先接通电源，后释放小车","到滑轮前按住小车，关电源取纸带，重复 3 次","舍密集点、每 5 点取计数点（T = 0.1 s）、同一起点量距离","求 v<sub>n<\/sub>、作 v-t 图、逐差求 a"],"notes":[{"do":"电磁计时器接约 8 V 交流，电火花接 220 V 交流","why":"直流不打点；电压不匹配不能工作或损坏"},{"do":"小车靠近打点计时器释放","why":"充分利用纸带，点更多"},{"do":"先接通电源，后释放小车","why":"否则开头没记录，点变少，起点不确定"},{"do":"到滑轮前按住小车","why":"防止撞击损坏器材"},{"do":"舍去开头密集点","why":"间距小，测量相对误差大"},{"do":"从同一起点读数","why":"读数误差不累积"},{"do":"不需要补偿阻力，不需要 m ≪ M","why":"阻力恒定时仍做匀加速运动"}],"errors":["偶然误差：长度读数、描点作图","系统误差：电源频率偏离 50 Hz（频率偏大→a 偏小）","光电门：d/Δt 是平均速度；用 (v₂−v₁)/t 求 a 偏小"],"conclusions":["“还有 4 个点未画出”→ T = 0.1 s","周期为 T、计数间隔 5T 时，逐差式分母为 225T²","v-t 图不过原点是正常的：截距 = 起点速度","遮光片越窄，d/Δt 越接近瞬时速度"]}}</script>
<script type="application/json" id="ml-questions">[{"id":"G1","source":"2025·北京卷·第16题","verified":true,"score":10,"stem":"利用打点计时器研究匀变速直线运动的规律，实验装置如图1所示（小车在细线牵引下沿木板运动，装置图略）。","parts":[{"label":"(1)","type":"choice","prompt":"按照图1安装好器材，下列实验步骤正确的操作顺序为____。A. 释放小车　B. 接通打点计时器的电源　C. 调整滑轮位置，使细线与木板平行","options":["CBA","BCA","CAB","ACB"],"answer":0,"replay":"E1","explain":"先调整滑轮使细线与木板平行（C），再接通电源（B），最后释放小车（A）。","quizId":"M01:paper:G1:(1)"},{"label":"(2)","type":"text-choice","prompt":"实验中打出的一条纸带如图2所示，A、B、C 为依次选取的三个计数点（相邻计数点间有 4 个点未画出），可以判断纸带的____与小车相连。<svg viewBox=\"0 0 640 96\" width=\"640\" role=\"img\" aria-label=\"纸带示意\"><rect x=\"10\" y=\"22\" width=\"620\" height=\"24\" fill=\"#F6F1E3\" stroke=\"#bbb\"/><circle cx=\"120\" cy=\"34\" r=\"2.8\" fill=\"#222\"/><text x=\"120\" y=\"16\" font-size=\"13\" text-anchor=\"middle\">A<\/text><circle cx=\"260\" cy=\"34\" r=\"2.8\" fill=\"#222\"/><text x=\"260\" y=\"16\" font-size=\"13\" text-anchor=\"middle\">B<\/text><circle cx=\"500\" cy=\"34\" r=\"2.8\" fill=\"#222\"/><text x=\"500\" y=\"16\" font-size=\"13\" text-anchor=\"middle\">C<\/text><path d=\"M120 53 V59 M260 53 V59 M120 56 H260\" stroke=\"#333\" fill=\"none\"/><text x=\"190.0\" y=\"69\" font-size=\"12\" text-anchor=\"middle\">x₁<\/text><path d=\"M120 73 V79 M500 73 V79 M120 76 H500\" stroke=\"#333\" fill=\"none\"/><text x=\"310.0\" y=\"90\" font-size=\"12\" text-anchor=\"middle\">x₂<\/text><\/svg><div style=\"text-align:center;font-size:13px\">图2（x₁ 为 AB 间距，x₂ 为 AC 间距）<\/div>","options":["左端","右端"],"answer":0,"explain":"小车加速，先打出的点间距小。AB 比 BC 短，说明 A 端先打点；纸带随小车运动，先打点的一端靠近小车，所以左端与小车相连。","quizId":"M01:paper:G1:(2)"},{"label":"(3)","type":"expr","prompt":"图2中相邻计数点间的时间间隔为 T，则打 B 点时小车的速度","lhs":"v =","vars":{"x1":"x₁","x2":"x₂","T":"T"},"extra":["1","2"],"answer":"x2/(2*T)","show":"x₂ ÷ (2T)","explain":"B 是 AC 段的中间时刻，AC 段位移为 x₂、用时 2T，v<sub>B<\/sub> = {{frac|x₂|2T}}。","quizId":"M01:paper:G1:(3)"},{"label":"(4)","type":"numeric","prompt":"某同学用打点计时器研究圆周运动：纸带一端固定在圆盘边缘 M 点，另一端穿过打点计时器，圆盘从静止开始转动。选取的部分纸带如下（以 A 为起点，B、C、D、E 的位置依次为 3.59 cm、8.00 cm、13.22 cm、19.24 cm），相邻计数点间的时间间隔为 0.10 s，圆盘半径 R = 0.10 m。这部分纸带通过打点计时器的加速度大小为（保留两位有效数字）","unit":"m/s²","answer":0.81,"tol":0.005,"sig":2,"explain":"逐差法：a = {{frac|x<sub>CE<\/sub> − x<sub>AC<\/sub>|(2T)²}} = {{frac|(19.24 − 2 × 8.00) × 10⁻² m|4 × (0.10 s)²}} ≈ 0.81 m/s²。","quizId":"M01:paper:G1:(4)"},{"label":"(5)","type":"numeric","prompt":"（接上问）打点计时器打 B 点时，圆盘上 M 点的向心加速度大小为（保留两位有效数字）","unit":"m/s²","answer":1.6,"tol":0.05,"sig":2,"explain":"v<sub>B<\/sub> = {{frac|x<sub>AC<\/sub>|2T}} = {{frac|0.0800 m|0.20 s}} = 0.40 m/s，a<sub>n<\/sub> = {{frac|v<sub>B<\/sub>²|R}} = 1.6 m/s²。纸带测得的是切向加速度，向心加速度要用 v²/R。（原题 (4) 两空，这里拆为 (4)(5)）","quizId":"M01:paper:G1:(5)"}]},{"id":"G2","source":"2026·陕晋青宁卷·第11题","verified":true,"stem":"某同学使用打点计时器进行“测量速度和加速度”的实验。","parts":[{"label":"(1)","type":"choice","prompt":"下述操作正确的是____。","options":["先拉动纸带，再开始打点","先开始打点，再拉动纸带"],"answer":1,"replay":"E1","explain":"先开始打点，待打点稳定后再拉动纸带，既能充分利用纸带，开头的点也稳定。","quizId":"M01:paper:G2:(1)"},{"label":"(2)","type":"numeric","prompt":"该同学用电源频率为 50 Hz 的打点计时器从左至右打出一条纸带，纸带放在毫米刻度尺上，P 点左右相邻两点的刻度分别为 2.40 cm 和 3.62 cm。可用某点左右相邻点间的平均速度代表该点的瞬时速度，则 P 点的瞬时速度为（保留三位有效数字）","unit":"m/s","answer":0.305,"tol":0.0005,"sig":3,"explain":"相邻两点间隔 0.02 s，v<sub>P<\/sub> = {{frac|(3.62 − 2.40) × 10⁻² m|2 × 0.02 s}} = 0.305 m/s。注意这里是连续的打点，不是每 5 个点取一个计数点。","quizId":"M01:paper:G2:(2)"},{"label":"(3)","type":"numeric","prompt":"测得 Q 点的瞬时速度 v<sub>Q<\/sub> = 0.560 m/s，P、Q 两点间有 10 个打点间隔，则 P、Q 两点间的平均加速度为（保留三位有效数字）","unit":"m/s²","answer":1.28,"tol":0.005,"sig":3,"explain":"a = {{frac|v<sub>Q<\/sub> − v<sub>P<\/sub>|Δt}} = {{frac|0.560 − 0.305|10 × 0.02}} m/s² ≈ 1.28 m/s²。","quizId":"M01:paper:G2:(3)"}]},{"id":"G3","source":"2024·天津卷·第9(2)题①②","verified":true,"stem":"某同学用图示装置探究加速度与力的关系（小车、长木板、打点计时器、槽码，装置图略）。","parts":[{"label":"①","type":"choice","prompt":"为补偿打点计时器对小车的阻力及其他阻力，调节木板倾角，使小车在不挂槽码时运动，并打出纸带进行检验。下列纸带中能表明补偿阻力恰当的是____。","options":["点距从密到疏","点距均匀","点距从疏到密","点距先密后疏再密"],"answer":1,"explain":"补偿阻力恰当时小车做匀速直线运动，相等时间内位移相等，点距均匀。","quizId":"M01:paper:G3:①"},{"label":"②","type":"numeric","prompt":"某次实验得到一条纸带，部分计数点如下（每相邻两个计数点间还有 4 个点未画出），测得 s₁ = 6.20 cm，s₂ = 6.70 cm，s₃ = 7.21 cm，s₄ = 7.73 cm，电源频率为 50 Hz。小车的加速度 a =（要求充分利用测量数据，保留两位有效数字）","unit":"m/s²","answer":0.51,"tol":0.005,"sig":2,"replay":"E3","explain":"T = 0.1 s，四段逐差：a = {{frac|(s₃ + s₄) − (s₁ + s₂)|4T²}} = {{frac|(7.73 + 7.21 − 6.70 − 6.20) × 10⁻² m|4 × (0.1 s)²}} = 0.51 m/s²。","quizId":"M01:paper:G3:②"}]},{"id":"G4","source":"2024·广东卷·第11(1)题","verified":true,"stem":"“探究加速度与物体受力、物体质量的关系”实验中得到纸带的一部分，每相邻两计数点间有四个点未画出，打点计时器电源频率为 50 Hz。按打点先后，相邻计数点间距依次为（单位 cm）：<table class=\"dt\"><tr><td>2.01<\/td><td>4.88<\/td><td>7.72<\/td><td>10.59<\/td><td>13.43<\/td><td>16.29<\/td><\/tr><\/table><span style=\"font-size:14px\">（原图中纸带从左到右标的是 16.29、13.43、10.59、7.72、4.88、2.01，即右端先打点。）<\/span>","parts":[{"label":"","type":"numeric","prompt":"小车的加速度大小为（保留 3 位有效数字）","unit":"m/s²","answer":2.86,"tol":0.005,"sig":3,"explain":"T = 0.1 s，六段逐差：a = {{frac|(16.29 + 13.43 + 10.59) − (7.72 + 4.88 + 2.01)|9 × (0.1)²}} × 10⁻² m/s² ≈ 2.86 m/s²。（原题本小问还有一空问“木板右端垫高的目的”，属 M03，此处未收）","quizId":"M01:paper:G4:main"}]},{"id":"G5","source":"2024·浙江1月选考·第16-Ⅰ题(4)","verified":true,"stem":"经正确操作后获得一条纸带，建立以计数点 0 为坐标原点的 x 轴，各计数点的位置坐标分别为 0、x₁、…、x₆（相邻计数点间还有 4 个点未画出）。已知打点计时器的打点周期为 T。","parts":[{"label":"(1)","type":"expr","prompt":"打计数点 5 时小车速度的表达式","lhs":"v =","vars":{"x4":"x₄","x5":"x₅","x6":"x₆","T":"T"},"extra":["1","2","5","0"],"answer":"(x6-x4)/(10*T)","show":"(x₆ − x₄) ÷ (10T)","replay":"E3","explain":"注意 x₁…x₆ 是<b>坐标<\/b>不是段长。相邻计数点间隔 t = 5T，计数点 5 是 4、6 两点的中间时刻：v₅ = {{frac|x₆ − x₄|2 × 5T}} = {{frac|x₆ − x₄|10T}}。","quizId":"M01:paper:G5:(1)"},{"label":"(2)","type":"choice","prompt":"小车加速度的表达式是____。","options":["a = {{frac|x₆ − 2x₃|(15T)²}}","a = {{frac|x₆ − 2x₃|(3T)²}}","a = {{frac|x₅ + x₄ − (x₃ + x₂)|(10T)²}}"],"answer":0,"explain":"前三段总长 x₃，后三段总长 x₆ − x₃。逐差：a = {{frac|(x₆ − x₃) − x₃|(3t)²}} = {{frac|x₆ − 2x₃|(15T)²}}。","quizId":"M01:paper:G5:(2)"}]},{"id":"G6","source":"2024·甘肃卷·第11题(2)","verified":true,"stem":"保持槽码质量不变，改变小车上砝码的质量，得到一系列打点纸带。其中一条纸带的相邻计数点间距离分别为 S₁、S₂、…、S₈，时间间隔均为 T。","parts":[{"label":"","type":"choice","prompt":"下列加速度算式中，最优的是____。","options":["a = {{frac|1|7}}[{{frac|S₈ − S₇|T²}} + {{frac|S₇ − S₆|T²}} + … + {{frac|S₂ − S₁|T²}}]","a = {{frac|1|6}}[{{frac|S₈ − S₆|2T²}} + {{frac|S₇ − S₅|2T²}} + … + {{frac|S₃ − S₁|2T²}}]","a = {{frac|1|5}}[{{frac|S₈ − S₅|3T²}} + {{frac|S₇ − S₄|3T²}} + … + {{frac|S₄ − S₁|3T²}}]","a = {{frac|1|4}}[{{frac|S₈ − S₄|4T²}} + {{frac|S₇ − S₃|4T²}} + {{frac|S₆ − S₂|4T²}} + {{frac|S₅ − S₁|4T²}}]"],"answer":3,"explain":"把 A、B、C 展开求和，中间项相互抵消：A 只剩 S₈ − S₁，B、C 也只用到首尾几段。D 是逐差法，8 个数据每个恰好用一次，偶然误差最小。（学·原理第 5 页可看纸带消去与分组图解）","quizId":"M01:paper:G6:main"}]},{"id":"G7","source":"2025·浙江1月选考·第14题(1)(2)(3)","verified":true,"stem":"“探究加速度与力、质量的关系”的实验装置中使用电火花打点计时器。","parts":[{"label":"(1)","type":"numeric","prompt":"某次实验中得到的纸带放在刻度尺上，每 5 个连续打出的点为一个计数点，电源频率为 50 Hz，计数点 2 对应刻度 8.90 cm，计数点 4 对应刻度 16.70 cm。打下计数点 3 时小车速度为（保留三位有效数字）","unit":"m/s","answer":0.39,"tol":0.0005,"sig":3,"show":"0.390","explain":"T = 0.1 s，v₃ = {{frac|(16.70 − 8.90) × 10⁻² m|0.2 s}} = 0.390 m/s。","quizId":"M01:paper:G7:(1)"},{"label":"(2)","type":"multi","prompt":"下列说法正确的是____（多选）","options":["改变小车总质量，需要重新补偿阻力","将打点计时器接到输出电压为 8 V 的交流电源上","调节滑轮高度，使牵引小车的细线跟长木板保持平行","小车应尽量靠近打点计时器，并应先接通电源，后释放小车"],"answer":[2,3],"replay":"E2","explain":"A 错：补偿阻力时 Mg sinθ = μMg cosθ，质量约掉，不必重新补偿。B 错：本题用的是<b>电火花<\/b>计时器，应接 220 V 交流。C、D 正确。","quizId":"M01:paper:G7:(2)"},{"label":"(3)","type":"expr","prompt":"改用气垫导轨：滑块先后通过两个光电门，遮光时间分别为 Δt₁、Δt₂，两光电门间距为 x，遮光条宽度为 d。滑块加速度","lhs":"a =","vars":{"d":"d","x":"x","t1":"Δt₁","t2":"Δt₂"},"extra":["1","2"],"answer":"d^2/(2*x)*(1/t2^2-1/t1^2)","show":"d²(1/Δt₂² − 1/Δt₁²) ÷ (2x)","replay":"E8","explain":"v₁ = d/Δt₁，v₂ = d/Δt₂，由 v₂² − v₁² = 2ax 得 a = {{frac|d²|2x}}({{frac|1|Δt₂²}} − {{frac|1|Δt₁²}})。（原题本空前还有游标卡尺读数 d = 10.00 mm，需看原图，此处未收）","quizId":"M01:paper:G7:(3)"}]},{"id":"G8","source":"2025·河南卷·第12题(1)(2)","verified":true,"stem":"实验小组利用打点计时器验证机械能守恒定律。可选用的器材有：交流电源（频率 50 Hz）、铁架台、电子天平、重锤、打点计时器、纸带、刻度尺等。","parts":[{"label":"(1)","type":"choice","prompt":"下列步骤中有 4 个是完成实验必需且正确的，按实验顺序排列为____。<br>①先接通电源，打点计时器开始打点，然后再释放纸带　②先释放纸带，然后再接通电源　③用电子天平称量重锤的质量　④将纸带下端固定在重锤上，穿过打点计时器的限位孔，用手捏住纸带上端　⑤在纸带上选取一段，用刻度尺测量该段内各点到起点的距离，记录分析数据　⑥关闭电源，取下纸带","options":["④①⑥⑤","④②⑥⑤","③④①⑤","④①⑤⑥"],"answer":0,"replay":"E1","explain":"先装纸带（④），先通电后释放（①），关电源取纸带（⑥），再测量处理（⑤）。质量在验证式中约掉，不必称量。","quizId":"M01:paper:G8:(1)"},{"label":"(2)","type":"numeric","prompt":"纸带上连续打出的五个点 A、B、C、D、E 到起点的距离依次为 13.20 cm、16.60 cm、20.34 cm、24.50 cm、29.00 cm，则打出 B 点时重锤下落的速度大小为（保留 3 位有效数字）","unit":"m/s","answer":1.79,"tol":0.005,"sig":3,"explain":"连续打点，T = 0.02 s：v<sub>B<\/sub> = {{frac|(20.34 − 13.20) × 10⁻² m|2 × 0.02 s}} ≈ 1.79 m/s。和“每 5 点取 1 个计数点（T = 0.1 s）”对比着记。","quizId":"M01:paper:G8:(2)"}]},{"id":"G9","source":"2024·浙江6月选考·第16-Ⅰ题(2)","verified":true,"stem":"在“验证机械能守恒定律”的实验中，获得一条纸带，截取点迹清晰的一段并测得数据：以点 0 为起点，点 12 的位置为 47.33 cm，点 13 为 53.83 cm，点 14 为 60.69 cm。已知打点的频率为 50 Hz。","parts":[{"label":"","type":"numeric","prompt":"打点“13”时，重锤下落的速度大小为（保留 3 位有效数字）","unit":"m/s","answer":3.34,"tol":0.005,"sig":3,"explain":"v₁₃ = {{frac|(60.69 − 47.33) × 10⁻² m|2 × 0.02 s}} = 3.34 m/s。M01 的“中间时刻速度”同样适用于竖直下落的重锤。（原题 (1) 的答案各来源有分歧，暂未收）","quizId":"M01:paper:G9:main"}]},{"id":"Y1","source":"原创","verified":true,"score":4,"stem":"在“探究小车速度随时间变化的规律”实验中：","parts":[{"label":"","type":"multi","prompt":"下列说法正确的是（　　）","options":["打点计时器应固定在长木板有滑轮的一端","应先释放小车，再接通电源","实验前必须把木板一端垫高以补偿阻力","释放前小车应停在靠近打点计时器的位置","电磁打点计时器应接约 8 V 的交流电源"],"answer":[3,4],"replay":"E1","explain":"计时器固定在<b>没有滑轮<\/b>的一端（A 错）；应先接通电源后释放小车（B 错）；本实验只研究速度随时间变化，阻力恒定时小车仍做匀加速运动，<b>不需要<\/b>补偿阻力（C 错）；D、E 正确。","quizId":"M01:paper:Y1:main"}]},{"id":"Y2","source":"原创","verified":true,"score":10,"stem":"某同学用电磁打点计时器（电源频率 50 Hz）打出一条纸带，从点迹清晰处开始取计数点 O、1、2、…、6，相邻两计数点之间还有 4 个点未画出，测得各段长度如下：<table class=\"dt\"><tr><th>x₁<\/th><th>x₂<\/th><th>x₃<\/th><th>x₄<\/th><th>x₅<\/th><th>x₆<\/th><\/tr><tr><td>1.40 cm<\/t         // 下半区：时间轴误差对照
        D.text(ctx, '时间轴对比：为什么用 a = (v₂ − v₁) / t 会偏小？', 18, 154, { size: 12, weight: 700, color: '#10233F' });
        var axY = 204, t1a = 44, t1w = 68, t2a = Math.max(190, w * 0.44), t2w = 34;
        var tm1 = t1a + t1w / 2, tm2 = t2a + t2w / 2;
        ctx.strokeStyle = '#10233F'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(22, axY); ctx.lineTo(w - 20, axY); ctx.stroke();
        D.text(ctx, 't', w - 14, axY + 4, { size: 12, weight: 700 });
        ctx.fillStyle = 'rgba(230,155,45,0.28)'; ctx.strokeStyle = '#E69B2D'; ctx.fillRect(t1a, axY - 14, t1w, 14); ctx.strokeRect(t1a, axY - 14, t1w, 14);
        ctx.fillStyle = 'rgba(18,169,196,0.28)'; ctx.strokeStyle = '#12A9C4'; ctx.fillRect(t2a, axY - 14, t2w, 14); ctx.strokeRect(t2a, axY - 14, t2w, 14);
        D.text(ctx, 'Δt₁', tm1, axY - 3, { align: 'center', size: 11, weight: 700, color: '#9A5A00' });
        D.text(ctx, 'Δt₂', tm2, axY - 3, { align: 'center', size: 11, weight: 700, color: '#0E8CA3' });
        [tm1, tm2].forEach(function (tx, i) {
          ctx.fillStyle = '#C7374B'; ctx.beginPath(); ctx.arc(tx, axY, 4, 0, Math.PI * 2); ctx.fill();
          D.text(ctx, i === 0 ? 'tₘ₁(v₁)' : 'tₘ₂(v₂)', tx, axY + 14, { align: 'center', size: 11, weight: 700, color: '#C7374B' });
        });
        // t 与 t' 对比括弧
        ctx.strokeStyle = '#4A5B73'; ctx.beginPath(); ctx.moveTo(t1a, axY - 20); ctx.lineTo(t1a, axY - 26); ctx.lineTo(t2a, axY - 26); ctx.lineTo(t2a, axY - 20); ctx.stroke();
        D.text(ctx, 't（两门开始遮光时间差）', (t1a + t2a) / 2, axY - 30, { align: 'center', size: 11, color: '#4A5B73', weight: 600 });
        ctx.strokeStyle = '#C7374B'; ctx.beginPath(); ctx.moveTo(tm1, axY + 19); ctx.lineTo(tm1, axY + 25); ctx.lineTo(tm2, axY + 25); ctx.lineTo(tm2, axY + 19); ctx.stroke();
        D.text(ctx, "真实间隔 t′ = t − (Δt₁−Δt₂)/2 < t", (tm1 + tm2) / 2, axY + 39, { align: 'center', size: 11, color: '#C7374B', weight: 700 });
        D.text(ctx, '用偏大的 t 作分母 ⇒ a 偏小', Math.max(t2a + t2w + 18, w * 0.62), axY + 20, { size: 11.5, weight: 700, color: '#C7374B' });
      });
      var rows = [0.002, 0.005, 0.010, 0.030].map(function (d) { var g = T.photogate({ timer: 'none' }, d); return h('tr', h('td', (d * 1000) + ' mm'), h('td', (g.dt1 * 1000).toFixed(2) + ' ms'), h('td', g.v1.toFixed(4)), h('td', g.vTrue1.toFixed(4))); });
      box.appendChild(h('table.dt', h('tr', h('th', '遮光片宽 d'), h('th', 'Δt₁'), h('th', 'd/Δt₁ (m/s)'), h('th', '遮光片前沿到达时的瞬时速度 (m/s)')), rows));
    }
  }

  /* =====================================================================
   *  组装
   * ===================================================================== */
  var shell = new ML.Shell({
    title: C.title, sub: C.sub, summary: C.summary,
    tabs: [
      { id: 'learn', label: '学·原理', mount: function (el) { ML.Learn(el, C.learn, C.equipment, { onPage: learnWidget, onFinish: function () { shell.go('bench'); } }); } },
      { id: 'bench', label: '做·实验', mount: function (el) { bench = new Bench(el); } },
      { id: 'diag', label: '诊·误差', mount: function (el) {
        var wrap = h('div.diag');
        el.appendChild(wrap);
        wrap.appendChild(h('h2.diag-h', 'A. 错误操作实验室'));
        wrap.appendChild(h('p.muted', '每个“试一试”按四拍进行：布置 → 运行 → 对比 → 追问与揭示。所有后果都由实验台的物理模型实时算出。'));
        var grid = h('div.err-grid'), cardMap = {};
        C.errors.forEach(function (e) {
          var note = PROC[e.noteId];
          var card = h('div.err-card' + ((S.done || {})[e.id] ? '.done' : ''),
            h('div.err-name', ((S.done || {})[e.id] ? '✓ ' : '') + e.name),
            note ? h('div.err-note', { html: '<b>注意事项：</b>' + M.tex(note.how) + (note.why ? '<div class="st-why">理由：' + M.tex(note.why) + '</div>' : '') }) : null,
            h('button.btn.primary.sm', { type: 'button', onclick: function () { openTry(e.id); } }, '试一试'));
          cardMap[e.id] = card;
          grid.appendChild(card);
        });
        ML.bus.on('try:done', function (id) {
          var card = cardMap[id];
          if (!card || card.classList.contains('done')) return;
          card.classList.add('done');
          var nameEl = ML.$('.err-name', card);
          if (nameEl && nameEl.textContent.indexOf('✓ ') !== 0) nameEl.textContent = '✓ ' + nameEl.textContent;
        });
        wrap.appendChild(grid);
        wrap.appendChild(h('h2.diag-h', 'B. 结果反推'));
        wrap.appendChild(h('p.muted', '看一个“出了问题”的结果，先判断原因，再去实验台亲手复现。'));
        var rev = h('div.rev'); wrap.appendChild(rev);
        ML.Reverse(rev, C.reverse, adapter);
      } },
      { id: 'paper', label: '练·真题', mount: function (el) { new ML.Paper(el, Q, { title: C.title.replace('实验：', '') + ' · 练习', onReplay: adapter.replay }); } }
    ]
  });
  ML.bus.on('tab', function (id) { if (id !== 'bench' && bench && bench.b.running) { bench.b.running = false; bench.loop.stop(); } });
  shell.go(S.tab);
  ML.perf.probe();
  ML.m01 = { bench: function () { return bench; }, ana: ana, adapter: adapter, shell: shell };
})(window.ML);

</script>
