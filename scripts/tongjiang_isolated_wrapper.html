<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="lesson" title="__TITLE__" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
<script id="edusimu-isolation" type="application/json">__CONFIG__</script>
<script>
(() => {
  'use strict';
  const config = JSON.parse(document.getElementById('edusimu-isolation').textContent);
  const frame = document.getElementById('lesson');
  const progressKey = `edusimu:tongjiang:progress:${config.slug}`;
  const lessonKey = `lab3d:${config.slug}`;
  const validProgress = value => {
    if (value === null) return true;
    if (typeof value !== 'string' || value.length > 16384) return false;
    try { const data = JSON.parse(value); return data !== null && typeof data === 'object' && !Array.isArray(data); }
    catch { return false; }
  };
  let progress = null;
  try { const saved = localStorage.getItem(progressKey); if (validProgress(saved)) progress = saved; } catch {}
  // Only this lesson's progress crosses the opaque-origin boundary. No auth or API bridge.
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.origin !== 'null') return;
    const data = event.data;
    if (data?.type === 'TONGJIANG_HOME_V1') {
      if (navigator.userActivation && !navigator.userActivation.isActive) return;
      top.location.assign(new URL('/edusimu/home', location.origin).href);
      return;
    }
    if (!data || Array.isArray(data) || data.type !== 'TONGJIANG_PROGRESS_V1' || data.key !== lessonKey || !validProgress(data.value)) return;
    try {
      if (data.value === null) localStorage.removeItem(progressKey);
      else localStorage.setItem(progressKey, data.value);
    } catch {}
  });
  function installProgressStorage(key, initial) {
    document.addEventListener('click', event => {
      const link = event.target.closest?.('a[href]');
      if (link && /^(?:\.\/)?index\.html$/.test(link.getAttribute('href'))) {
        event.preventDefault();
        parent.postMessage({ type: 'TONGJIANG_HOME_V1' }, '*');
      }
    }, true);
    let value = initial;
    const publish = () => parent.postMessage({ type: 'TONGJIANG_PROGRESS_V1', key, value }, '*');
    const storage = Object.freeze({
      get length() { return value === null ? 0 : 1; },
      key(index) { return Number(index) === 0 && value !== null ? key : null; },
      getItem(name) { return String(name) === key ? value : null; },
      setItem(name, next) {
        if (String(name) !== key) return;
        next = String(next);
        if (next.length > 16384) return;
        try { const parsed = JSON.parse(next); if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return; } catch { return; }
        value = next; publish();
      },
      removeItem(name) { if (String(name) === key) { value = null; publish(); } },
      clear() { value = null; publish(); }
    });
    Object.defineProperty(window, 'localStorage', { value: storage, configurable: false, writable: false });
  }
  const binary = atob(config.sourceBase64);
  const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
  const source = new TextDecoder().decode(bytes);
  const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; worker-src blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
  const tabletAdapt = () => {
    let tries = 0;
    const applyLayout = () => {
      const w = window.innerWidth || 0;
      const left = document.getElementById('left');
      const right = document.getElementById('right');
      if (!left || !right) {
        if (++tries < 40) setTimeout(applyLayout, 100);
        return;
      }
      if (w <= 920 && !document.body.dataset.edusimuTabletInit) {
        document.body.dataset.edusimuTabletInit = '1';
        left.classList.add('collapsed');
        right.classList.add('collapsed');
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyLayout);
    } else {
      applyLayout();
    }
  };
  const tabletCss = [
    '@media (max-width:1180px){',
    ':root{--panelw-l:clamp(240px,25vw,300px);--panelw-r:clamp(240px,25vw,295px);}',
    '#eqb{max-width:min(340px,calc(100vw - 340px));padding:5px 9px 6px;}',
    '#eqb .beq{font-size:14px;}',
    '#top .mq{display:none;}',
    '}',
    '@media (max-width:920px){',
    ':root{--panelw-l:min(296px,82vw);--panelw-r:min(296px,82vw);}',
    '#left.collapsed{transform:translateX(calc(-100% - 16px));}',
    '#right.collapsed{transform:translateX(calc(100% + 16px));}',
    '#eqb{max-width:calc(100vw - 88px);}',
    '#tabL,#tabR{width:30px;height:74px;font-size:12px;}',
    '}'
  ].join('');
  const shim = `(${installProgressStorage.toString()})(${JSON.stringify(lessonKey)},${JSON.stringify(progress)});(${tabletAdapt.toString()})();`;
  const insertion = `<meta http-equiv="Content-Security-Policy" content="${policy}"><script>${shim}<` + '/script>';
  const withHead = source.replace(/<head\b[^>]*>/i, head => head + insertion);
  const styleTag = `<style>${tabletCss}</style>`;
  const bodyClose = /<\/body>(?![\s\S]*<\/body>)/i;
  frame.srcdoc = bodyClose.test(withHead)
    ? withHead.replace(bodyClose, match => styleTag + match)
    : withHead + styleTag;
})();
</script>
</body>
</html>
